<style>

body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:#f4f6fb;height:100vh;overflow:hidden;}

.scrim{position:fixed;inset:0;background:rgba(12,27,42,.55);display:none;z-index:50;align-items:center;justify-content:center;}

.pad{width:min(1000px,92vw);height:min(80vh,720px);background:#0d1b2a;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.4);display:flex;flex-direction:column;overflow:hidden;}

.pad-bar{display:flex;gap:10px;align-items:center;padding:10px 16px;background:#12233f}
.pad-out{background:#081018;color:#8ef0a5;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:18px;white-space:pre-wrap;padding:12px 18px;max-height:34%;overflow:auto;border-top:1px solid #1e3252}
.pad-out.err{color:#ff8f87}.pad .btn{padding:10px 18px;font-size:15px}.pad .btn.close{background:#39516f;color:#fff;margin-left:auto}

const DECK = [{"type": "section", "title": "Control Structures & Functions", "subtitle": "Collections were the nouns \u2014 control structures are the verbs, and functions give that work a name", "i": 0}, {"type": "content", "title": "Three ways a program can flow", "bullets": ["So far every line ran top to bottom, once \u2014 that is SEQUENCE.", "SELECTION lets the program choose a path (if / elif / else).", "ITERATION lets it repeat work (while, for).", "Every program is built from just these three shapes.", "Python marks each block by INDENTATION, not braces \u2014 whitespace is syntax."], "code": "if score >= 40:      # selection\n    print(\"Pass\")\nfor m in marks:      # iteration\n    total += m", "run": "score = 72\nmarks = [10, 20]\ntotal = 0\nif score >= 40:\n    print(\"Pass\")\nfor m in marks:\n    total += m\nprint(total)", "i": 1}, {"type": "section", "title": "Conditions", "subtitle": "Every branch and loop is steered by a bool", "i": 2}, {"type": "content", "title": "Comparisons produce True / False", "bullets": ["Comparison operators return a bool: ==  !=  <  <=  >  >=", "== compares VALUES; do not confuse it with = (assignment).", "Comparisons can be chained: 40 <= x < 60 reads like maths."], "code": "72 >= 40          # True\n\"Asha\" == \"asha\"   # False (case matters)\n40 <= 55 < 60      # True  (chained)", "run": "print(72 >= 40)\nprint(\"Asha\" == \"asha\")\nprint(40 <= 55 < 60)", "i": 3}, {"type": "predict", "topic": "chained compare", "prompt": "What is printed?", "code": "x = 55\nprint(0 < x <= 55)", "run": "x = 55\nprint(0 < x <= 55)", "expect": "True", "why": "0 < 55 is True and 55 <= 55 is True; a chain is the AND of its links.", "i": 4}, {"type": "content", "title": "Truthiness: not everything is a bool", "bullets": ["if marks: quietly means 'if the list is non-empty'.", "Falsy: 0, 0.0, '' , [], (), {}, None.", "Everything else is truthy \u2014 powerful, and a common surprise."], "code": "bool(0)      # False\nbool(\"\")     # False\nbool([])     # False\nbool([0])    # True  (non-empty!)", "run": "print(bool(0), bool(\"\"), bool([]), bool([0]))", "i": 5}, {"type": "predict", "topic": "truthiness", "prompt": "Which branch runs?", "code": "data = []\nif data:\n    print(\"has items\")\nelse:\n    print(\"empty\")", "run": "data = []\nif data:\n    print(\"has items\")\nelse:\n    print(\"empty\")", "expect": "empty", "why": "An empty list is falsy, so the else branch runs.", "i": 6}, {"type": "content", "title": "Boolean operators & short-circuit", "bullets": ["Precedence: not > and > or. Parenthesise when unsure.", "and stops at the first falsy operand; or at the first truthy one.", "Python returns the OPERAND, not always True/False."], "code": "name = \"\"\nname and name.upper()   # '' -- stops at falsy name\nname or \"Guest\"          # 'Guest' -- common default idiom", "run": "name = \"\"\nprint(repr(name and name.upper()))\nprint(name or \"Guest\")", "i": 7}, {"type": "content", "title": "Precedence in action: not > and > or", "bullets": ["and binds tighter than or, so 'A or B and C' means 'A or (B and C)'.", "not binds tightest of the three: 'not X and Y' means '(not X) and Y'.", "When in doubt, add parentheses \u2014 they cost nothing and remove all guessing."], "code": "True or False and False     # or (True) (False and False) -> True\n(True or False) and False   # forced grouping        -> False\nnot False and True          # (not False) and True   -> True", "run": "print(True or False and False)\nprint((True or False) and False)\nprint(not False and True)", "i": 8}, {"type": "predict", "topic": "and before or", "prompt": "No parentheses \u2014 what prints?", "code": "print(True or False and False)", "run": "print(True or False and False)", "expect": "True", "why": "and binds tighter, so this is True or (False and False) = True or False = True. It is NOT (True or False) and False.", "i": 9}, {"type": "predict", "topic": "not binds tightest", "prompt": "What prints?", "code": "print(not 0 and 5)", "run": "print(not 0 and 5)", "expect": "5", "why": "not binds tightest: (not 0) and 5 = True and 5. 'and' returns the last operand when the left is truthy, so the result is 5.", "i": 10}, {"type": "mcq", "topic": "short-circuit", "prompt": "What does 0 or \"hi\" or 5 evaluate to?", "code": "0 or \"hi\" or 5", "options": ["True", "0", "\"hi\"", "5"], "answer": 2, "expect": "\"hi\"", "why": "or returns the first truthy operand. 0 is falsy; 'hi' is truthy, so it stops there.", "run": "print(0 or \"hi\" or 5)", "i": 11}, {"type": "section", "title": "Selection", "subtitle": "if / elif / else \u2014 making decisions", "i": 12}, {"type": "content", "title": "if / elif / else", "bullets": ["Branches are tested top to bottom.", "The FIRST true branch wins; the rest are skipped.", "elif chains keep the logic flat and readable.", "else is the optional catch-all."], "code": "score = 72\nif score >= 90:\n    grade = \"S\"\nelif score >= 80:\n    grade = \"A\"\nelif score >= 40:\n    grade = \"P\"\nelse:\n    grade = \"F\"\ngrade   # 'P'", "run": "score = 72\nif score >= 90:\n    grade = \"S\"\nelif score >= 80:\n    grade = \"A\"\nelif score >= 40:\n    grade = \"P\"\nelse:\n    grade = \"F\"\nprint(grade)", "i": 13}, {"type": "predict", "topic": "first-true-wins", "prompt": "What is printed?", "code": "x = 5\nif x > 3:\n    print(\"big\")\nelif x > 4:\n    print(\"medium\")", "run": "x = 5\nif x > 3:\n    print(\"big\")\nelif x > 4:\n    print(\"medium\")", "expect": "big", "why": "x>3 is True, so 'big' prints and the elif is never tested \u2014 even though x>4 is also True.", "i": 14}, {"type": "content", "title": "A classic branching bug: wrong order", "bullets": ["With overlapping ranges, put the HIGHEST / most specific test first.", "A score of 95 wrongly becomes 'P' if the >=40 test comes first.", "Ordering here is logic, not style \u2014 the first true branch wins."], "code": "score = 95\n# WRONG order:\nif score >= 40:\n    g = \"P\"        # 95 lands here...\nelif score >= 80:\n    g = \"A\"        # ...so this never runs\ng   # 'P'  (bug!)", "run": "score = 95\nif score >= 40:\n    g = \"P\"\nelif score >= 80:\n    g = \"A\"\nprint(g)", "i": 15}, {"type": "predict", "topic": "fix the order", "prompt": "With the order fixed, what prints?", "code": "score = 95\nif score >= 80:\n    g = \"A\"\nelif score >= 40:\n    g = \"P\"\nprint(g)", "run": "score = 95\nif score >= 80:\n    g = \"A\"\nelif score >= 40:\n    g = \"P\"\nprint(g)", "expect": "A", "why": "Highest threshold first, so 95 correctly lands in 'A'.", "i": 16}, {"type": "section", "title": "Iteration I", "subtitle": "the while loop", "i": 17}, {"type": "content", "title": "while: repeat as long as a condition holds", "bullets": ["Three ingredients: initialise, test, update.", "Forget the update and you get an INFINITE loop (Ctrl+C to stop).", "Use while when you don't know the number of passes in advance."], "code": "total = 0\nn = 1\nwhile n <= 5:\n    total = total + n\n    n = n + 1      # MUST make progress\ntotal   # 15", "run": "total = 0\nn = 1\nwhile n <= 5:\n    total = total + n\n    n = n + 1\nprint(total)", "i": 18}, {"type": "predict", "topic": "while count", "prompt": "What is n at the end?", "code": "n = 0\nwhile n < 3:\n    n += 1\nprint(n)", "run": "n = 0\nwhile n < 3:\n    n += 1\nprint(n)", "expect": "3", "why": "n goes 0->1->2->3; at 3 the test n<3 is False and the loop stops. The variable keeps its last value.", "i": 19}, {"type": "mcq", "topic": "infinite loop", "prompt": "Which change makes 'while n < 3:' loop forever?", "code": "n = 0\nwhile n < 3:\n    ...   # what's missing?", "options": ["Start n at 0", "Remove the n += 1 update", "Use n <= 3 instead", "Print inside the loop"], "answer": 1, "expect": "Remove the n += 1 update", "why": "With no update the condition never becomes False, so the loop never exits.", "run": "print(\"remove the update -> condition never flips -> infinite loop\")", "i": 20}, {"type": "section", "title": "Iteration II", "subtitle": "the for loop, range, enumerate, zip", "i": 21}, {"type": "content", "title": "for: walk through a collection", "bullets": ["for visits each item \u2014 no manual counter.", "Works on lists, tuples, sets, dict keys, strings \u2014 anything iterable.", "The loop variable is rebound on every pass.", "This is the natural tool for your gradebook."], "code": "marks = [72, 55, 90, 33]\ntotal = 0\nfor m in marks:      # m takes each value in turn\n    total = total + m\ntotal   # 250", "run": "marks = [72, 55, 90, 33]\ntotal = 0\nfor m in marks:\n    total = total + m\nprint(total)", "i": 22}, {"type": "content", "title": "Counting with range", "bullets": ["range(5) -> 0,1,2,3,4 (stop is EXCLUSIVE).", "range(1, 6) -> 1..5 ; range(0, 10, 2) -> 0,2,4,6,8.", "range is a LAZY object (recall L3) \u2014 it builds no list.", "Prefer 'for item in collection' over 'for i in range(len(...))'."], "code": "list(range(5))         # [0,1,2,3,4]\nlist(range(1, 6))      # [1,2,3,4,5]\nlist(range(0, 10, 2))  # [0,2,4,6,8]", "run": "print(list(range(5)))\nprint(list(range(1, 6)))\nprint(list(range(0, 10, 2)))", "i": 23}, {"type": "predict", "topic": "range bounds", "prompt": "What does this print?", "code": "print(list(range(2, 8, 2)))", "run": "print(list(range(2, 8, 2)))", "expect": "[2, 4, 6]", "why": "Start 2, step 2, stop 8 exclusive: 2,4,6 (8 is not included).", "i": 24}, {"type": "content", "title": "enumerate & zip", "bullets": ["enumerate gives (index, item) pairs \u2014 cleaner than a counter.", "zip walks two (or more) collections in lock-step.", "Both return lazy objects; both are everyday tools in data work."], "code": "names = [\"Asha\", \"Ravi\", \"Meera\"]\nfor i, name in enumerate(names):\n    print(i, name)\nfor name, m in zip(names, [72, 55, 90]):\n    print(name, m)", "run": "names = [\"Asha\", \"Ravi\", \"Meera\"]\nfor i, name in enumerate(names):\n    print(i, name)\nfor name, m in zip(names, [72, 55, 90]):\n    print(name, m)", "i": 25}, {"type": "predict", "topic": "zip stops short", "prompt": "What does zip produce here?", "code": "a = [1, 2, 3]\nb = [\"x\", \"y\"]\nprint(list(zip(a, b)))", "run": "a = [1, 2, 3]\nb = [\"x\", \"y\"]\nprint(list(zip(a, b)))", "expect": "[(1, 'x'), (2, 'y')]", "why": "zip stops at the shortest input, so the trailing 3 is dropped.", "i": 26}, {"type": "section", "title": "Steering a loop", "subtitle": "break, continue, for...else", "i": 27}, {"type": "content", "title": "break & continue", "bullets": ["break exits the WHOLE loop immediately.", "continue skips to the next pass, dropping the rest of the body.", "Both affect only the INNERMOST loop they sit in."], "code": "for m in [72, None, 33, 90]:\n    if m is None:\n        continue     # skip missing\n    if m < 40:\n        print(\"stop at\", m)\n        break        # exit the loop", "run": "for m in [72, None, 33, 90]:\n    if m is None:\n        continue\n    if m < 40:\n        print(\"stop at\", m)\n        break", "i": 28}, {"type": "predict", "topic": "continue", "prompt": "What is printed?", "code": "for i in range(3):\n    if i == 1:\n        continue\n    print(i)", "run": "for i in range(3):\n    if i == 1:\n        continue\n    print(i)", "expect": "0\n2", "why": "i=1 hits continue and is skipped; 0 and 2 print.", "i": 29}, {"type": "predict", "topic": "break", "prompt": "What is printed?", "code": "for c in \"data\":\n    if c == \"t\":\n        break\n    print(c)", "run": "for c in \"data\":\n    if c == \"t\":\n        break\n    print(c)", "expect": "d\na", "why": "Looping the string, 'd' and 'a' print, then 't' triggers break before printing.", "i": 30}, {"type": "content", "title": "The surprising for...else", "bullets": ["The loop's else runs ONLY if the loop finished without break.", "Read it as: no break => else.", "Perfect for search-and-report: 'did we ever find one?'"], "code": "for m in [72, 55, 90]:\n    if m < 40:\n        print(\"At least one fail\")\n        break\nelse:\n    print(\"Everyone passed!\")   # no break -> runs", "run": "for m in [72, 55, 90]:\n    if m < 40:\n        print(\"At least one fail\")\n        break\nelse:\n    print(\"Everyone passed!\")", "i": 31}, {"type": "mcq", "topic": "for...else", "prompt": "When does a loop's else block run?", "code": "for x in xs:\n    if bad(x):\n        break\nelse:\n    ...   # when?", "options": ["Always after the loop", "Only if the loop body never ran", "Only if the loop finished without hitting break", "Only on the last iteration"], "answer": 2, "expect": "Only if the loop finished without hitting break", "why": "The else runs exactly when the loop completes normally \u2014 i.e. no break fired.", "run": "print(\"no break -> else runs; a break skips the else\")", "i": 32}, {"type": "section", "title": "Running example", "subtitle": "the gradebook finally computes", "i": 33}, {"type": "content", "title": "Average & topper", "bullets": ["Our list-of-dicts from L4 \u2014 now we can process it.", "Loop to accumulate a total; branch to track the topper.", "In L9 Pandas does this in one line \u2014 but this is the logic underneath."], "code": "gradebook = [\n    {\"name\": \"Asha\",  \"score\": 72},\n    {\"name\": \"Ravi\",  \"score\": 33},\n    {\"name\": \"Meera\", \"score\": 90},\n]\ntotal, topper = 0, gradebook[0]\nfor s in gradebook:\n    total += s[\"score\"]\n    if s[\"score\"] > topper[\"score\"]:\n        topper = s\ntotal / len(gradebook)   # 65.0\ntopper[\"name\"]            # 'Meera'", "run": "gradebook = [\n    {\"name\": \"Asha\",  \"score\": 72},\n    {\"name\": \"Ravi\",  \"score\": 33},\n    {\"name\": \"Meera\", \"score\": 90},\n]\ntotal, topper = 0, gradebook[0]\nfor s in gradebook:\n    total += s[\"score\"]\n    if s[\"score\"] > topper[\"score\"]:\n        topper = s\nprint(\"Average:\", total / len(gradebook))\nprint(\"Topper :\", topper[\"name\"])", "i": 34}, {"type": "content", "title": "Assign PASS / FAIL", "bullets": ["Loop + branch turn raw records into a graded report.", "A conditional expression sets a new key in one line.", "A second pass reports just the failures."], "code": "for s in gradebook:\n    s[\"result\"] = \"PASS\" if s[\"score\"] >= 40 else \"FAIL\"\nfor s in gradebook:\n    if s[\"result\"] == \"FAIL\":\n        print(s[\"name\"], \"must repeat\")", "run": "gradebook = [\n    {\"name\": \"Asha\",  \"score\": 72},\n    {\"name\": \"Ravi\",  \"score\": 33},\n    {\"name\": \"Meera\", \"score\": 90},\n]\nfor s in gradebook:\n    s[\"result\"] = \"PASS\" if s[\"score\"] >= 40 else \"FAIL\"\nfor s in gradebook:\n    if s[\"result\"] == \"FAIL\":\n        print(s[\"name\"], \"must repeat\")", "i": 35}, {"type": "predict", "topic": "count above average", "prompt": "What does this print?", "code": "scores = [72, 33, 90]\navg = sum(scores) / len(scores)\ncount = 0\nfor x in scores:\n    if x > avg:\n        count += 1\nprint(avg, count)", "run": "scores = [72, 33, 90]\navg = sum(scores) / len(scores)\ncount = 0\nfor x in scores:\n    if x > avg:\n        count += 1\nprint(avg, count)", "expect": "65.0 2", "why": "Average is 65.0; 72 and 90 beat it, so count is 2.", "i": 36}, {"type": "section", "title": "Watch out", "subtitle": "common misconceptions", "i": 37}, {"type": "content", "title": "Five traps to avoid", "bullets": ["= assigns, == compares \u2014 mixing them is a classic bug.", "elif does not check everything \u2014 once a branch is true, the rest are skipped.", "The loop variable keeps its LAST value after the loop ends.", "range(1,5) does NOT include 5 \u2014 stop is exclusive.", "Modifying a list while looping over it is a bug \u2014 iterate a copy instead."], "code": "# iterate a COPY when removing:\nfor x in xs[:]:      # xs[:] is a shallow copy\n    if drop(x):\n        xs.remove(x)", "run": "xs = [1, 2, 3, 4]\nfor x in xs[:]:\n    if x % 2 == 0:\n        xs.remove(x)\nprint(xs)", "i": 38}, {"type": "content", "title": "The loop variable outlives the loop", "bullets": ["The loop variable is NOT scoped to the loop \u2014 it lingers afterwards.", "After the loop ends it holds the LAST value it was bound to.", "If the collection is empty, the loop body never runs and the variable is never created.", "Handy sometimes, a subtle bug other times \u2014 know that it happens."], "code": "for i in range(3):\n    pass\ni          # 2  -- the last value, still alive\n\nfor x in [10, 20, 30]:\n    last = x\nx          # 30 -- outlives the loop too", "run": "for i in range(3):\n    pass\nprint(i)\nfor x in [10, 20, 30]:\n    last = x\nprint(x)", "i": 39}, {"type": "predict", "topic": "loop var survives", "prompt": "After the loop, what is x?", "code": "for x in [10, 20, 30]:\n    last = x\nprint(x)", "run": "for x in [10, 20, 30]:\n    last = x\nprint(x)", "expect": "30", "why": "The loop variable keeps its LAST value after the loop ends \u2014 here the final item, 30.", "i": 40}, {"type": "content", "title": "xs[:] \u2014 a shallow copy, not the same object", "bullets": ["The full slice xs[:] builds a NEW list with the same elements.", "Same CONTENTS as xs (== is True), but a DIFFERENT object (is is False).", "This is why 'for x in xs[:]' is the safe way to loop while editing xs."], "code": "xs[:]        # new list, same elements\nxs[:] == xs  # True  (same contents)\nxs[:] is xs  # False (different object)", "run": "xs = [1, 2, 3]\nprint(xs[:])\nprint(xs[:] == xs)\nprint(xs[:] is xs)", "i": 41}, {"type": "predict", "topic": "mutate-while-looping", "prompt": "Surprising: what is xs?", "code": "xs = [1, 2, 3, 4]\nfor x in xs:\n    if x % 2 == 0:\n        xs.remove(x)\nprint(xs)", "run": "xs = [1, 2, 3, 4]\nfor x in xs:\n    if x % 2 == 0:\n        xs.remove(x)\nprint(xs)", "expect": "[1, 3]", "why": "It happens to work here, but removing while iterating shifts indices and can skip elements \u2014 always iterate over a copy (xs[:]).", "i": 42}, {"type": "content", "title": "Why elements get SKIPPED", "bullets": ["The list iterator tracks an internal INDEX and advances it each pass.", "When you delete an item, everything to its right shifts LEFT by one...", "...but the index still advances \u2014 so the shifted-in element is jumped over.", "With two adjacent 2s, removing one leaves the other untouched.", "The fix: loop over xs[:] (a copy), which never shifts under you."], "code": "# idx 0 sees 1  -> list [1,2,2,3]\n# idx 1 sees 2  -> remove -> list shifts to [1,2,3]\n# idx 2 sees 3  -> the surviving 2 was SKIPPED!\nxs = [1, 2, 2, 3]\nfor x in xs:\n    if x == 2:\n        xs.remove(x)\nxs   # [1, 2, 3]  -- a 2 survived", "run": "xs = [1, 2, 2, 3]\nfor pos, x in enumerate(xs):\n    print(\"index\", pos, \"sees\", x, \"| list now\", xs)\n    if x == 2:\n        xs.remove(x)\nprint(\"result:\", xs, \"-- a 2 survived (skipped)\")", "i": 43}, {"type": "predict", "topic": "skip proof", "prompt": "Two adjacent 2s \u2014 how many survive?", "code": "xs = [1, 2, 2, 3]\nfor x in xs:\n    if x == 2:\n        xs.remove(x)\nprint(xs)", "run": "xs = [1, 2, 2, 3]\nfor x in xs:\n    if x == 2:\n        xs.remove(x)\nprint(xs)", "expect": "[1, 2, 3]", "why": "Removing the first 2 shifts the second 2 into the index we just left, so the iterator skips right over it \u2014 one 2 survives. Looping xs[:] fixes it.", "i": 44}, {"type": "section", "title": "From loops to functions", "subtitle": "We can now compute \u2014 next we give that logic a NAME and reuse it", "i": 45}, {"type": "content", "title": "Why bother wrapping code in a name?", "bullets": ["Last lecture we averaged the gradebook with a loop; imagine writing it again for every batch.", "A FUNCTION packages a piece of logic once, then runs it on demand with a single call.", "Benefits: no repetition (DRY), a readable name, one place to fix bugs, easy testing.", "You have already been CALLING functions: print(), len(), sum(), range(). Now we DEFINE our own.", "Think of it as teaching Python a new verb."], "code": "# the loop from L5, but named once and reused\ndef average(marks):\n    return sum(marks) / len(marks)\n\naverage([72, 55, 90])   # call it as often as you like\naverage([40, 60])", "run": "def average(marks):\n    return sum(marks) / len(marks)\nprint(average([72, 55, 90]))\nprint(average([40, 60]))", "i": 46}, {"type": "section", "title": "Defining a function", "subtitle": "def, parameters, body, return", "i": 47}, {"type": "content", "title": "Anatomy of a def", "bullets": ["def NAME(parameters):  starts the definition (note the colon).", "The indented BODY is the code that runs when the function is called.", "return hands a value back to the caller and ends the function immediately.", "Defining a function does NOT run it \u2014 calling it does.", "Parameters are the names in the def; arguments are the values you pass in."], "code": "def greet(name):        # name is a PARAMETER\n    message = \"Hi \" + name\n    return message      # hands the value back\n\ngreet(\"Asha\")           # \"Asha\" is the ARGUMENT -> \"Hi Asha\"", "run": "def greet(name):\n    message = \"Hi \" + name\n    return message\nprint(greet(\"Asha\"))", "i": 48}, {"type": "content", "title": "return vs print \u2014 not the same thing", "bullets": ["print DISPLAYS text on screen and gives back None.", "return SENDS a value back so the caller can use it in more computation.", "A function that only prints cannot be reused in an expression: total = f(...) would capture None.", "Rule of thumb: compute-and-return; let the CALLER decide whether to print."], "code": "def with_return(x):\n    return x * 2         # usable: y = with_return(4) -> 8\n\ndef with_print(x):\n    print(x * 2)         # shows 8, but returns None\n\ny = with_return(4)       # y is 8\nz = with_print(4)        # prints 8, z is None", "run": "def with_return(x):\n    return x * 2\ndef with_print(x):\n    print(x * 2)\ny = with_return(4)\nz = with_print(4)\nprint(\"y =\", y)\nprint(\"z =\", z)", "i": 49}, {"type": "predict", "topic": "no return means None", "prompt": "A function with no return \u2014 what is captured?", "code": "def show(x):\n    print(x)\nresult = show(10)\nprint(result)", "run": "def show(x):\n    print(x)\nresult = show(10)\nprint(result)", "expect": "10\nNone", "why": "show prints 10, but with no return statement it hands back None, so result is None.", "i": 50}, {"type": "mcq", "topic": "early return", "prompt": "What does classify(72) return?", "code": "def classify(score):\n    if score >= 40:\n        return \"PASS\"\n    return \"FAIL\"", "options": ["\"PASS\"", "\"FAIL\"", "\"PASS\" then \"FAIL\"", "None"], "answer": 0, "expect": "\"PASS\"", "why": "return exits the function at once. 72 >= 40 is True, so it returns 'PASS' and the final line is never reached.", "run": "def classify(score):\n    if score >= 40:\n        return \"PASS\"\n    return \"FAIL\"\nprint(classify(72))", "i": 51}, {"type": "section", "title": "Arguments", "subtitle": "positional, keyword, defaults, *args, **kwargs", "i": 52}, {"type": "content", "title": "Positional vs keyword arguments", "bullets": ["POSITIONAL: matched by order  ->  power(2, 3) means base=2, exp=3.", "KEYWORD: matched by name  ->  power(exp=3, base=2) is the same call, order-free.", "Keywords make a call self-documenting and immune to argument-order mistakes.", "Positional arguments must come BEFORE keyword arguments in a call."], "code": "def power(base, exp):\n    return base ** exp\n\npower(2, 3)              # positional -> 8\npower(exp=3, base=2)     # keyword, any order -> 8", "run": "def power(base, exp):\n    return base ** exp\nprint(power(2, 3))\nprint(power(exp=3, base=2))", "i": 53}, {"type": "content", "title": "Default parameter values", "bullets": ["A parameter can carry a DEFAULT: def f(x, step=1).", "Callers may omit it (uses the default) or override it.", "Defaults must come AFTER all non-default parameters in the def.", "Great for options that usually take one value but occasionally change."], "code": "def grade(score, cutoff=40):\n    return \"PASS\" if score >= cutoff else \"FAIL\"\n\ngrade(72)                # uses cutoff=40 -> \"PASS\"\ngrade(35, cutoff=33)     # override -> \"PASS\"", "run": "def grade(score, cutoff=40):\n    return \"PASS\" if score >= cutoff else \"FAIL\"\nprint(grade(72))\nprint(grade(35, cutoff=33))", "i": 54}, {"type": "predict", "topic": "default used", "prompt": "cutoff is not passed \u2014 what prints?", "code": "def grade(score, cutoff=40):\n    return \"PASS\" if score >= cutoff else \"FAIL\"\nprint(grade(38))", "run": "def grade(score, cutoff=40):\n    return \"PASS\" if score >= cutoff else \"FAIL\"\nprint(grade(38))", "expect": "FAIL", "why": "With cutoff defaulting to 40, 38 >= 40 is False, so the conditional expression gives 'FAIL'.", "i": 55}, {"type": "content", "title": "The mutable-default TRAP", "bullets": ["A default value is created ONCE, when the function is defined \u2014 not on each call.", "So a default list/dict is SHARED across every call that uses it \u2014 it remembers!", "The idiomatic fix: default to None, then build a fresh list inside the body.", "This is one of Python's most famous gotchas \u2014 worth memorising."], "code": "def bad(item, bucket=[]):     # ONE list, reused forever\n    bucket.append(item)\n    return bucket\n\nbad(1)   # [1]\nbad(2)   # [1, 2]  <- surprise! same list", "run": "def bad(item, bucket=[]):\n    bucket.append(item)\n    return bucket\nprint(bad(1))\nprint(bad(2))\nprint(bad(3))", "i": 56}, {"type": "predict", "topic": "mutable default bites", "prompt": "Second call \u2014 what is printed?", "code": "def add(item, bucket=[]):\n    bucket.append(item)\n    return bucket\nadd(\"a\")\nprint(add(\"b\"))", "run": "def add(item, bucket=[]):\n    bucket.append(item)\n    return bucket\nadd(\"a\")\nprint(add(\"b\"))", "expect": "['a', 'b']", "why": "The default list is created once and shared, so the 'a' from the first call is still there when 'b' is appended.", "i": 57}, {"type": "content", "title": "The fix: default to None", "bullets": ["Default to None, then create a fresh object inside the body on every call.", "'bucket = bucket or []' or an explicit 'if bucket is None' both work.", "Now each call that omits the argument gets its OWN new list.", "Prefer this pattern any time a default would be a list, dict or set."], "code": "def good(item, bucket=None):\n    if bucket is None:\n        bucket = []       # fresh list each call\n    bucket.append(item)\n    return bucket\n\ngood(1)   # [1]\ngood(2)   # [2]  <- independent", "run": "def good(item, bucket=None):\n    if bucket is None:\n        bucket = []\n    bucket.append(item)\n    return bucket\nprint(good(1))\nprint(good(2))", "i": 58}, {"type": "content", "title": "*args and **kwargs \u2014 any number of arguments", "bullets": ["*args collects EXTRA positional arguments into a tuple.", "**kwargs collects EXTRA keyword arguments into a dict.", "The names args/kwargs are convention; the * and ** are what matter.", "This is how print() accepts any number of items, and sep=/end= keywords."], "code": "def total(*args):        # args is a tuple\n    return sum(args)\n\ntotal(10, 20, 30)        # 60\n\ndef tag(**kwargs):       # kwargs is a dict\n    return kwargs\n\ntag(name=\"Asha\", score=72)", "run": "def total(*args):\n    return sum(args)\nprint(total(10, 20, 30))\ndef tag(**kwargs):\n    return kwargs\nprint(tag(name=\"Asha\", score=72))", "i": 59}, {"type": "predict", "topic": "star-args tuple", "prompt": "What does this print?", "code": "def total(*args):\n    return sum(args)\nprint(total(1, 2, 3, 4))", "run": "def total(*args):\n    return sum(args)\nprint(total(1, 2, 3, 4))", "expect": "10", "why": "*args gathers 1,2,3,4 into the tuple (1,2,3,4); sum adds them to 10.", "i": 60}, {"type": "section", "title": "Return values", "subtitle": "one value, many values, or none", "i": 61}, {"type": "content", "title": "Returning multiple values", "bullets": ["return a, b actually returns a TUPLE (a, b).", "The caller can UNPACK it into several names in one line.", "A clean way to hand back several results \u2014 e.g. min and max together.", "You already met tuple unpacking with enumerate and zip in L5."], "code": "def stats(marks):\n    return min(marks), max(marks), sum(marks) / len(marks)\n\nlo, hi, avg = stats([72, 55, 90])\nlo, hi, avg      # 55 90 72.33...", "run": "def stats(marks):\n    return min(marks), max(marks), sum(marks) / len(marks)\nlo, hi, avg = stats([72, 55, 90])\nprint(lo, hi, round(avg, 2))", "i": 62}, {"type": "predict", "topic": "tuple return unpack", "prompt": "What is printed?", "code": "def minmax(xs):\n    return min(xs), max(xs)\na, b = minmax([4, 9, 1])\nprint(a, b)", "run": "def minmax(xs):\n    return min(xs), max(xs)\na, b = minmax([4, 9, 1])\nprint(a, b)", "expect": "1 9", "why": "minmax returns the tuple (1, 9); unpacking binds a=1 and b=9.", "i": 63}, {"type": "mcq", "topic": "bare return", "prompt": "What does a plain 'return' (no value) hand back?", "code": "def f(x):\n    if x < 0:\n        return        # bare return\n    print(x)", "options": ["0", "an empty string", "None", "it raises an error"], "answer": 2, "expect": "None", "why": "A bare return exits the function and yields None \u2014 the same value you get when a function falls off the end with no return at all.", "run": "def f(x):\n    if x < 0:\n        return\n    print(x)\nprint(f(-1))", "i": 64}, {"type": "section", "title": "Scope", "subtitle": "local vs global \u2014 where a name lives", "i": 65}, {"type": "content", "title": "Local names stay inside", "bullets": ["Names created inside a function are LOCAL \u2014 they vanish when it returns.", "The outside world cannot see a function's local variables.", "A function CAN read a global (outer) variable it does not reassign.", "This isolation is a feature: functions don't accidentally clobber each other."], "code": "def f():\n    inside = 42          # local to f\n    return inside\n\nf()          # 42\ninside       # NameError -- not visible out here", "run": "def f():\n    inside = 42\n    return inside\nprint(f())\ntry:\n    print(inside)\nexcept NameError as e:\n    print(\"NameError:\", e)", "i": 66}, {"type": "predict", "topic": "local shadows", "prompt": "What prints? (watch the two x's)", "code": "x = 10\ndef f():\n    x = 99        # a NEW local x\n    return x\nprint(f(), x)", "run": "x = 10\ndef f():\n    x = 99\n    return x\nprint(f(), x)", "expect": "99 10", "why": "The x inside f is a separate local; assigning it does not touch the global x, which stays 10.", "i": 67}, {"type": "content", "title": "Reading a global vs reassigning it", "bullets": ["Reading an outer variable inside a function is fine \u2014 no keyword needed.", "But ASSIGNING to that name creates a new LOCAL, shadowing the global.", "To actually rebind a module-level name, declare 'global name' first.", "Best practice: avoid global; pass values IN as arguments and RETURN results out."], "code": "count = 0\ndef bump():\n    global count         # without this, count += 1 errors\n    count += 1\n\nbump(); bump()\ncount    # 2", "run": "count = 0\ndef bump():\n    global count\n    count += 1\nbump(); bump()\nprint(count)", "i": 68}, {"type": "mcq", "topic": "scope isolation", "prompt": "After this runs, what is the global total?", "code": "total = 0\ndef add(n):\n    total = n        # no global keyword\n    return total\nadd(5)", "options": ["5", "0", "None", "it raises an error"], "answer": 1, "expect": "0", "why": "Without 'global', 'total = n' makes a new local; the module-level total is untouched and stays 0.", "run": "total = 0\ndef add(n):\n    total = n\n    return total\nadd(5)\nprint(total)", "i": 69}, {"type": "section", "title": "How arguments are passed", "subtitle": "pass-by-object-reference \u2014 and why a function can change your list", "i": 70}, {"type": "content", "title": "Passing a mutable object shares it", "bullets": ["Python passes the OBJECT, not a copy \u2014 the parameter and the caller's name point to the SAME object.", "So mutating a list/dict inside a function is visible to the caller afterwards.", "Numbers, strings and tuples are IMMUTABLE, so they appear 'unchanged' \u2014 you cannot mutate them in place.", "This is the same aliasing idea from L4, now crossing a function boundary.", "Rule: if a function must not touch the caller's data, copy it (list(x) or x[:]) first."], "code": "def append_pass(book):\n    book.append({\"name\": \"New\", \"score\": 50})   # mutates caller's list\n\ngradebook = [{\"name\": \"Asha\", \"score\": 72}]\nappend_pass(gradebook)\nlen(gradebook)      # 2  -- the caller sees the change", "run": "def append_pass(book):\n    book.append({\"name\": \"New\", \"score\": 50})\ngradebook = [{\"name\": \"Asha\", \"score\": 72}]\nappend_pass(gradebook)\nprint(len(gradebook), gradebook)", "i": 71}, {"type": "predict", "topic": "mutate through param", "prompt": "The list is passed in \u2014 what is its length after?", "code": "def add_bonus(scores):\n    scores.append(100)\nmarks = [72, 55]\nadd_bonus(marks)\nprint(len(marks))", "run": "def add_bonus(scores):\n    scores.append(100)\nmarks = [72, 55]\nadd_bonus(marks)\nprint(len(marks))", "expect": "3", "why": "scores and marks name the SAME list object, so appending inside the function is visible outside \u2014 the length becomes 3.", "i": 72}, {"type": "content", "title": "Rebinding vs mutating inside a function", "bullets": ["MUTATING the object (append, sort, x[i]=...) is seen by the caller.", "REBINDING the parameter (scores = something_new) only changes the LOCAL name.", "So 'scores = scores + [100]' builds a new list and does NOT affect the caller.", "Know which one you're doing \u2014 it's the difference between a silent side-effect and none."], "code": "def rebinds(scores):\n    scores = scores + [100]   # NEW local list; caller untouched\n    return scores\n\nmarks = [72, 55]\nrebinds(marks)     # returns [72, 55, 100]\nmarks              # still [72, 55]", "run": "def rebinds(scores):\n    scores = scores + [100]\n    return scores\nmarks const TOTAL = DECK.length;
let idx = 0, pyReady = false, pyodide = null;
const seen = new Set();
const $ = s => document.querySelector(s);

async function initPy(){
  const bar = $("#pybar");
  if(location.protocol === "file:"){
    bar.className = "pybar warn";
    bar.textContent = "Run disabled \u2014 use the start_lecture launcher (not double-click)";
    return;
  }
  try{
    bar.textContent = "Loading Python runtime\u2026";
    pyodide = await loadPyodide({ indexURL: "./pyodide/" });
    pyReady = true; bar.className = "pybar ready"; bar.textContent = "Python ready \u2713";
    refreshRunButtons();
  }catch(e){ bar.className="pybar warn"; bar.textContent="Python failed to load \u2014 content & reveal still work"; }
}
function refreshRunButtons(){
  const it = DECK[idx]; const canRun = pyReady && it.type==="predict";
  const rb=$("#runBtn"); if(rb){ rb.disabled=!canRun; rb.style.display=(it.type==="predict")?"":"none"; }
}
async function pyRun(src){
  if(!pyReady) return {out:"(run unavailable \u2014 see banner)",err:false};
  try{
    pyodide.runPython("import sys, io\n_buf = io.StringIO()\nsys.stdout = _buf\n");
    pyodide.runPython(src);
    let res = pyodide.runPython("sys.stdout = sys.__stdout__; _buf.getvalue()");
    return {out:(res&&res.length)?res.replace(/\n$/,""):"(no output)",err:false};
  }catch(err){ pyodide.runPython("sys.stdout = sys.__stdout__");
    return {out:String(err).split("\n").slice(-4).join("\n"),err:true}; }
}
async function runCurrent(){
  const it=DECK[idx]; if(it.type!=="predict") return;
  const box=$("#outbox"),out=$("#outpre"); if(!box) return;
  box.style.display="block"; out.className=""; out.textContent="running\u2026";
  const r=await pyRun(it.run); out.className=r.err?"err":""; out.textContent=r.out;
}
function reveal(){
  const it=DECK[idx]; const rv=$("#reveal"); if(rv) rv.classList.add("show");
  if(it.type==="mcq"){ const o=document.querySelector('.opt[data-i="'+it.answer+'"]'); if(o) o.classList.add("correct"); }
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function render(){
  const it=DECK[idx]; seen.add(idx);
  $("#count").textContent=(idx+1)+" / "+TOTAL;
  const card=$("#card"); card.className="card"+(it.type==="section"?" section-card":"");
  let b="";
  if(it.type==="section"){
    b+='<div class="section-kicker">Section</div>';
    b+='<div class="section-title">'+esc(it.title)+'</div>';
    if(it.subtitle) b+='<div class="section-sub">'+esc(it.subtitle)+'</div>';
  } else if(it.type==="content"){
    b+='<div class="content-title">'+esc(it.title)+'</div>';
    if(it.bullets){ b+='<ul class="content-bullets">'; it.bullets.forEach(x=>b+='<li>'+esc(x)+'</li>'); b+='</ul>'; }
    if(it.code) b+='<pre class="code">'+esc(it.code)+'</pre>';
  } else {
    b+='<div class="chips"><span class="chip '+it.type+'">'+it.type+'</span><span class="chip topic">'+esc(it.topic)+'</span></div>';
    if(it.prompt) b+='<div class="prompt">'+esc(it.prompt)+'</div>';
    b+='<pre class="code">'+esc(it.code)+'</pre>';
    if(it.type==="mcq"){ const L="ABCDEFGH"; b+='<div class="opts">';
      it.options.forEach((o,i)=>b+='<div class="opt" data-i="'+i+'"><span class="k">'+L[i]+'</span><span>'+esc(o)+'</span></div>'); b+='</div>';
    } else { b+='<div class="output" id="outbox" style="display:none"><div class="lbl">Live output</div><pre id="outpre"></pre></div>'; }
    b+='<div class="reveal" id="reveal"><div class="ans">'+esc(it.expect)+'</div><div class="why">'+esc(it.why)+'</div></div>';
  }
  card.innerHTML=b; buildDots();
  const isQ=(it.type==="predict"||it.type==="mcq");
  $("#revealBtn").style.display=isQ?"":"none"; refreshRunButtons();
}
function buildDots(){
  const wrap=$("#dots"); wrap.innerHTML="";
  DECK.forEach((it,i)=>{ const d=document.createElement("div");
    let c="dot"; if(it.type==="section")c+=" section"; else if(it.type==="content")c+=" content";
    if(seen.has(i))c+=" done"; if(i===idx)c+=" here";
    d.className=c; d.title=it.title||it.topic||("#"+(i+1)); d.onclick=()=>{idx=i;render();}; wrap.appendChild(d); });
}
function next(){ if(idx<TOTAL-1){idx++;render();} }
function prev(){ if(idx>0){idx--;render();} }
function openPad(){
  const it=DECK[idx]; const seed=(it.run||it.code||"").trim();
  $("#padText").value=seed||"# type any Python, Ctrl+Enter to run\nprint('hello')";
  $("#padOut").textContent=""; $("#padOut").className="pad-out";
  $("#scrim").classList.add("show"); setTimeout(()=>$("#padText").focus(),30);
}
function closePad(){ $("#scrim").classList.remove("show"); }
async function runPad(){
  const out=$("#padOut"); out.className="pad-out"; out.textContent="running\u2026";
  const r=await pyRun($("#padText").value); out.className="pad-out"+(r.err?" err":""); out.textContent=r.out;
}
document.addEventListener("keydown",e=>{
  const padOpen=$("#scrim").classList.contains("show");
  if(padOpen){
    if(e.key==="Escape"){e.preventDefault();closePad();}
    else if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();runPad();}
    else if(e.key==="Tab"){e.preventDefault();const t=$("#padText"),s=t.selectionStart,en=t.selectionEnd;
      t.value=t.value.slice(0,s)+"    "+t.value.slice(en);t.selectionStart=t.selectionEnd=s+4;}
    return;
  }
  if(e.target.tagName==="TEXTAREA") return;
  if(e.key===" "||e.key==="ArrowRight"){e.preventDefault();next();}
  else if(e.key==="ArrowLeft"){e.preventDefault();prev();}
  else if(e.key==="r"||e.key==="R"){e.preventDefault();runCurrent();}
  else if(e.key==="a"||e.key==="A"){e.preventDefault();reveal();}
  else if(e.key==="s"||e.key==="S"){e.preventDefault();openPad();}
});
window.addEventListener("DOMContentLoaded",()=>{
  $("#runBtn").addEventListener("click",runCurrent);
  $("#revealBtn").addEventListener("click",reveal);
  $("#scratchBtn").addEventListener("click",openPad);
  $("#nextBtn").addEventListener("click",next);
  $("#prevBtn").addEventListener("click",prev);
  $("#padRun").addEventListener("click",runPad);
  $("#padClose").addEventListener("click",closePad);
  $("#scrim").addEventListener("click",e=>{ if(e.target===$("#scrim")) closePad(); });
  render(); initPy();
});
</script>
