<style>
  :root{ --brand:#214B8C; --ink:#12233b; --mut:#5b6b80; --bg:#f4f7fb;

  *{box-sizing:border-box}

          padding:8px 18px;font-size:13px;}

  /* ---------- topic navigation ---------- */
  #navwrap{background:#fff;border-bottom:1px solid var(--line);padding:10px 18px 12px;
           position:sticky;top:0;z-index:10;}

          justify-content:space-between;gap:12px;flex-wrap:wrap;}

          position:relative;border-radius:7px;overflow:visible;}

       transition:background .12s,transform .12s;}
  .seg:hover{background:#aec3e2}
  .seg.past{background:#9db4d0}
  .seg.current{background:var(--brand)}
  .seg.current:hover{background:#183a6e}

             border-radius:1px;pointer-events:none;transition:left .15s ease;}
  #navtip{position:absolute;bottom:26px;transform:translateX(-50%);
          background:var(--ink);color:#fff;padding:6px 10px;border-radius:7px;
          font-size:12.5px;white-space:nowrap;pointer-events:none;opacity:0;
          transition:opacity .1s;z-index:30;box-shadow:0 6px 16px rgba(0,0,0,.2)}

  button.nav{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;
             font-size:14px;font-weight:600;color:var(--brand);cursor:pointer}

  /* scratchpad */
  #scrim{position:fixed;inset:0;background:rgba(12,24,44,.55);display:none;z-index:20}

  #pad{position:fixed;z-index:21;left:50%;top:50%;transform:translate(-50%,-50%);
       width:min(880px,94vw);height:min(620px,90vh);background:#fff;border-radius:14px;
       box-shadow:0 20px 60px rgba(0,0,0,.4);display:none;flex-direction:column;overflow:hidden}
  #pad.show{display:flex}
  #pad .h{background:var(--violet);color:#fff;padding:10px 16px;font-weight:600;
          display:flex;justify-content:space-between;align-items:center}
  #pad textarea{flex:1;border:0;outline:0;resize:none;padding:16px;
                font-family:Consolas,monospace;font-size:18px;line-height:1.5;color:#0d1b2a}
  #pad .bar{border-top:1px solid var(--line);padding:8px 12px;display:flex;gap:10px;align-items:center}
  #padOut{background:#0d1b2a;color:#e6f0ff;font-family:Consolas,monospace;font-size:16px;
          padding:10px 14px;max-height:180px;overflow:auto;white-space:pre-wrap;display:none}
  #padOut.show{display:block}
  #padOut img{max-width:100%;background:#fff;border-radius:6px}

    #navtop .slidecount{display:none}

  }

<script>
const DECK = [{"type": "section", "title": "NumPy", "subtitle": "Seven lectures ago we said everything is an object. Today we find out what that cost us.", "nav": "Why NumPy?"}, {"type": "section", "title": "First: modules, packages & libraries", "subtitle": "We are about to write 'import numpy'. What does import actually do?", "nav": "Why NumPy?"}, {"type": "content", "title": "Why we don't write everything ourselves", "bullets": ["So far our gradebook code lived in one file. That is fine for one lecture — not for a whole project.", "Two problems appear: (1) useful code should be REUSED, not copy-pasted; (2) one giant file becomes unreadable.", "The answer everywhere in Python: put related code in its OWN file, then IMPORT it where you need it.", "That imported file is a MODULE. Today's NumPy is just a very large, very fast collection of such files."], "code": "# gradebook_tools.py   <- a separate file (a MODULE)\n\ndef average(marks):\n    return sum(marks) / len(marks)\n\ndef topper(marks):\n    return marks.index(max(marks))", "run": "def average(marks):\n    return sum(marks) / len(marks)\n\ndef topper(marks):\n    return marks.index(max(marks))\n\nmarks = [72, 55, 91, 38, 66]\nprint('average:', average(marks))\nprint('topper index:', topper(marks))", "nav": "Why NumPy?"}, {"type": "content", "title": "Module = one .py file you can import", "bullets": ["A MODULE is simply a .py file. Its name is the file name without .py (gradebook_tools.py -> module 'gradebook_tools').", "'import gradebook_tools' runs that file once and hands you a module object — everything is an object, modules too.", "You then reach inside with a dot: gradebook_tools.average(marks). The dot means 'look up this name inside that object'.", "'from ... import ...' pulls specific names out so you can use them bare. 'import ... as ...' gives a short alias."], "code": "import gradebook_tools\nprint(gradebook_tools.average(marks))\n\nfrom gradebook_tools import topper\nprint(topper(marks))\n\nimport gradebook_tools as gt   # alias\nprint(gt.average(marks))", "run": "# (illustrative import forms — no file here, so we define inline)\ndef average(marks): return sum(marks)/len(marks)\nmarks=[72,55,91,38,66]\nprint('gradebook_tools.average(marks) ->', average(marks))\nprint(\"forms: 'import m' | 'from m import name' | 'import m as short'\")", "nav": "Why NumPy?"}, {"type": "content", "title": "Package = a folder of modules; library = the whole toolkit", "bullets": ["When one file is not enough, you group many modules in a FOLDER. That folder is a PACKAGE.", "A package can hold sub-packages, so big toolkits are trees of folders and files — that is how NumPy is organised.", "'LIBRARY' is the informal word for a package (or set of packages) you install and reuse — NumPy, Pandas, Matplotlib.", "Standard library = ships with Python (math, random, statistics). Third-party = you install it (NumPy). Next slide: the difference."], "code": "numpy/                 <- a PACKAGE (folder)\n    __init__.py        <- marks the folder as a package\n    linalg/            <- a SUB-package\n        __init__.py\n    random/\n        __init__.py\n# 'import numpy' loads the package; 'numpy.linalg' reaches a sub-package", "run": "# The standard library is already here — import a real module and use it:\nimport statistics\nmarks = [72, 55, 91, 38, 66]\nprint('mean  :', statistics.mean(marks))\nprint('median:', statistics.median(marks))\nprint('stdev :', round(statistics.stdev(marks), 3))", "nav": "Why NumPy?"}, {"type": "content", "title": "Batteries included — and batteries you add", "bullets": ["Python ships with a big STANDARD LIBRARY: math, random, statistics, datetime — import and go, nothing to install.", "But it deliberately does NOT ship fast numeric arrays. That is a THIRD-PARTY library you add: NumPy.", "You install third-party libraries once (pip install numpy); then 'import numpy' works like any other module.", "NumPy's near-universal alias is np. From here on, 'import numpy as np' — and now you know exactly what that line means."], "code": "# standard library — already available\nimport math, random, statistics\n\n# third-party — installed once with:  pip install numpy\nimport numpy as np      # 'np' is the conventional short alias\n\nprint(np.array([72, 55, 91]))", "run": "import math, random, statistics\nimport numpy as np\nprint('math.sqrt(2)      =', round(math.sqrt(2), 4))\nprint('np.array([72,55]) =', np.array([72, 55]))\nprint('numpy version     =', np.__version__)", "nav": "Why NumPy?"}, {"type": "mcq", "topic": "imports", "title": "Which statement is correct?", "code": "# A module, a package, and a library — which line is TRUE?", "options": ["A module is a folder; a package is a single .py file", "A module is a single .py file; a package is a folder of modules", "import numpy runs numpy's code every time you call np.array", "The standard library must be installed with pip before use"], "answer": 1, "expect": "A module is a single .py file; a package is a folder of modules", "why": "Module = one .py file. Package = a folder of modules (with __init__.py). 'import' runs a module ONCE and caches it. The standard library ships with Python — no pip needed; only third-party libraries like NumPy are installed.", "nav": "Why NumPy?"}, {"type": "content", "title": "The problem, stated as a question", "bullets": ["Our gradebook has grown. This semester: CSE DD + ECE + MECH — hundreds of students, several assessments each.", "Suppose the exam was hard and we want to curve every mark: add 5 to all of them.", "With a Python list you would write a loop, or a list comprehension: [m + 5 for m in marks].", "That works. But how FAST is it when there are 100,000 marks? Hold that question."], "code": "marks = [72, 55, 91, 38, 66]\ncurved = [m + 5 for m in marks]\nprint(curved)", "run": "marks = [72, 55, 91, 38, 66]\ncurved = [m + 5 for m in marks]\nprint(curved)", "nav": "Why NumPy?"}, {"type": "content", "title": "A speed duel — list vs array", "bullets": ["Here is a plain Python LIST of 100 marks. To curve it we add 5 to each element with a comprehension.", "The NumPy array does the SAME job with just 'marks + 5' — no loop written at all.", "One run of 100 is too quick to measure honestly, so we time the SAME work repeated many times. Press R.", "The array wins by a wide margin. The interesting question is not THAT it is faster — it is WHY. That 'why' is the next slide."], "code": "import numpy as np\n\n# a plain Python list of 100 marks\nmarks_list = list(range(100))\n\n# curve each mark by +5 ...\ncurved_list = [m + 5 for m in marks_list]   # list: element by element\n\n# ... vs the SAME job on a NumPy array\nmarks_arr = np.array(marks_list)\ncurved_arr = marks_arr + 5                  # array: all at once, no loop", "run": "import numpy as np, time\n\nmarks_list = list(range(100))\nmarks_arr  = np.array(marks_list)\n\nREPEAT = 20000   # repeat the +5 many times so the timing is measurable\n\nt = time.perf_counter()\nfor _ in range(REPEAT):\n    curved = [m + 5 for m in marks_list]     # list: loop over 100 elements\nlist_ms = (time.perf_counter() - t) * 1000\n\nt = time.perf_counter()\nfor _ in range(REPEAT):\n    curved = marks_arr + 5                    # array: one vectorised step\narr_ms = (time.perf_counter() - t) * 1000\n\nprint(f'add 5 to 100 marks, x{REPEAT} times')\nprint(f'list  : {list_ms:8.2f} ms')\nprint(f'array : {arr_ms:8.2f} ms')\nprint(f'the array is ~{list_ms/max(arr_ms,1e-6):.0f}x faster')", "nav": "Why NumPy?"}, {"type": "content", "title": "Why the array wins — look inside memory", "bullets": ["LEFT: a Python list holds a row of POINTERS. Each mark is a separate int object, boxed, scattered across memory.", "To add 5, Python chases each pointer, unboxes the int, adds, re-boxes — a detour per element.", "RIGHT: a NumPy array is ONE contiguous block of raw numbers. Adding 5 is a single straight sweep.", "This is 'everything is an object' made visible — and made expensive. NumPy trades per-element flexibility for speed."], "svg": "<svg viewBox=\"0 0 860 430\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Segoe UI,system-ui,sans-serif\">\n  <!-- ================= LEFT: Python list ================= -->\n  <text x=\"215\" y=\"30\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" fill=\"#214B8C\">Python list  [72, 55, 91]</text>\n  <text x=\"215\" y=\"52\" text-anchor=\"middle\" font-size=\"13\" fill=\"#5b6b80\">a row of pointers &#8594; scattered boxed int objects</text>\n\n  <!-- the list: three pointer slots -->\n  <g>\n    <rect x=\"70\" y=\"80\" width=\"290\" height=\"54\" rx=\"8\" fill=\"#eef3f9\" stroke=\"#214B8C\" stroke-width=\"2\"/>\n    <line x1=\"166\" y1=\"80\" x2=\"166\" y2=\"134\" stroke=\"#9db4d0\"/>\n    <line x1=\"262\" y1=\"80\" x2=\"262\" y2=\"134\" stroke=\"#9db4d0\"/>\n    <text x=\"118\" y=\"113\" text-anchor=\"middle\" font-size=\"15\" fill=\"#22509a\" font-weight=\"600\">ptr</text>\n    <text x=\"214\" y=\"113\" text-anchor=\"middle\" font-size=\"15\" fill=\"#22509a\" font-weight=\"600\">ptr</text>\n    <text x=\"310\" y=\"113\" text-anchor=\"middle\" font-size=\"15\" fill=\"#22509a\" font-weight=\"600\">ptr</text>\n    <text x=\"70\" y=\"150\" font-size=\"12\" fill=\"#5b6b80\">contiguous slots &#8212; but they only hold addresses</text>\n  </g>\n\n  <!-- three scattered int objects -->\n  <g>\n    <!-- obj 1 -->\n    <rect x=\"60\" y=\"235\" width=\"120\" height=\"70\" rx=\"10\" fill=\"#fff\" stroke=\"#c94b4b\" stroke-width=\"2\"/>\n    <text x=\"120\" y=\"262\" text-anchor=\"middle\" font-size=\"12\" fill=\"#8a2b2b\">int object</text>\n    <text x=\"120\" y=\"290\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" fill=\"#12233b\">72</text>\n    <!-- obj 2 -->\n    <rect x=\"230\" y=\"330\" width=\"120\" height=\"70\" rx=\"10\" fill=\"#fff\" stroke=\"#c94b4b\" stroke-width=\"2\"/>\n    <text x=\"290\" y=\"357\" text-anchor=\"middle\" font-size=\"12\" fill=\"#8a2b2b\">int object</text>\n    <text x=\"290\" y=\"385\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" fill=\"#12233b\">55</text>\n    <!-- obj 3 -->\n    <rect x=\"20\" y=\"345\" width=\"120\" height=\"70\" rx=\"10\" fill=\"#fff\" stroke=\"#c94b4b\" stroke-width=\"2\"/>\n    <text x=\"80\" y=\"372\" text-anchor=\"middle\" font-size=\"12\" fill=\"#8a2b2b\">int object</text>\n    <text x=\"80\" y=\"400\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" fill=\"#12233b\">91</text>\n  </g>\n\n  <!-- arrows from pointer slots to scattered objects -->\n  <defs>\n    <marker id=\"ar\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\">\n      <path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#c94b4b\"/>\n    </marker>\n  </defs>\n  <path d=\"M118,134 C118,180 120,205 120,233\" fill=\"none\" stroke=\"#c94b4b\" stroke-width=\"2\" marker-end=\"url(#ar)\"/>\n  <path d=\"M214,134 C214,220 280,290 288,328\" fill=\"none\" stroke=\"#c94b4b\" stroke-width=\"2\" marker-end=\"url(#ar)\"/>\n  <path d=\"M310,134 C310,240 120,300 82,343\" fill=\"none\" stroke=\"#c94b4b\" stroke-width=\"2\" marker-end=\"url(#ar)\"/>\n\n  <text x=\"215\" y=\"425\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#8a2b2b\">add 5 &#8594; chase each pointer, unbox, add, re-box  (slow)</text>\n\n  <!-- divider -->\n  <line x1=\"440\" y1=\"70\" x2=\"440\" y2=\"420\" stroke=\"#dbe4f0\" stroke-width=\"2\" stroke-dasharray=\"5 5\"/>\n\n  <!-- ================= RIGHT: NumPy array ================= -->\n  <text x=\"650\" y=\"30\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" fill=\"#1f7a4d\">NumPy array  np.array([72, 55, 91])</text>\n  <text x=\"650\" y=\"52\" text-anchor=\"middle\" font-size=\"13\" fill=\"#5b6b80\">one contiguous block of raw numbers &#8212; no boxes, no pointers</text>\n\n  <g>\n    <rect x=\"500\" y=\"200\" width=\"300\" height=\"60\" rx=\"8\" fill=\"#e9f7ef\" stroke=\"#1f7a4d\" stroke-width=\"2\"/>\n    <line x1=\"600\" y1=\"200\" x2=\"600\" y2=\"260\" stroke=\"#9ccdb0\"/>\n    <line x1=\"700\" y1=\"200\" x2=\"700\" y2=\"260\" stroke=\"#9ccdb0\"/>\n    <text x=\"550\" y=\"238\" text-anchor=\"middle\" font-size=\"24\" font-weight=\"700\" fill=\"#12233b\">72</text>\n    <text x=\"650\" y=\"238\" text-anchor=\"middle\" font-size=\"24\" font-weight=\"700\" fill=\"#12233b\">55</text>\n    <text x=\"750\" y=\"238\" text-anchor=\"middle\" font-size=\"24\" font-weight=\"700\" fill=\"#12233b\">91</text>\n  </g>\n  <text x=\"650\" y=\"285\" text-anchor=\"middle\" font-size=\"13\" fill=\"#1f7a4d\">the values live right here, side by side (int64, 8 bytes each)</text>\n\n  <!-- one CPU sweep arrow -->\n  <path d=\"M505,320 L795,320\" fill=\"none\" stroke=\"#1f7a4d\" stroke-width=\"2.5\" marker-end=\"url(#arg)\"/>\n  <defs>\n    <marker id=\"arg\" markerWidth=\"10\" markerHeight=\"10\" refX=\"8\" refY=\"5\" orient=\"auto\">\n      <path d=\"M0,0 L10,5 L0,10 Z\" fill=\"#1f7a4d\"/>\n    </marker>\n  </defs>\n  <text x=\"650\" y=\"345\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#1f7a4d\">add 5 &#8594; one straight sweep over the block  (fast)</text>\n</svg>", "nav": "Why NumPy?"}, {"type": "section", "title": "The ndarray", "subtitle": "Meet the object that replaces the list of marks", "nav": "The ndarray"}, {"type": "content", "title": "Making an array from our marks", "bullets": ["np.array(...) turns a list of marks into an ndarray — NumPy's core object.", "Ask it the same questions we asked strings and lists: what type, what's inside, how big.", "dtype is new: the array knows ALL its elements share one type (int64). That uniformity is what makes it fast.", "shape (5,) means: one dimension, five marks. We'll grow this to a 2D matrix soon."], "code": "import numpy as np\nmarks = np.array([72, 55, 91, 38, 66])\nprint(marks)\nprint(type(marks).__name__)\nprint(marks.dtype)\nprint(marks.shape)", "run": "import numpy as np\nmarks = np.array([72, 55, 91, 38, 66])\nprint(marks)\nprint(type(marks).__name__)\nprint(marks.dtype)\nprint(marks.shape)", "nav": "The ndarray"}, {"type": "predict", "topic": "reduction", "title": "Ask the array for the class average", "code": "import numpy as np\nmarks = np.array([72, 55, 91, 38, 66])\nprint(marks.mean())", "run": "import numpy as np\nmarks = np.array([72, 55, 91, 38, 66])\nprint(marks.mean())", "expect": "64.4", "why": "mean() collapses the whole array to one number. Sum is 322, divided by 5 marks = 64.4.", "nav": "The ndarray"}, {"type": "section", "title": "NumPy arrays", "subtitle": "How they store data, how they are created, and why they need a header. We begin with one picture: what a Python list keeps in memory, versus what an array keeps.", "nav": "Creating Arrays"}, {"type": "content", "title": "Two ways to keep five marks", "bullets": ["LEFT — a Python list is a row of POINTERS. Each mark is a separate int object living somewhere else on the heap, carrying a type tag and a reference count alongside the number itself.", "The number 72 costs roughly 28 bytes there, and reaching it means following an address to wherever it happens to sit.", "RIGHT — a NumPy array is ONE contiguous block of raw values, all the same width, with nothing boxed and no pointers at all.", "That single difference is the whole lecture. Because every value is the same size, element k always sits at byte k × itemsize, so finding it is arithmetic rather than a lookup — and the CPU can prefetch what comes next."], "svg": "<svg viewBox=\"0 0 880 470\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Segoe UI,system-ui,sans-serif\">\n  <defs>\n    <marker id=\"ar\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\">\n      <path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#c94b4b\"/>\n    </marker>\n    <marker id=\"arg\" markerWidth=\"10\" markerHeight=\"10\" refX=\"8\" refY=\"5\" orient=\"auto\">\n      <path d=\"M0,0 L10,5 L0,10 Z\" fill=\"#1f7a4d\"/>\n    </marker>\n  </defs>\n\n  <text x=\"215\" y=\"28\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" fill=\"#214B8C\">list  [72, 55, 91]</text>\n  <text x=\"215\" y=\"50\" text-anchor=\"middle\" font-size=\"13\" fill=\"#5b6b80\">a row of pointers &#8594; scattered, boxed int objects</text>\n\n  <rect x=\"70\" y=\"78\" width=\"290\" height=\"54\" rx=\"8\" fill=\"#eef3f9\" stroke=\"#214B8C\" stroke-width=\"2\"/>\n  <line x1=\"166\" y1=\"78\" x2=\"166\" y2=\"132\" stroke=\"#9db4d0\"/>\n  <line x1=\"262\" y1=\"78\" x2=\"262\" y2=\"132\" stroke=\"#9db4d0\"/>\n  <text x=\"118\" y=\"111\" text-anchor=\"middle\" font-size=\"15\" fill=\"#22509a\" font-weight=\"600\">ptr</text>\n  <text x=\"214\" y=\"111\" text-anchor=\"middle\" font-size=\"15\" fill=\"#22509a\" font-weight=\"600\">ptr</text>\n  <text x=\"310\" y=\"111\" text-anchor=\"middle\" font-size=\"15\" fill=\"#22509a\" font-weight=\"600\">ptr</text>\n  <text x=\"70\" y=\"150\" font-size=\"12\" fill=\"#5b6b80\">contiguous slots &#8212; but they hold only addresses</text>\n\n  <rect x=\"60\" y=\"235\" width=\"120\" height=\"70\" rx=\"10\" fill=\"#fff\" stroke=\"#c94b4b\" stroke-width=\"2\"/>\n  <text x=\"120\" y=\"262\" text-anchor=\"middle\" font-size=\"12\" fill=\"#8a2b2b\">int object + header</text>\n  <text x=\"120\" y=\"290\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" fill=\"#12233b\">72</text>\n\n  <rect x=\"230\" y=\"330\" width=\"120\" height=\"70\" rx=\"10\" fill=\"#fff\" stroke=\"#c94b4b\" stroke-width=\"2\"/>\n  <text x=\"290\" y=\"357\" text-anchor=\"middle\" font-size=\"12\" fill=\"#8a2b2b\">int object + header</text>\n  <text x=\"290\" y=\"385\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" fill=\"#12233b\">55</text>\n\n  <rect x=\"20\" y=\"345\" width=\"120\" height=\"70\" rx=\"10\" fill=\"#fff\" stroke=\"#c94b4b\" stroke-width=\"2\"/>\n  <text x=\"80\" y=\"372\" text-anchor=\"middle\" font-size=\"12\" fill=\"#8a2b2b\">int object + header</text>\n  <text x=\"80\" y=\"400\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" fill=\"#12233b\">91</text>\n\n  <path d=\"M118,132 C118,180 120,205 120,233\" fill=\"none\" stroke=\"#c94b4b\" stroke-width=\"2\" marker-end=\"url(#ar)\"/>\n  <path d=\"M214,132 C214,220 280,290 288,328\" fill=\"none\" stroke=\"#c94b4b\" stroke-width=\"2\" marker-end=\"url(#ar)\"/>\n  <path d=\"M310,132 C310,240 120,300 82,343\" fill=\"none\" stroke=\"#c94b4b\" stroke-width=\"2\" marker-end=\"url(#ar)\"/>\n\n  <text x=\"215\" y=\"440\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#8a2b2b\">add 5 &#8594; chase a pointer, unbox, add, allocate, re-box &#8212; per element</text>\n  <text x=\"215\" y=\"460\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#8a2b2b\">each object also carries a type tag and a reference count</text>\n\n  <line x1=\"440\" y1=\"68\" x2=\"440\" y2=\"440\" stroke=\"#dbe4f0\" stroke-width=\"2\" stroke-dasharray=\"5 5\"/>\n\n  <text x=\"655\" y=\"28\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" fill=\"#1f7a4d\">np.array([72, 55, 91])</text>\n  <text x=\"655\" y=\"50\" text-anchor=\"middle\" font-size=\"13\" fill=\"#5b6b80\">one contiguous block of raw numbers &#8212; no boxes, no pointers</text>\n\n  <rect x=\"505\" y=\"200\" width=\"300\" height=\"60\" rx=\"8\" fill=\"#e9f7ef\" stroke=\"#1f7a4d\" stroke-width=\"2\"/>\n  <line x1=\"605\" y1=\"200\" x2=\"605\" y2=\"260\" stroke=\"#9ccdb0\"/>\n  <line x1=\"705\" y1=\"200\" x2=\"705\" y2=\"260\" stroke=\"#9ccdb0\"/>\n  <text x=\"555\" y=\"238\" text-anchor=\"middle\" font-size=\"24\" font-weight=\"700\" fill=\"#12233b\">72</text>\n  <text x=\"655\" y=\"238\" text-anchor=\"middle\" font-size=\"24\" font-weight=\"700\" fill=\"#12233b\">55</text>\n  <text x=\"755\" y=\"238\" text-anchor=\"middle\" font-size=\"24\" font-weight=\"700\" fill=\"#12233b\">91</text>\n\n  <text x=\"555\" y=\"192\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#5b6b80\">byte 0</text>\n  <text x=\"655\" y=\"192\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#5b6b80\">byte 8</text>\n  <text x=\"755\" y=\"192\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#5b6b80\">byte 16</text>\n  <text x=\"655\" y=\"285\" text-anchor=\"middle\" font-size=\"13\" fill=\"#1f7a4d\">the values live right here, side by side, 8 bytes each (int64)</text>\n\n  <path d=\"M510,325 L800,325\" fill=\"none\" stroke=\"#1f7a4d\" stroke-width=\"2.5\" marker-end=\"url(#arg)\"/>\n  <text x=\"655\" y=\"348\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#1f7a4d\">add 5 &#8594; one straight sweep, in compiled C</text>\n\n  <rect x=\"505\" y=\"372\" width=\"300\" height=\"72\" rx=\"9\" fill=\"#f2f7ff\" stroke=\"#214B8C\" stroke-width=\"1.2\"/>\n  <text x=\"520\" y=\"396\" font-size=\"12.5\" font-weight=\"700\" fill=\"#214B8C\">Because every value is the same size,</text>\n  <text x=\"520\" y=\"416\" font-size=\"12.5\" fill=\"#3a5170\">element k is always at byte  k &#215; 8.</text>\n  <text x=\"520\" y=\"434\" font-size=\"12.5\" fill=\"#3a5170\">No lookup needed &#8212; just arithmetic.</text>\n</svg>", "nav": "Creating Arrays"}, {"type": "predict", "topic": "storage", "title": "Put a number on it", "code": "import numpy as np, sys\n\nmarks_list = list(range(1000))\nmarks_arr  = np.array(marks_list, dtype=np.int64)\n\nprint('array, the whole block   :', marks_arr.nbytes)\nprint('list, pointer slots only :', sys.getsizeof(marks_list))\n\ntotal = sys.getsizeof(marks_list) + sum(sys.getsizeof(v) for v in marks_list)\nprint('list, counting the ints  :', total)", "run": "import numpy as np, sys\nmarks_list = list(range(1000))\nmarks_arr  = np.array(marks_list, dtype=np.int64)\nprint('array, the whole block   :', marks_arr.nbytes, 'bytes')\nprint('list, pointer slots only :', sys.getsizeof(marks_list), 'bytes')\ntotal = sys.getsizeof(marks_list) + sum(sys.getsizeof(v) for v in marks_list)\nprint('list, counting the ints  :', total, 'bytes')\nprint()\nprint('the list needs about', round(total / marks_arr.nbytes, 1), 'x more memory for the same 1000 numbers')", "expect": "The array is exactly 1000 × 8 = 8000 bytes.\nThe list needs roughly 4-5x that, because it\npays twice: once for the address, once for\nthe object the address points to.", "why": "The array total is exact and predictable: size × itemsize, nothing else. The list cannot be predicted that way, because its cost depends on how many separate objects exist and how big each one is. The precise totals shift between Python builds; what never shifts is that one container stores numbers and the other stores directions to numbers.", "nav": "Creating Arrays"}, {"type": "content", "title": "Three kinds of constructor", "bullets": ["NumPy gives you seven or eight ways to make an array. They are not seven things to memorise — they are three situations, and you are always in one of them.", "1. THE DATA IS KNOWN. You already have the values in a Python list. np.array copies them into a block.", "2. ONLY THE SIZE IS KNOWN. You know how big the answer must be, not yet what goes in it. np.zeros, np.ones, np.full, np.eye, np.empty.", "3. ONLY A RULE IS KNOWN. No data and no size — just 'from here to there, like this'. np.arange and np.linspace must work out the count before anything else.", "Notice what all three share: the size is settled BEFORE the block is allocated. An allocator needs a byte count, so nothing else is possible."], "svg": "<svg viewBox=\"0 0 880 420\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Segoe UI,system-ui,sans-serif\">\n  <defs>\n    <marker id=\"ca\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\">\n      <path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#214B8C\"/>\n    </marker>\n  </defs>\n\n  <text x=\"440\" y=\"24\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#214B8C\">What do you already know? That decides which constructor you need.</text>\n\n  <g transform=\"translate(20,44)\">\n    <rect x=\"0\" y=\"0\" width=\"270\" height=\"286\" rx=\"12\" fill=\"#fff5f5\" stroke=\"#c94b4b\" stroke-width=\"1.6\"/>\n    <text x=\"135\" y=\"30\" text-anchor=\"middle\" font-size=\"14.5\" font-weight=\"700\" fill=\"#8a2b2b\">1 &#183; the DATA is known</text>\n    <line x1=\"20\" y1=\"44\" x2=\"250\" y2=\"44\" stroke=\"#e8c4c4\"/>\n    <text x=\"135\" y=\"70\" text-anchor=\"middle\" font-size=\"13\" font-family=\"Consolas,monospace\" fill=\"#8a2b2b\">np.array(...)</text>\n    <text x=\"20\" y=\"104\" font-size=\"12.5\" fill=\"#3a5170\">You have the values already,</text>\n    <text x=\"20\" y=\"122\" font-size=\"12.5\" fill=\"#3a5170\">sitting in a Python list.</text>\n    <text x=\"20\" y=\"152\" font-size=\"12\" font-weight=\"700\" fill=\"#8a2b2b\">what it must do</text>\n    <text x=\"20\" y=\"174\" font-size=\"12.5\" fill=\"#3a5170\">walk the list to learn shape</text>\n    <text x=\"20\" y=\"192\" font-size=\"12.5\" fill=\"#3a5170\">scan it to pick ONE dtype</text>\n    <text x=\"20\" y=\"210\" font-size=\"12.5\" fill=\"#3a5170\">allocate the block</text>\n    <text x=\"20\" y=\"228\" font-size=\"12.5\" fill=\"#3a5170\">unbox and copy every value</text>\n    <rect x=\"20\" y=\"244\" width=\"230\" height=\"28\" rx=\"6\" fill=\"#fff\" stroke=\"#c94b4b\"/>\n    <text x=\"135\" y=\"263\" text-anchor=\"middle\" font-size=\"12\" fill=\"#8a2b2b\">the only slow one &#8212; do it once</text>\n  </g>\n\n  <g transform=\"translate(305,44)\">\n    <rect x=\"0\" y=\"0\" width=\"270\" height=\"286\" rx=\"12\" fill=\"#f2f7ff\" stroke=\"#214B8C\" stroke-width=\"1.6\"/>\n    <text x=\"135\" y=\"30\" text-anchor=\"middle\" font-size=\"14.5\" font-weight=\"700\" fill=\"#214B8C\">2 &#183; only the SIZE is known</text>\n    <line x1=\"20\" y1=\"44\" x2=\"250\" y2=\"44\" stroke=\"#c9daf0\"/>\n    <text x=\"135\" y=\"70\" text-anchor=\"middle\" font-size=\"13\" font-family=\"Consolas,monospace\" fill=\"#22509a\">zeros ones full eye empty</text>\n    <text x=\"20\" y=\"104\" font-size=\"12.5\" fill=\"#3a5170\">You know how big the answer</text>\n    <text x=\"20\" y=\"122\" font-size=\"12.5\" fill=\"#3a5170\">is, but not yet what is in it.</text>\n    <text x=\"20\" y=\"152\" font-size=\"12\" font-weight=\"700\" fill=\"#214B8C\">what it must do</text>\n    <text x=\"20\" y=\"174\" font-size=\"12.5\" fill=\"#3a5170\">you gave the shape already</text>\n    <text x=\"20\" y=\"192\" font-size=\"12.5\" fill=\"#3a5170\">allocate the block</text>\n    <text x=\"20\" y=\"210\" font-size=\"12.5\" fill=\"#3a5170\">write one constant across it</text>\n    <text x=\"20\" y=\"228\" font-size=\"12.5\" fill=\"#3a5170\">(empty skips even that)</text>\n    <rect x=\"20\" y=\"244\" width=\"230\" height=\"28\" rx=\"6\" fill=\"#fff\" stroke=\"#214B8C\"/>\n    <text x=\"135\" y=\"263\" text-anchor=\"middle\" font-size=\"12\" fill=\"#22509a\">no Python objects touched</text>\n  </g>\n\n  <g transform=\"translate(590,44)\">\n    <rect x=\"0\" y=\"0\" width=\"270\" height=\"286\" rx=\"12\" fill=\"#e9f7ef\" stroke=\"#1f7a4d\" stroke-width=\"1.6\"/>\n    <text x=\"135\" y=\"30\" text-anchor=\"middle\" font-size=\"14.5\" font-weight=\"700\" fill=\"#1f7a4d\">3 &#183; only a RULE is known</text>\n    <line x1=\"20\" y1=\"44\" x2=\"250\" y2=\"44\" stroke=\"#bfe3ce\"/>\n    <text x=\"135\" y=\"70\" text-anchor=\"middle\" font-size=\"13\" font-family=\"Consolas,monospace\" fill=\"#1f7a4d\">arange &#183; linspace</text>\n    <text x=\"20\" y=\"104\" font-size=\"12.5\" fill=\"#3a5170\">No data and no size &#8212; just</text>\n    <text x=\"20\" y=\"122\" font-size=\"12.5\" fill=\"#3a5170\">&#8220;from here to there, like this&#8221;.</text>\n    <text x=\"20\" y=\"152\" font-size=\"12\" font-weight=\"700\" fill=\"#1f7a4d\">what it must do</text>\n    <text x=\"20\" y=\"174\" font-size=\"12.5\" fill=\"#3a5170\">work out HOW MANY first</text>\n    <text x=\"20\" y=\"192\" font-size=\"12.5\" fill=\"#3a5170\">allocate that many</text>\n    <text x=\"20\" y=\"210\" font-size=\"12.5\" fill=\"#3a5170\">generate each value in place</text>\n    <text x=\"20\" y=\"228\" font-size=\"12.5\" fill=\"#3a5170\">no source values ever exist</text>\n    <rect x=\"20\" y=\"244\" width=\"230\" height=\"28\" rx=\"6\" fill=\"#fff\" stroke=\"#1f7a4d\"/>\n    <text x=\"135\" y=\"263\" text-anchor=\"middle\" font-size=\"12\" fill=\"#1f7a4d\">the count is the hard part</text>\n  </g>\n\n  <text x=\"440\" y=\"358\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#5b6b80\">All three end the same way: one contiguous block, one dtype, plus a small header.</text>\n  <text x=\"440\" y=\"380\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#5b6b80\">And all three settle the SIZE before they allocate &#8212; an allocator needs a byte count.</text>\n</svg>", "nav": "Creating Arrays"}, {"type": "section", "title": "Category 1 · the data is known", "subtitle": "np.array() — the only constructor that has to cross out of Python", "nav": "Creating Arrays"}, {"type": "content", "title": "From a list of integers to one block", "bullets": ["np.array cannot simply take the list's memory, because that memory holds addresses, not numbers. It has to rebuild everything.", "First it walks the list to learn the shape. Then it SCANS every element to choose one dtype that can hold all of them — here, all integers, so int64 at 8 bytes each.", "Only then can it allocate: size × itemsize = 5 × 8 = 40 bytes. Finally it visits each Python object again, unboxes it, and writes the raw value into place.", "The output is the picture on the right: five numbers side by side, no pointers, no type tags, no reference counts. Element k at byte k × 8."], "svg": "<svg viewBox=\"0 0 880 400\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Segoe UI,system-ui,sans-serif\">\n  <defs>\n    <marker id=\"ia\" markerWidth=\"10\" markerHeight=\"10\" refX=\"8\" refY=\"5\" orient=\"auto\">\n      <path d=\"M0,0 L10,5 L0,10 Z\" fill=\"#214B8C\"/>\n    </marker>\n  </defs>\n\n  <text x=\"30\" y=\"28\" font-size=\"15\" font-family=\"Consolas,monospace\" font-weight=\"700\" fill=\"#12233b\">np.array([72, 55, 91, 38, 66])</text>\n\n  <text x=\"30\" y=\"62\" font-size=\"12.5\" fill=\"#8a2b2b\">the input: 5 pointers to 5 boxed int objects, scattered</text>\n  <g transform=\"translate(30,72)\">\n    <rect x=\"0\" y=\"0\" width=\"380\" height=\"38\" rx=\"6\" fill=\"#fff5f5\" stroke=\"#c94b4b\" stroke-width=\"1.4\"/>\n    <line x1=\"76\" y1=\"0\" x2=\"76\" y2=\"38\" stroke=\"#e8c4c4\"/><line x1=\"152\" y1=\"0\" x2=\"152\" y2=\"38\" stroke=\"#e8c4c4\"/>\n    <line x1=\"228\" y1=\"0\" x2=\"228\" y2=\"38\" stroke=\"#e8c4c4\"/><line x1=\"304\" y1=\"0\" x2=\"304\" y2=\"38\" stroke=\"#e8c4c4\"/>\n    <text x=\"38\"  y=\"25\" text-anchor=\"middle\" font-size=\"13\" fill=\"#8a2b2b\">ptr</text>\n    <text x=\"114\" y=\"25\" text-anchor=\"middle\" font-size=\"13\" fill=\"#8a2b2b\">ptr</text>\n    <text x=\"190\" y=\"25\" text-anchor=\"middle\" font-size=\"13\" fill=\"#8a2b2b\">ptr</text>\n    <text x=\"266\" y=\"25\" text-anchor=\"middle\" font-size=\"13\" fill=\"#8a2b2b\">ptr</text>\n    <text x=\"342\" y=\"25\" text-anchor=\"middle\" font-size=\"13\" fill=\"#8a2b2b\">ptr</text>\n  </g>\n\n  <path d=\"M220,124 L220,166\" stroke=\"#214B8C\" stroke-width=\"2.5\" marker-end=\"url(#ia)\"/>\n  <text x=\"238\" y=\"150\" font-size=\"12.5\" fill=\"#22509a\">scan &#8594; all ints &#8594; dtype int64, itemsize 8</text>\n\n  <text x=\"30\" y=\"200\" font-size=\"12.5\" font-weight=\"700\" fill=\"#1f7a4d\">the result: ONE contiguous block, 5 slots of 8 bytes</text>\n  <g transform=\"translate(30,212)\">\n    <rect x=\"0\"   y=\"0\" width=\"150\" height=\"56\" fill=\"#e9f7ef\" stroke=\"#1f7a4d\" stroke-width=\"1.6\"/>\n    <rect x=\"150\" y=\"0\" width=\"150\" height=\"56\" fill=\"#e9f7ef\" stroke=\"#1f7a4d\" stroke-width=\"1.6\"/>\n    <rect x=\"300\" y=\"0\" width=\"150\" height=\"56\" fill=\"#e9f7ef\" stroke=\"#1f7a4d\" stroke-width=\"1.6\"/>\n    <rect x=\"450\" y=\"0\" width=\"150\" height=\"56\" fill=\"#e9f7ef\" stroke=\"#1f7a4d\" stroke-width=\"1.6\"/>\n    <rect x=\"600\" y=\"0\" width=\"150\" height=\"56\" fill=\"#e9f7ef\" stroke=\"#1f7a4d\" stroke-width=\"1.6\"/>\n    <text x=\"75\"  y=\"36\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" fill=\"#12233b\">72</text>\n    <text x=\"225\" y=\"36\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" fill=\"#12233b\">55</text>\n    <text x=\"375\" y=\"36\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" fill=\"#12233b\">91</text>\n    <text x=\"525\" y=\"36\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" fill=\"#12233b\">38</text>\n    <text x=\"675\" y=\"36\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" fill=\"#12233b\">66</text>\n    <text x=\"75\"  y=\"-8\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#5b6b80\">byte 0</text>\n    <text x=\"225\" y=\"-8\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#5b6b80\">byte 8</text>\n    <text x=\"375\" y=\"-8\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#5b6b80\">byte 16</text>\n    <text x=\"525\" y=\"-8\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#5b6b80\">byte 24</text>\n    <text x=\"675\" y=\"-8\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#5b6b80\">byte 32</text>\n    <text x=\"75\"  y=\"74\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#1f7a4d\">8 bytes</text>\n    <text x=\"225\" y=\"74\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#1f7a4d\">8 bytes</text>\n    <text x=\"375\" y=\"74\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#1f7a4d\">8 bytes</text>\n    <text x=\"525\" y=\"74\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#1f7a4d\">8 bytes</text>\n    <text x=\"675\" y=\"74\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#1f7a4d\">8 bytes</text>\n  </g>\n\n  <g transform=\"translate(30,318)\">\n    <rect x=\"0\" y=\"0\" width=\"360\" height=\"62\" rx=\"9\" fill=\"#f2f7ff\" stroke=\"#214B8C\" stroke-width=\"1.2\"/>\n    <text x=\"18\" y=\"26\" font-size=\"13\" font-weight=\"700\" fill=\"#214B8C\">nbytes = size &#215; itemsize = 5 &#215; 8 = 40</text>\n    <text x=\"18\" y=\"48\" font-size=\"12.5\" fill=\"#3a5170\">No pointers. No type tags. No reference counts.</text>\n  </g>\n  <g transform=\"translate(410,318)\">\n    <rect x=\"0\" y=\"0\" width=\"370\" height=\"62\" rx=\"9\" fill=\"#e9f7ef\" stroke=\"#1f7a4d\" stroke-width=\"1.2\"/>\n    <text x=\"18\" y=\"26\" font-size=\"13\" font-weight=\"700\" fill=\"#1f7a4d\">element k lives at byte k &#215; 8</text>\n    <text x=\"18\" y=\"48\" font-size=\"12.5\" fill=\"#3a5170\">Reaching any value is arithmetic, not a lookup.</text>\n  </g>\n</svg>", "code": "import numpy as np\n\nmarks = np.array([72, 55, 91, 38, 66])\n\nprint(marks.dtype, marks.itemsize, marks.nbytes)", "run": "import numpy as np\nmarks = np.array([72, 55, 91, 38, 66])\nprint('values   :', marks)\nprint('dtype    :', marks.dtype)\nprint('itemsize :', marks.itemsize, 'bytes per value')\nprint('size     :', marks.size, 'values')\nprint('nbytes   :', marks.nbytes, '= ', marks.size, 'x', marks.itemsize)\nprint()\nfor k in range(marks.size):\n    print(f'  element {k} -> byte {k * marks.itemsize:>2} -> {marks[k]}')", "nav": "Creating Arrays"}, {"type": "content", "title": "Now mix the types — what does the block become?", "bullets": ["Feed it an int, a float and a string together. The block permits exactly ONE dtype, so the scan must find a type that holds all three.", "It widens in one direction only: int can become float, and anything can become text. So text wins, and every value is converted to a string.", "The width is set by the longest possible entry, and each slot is padded out to that width so the block stays uniform. Here that is <U32 — 32 characters, 4 bytes each, 128 bytes per slot.", "Three small numbers now occupy 384 bytes instead of 24. Worse, arithmetic is gone: marks + 5 is a TypeError. One stray string cost you the entire array."], "svg": "<svg viewBox=\"0 0 880 420\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Segoe UI,system-ui,sans-serif\">\n  <defs>\n    <marker id=\"ma\" markerWidth=\"10\" markerHeight=\"10\" refX=\"8\" refY=\"5\" orient=\"auto\">\n      <path d=\"M0,0 L10,5 L0,10 Z\" fill=\"#c94b4b\"/>\n    </marker>\n  </defs>\n\n  <text x=\"30\" y=\"28\" font-size=\"15\" font-family=\"Consolas,monospace\" font-weight=\"700\" fill=\"#12233b\">np.array([72, 55.5, 'pass'])</text>\n  <text x=\"30\" y=\"52\" font-size=\"12.5\" fill=\"#5b6b80\">an int, a float and a string &#8212; but the block allows exactly ONE dtype</text>\n\n  <g transform=\"translate(30,68)\">\n    <rect x=\"0\"   y=\"0\" width=\"150\" height=\"42\" rx=\"6\" fill=\"#fff\" stroke=\"#9db4d0\"/>\n    <rect x=\"165\" y=\"0\" width=\"150\" height=\"42\" rx=\"6\" fill=\"#fff\" stroke=\"#9db4d0\"/>\n    <rect x=\"330\" y=\"0\" width=\"150\" height=\"42\" rx=\"6\" fill=\"#fff\" stroke=\"#9db4d0\"/>\n    <text x=\"75\"  y=\"27\" text-anchor=\"middle\" font-size=\"15\" font-family=\"Consolas,monospace\" fill=\"#12233b\">72</text>\n    <text x=\"240\" y=\"27\" text-anchor=\"middle\" font-size=\"15\" font-family=\"Consolas,monospace\" fill=\"#12233b\">55.5</text>\n    <text x=\"405\" y=\"27\" text-anchor=\"middle\" font-size=\"15\" font-family=\"Consolas,monospace\" fill=\"#12233b\">'pass'</text>\n    <text x=\"75\"  y=\"60\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#5b6b80\">int</text>\n    <text x=\"240\" y=\"60\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#5b6b80\">float</text>\n    <text x=\"405\" y=\"60\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#5b6b80\">str</text>\n  </g>\n\n  <g transform=\"translate(540,60)\">\n    <rect x=\"0\" y=\"0\" width=\"310\" height=\"66\" rx=\"9\" fill=\"#fff5f5\" stroke=\"#c94b4b\" stroke-width=\"1.3\"/>\n    <text x=\"16\" y=\"24\" font-size=\"12.5\" font-weight=\"700\" fill=\"#8a2b2b\">the scan picks the widest type</text>\n    <text x=\"16\" y=\"44\" font-size=\"12.5\" fill=\"#3a5170\">int &#8594; float &#8594; text.  Text wins.</text>\n    <text x=\"16\" y=\"60\" font-size=\"12.5\" fill=\"#3a5170\">Every value becomes a string.</text>\n  </g>\n\n  <path d=\"M250,142 L250,178\" stroke=\"#c94b4b\" stroke-width=\"2.5\" marker-end=\"url(#ma)\"/>\n  <text x=\"268\" y=\"166\" font-size=\"12.5\" fill=\"#8a2b2b\">dtype &lt;U32 &#8212; every slot is 32 characters wide, 4 bytes each = 128 bytes</text>\n\n  <text x=\"30\" y=\"212\" font-size=\"12.5\" font-weight=\"700\" fill=\"#8a2b2b\">the block: 3 slots, each padded out to the full width</text>\n  <g transform=\"translate(30,224)\">\n    <rect x=\"0\"   y=\"0\" width=\"266\" height=\"52\" fill=\"#fff5f5\" stroke=\"#c94b4b\" stroke-width=\"1.6\"/>\n    <rect x=\"266\" y=\"0\" width=\"266\" height=\"52\" fill=\"#fff5f5\" stroke=\"#c94b4b\" stroke-width=\"1.6\"/>\n    <rect x=\"532\" y=\"0\" width=\"266\" height=\"52\" fill=\"#fff5f5\" stroke=\"#c94b4b\" stroke-width=\"1.6\"/>\n    <text x=\"24\"  y=\"32\" font-size=\"16\" font-family=\"Consolas,monospace\" font-weight=\"700\" fill=\"#12233b\">'72'</text>\n    <text x=\"290\" y=\"32\" font-size=\"16\" font-family=\"Consolas,monospace\" font-weight=\"700\" fill=\"#12233b\">'55.5'</text>\n    <text x=\"556\" y=\"32\" font-size=\"16\" font-family=\"Consolas,monospace\" font-weight=\"700\" fill=\"#12233b\">'pass'</text>\n    <text x=\"150\" y=\"32\" font-size=\"12.5\" font-family=\"Consolas,monospace\" fill=\"#c99\">. . . . . . . padding . . . . . .</text>\n    <text x=\"420\" y=\"32\" font-size=\"12.5\" font-family=\"Consolas,monospace\" fill=\"#c99\">. . . . . padding . . . . .</text>\n    <text x=\"686\" y=\"32\" font-size=\"12.5\" font-family=\"Consolas,monospace\" fill=\"#c99\">. . . . . padding . . . . .</text>\n    <text x=\"133\" y=\"70\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#8a2b2b\">128 bytes</text>\n    <text x=\"399\" y=\"70\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#8a2b2b\">128 bytes</text>\n    <text x=\"665\" y=\"70\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#8a2b2b\">128 bytes</text>\n  </g>\n\n  <g transform=\"translate(30,318)\">\n    <rect x=\"0\" y=\"0\" width=\"360\" height=\"82\" rx=\"9\" fill=\"#fff5f5\" stroke=\"#c94b4b\" stroke-width=\"1.2\"/>\n    <text x=\"18\" y=\"26\" font-size=\"13\" font-weight=\"700\" fill=\"#8a2b2b\">nbytes = 3 &#215; 128 = 384 bytes</text>\n    <text x=\"18\" y=\"48\" font-size=\"12.5\" fill=\"#3a5170\">The same three numbers as float64</text>\n    <text x=\"18\" y=\"66\" font-size=\"12.5\" fill=\"#3a5170\">would have been 3 &#215; 8 = 24 bytes.</text>\n  </g>\n  <g transform=\"translate(410,318)\">\n    <rect x=\"0\" y=\"0\" width=\"370\" height=\"82\" rx=\"9\" fill=\"#f2f7ff\" stroke=\"#214B8C\" stroke-width=\"1.2\"/>\n    <text x=\"18\" y=\"26\" font-size=\"13\" font-weight=\"700\" fill=\"#214B8C\">And now nothing works</text>\n    <text x=\"18\" y=\"48\" font-size=\"12.5\" fill=\"#3a5170\">a + 5 is a TypeError. a.mean() fails.</text>\n    <text x=\"18\" y=\"66\" font-size=\"12.5\" fill=\"#3a5170\">One stray string cost you the whole array.</text>\n  </g>\n</svg>", "code": "import numpy as np\n\nprint(np.array([72, 55, 91]).dtype)          # all ints\nprint(np.array([72, 55.5, 91]).dtype)        # one float\nprint(np.array([72, 55.5, 'pass']).dtype)    # one string", "run": "import numpy as np\nfor L in [[72, 55, 91], [72, 55.5, 91], [72, 55.5, 'pass']]:\n    a = np.array(L)\n    print(f'{str(L):<24} -> dtype {str(a.dtype):<9} itemsize {a.itemsize:>4}  nbytes {a.nbytes:>4}')\nprint()\nbad = np.array([72, 55.5, 'pass'])\nprint('the values are now text:', bad)\ntry:\n    bad + 5\nexcept Exception as e:\n    print('bad + 5 ->', type(e).__name__)\nprint()\ngood = np.array([72, 55, 91], dtype=np.int8)\nprint('and you can pin it yourself: dtype', good.dtype, '| nbytes', good.nbytes)", "nav": "Creating Arrays"}, {"type": "section", "title": "Category 2 · only the size is known", "subtitle": "zeros, ones, full, eye, empty — allocate the block first, decide the contents later", "nav": "Creating Arrays"}, {"type": "content", "title": "np.zeros — a blank slate", "bullets": ["np.zeros(shape) takes a SHAPE, not data. No Python list is involved, so none of the scanning and unboxing from the last section happens.", "Use it when you know how big the answer must be before you know what goes in it: an attendance register of 222 students × 30 classes, everyone absent until marked.", "Watch the dtype. It defaults to float64, so np.zeros(3) gives [0. 0. 0.] with dots, not [0 0 0]. Marks are integers — ask for dtype=int when you mean it.", "Cost is the writing, not the allocating: it must touch all size × itemsize bytes to put a zero in each."], "code": "import numpy as np\n\nregister = np.zeros((4, 3))            # float64 by default\nregister_int = np.zeros((4, 3), dtype=int)\n\nprint(register)\nprint(register.dtype, register_int.dtype)", "run": "import numpy as np\nprint(np.zeros((4, 3)))\nprint('dtype', np.zeros((4, 3)).dtype, '| itemsize', np.zeros((4, 3)).itemsize, '| nbytes', np.zeros((4, 3)).nbytes)\nprint()\nprint(np.zeros((4, 3), dtype=int))\nprint('dtype', np.zeros((4, 3), dtype=int).dtype)\nprint()\nprint('1D form:', np.zeros(5))", "nav": "Creating Arrays"}, {"type": "content", "title": "np.ones — a neutral starting value", "bullets": ["Identical machinery to np.zeros, with 1 written across the block instead of 0. Also float64 by default.", "Reach for it when 1 is the value that means 'no effect yet': weights before you tune them, a multiplier you are about to scale, a mask that lets everything through.", "It is also the quickest way to get an array of any constant: np.ones(5) * 7. That said, if you want 7, np.full says so more directly.", "Same cost model as zeros — proportional to the bytes written, not to the call."], "code": "import numpy as np\n\nweights = np.ones(3)            # one weight per assessment\nprint(weights, weights.dtype)\n\nprint(np.ones((2, 4), dtype=int))", "run": "import numpy as np\nprint(np.ones(3), '| dtype', np.ones(3).dtype)\nprint()\nprint(np.ones((2, 4), dtype=int))\nprint()\nprint('scaled to a constant:', np.ones(5) * 7)\nprint('weighted marks demo :', np.array([72, 55, 91]) * np.ones(3))", "nav": "Creating Arrays"}, {"type": "content", "title": "np.full and np.eye — any constant, and a structure", "bullets": ["np.full(shape, value) fills with whatever you choose. np.full((4,3), -1) is the standard 'not graded yet' marker, because 0 is a real mark and -1 is not.", "np.full is the exception on dtype: it takes the type of the fill value you gave it. -1 gives an int array; -1.0 gives a float array. Be deliberate about which you type.", "np.eye(n) looks like a different kind of object — 1 on the diagonal, 0 elsewhere — but it belongs here too. Underneath it is zeros, then writing 1 into every (n+1)-th slot of the flat block.", "Why n+1? Moving one row down and one column across is n+1 steps through a row-major block. Even the structural-looking constructor is an ordinary fill with an interesting step."], "code": "import numpy as np\n\nungraded = np.full((4, 3), -1)      # int, from the fill value\nprint(ungraded.dtype, np.full((4, 3), -1.0).dtype)\n\nn = 4\nz = np.zeros((n, n))\nz.flat[::n + 1] = 1                 # this IS np.eye(4)\nprint(np.array_equal(z, np.eye(n)))", "run": "import numpy as np\nprint(np.full((2, 3), -1))\nprint('np.full(-1) dtype :', np.full(3, -1).dtype, '   np.full(-1.0) dtype :', np.full(3, -1.0).dtype)\nprint()\nn = 4\nz = np.zeros((n, n))\nz.flat[::n + 1] = 1\nprint(z)\nprint('identical to np.eye(4)?', np.array_equal(z, np.eye(n)))\nprint('flat block :', z.ravel())\nprint('the 1s sit at indices 0, 5, 10, 15  -> step n+1 =', n + 1)", "nav": "Creating Arrays"}, {"type": "content", "title": "np.empty — allocate, and skip the fill", "bullets": ["np.empty is the same constructor with the writing removed. It performs the allocation and stops. The full block is reserved and addressable — 'empty' refers to the contents, not the size.", "So it contains whatever those bytes held before: values freed by earlier code, reinterpreted through your chosen dtype. Run it and look.", "It is fast and legitimate, but only safe when you are about to overwrite every element. Read before you write and you read junk.", "Its teaching value is that it shows exactly what np.zeros charges you for. Allocating is nearly free; np.zeros = np.empty + the guarantee, and the guarantee is O(n)."], "code": "import numpy as np\n\nscratch = np.empty(5)      # allocated, NOT initialised\nprint(scratch)             # whatever was in that memory", "run": "import numpy as np, time\n\njunk = np.arange(3000, dtype=np.float64) + 0.5\ndel junk                      # hand the block back to the allocator\n\nscratch = np.empty(3000, dtype=np.float64)\nprint('first 8 values of a fresh np.empty:')\nprint(scratch[:8])\nprint('all zero?', bool(np.all(scratch == 0)))\nprint('(recognise any of those? they are the values we just deleted)')\nprint()\n\ndef best(f, r=7):\n    b = 1e9\n    for _ in range(r):\n        t = time.perf_counter(); f(); b = min(b, time.perf_counter() - t)\n    return b * 1000\n\nprint(f\"{'N':>10} {'empty':>10} {'zeros':>10} {'ones':>10}\")\nfor N in (200_000, 1_000_000, 4_000_000):\n    print(f'{N:>10} {best(lambda: np.empty(N)):>10.4f} {best(lambda: np.zeros(N)):>10.4f} {best(lambda: np.ones(N)):>10.4f}   ms')\nprint()\nprint('empty stays flat as N grows. the others scale with N.')", "nav": "Creating Arrays"}, {"type": "section", "title": "Category 3 · only a rule is known", "subtitle": "arange and linspace — no data, no size, just 'from here to there, like this'", "nav": "Creating Arrays"}, {"type": "content", "title": "np.arange — you state the STEP", "bullets": ["np.arange(start, stop, step) is range()'s array cousin, and the stop value is EXCLUDED exactly as in range().", "But before it can allocate anything it must work out how many values there will be, and you did not tell it. It computes the count as ceil((stop - start) / step).", "Use it when the step is what you genuinely know: roll numbers 1 to 222, every 5th mark, assessment indices 0, 1, 2.", "Unlike range(), the step may be a float — and that is precisely where deriving a count from floating point goes wrong. Next slide."], "code": "import numpy as np\n\nprint(np.arange(5))          # 0 up to (not including) 5\nprint(np.arange(2, 10, 2))   # start, stop, step\nprint(np.arange(222) + 1)    # roll numbers", "run": "import numpy as np\nprint('np.arange(5)        ->', np.arange(5))\nprint('np.arange(2, 10, 2) ->', np.arange(2, 10, 2))\nrolls = np.arange(222) + 1\nprint('roll numbers        ->', rolls[:8], '...', rolls[-3:], '| count', rolls.size)\nprint()\nprint('count = ceil((stop - start) / step), computed BEFORE allocating')", "nav": "Creating Arrays"}, {"type": "predict", "topic": "numerics", "title": "The arange trap — how many values come out?", "code": "import numpy as np\n\n# 1.3 is the stop, and stop is excluded.\n# So this should give 1.0, 1.1, 1.2 -- three values.\ncutoffs = np.arange(1, 1.3, 0.1)\nprint(cutoffs)\nprint('count:', len(cutoffs))", "run": "import numpy as np\ncutoffs = np.arange(1, 1.3, 0.1)\nprint(cutoffs)\nprint('count:', len(cutoffs))\nprint()\nprint('the count came from this division:')\nprint('  (1.3 - 1) / 0.1 =', (1.3 - 1) / 0.1)\nprint('  0.1 in binary   =', format(0.1, '.20f'))\nprint()\nprint('linspace has no such problem:', np.linspace(1, 1.2, 3))", "expect": "[1.  1.1 1.2 1.3]\ncount: 4", "why": "You asked for an exclusive stop of 1.3 and got 1.3 anyway. The reason is in the run output: 0.1 is not representable in binary, so (1.3 - 1) / 0.1 evaluates to 3.0000000000000004, and its ceiling is 4. The block was allocated at the wrong length before a single value was written — the failure is in the sizing step, not in the values. When the count matters, do not make NumPy guess it.", "nav": "Creating Arrays"}, {"type": "content", "title": "np.linspace — you state the COUNT", "bullets": ["np.linspace(start, stop, n) is handed the count directly, as an integer. There is nothing to derive, so the sizing step cannot go wrong.", "It then computes the step by one division, (stop - start) / (n - 1), and forces the last element to land exactly on stop. The endpoint is INCLUDED — the opposite of arange.", "Use it whenever the number of points is what you actually care about: grade band boundaries, a smooth x-axis for a plot, sampling a range evenly.", "The rule of thumb: if you can state the STEP, use arange. If you can state the COUNT, use linspace. Floats push you towards linspace."], "code": "import numpy as np\n\nprint(np.linspace(0, 1, 5))     # 5 values, both ends included\nprint(np.linspace(0, 100, 5))   # 5 grade boundaries", "run": "import numpy as np\nprint('np.linspace(0, 1, 5)   ->', np.linspace(0, 1, 5))\nprint('np.linspace(0, 100, 5) ->', np.linspace(0, 100, 5))\nprint()\nprint('endpoint included by default; turn it off if you want arange behaviour:')\nprint('np.linspace(0, 1, 5, endpoint=False) ->', np.linspace(0, 1, 5, endpoint=False))\nprint()\nvals, step = np.linspace(0, 1, 5, retstep=True)\nprint('it will even tell you the step it chose:', step)", "nav": "Creating Arrays"}, {"type": "mcq", "topic": "creation", "title": "You need exactly 11 evenly spaced cut-offs from 0 to 100", "code": "import numpy as np\n# 0, 10, 20, ... 100 -- eleven values, both ends included.\n# Which line states what you actually mean?", "options": ["np.arange(0, 100, 10)", "np.arange(0, 110, 10)", "np.linspace(0, 100, 11)", "np.linspace(0, 100, 10)"], "answer": 2, "expect": "np.linspace(0, 100, 11)", "why": "linspace(0, 100, 11) says it directly: eleven values, endpoint kept, count guaranteed. arange(0, 100, 10) stops at 90, since stop is exclusive. arange(0, 110, 10) does give the right answer here — but only because the step is a whole number, so the count division is exact; make the step 0.1 and it becomes a coin flip. linspace(0, 100, 10) gives ten points with a step of 11.11.", "nav": "Creating Arrays"}, {"type": "content", "title": "Choosing, without memorising", "bullets": ["Do you already have the values? → np.array. It is the expensive one, so do it once, at the edge of your program.", "Do you know the size but not the contents? → np.zeros / np.ones / np.full. Cost is proportional to the bytes written.", "Will you overwrite every slot immediately anyway? → np.empty. Skips the fill; unsafe otherwise.", "Do you know the STEP? → np.arange. Do you know the COUNT? → np.linspace.", "Do you need a diagonal? → np.eye, which is zeros with a stride of n+1.", "All of them hand back the same kind of thing: one contiguous block, one dtype, plus a small header. Only the values differ."], "code": "import numpy as np\n\ndata     = np.array([72, 55, 91])\nblank    = np.zeros((2, 3), dtype=int)\nweights  = np.ones(3)\nsentinel = np.full(4, -1)\nby_step  = np.arange(0, 10, 2)\nby_count = np.linspace(0, 10, 6)\nident    = np.eye(2)", "run": "import numpy as np\nrows = [('np.array([72,55,91])  ', np.array([72, 55, 91]),      'data known'),\n        ('np.zeros((2,3), int)  ', np.zeros((2, 3), dtype=int), 'size known'),\n        ('np.ones(3)            ', np.ones(3),                  'size known'),\n        ('np.full(4, -1)        ', np.full(4, -1),              'size known'),\n        ('np.empty(3)           ', np.empty(3),                 'size known, no fill'),\n        ('np.eye(2)             ', np.eye(2),                   'size known + stride'),\n        ('np.arange(0, 10, 2)   ', np.arange(0, 10, 2),         'rule: by step'),\n        ('np.linspace(0, 10, 6) ', np.linspace(0, 10, 6),       'rule: by count')]\nfor name, a, kind in rows:\n    print(f'{name} {kind:<20} {str(a.ravel())[:30]}')", "nav": "Creating Arrays"}, {"type": "section", "title": "Why an array needs a header at all", "subtitle": "Do not memorise five attributes. Derive them. Each one exists because some everyday operation would otherwise mean copying the entire block.", "nav": "Array Internals"}, {"type": "content", "title": "One flat block, plus the instructions to read it", "bullets": ["Everything we built today is a straight line of values in memory. There is no second dimension down there. There cannot be — memory is addressed by a single number.", "So the block on its own is useless. Twelve int64s and twenty-four int32s look identical; four rows of three and three rows of four look identical.", "Something must record the missing instructions. That something is the header: a handful of bytes sitting next to a pointer.", "For the rest of the session we will invent it. Take a scenario, ask what you would have to copy without it, and the attribute falls out."], "svg": "<svg viewBox=\"0 0 880 450\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Segoe UI,system-ui,sans-serif\">\n  <defs>\n    <marker id=\"hd\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\">\n      <path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#214B8C\"/>\n    </marker>\n  </defs>\n\n  <text x=\"30\" y=\"24\" font-size=\"14\" font-weight=\"700\" fill=\"#214B8C\">THE OBJECT</text>\n  <text x=\"140\" y=\"24\" font-size=\"13\" fill=\"#5b6b80\">= a pointer to a flat block, plus a header that says how to read it</text>\n\n  <g transform=\"translate(30,40)\">\n    <rect x=\"0\" y=\"0\" width=\"360\" height=\"168\" rx=\"10\" fill=\"#f2f7ff\" stroke=\"#214B8C\" stroke-width=\"1.6\"/>\n    <text x=\"18\" y=\"26\" font-size=\"13\" font-weight=\"700\" fill=\"#214B8C\">HEADER &#8212; stored, a few bytes</text>\n    <text x=\"18\" y=\"56\" font-size=\"14.5\" font-family=\"Consolas,monospace\" fill=\"#12233b\">dtype</text>\n    <text x=\"140\" y=\"56\" font-size=\"14.5\" font-family=\"Consolas,monospace\" font-weight=\"700\" fill=\"#12233b\">int64</text>\n    <text x=\"230\" y=\"56\" font-size=\"11.5\" fill=\"#5b6b80\">what one value IS</text>\n    <text x=\"18\" y=\"86\" font-size=\"14.5\" font-family=\"Consolas,monospace\" fill=\"#12233b\">itemsize</text>\n    <text x=\"140\" y=\"86\" font-size=\"14.5\" font-family=\"Consolas,monospace\" font-weight=\"700\" fill=\"#12233b\">8</text>\n    <text x=\"230\" y=\"86\" font-size=\"11.5\" fill=\"#5b6b80\">bytes for one value</text>\n    <text x=\"18\" y=\"116\" font-size=\"14.5\" font-family=\"Consolas,monospace\" fill=\"#12233b\">shape</text>\n    <text x=\"140\" y=\"116\" font-size=\"14.5\" font-family=\"Consolas,monospace\" font-weight=\"700\" fill=\"#12233b\">(4, 3)</text>\n    <text x=\"230\" y=\"116\" font-size=\"11.5\" fill=\"#5b6b80\">how to fold the block</text>\n    <line x1=\"18\" y1=\"130\" x2=\"342\" y2=\"130\" stroke=\"#c9daf0\"/>\n    <text x=\"18\" y=\"152\" font-size=\"12\" fill=\"#5b6b80\">ndim = len(shape) = 2 &#160;&#160;&#183;&#160;&#160; size = 4 &#215; 3 = 12 &#160;&#160;(both derived)</text>\n  </g>\n\n  <g transform=\"translate(420,40)\">\n    <rect x=\"0\" y=\"0\" width=\"430\" height=\"168\" rx=\"10\" fill=\"#fff\" stroke=\"#dbe4f0\" stroke-width=\"1.5\"/>\n    <text x=\"18\" y=\"26\" font-size=\"13\" font-weight=\"700\" fill=\"#214B8C\">ONLY TWO FACTS ARE INDEPENDENT</text>\n    <text x=\"18\" y=\"56\" font-size=\"13\" fill=\"#3a5170\">dtype &#8594; itemsize &#160;&#160;(itemsize IS dtype.itemsize)</text>\n    <text x=\"18\" y=\"82\" font-size=\"13\" fill=\"#3a5170\">shape &#8594; ndim, size &#160;&#160;(a length and a product)</text>\n    <line x1=\"18\" y1=\"98\" x2=\"412\" y2=\"98\" stroke=\"#dbe4f0\"/>\n    <text x=\"18\" y=\"124\" font-size=\"13\" fill=\"#3a5170\">Everything else is bookkeeping on those two.</text>\n    <text x=\"18\" y=\"152\" font-size=\"15\" font-family=\"Consolas,monospace\" font-weight=\"700\" fill=\"#1f7a4d\">size &#215; itemsize = nbytes = 96</text>\n  </g>\n\n  <text x=\"30\" y=\"244\" font-size=\"13\" font-weight=\"700\" fill=\"#1f7a4d\">THE BUFFER &#8212; always one-dimensional, always contiguous</text>\n  <g transform=\"translate(30,258)\">\n    <rect x=\"0\"   y=\"0\" width=\"66\" height=\"44\" fill=\"#e9f7ef\" stroke=\"#1f7a4d\"/><rect x=\"66\"  y=\"0\" width=\"66\" height=\"44\" fill=\"#e9f7ef\" stroke=\"#1f7a4d\"/><rect x=\"132\" y=\"0\" width=\"66\" height=\"44\" fill=\"#e9f7ef\" stroke=\"#1f7a4d\"/>\n    <rect x=\"198\" y=\"0\" width=\"66\" height=\"44\" fill=\"#e9f7ef\" stroke=\"#1f7a4d\"/><rect x=\"264\" y=\"0\" width=\"66\" height=\"44\" fill=\"#e9f7ef\" stroke=\"#1f7a4d\"/><rect x=\"330\" y=\"0\" width=\"66\" height=\"44\" fill=\"#e9f7ef\" stroke=\"#1f7a4d\"/>\n    <rect x=\"396\" y=\"0\" width=\"66\" height=\"44\" fill=\"#e9f7ef\" stroke=\"#1f7a4d\"/><rect x=\"462\" y=\"0\" width=\"66\" height=\"44\" fill=\"#e9f7ef\" stroke=\"#1f7a4d\"/><rect x=\"528\" y=\"0\" width=\"66\" height=\"44\" fill=\"#e9f7ef\" stroke=\"#1f7a4d\"/>\n    <rect x=\"594\" y=\"0\" width=\"66\" height=\"44\" fill=\"#e9f7ef\" stroke=\"#1f7a4d\"/><rect x=\"660\" y=\"0\" width=\"66\" height=\"44\" fill=\"#e9f7ef\" stroke=\"#1f7a4d\"/><rect x=\"726\" y=\"0\" width=\"66\" height=\"44\" fill=\"#e9f7ef\" stroke=\"#1f7a4d\"/>\n\n    <text x=\"33\"  y=\"29\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"600\" fill=\"#12233b\">72</text>\n    <text x=\"99\"  y=\"29\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"600\" fill=\"#12233b\">68</text>\n    <text x=\"165\" y=\"29\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"600\" fill=\"#12233b\">91</text>\n    <text x=\"231\" y=\"29\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"600\" fill=\"#12233b\">55</text>\n    <text x=\"297\" y=\"29\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"600\" fill=\"#12233b\">62</text>\n    <text x=\"363\" y=\"29\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"600\" fill=\"#12233b\">40</text>\n    <text x=\"429\" y=\"29\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"600\" fill=\"#12233b\">88</text>\n    <text x=\"495\" y=\"29\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"600\" fill=\"#12233b\">79</text>\n    <text x=\"561\" y=\"29\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"600\" fill=\"#12233b\">95</text>\n    <text x=\"627\" y=\"29\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"600\" fill=\"#12233b\">30</text>\n    <text x=\"693\" y=\"29\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"600\" fill=\"#12233b\">45</text>\n    <text x=\"759\" y=\"29\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"600\" fill=\"#12233b\">58</text>\n\n    <text x=\"0\"   y=\"-6\" font-size=\"10.5\" fill=\"#5b6b80\">byte 0</text>\n    <text x=\"198\" y=\"-6\" font-size=\"10.5\" fill=\"#5b6b80\">byte 24</text>\n    <text x=\"396\" y=\"-6\" font-size=\"10.5\" fill=\"#5b6b80\">byte 48</text>\n    <text x=\"594\" y=\"-6\" font-size=\"10.5\" fill=\"#5b6b80\">byte 72</text>\n\n    <path d=\"M2,52 L196,52\" stroke=\"#214B8C\" stroke-width=\"2\"/><path d=\"M2,52 L2,58 M196,52 L196,58\" stroke=\"#214B8C\" stroke-width=\"2\"/>\n    <path d=\"M200,52 L394,52\" stroke=\"#214B8C\" stroke-width=\"2\"/><path d=\"M200,52 L200,58 M394,52 L394,58\" stroke=\"#214B8C\" stroke-width=\"2\"/>\n    <path d=\"M398,52 L592,52\" stroke=\"#214B8C\" stroke-width=\"2\"/><path d=\"M398,52 L398,58 M592,52 L592,58\" stroke=\"#214B8C\" stroke-width=\"2\"/>\n    <path d=\"M596,52 L790,52\" stroke=\"#214B8C\" stroke-width=\"2\"/><path d=\"M596,52 L596,58 M790,52 L790,58\" stroke=\"#214B8C\" stroke-width=\"2\"/>\n    <text x=\"99\"  y=\"74\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#22509a\">row 0</text>\n    <text x=\"297\" y=\"74\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#22509a\">row 1</text>\n    <text x=\"495\" y=\"74\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#22509a\">row 2</text>\n    <text x=\"693\" y=\"74\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#22509a\">row 3</text>\n  </g>\n\n  <g transform=\"translate(30,394)\">\n    <rect x=\"0\" y=\"0\" width=\"820\" height=\"46\" rx=\"9\" fill=\"#f2f7ff\" stroke=\"#214B8C\" stroke-width=\"1.2\"/>\n    <text x=\"18\" y=\"29\" font-size=\"13.5\" fill=\"#3a5170\">The brackets are not in memory. Nothing separates row 0 from row 1 except the header saying &#8220;every 3 values, start a new row.&#8221;</text>\n  </g>\n</svg>", "nav": "Array Internals"}, {"type": "content", "title": "Scenario 1 — the same marks, viewed differently", "bullets": ["The OMR scanner hands you 12 marks as one flat roll. You want to see them as 4 students × 3 assessments. Later grouped as 3 × 4. Later still flat again, for a histogram.", "Without a header you would build a fresh list-of-lists each time — read all 12 values, write all 12 values, three times over. On a real gradebook that is megabytes copied to answer a question about LAYOUT.", "But nothing about the data changed. Only your reading of it did. So record the reading: a field saying 'every 3 values, start a new row'.", "That field is .shape. Give it a new value and the same block is a different array. Zero bytes move."], "code": "import numpy as np\n\nflat = np.array([72, 68, 91, 55, 62, 40, 88, 79, 95, 30, 45, 58])\n\nas_grid   = flat.reshape(4, 3)\nregrouped = flat.reshape(3, 4)\n\nprint(np.shares_memory(flat, as_grid), np.shares_memory(flat, regrouped))", "run": "import numpy as np\nflat = np.array([72, 68, 91, 55, 62, 40, 88, 79, 95, 30, 45, 58])\nfor name, a in [('flat  ', flat), ('(4,3) ', flat.reshape(4, 3)), ('(3,4) ', flat.reshape(3, 4)), ('(2,6) ', flat.reshape(2, 6))]:\n    print(name, 'shape', str(a.shape).ljust(8), 'nbytes', a.nbytes, ' same block:', np.shares_memory(flat, a))\nprint()\nprint(flat.reshape(4, 3))\nprint()\nprint('nbytes never changed. only the instruction did.')", "nav": "Array Internals"}, {"type": "predict", "topic": "shape", "title": "So what did the header save us?", "code": "import numpy as np\n\nbig = np.arange(4_000_000)      # 32 MB of marks\n\n# reshape it, versus actually copying it.\n# How far apart should these be?", "run": "import numpy as np, time\n\ndef best(f, r=5):\n    b = 1e9\n    for _ in range(r):\n        t = time.perf_counter(); f(); b = min(b, time.perf_counter() - t)\n    return b * 1000\n\nbig = np.arange(4_000_000)\nr = best(lambda: big.reshape(2000, 2000))\nc = best(lambda: big.copy(), 3)\n\nprint(f'reshape(2000, 2000) : {r:9.4f} ms   <- edit the header')\nprint(f'copy()              : {c:9.4f} ms   <- move 32 MB')\nprint()\nprint(f'the header edit is ~{c/max(r,1e-12):,.0f}x cheaper')\nprint('shares memory with the original:', np.shares_memory(big, big.reshape(2000, 2000)))", "expect": "reshape is thousands of times cheaper than copy,\nand it does not depend on how big the array is.", "why": "reshape is O(1): it writes a new shape tuple and hands back an object pointing at the same buffer. copy() is O(n) — it must touch all 32 MB. That gap is the entire justification for having a header, and it does not shrink as data grows. It widens, because one side scales with N and the other does not.", "nav": "Array Internals"}, {"type": "content", "title": "Scenario 2 — the block cannot tell you what it means", "bullets": ["You are handed eight bytes. Are they one int64, one float64, two int32s, or eight characters? The bytes are identical in every case. There is no tag inside them.", "The alternative is to label every element with its own type — which is exactly what Python does, and exactly the boxing we abandoned in the first picture of this lecture.", "So record the interpretation ONCE, for the whole array. That is .dtype: not a property of any single value, but the rule for reading all of them.", "The proof is .view(), which changes the dtype and nothing else. Same bytes, same address, completely different numbers."], "code": "import numpy as np\n\nraw = np.array([1078530011], dtype=np.int32)\n\nprint(raw)                    # read those 4 bytes as an integer\nprint(raw.view(np.float32))   # read the SAME 4 bytes as a float", "run": "import numpy as np\nraw = np.array([1078530011], dtype=np.int32)\nprint('as int32   :', raw)\nprint('as float32 :', raw.view(np.float32))\nprint('same block :', np.shares_memory(raw, raw.view(np.float32)))\nprint()\nx = np.array([1.0, 2.0])\nprint('float64 [1.0, 2.0] read as int64 :', x.view(np.int64))\nprint()\nprint('nothing was converted. one header field changed.')", "nav": "Array Internals"}, {"type": "content", "title": "Scenario 3 — where exactly is element k?", "bullets": ["You ask for grid[2, 1]. Something must turn that pair of indices into a single byte address, because there is no other way to reach memory.", "The formula is base + (2 × bytes-per-row) + (1 × bytes-per-value). Both of those numbers depend on knowing how wide ONE value is.", "Without that width recorded, no offset can be computed and every lookup would have to scan from the start — indexing would be O(n) instead of O(1).", ".itemsize is that width. .strides are the two products precomputed. This is the attribute that makes indexing arithmetic rather than searching."], "code": "import numpy as np\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\ngrid = grid.astype(np.int64)\n\ni, j = 2, 1\noffset = i * grid.strides[0] + j * grid.strides[1]\nprint('byte offset :', offset)\nprint('element no  :', offset // grid.itemsize)", "run": "import numpy as np\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\ngrid = grid.astype(np.int64)\nprint('itemsize', grid.itemsize, 'bytes  | strides', grid.strides, 'bytes')\nprint()\ni, j = 2, 1\noffset = i * grid.strides[0] + j * grid.strides[1]\nprint(f'grid[{i},{j}] -> {i}*{grid.strides[0]} + {j}*{grid.strides[1]} = {offset} bytes in')\nprint(f'          -> element {offset // grid.itemsize} of the flat block')\nprint()\nprint('flat block :', grid.ravel())\nprint('value there:', grid.ravel()[offset // grid.itemsize], ' | grid[2,1] =', grid[i, j])", "nav": "Array Internals"}, {"type": "content", "title": "Scenario 4 — is this reshape even legal?", "bullets": ["You want to reshape the gradebook to (6, 2). Allowed? Only if 6 × 2 equals the number of values actually in the block.", "Answering that by walking the data would be O(n) — an expensive check guarding an operation that was supposed to be free. Validation would cost more than the thing being validated.", "So record the count. .size is the number of values, and every reshape, broadcast and allocation check is settled by arithmetic on it alone.", "It also answers the ordinary questions: how many marks are there, how much memory is this (size × itemsize), what do I divide by for the mean."], "code": "import numpy as np\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\n\nprint(grid.size)                # 12 values\nprint(grid.reshape(6, 2).shape) # 6 x 2 = 12, fine\n# grid.reshape(5, 3)            # 5 x 3 = 15, refused", "run": "import numpy as np\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\nprint('size :', grid.size, '(so any new shape must multiply to 12)')\nprint()\nfor shape in [(6, 2), (3, 4), (12,), (5, 3)]:\n    try:\n        grid.reshape(shape)\n        print(f'  reshape{str(shape):8} ok')\n    except Exception as e:\n        print(f'  reshape{str(shape):8} refused -> {e}')\nprint()\nprint('that check never looked at a single value.')", "nav": "Array Internals"}, {"type": "content", "title": "Scenario 5 — how many indices do I need?", "bullets": ["You write a function that reports the top mark. Sometimes it is handed one student's row, sometimes the whole gradebook. Before it can index anything it must know which it has.", "grid[2, 1] is meaningful for a 2D array and an error for a 1D one — and the block is a line of 12 values either way, so it cannot tell you.", "So the header records it: .ndim. It is len(shape), which means it costs nothing to store and nothing to read.", "And it is not merely descriptive. row[:, None] adds an axis so a row can broadcast down a matrix: ndim goes 1 to 2, shape gains an entry, and not one value moves."], "code": "import numpy as np\n\nrow = np.array([72, 68, 91])\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\n\nprint(row.ndim, grid.ndim)\n\ncol = row[:, None]        # same 3 marks, now a column\nprint(col.shape, col.ndim, np.shares_memory(row, col))", "run": "import numpy as np\nrow = np.array([72, 68, 91])\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\nprint('row.ndim  :', row.ndim, ' shape', row.shape)\nprint('grid.ndim :', grid.ndim, ' shape', grid.shape)\nprint()\ncol = row[:, None]\nprint('row[:, None] -> shape', col.shape, '| ndim', col.ndim, '| same block:', np.shares_memory(row, col))\nprint(col)\nprint()\nprint('an axis appeared out of nothing. nbytes:', row.nbytes, '->', col.nbytes)", "nav": "Array Internals"}, {"type": "predict", "topic": "attributes", "title": "A caution: size is not len()", "code": "import numpy as np\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\n\nprint('len(grid) :', len(grid))\nprint('grid.size :', grid.size)", "run": "import numpy as np\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\nprint('len(grid) :', len(grid))\nprint('grid.size :', grid.size)\nprint('shape     :', grid.shape, '->', grid.shape[0], '*', grid.shape[1], '=', grid.shape[0] * grid.shape[1])\nprint()\nflat = np.array([72, 55, 91, 38, 66])\nprint('for 1D they agree:', len(flat), flat.size)", "expect": "len(grid) : 4\ngrid.size : 12", "why": "len() is Python's protocol and it only ever reports the FIRST axis — here, how many students. .size is NumPy's count of every value in the block. For a 1D array the two agree, which is exactly why this trips people up: it works fine right up until the day they move to 2D.", "nav": "Array Internals"}, {"type": "predict", "topic": "attributes", "title": "itemsize is a budget, not a detail", "code": "import numpy as np\n\nmarks = np.array([72, 55, 91, 38, 66], dtype=np.int64)\nsmall = marks.astype(np.int8)\n\nfor a in (marks, small):\n    print(a.dtype, '| itemsize', a.itemsize, '| size', a.size, '| nbytes', a.nbytes)", "run": "import numpy as np\nmarks = np.array([72, 55, 91, 38, 66], dtype=np.int64)\nsmall = marks.astype(np.int8)\nfor a in (marks, small):\n    print(a.dtype, '| itemsize', a.itemsize, '| size', a.size, '| nbytes', a.nbytes)\nprint()\nprint('same values?', np.array_equal(marks, small))\nprint()\nn = 222 * 30\nprint(f'a real register, {n} slots: {n*8} bytes as int64, {n} bytes as int8')", "expect": "int64 | itemsize 8 | size 5 | nbytes 40\nint8 | itemsize 1 | size 5 | nbytes 5", "why": "Marks live between 0 and 100 and int8 holds -128 to 127, so seven of those eight bytes per mark stored nothing. size × itemsize = nbytes holds exactly in both rows. Note this is the one operation on today's list that really does copy: astype must rewrite every value, because itemsize is the one header field the block's layout genuinely depends on.", "nav": "Array Internals"}, {"type": "mcq", "topic": "attributes", "title": "An array has shape (6, 4) and dtype float32. What is nbytes?", "code": "import numpy as np\na = np.zeros((6, 4), dtype=np.float32)\n# float32 = 32 bits = 4 bytes per value\nprint(a.nbytes)   # ?", "options": ["24", "96", "192", "10"], "answer": 1, "expect": "96", "why": "size = 6 × 4 = 24 values, itemsize for float32 = 4 bytes, so nbytes = 24 × 4 = 96. The tempting wrong answer is 24 — that is the SIZE, a count of values, not a count of bytes. 192 would be the answer for float64. Whenever you meet one of these numbers, check which currency it is quoted in.", "nav": "Array Internals"}, {"type": "predict", "topic": "attributes", "title": "And reading the header is free", "code": "import numpy as np, time\n\nbig = np.zeros(5_000_000)\n\n# reading .shape, versus actually summing the array.\n# How different should these be?", "run": "import numpy as np, time\n\ndef best(f, r):\n    b = 1e9\n    for _ in range(r):\n        t = time.perf_counter(); f(); b = min(b, time.perf_counter() - t)\n    return b * 1000\n\nbig = np.zeros(5_000_000)\ns = best(lambda: big.shape, 200)\nm = best(lambda: big.sum(), 5)\n\nprint(f'big.shape : {s:10.6f} ms   <- read a few header bytes')\nprint(f'big.sum() : {m:10.6f} ms   <- walk 5,000,000 values')\nprint()\nprint(f'~{m/max(s,1e-12):,.0f}x apart, and the gap grows with N')", "expect": "shape returns in a fraction of a microsecond\nno matter how large the array is.\nsum() has to walk every value.", "why": "Reading an attribute reads the header and never looks at the buffer, so it is O(1) and independent of the array's size. sum() is O(n). This is why checking .shape and .dtype inside a hot loop costs nothing, and why 'validate before you compute' is free advice in NumPy.", "nav": "Array Internals"}, {"type": "content", "title": "The realisation", "bullets": ["Look back at what each scenario actually needed. View the marks differently: change shape. Reinterpret the bytes: change dtype. Locate an element: use itemsize. Validate a reshape: use size. Handle a row or a matrix: check ndim.", "In not one of those cases did the data have to move. Every one was answered by writing or reading a few bytes of header beside an untouched block.", "That is the whole design, and it is why we started with the storage picture. Keep one large block still, and make every operation an edit to the small description of how to read it.", "So the attributes are not five facts about an array. They are the five things you are allowed to change for free.", "Next module makes it explicit: slicing, transposing, adding an axis and broadcasting are all header edits over one block that never moves."], "code": "import numpy as np\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\n\nfor name in ['shape', 'ndim', 'size', 'dtype', 'itemsize
