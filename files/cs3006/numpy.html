', 'nbytes']:\n    print(f'{name:>9} : {getattr(grid, name)}')", "run": "import numpy as np, math\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\nprint('operation            header field    bytes moved')\nprint('-' * 52)\nfor op, field in [('reshape(3,4)', 'shape'), ('view(int32)', 'dtype'),\n                  ('row[:, None]', 'shape, ndim'), ('a.T', 'shape, strides'),\n                  ('a[1:3]', 'shape, offset')]:\n    print(f'{op:<20} {field:<15} 0')\nprint('astype(int8)         dtype           all of them')\nprint()\nprint('and the header itself is only two independent facts:')\nprint('  ndim     == len(shape)      :', grid.ndim == len(grid.shape))\nprint('  size     == prod(shape)     :', grid.size == math.prod(grid.shape))\nprint('  itemsize == dtype.itemsize  :', grid.itemsize == grid.dtype.itemsize)\nprint('  nbytes   == size * itemsize :', grid.nbytes == grid.size * grid.itemsize)", "nav": "Array Internals"}, {"type": "section", "title": "Vectorized Operations", "subtitle": "Element-wise arithmetic and universal functions — the compiled loop underneath everything broadcasting and axis reductions do next.", "nav": "Vectorized Ops (ufuncs)"}, {"type": "content", "title": "Element-wise arithmetic", "bullets": ["+, -, *, /, **, // and % all work element by element between two arrays of the same shape, or between an array and a single number.", "No loop is written, and none runs in Python. NumPy dispatches one compiled loop over the whole block.", "The comparison operators do the same thing and give you a boolean array — which is the raw material for masking and counting.", "Watch the dtype: dividing integers gives float64, and multiplying by a float promotes the entire array. The dtype belongs to the array, not to individual values."], "code": "import numpy as np\n\nmarks = np.array([72, 55, 91, 38, 66])\n\nprint(marks + 5)\nprint(marks * 1.1)\nprint(marks / 2)\nprint(marks >= 40)", "run": "import numpy as np\nmarks = np.array([72, 55, 91, 38, 66])\nprint('marks       :', marks, marks.dtype)\nprint('marks + 5   :', marks + 5)\nprint('marks * 1.1 :', np.round(marks * 1.1, 2), '<- promoted to', (marks * 1.1).dtype)\nprint('marks / 2   :', marks / 2, '<-', (marks / 2).dtype, 'even from ints')\nprint('marks >= 40 :', marks >= 40)\nprint('how many passed:', (marks >= 40).sum())", "nav": "Vectorized Ops (ufuncs)"}, {"type": "content", "title": "Universal functions (ufuncs)", "bullets": ["np.sqrt, np.exp, np.log, np.sin and friends are 'universal functions': a compiled element-wise loop, plus broadcasting, plus the dtype rules, in one object.", "In fact + is a ufunc too — np.add. The operators are just friendly names for them.", "Use the NumPy version, never math.sqrt in a loop: math.sqrt takes one Python float at a time, so it forces you straight back into per-element Python.", "Most ufuncs accept out= to write into an array you already have, which avoids allocating a temporary. That matters inside a loop over many iterations."], "code": "import numpy as np\n\nx = np.array([0.0, 0.5, 1.0, 2.0])\nprint(np.sqrt(x))\nprint(np.exp(x))\nprint(np.sin(x))\n\nout = np.empty_like(x)\nnp.sqrt(x, out=out)      # no temporary allocated", "run": "import numpy as np, math, time\nx = np.linspace(0, 2, 5)\nprint('x        :', np.round(x, 3))\nprint('np.sqrt  :', np.round(np.sqrt(x), 4))\nprint('np.exp   :', np.round(np.exp(x), 4))\nprint('np.sin   :', np.round(np.sin(x), 4))\nprint()\nbig = np.linspace(0, 100, 400_000)\nt = time.perf_counter(); np.sqrt(big); a = (time.perf_counter() - t) * 1000\nt = time.perf_counter(); [math.sqrt(v) for v in big]; b = (time.perf_counter() - t) * 1000\nprint(f'np.sqrt(big)          : {a:8.2f} ms')\nprint(f'[math.sqrt(v) for ...]: {b:8.2f} ms   ~{b/a:.0f}x slower')", "nav": "Vectorized Ops (ufuncs)"}, {"type": "section", "title": "Broadcasting", "subtitle": "Curve, scale, and centre every mark at once — no loop", "nav": "Broadcasting"}, {"type": "predict", "topic": "broadcasting", "title": "Curve every mark by +5", "code": "import numpy as np\nmarks = np.array([72, 55, 91, 38, 66])\nprint(marks + 5)", "run": "import numpy as np\nmarks = np.array([72, 55, 91, 38, 66])\nprint(marks + 5)", "expect": "[77 60 96 43 71]", "why": "The single number 5 is 'broadcast' across all five marks — one operation touches every element. No comprehension, no loop.", "nav": "Broadcasting"}, {"type": "predict", "topic": "broadcasting", "title": "Scale marks up 10% — watch the type", "code": "import numpy as np\nmarks = np.array([72, 55, 91, 38, 66])\nprint(marks * 1.1)", "run": "import numpy as np\nmarks = np.array([72, 55, 91, 38, 66])\nprint(marks * 1.1)", "expect": "[ 79.2  60.5 100.1  41.8  72.6]", "why": "Multiplying by a float promotes the whole array to float64 — note 100.1 sailed past 100, a real gotcha when scaling marks.", "nav": "Broadcasting"}, {"type": "mcq", "topic": "broadcasting", "title": "Centre the marks on the class average", "code": "import numpy as np\nmarks = np.array([72, 55, 91, 38, 66])\ncentred = marks - marks.mean()\n# what does centred[0] tell you about student 0?", "options": ["Their raw mark, 72", "How far above/below the class average they scored", "Their rank in the class", "The class average itself"], "answer": 1, "expect": "How far above/below the class average they scored", "why": "marks - marks.mean() subtracts 64.4 from every mark. centred[0] = 7.6 means student 0 scored 7.6 above average. This 'centring' returns in Module 3 as the first step of standardization.", "nav": "Broadcasting"}, {"type": "content", "title": "The three rules", "bullets": ["Broadcasting is what lets marks + 5 work at all: the single number 5 is stretched to match the array's shape.", "The rules are mechanical and there are only three. Apply them in order, from the right, and either you get an output shape or you get an error.", "Rule 2 is the interesting one. The stretch is implemented by setting that axis's stride to ZERO, so every step along it re-reads the same memory. That is why broadcasting allocates nothing.", "Read the diagram, then we will drill it until calling the output shape is automatic."], "svg": "<svg viewBox=\"0 0 880 440\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Segoe UI,system-ui,sans-serif\">\n  <text x=\"30\" y=\"26\" font-size=\"15\" font-weight=\"700\" fill=\"#214B8C\">The three rules, applied in this order</text>\n\n  <g transform=\"translate(20,44)\">\n    <rect x=\"0\" y=\"0\" width=\"840\" height=\"76\" rx=\"10\" fill=\"#f2f7ff\" stroke=\"#214B8C\" stroke-width=\"1.4\"/>\n    <text x=\"18\" y=\"26\" font-size=\"13.5\" font-weight=\"700\" fill=\"#214B8C\">RULE 1 &#183; ALIGN FROM THE RIGHT</text>\n    <text x=\"18\" y=\"50\" font-size=\"12.5\" fill=\"#3a5170\">Line the two shapes up by their LAST axis. If one has fewer axes, pad it on the LEFT with 1s.</text>\n    <text x=\"18\" y=\"68\" font-size=\"12.5\" font-family=\"Consolas,monospace\" fill=\"#22509a\">(5, 3) and (3,)&#160;&#160;&#8594;&#160;&#160;(5, 3) and (1, 3)</text>\n  </g>\n\n  <g transform=\"translate(20,132)\">\n    <rect x=\"0\" y=\"0\" width=\"840\" height=\"76\" rx=\"10\" fill=\"#e9f7ef\" stroke=\"#1f7a4d\" stroke-width=\"1.4\"/>\n    <text x=\"18\" y=\"26\" font-size=\"13.5\" font-weight=\"700\" fill=\"#1f7a4d\">RULE 2 &#183; A 1 STRETCHES</text>\n    <text x=\"18\" y=\"50\" font-size=\"12.5\" fill=\"#3a5170\">Where one axis is 1 and the other is n, the 1 is stretched to n &#8212; by setting that stride to ZERO.</text>\n    <text x=\"18\" y=\"68\" font-size=\"12.5\" font-family=\"Consolas,monospace\" fill=\"#1f7a4d\">(1, 3) with (5, 3)&#160;&#160;&#8594;&#160;&#160;(5, 3).&#160;&#160;No memory is allocated for the stretch.</text>\n  </g>\n\n  <g transform=\"translate(20,220)\">\n    <rect x=\"0\" y=\"0\" width=\"840\" height=\"76\" rx=\"10\" fill=\"#fff5f5\" stroke=\"#c94b4b\" stroke-width=\"1.4\"/>\n    <text x=\"18\" y=\"26\" font-size=\"13.5\" font-weight=\"700\" fill=\"#8a2b2b\">RULE 3 &#183; ANYTHING ELSE IS AN ERROR</text>\n    <text x=\"18\" y=\"50\" font-size=\"12.5\" fill=\"#3a5170\">If a pair is neither equal nor contains a 1, there is no stride that can fix it. NumPy refuses.</text>\n    <text x=\"18\" y=\"68\" font-size=\"12.5\" font-family=\"Consolas,monospace\" fill=\"#8a2b2b\">(5, 3) and (5,)&#160;&#160;&#8594;&#160;&#160;3 meets 5&#160;&#160;&#8594;&#160;&#160;ValueError</text>\n  </g>\n\n  <g transform=\"translate(20,312)\">\n    <text x=\"0\" y=\"16\" font-size=\"13\" font-weight=\"700\" fill=\"#214B8C\">Worked example</text>\n    <rect x=\"0\" y=\"26\" width=\"400\" height=\"106\" rx=\"9\" fill=\"#fff\" stroke=\"#dbe4f0\" stroke-width=\"1.4\"/>\n    <text x=\"20\" y=\"52\" font-size=\"14\" font-family=\"Consolas,monospace\" fill=\"#12233b\">A.shape&#160;&#160;&#160;(4, 1, 6)</text>\n    <text x=\"20\" y=\"74\" font-size=\"14\" font-family=\"Consolas,monospace\" fill=\"#12233b\">B.shape&#160;&#160;&#160;&#160;&#160;&#160;&#160;(3, 6)</text>\n    <line x1=\"20\" y1=\"84\" x2=\"330\" y2=\"84\" stroke=\"#9db4d0\"/>\n    <text x=\"20\" y=\"106\" font-size=\"14\" font-family=\"Consolas,monospace\" font-weight=\"700\" fill=\"#1f7a4d\">result&#160;&#160;&#160;&#160;(4, 3, 6)</text>\n    <text x=\"20\" y=\"124\" font-size=\"11.5\" fill=\"#5b6b80\">6=6 keep &#183; 1 stretches to 3 &#183; 4 carried through</text>\n  </g>\n\n  <g transform=\"translate(440,312)\">\n    <rect x=\"0\" y=\"26\" width=\"420\" height=\"106\" rx=\"9\" fill=\"#f2f7ff\" stroke=\"#214B8C\" stroke-width=\"1.4\"/>\n    <text x=\"20\" y=\"52\" font-size=\"13\" font-weight=\"700\" fill=\"#214B8C\">Why this is free</text>\n    <text x=\"20\" y=\"76\" font-size=\"12.5\" fill=\"#3a5170\">A stretched axis is given a stride of 0, so every</text>\n    <text x=\"20\" y=\"94\" font-size=\"12.5\" fill=\"#3a5170\">step along it re-reads the same memory.</text>\n    <text x=\"20\" y=\"118\" font-size=\"12.5\" font-family=\"Consolas,monospace\" fill=\"#1f7a4d\">broadcast_to(row, (4,3)).strides &#8594; (0, 8)</text>\n  </g>\n</svg>", "nav": "Broadcasting"}, {"type": "content", "title": "Seeing rule 2 in memory", "bullets": ["np.broadcast_to shows you the stretched array without any of the usual arithmetic getting in the way.", "Look at the strides: a 0 in the first position. Four rows, twelve logical elements, three actual numbers, no allocation.", "That is also why a broadcast result is read-only — several logical positions map to the same byte, so there is no sensible way to write to just one of them.", "So 'the 1 stretches' is not a metaphor for copying. Nothing is copied; the header simply lies about how far apart the rows are."], "code": "import numpy as np\n\nrow = np.array([10, 20, 30])\nbig = np.broadcast_to(row, (4, 3))\n\nprint(big)\nprint(big.strides)\nprint(np.shares_memory(row, big))", "run": "import numpy as np\nrow = np.array([10, 20, 30])\nbig = np.broadcast_to(row, (4, 3))\nprint(big)\nprint('row.strides :', row.strides)\nprint('big.strides :', big.strides, '  <- zero down the rows')\nprint('shares memory:', np.shares_memory(row, big))\nprint('row.nbytes:', row.nbytes, ' logical size of big:', big.size * big.itemsize)\ntry:\n    big[0, 0] = 99\nexcept Exception as e:\n    print('writing to it ->', type(e).__name__)", "nav": "Broadcasting"}, {"type": "mcq", "topic": "broadcast", "title": "(5, 3) and (3,) — what comes out?", "code": "import numpy as np\na = np.zeros((5, 3))\nb = np.zeros(3)\nprint((a + b).shape)   # ?", "options": ["(5, 3)", "(3, 5)", "(5,)", "ValueError"], "answer": 0, "expect": "(5, 3)", "why": "Align from the right: 3 meets 3, so that axis is kept. b has no second axis, so rule 1 pads it to (1, 3), and rule 2 stretches the 1 up to 5. Result (5, 3). This is the everyday case — one weight per assessment, applied to every student.", "nav": "Broadcasting"}, {"type": "mcq", "topic": "broadcast", "title": "(5, 3) and (5,) — what comes out?", "code": "import numpy as np\na = np.zeros((5, 3))\nb = np.zeros(5)\nprint((a + b).shape)   # ?", "options": ["(5, 3)", "(5, 5)", "(3, 5)", "ValueError"], "answer": 3, "expect": "ValueError", "why": "Align from the right: 3 meets 5. Neither is equal and neither is 1, so rule 3 applies and NumPy refuses. This is the single most common broadcasting error in student code — you have one number per STUDENT and you want it applied across their row, but the alignment is from the right. The fix is to give it an explicit second axis: b[:, None] has shape (5, 1), which stretches correctly.", "nav": "Broadcasting"}, {"type": "predict", "topic": "broadcast", "title": "The accidental matrix", "code": "import numpy as np\n\nrow = np.arange(6)\ncol = np.arange(6)[:, None]\n\nprint(row.shape, col.shape)\nprint((row + col).shape)", "run": "import numpy as np\nrow = np.arange(6)\ncol = np.arange(6)[:, None]\nprint('row.shape', row.shape, ' col.shape', col.shape)\nprint('sum shape', (row + col).shape)\nprint(row + col)\nprint()\nprint('36 values out of two arrays of 6. this is a feature when you want it')\nprint('(distance matrices, outer products) and a memory bomb when you do not.')", "expect": "(6,) and (6, 1) broadcast to (6, 6).", "why": "A row and a column stretch into a full matrix: rule 2 fires on both axes at once. Deliberately, this is how you build distance matrices and outer products in one line. Accidentally, it is how a student turns a 100,000-element array into a 10-billion-element one and runs out of memory. If a result has more elements than either input, check that you meant it.", "nav": "Broadcasting"}, {"type": "section", "title": "Boolean masking", "subtitle": "Stop looping. Start asking the data questions.", "nav": "Boolean Masking"}, {"type": "predict", "topic": "masking", "title": "Ask: which marks are failing?", "code": "import numpy as np\nmarks = np.array([72, 55, 91, 38, 66])\nprint(marks < 40)", "run": "import numpy as np\nmarks = np.array([72, 55, 91, 38, 66])\nprint(marks < 40)", "expect": "[False False False  True False]", "why": "A comparison broadcasts too — it returns a boolean array, one True/False per mark. This mask is the 'question' answered element by element.", "nav": "Boolean Masking"}, {"type": "predict", "topic": "masking", "title": "Now SELECT the failing marks", "code": "import numpy as np\nmarks = np.array([72, 55, 91, 38, 66])\nprint(marks[marks < 40])", "run": "import numpy as np\nmarks = np.array([72, 55, 91, 38, 66])\nprint(marks[marks < 40])", "expect": "[38]", "why": "Indexing with the mask keeps only the marks where it was True. 'marks[marks < 40]' reads literally as 'the marks that are below 40'.", "nav": "Boolean Masking"}, {"type": "predict", "topic": "masking", "title": "One line: what fraction passed?", "code": "import numpy as np\nmarks = np.array([72, 55, 91, 38, 66])\nprint((marks >= 40).mean())", "run": "import numpy as np\nmarks = np.array([72, 55, 91, 38, 66])\nprint((marks >= 40).mean())", "expect": "0.8", "why": "True counts as 1, False as 0. The mean of the boolean mask is the pass RATE — 4 of 5 passed = 0.8. A whole survey question answered in one line.", "nav": "Boolean Masking"}, {"type": "section", "title": "The marks matrix", "subtitle": "Students down the rows, assessments across the columns — and the axis puzzle", "nav": "Marks Matrix & Axes"}, {"type": "content", "title": "From a row of marks to a full gradebook", "bullets": ["One assessment was a 1D array. The real gradebook is 2D: each ROW a student, each COLUMN an assessment.", "Here: 4 students, 3 assessments. shape (4, 3) — read as (rows, columns).", "This single object replaces the list-of-lists gradebook we built by hand in earlier lectures.", "Next question: how do we get each student's average? And each assessment's average? Same method — different axis."], "code": "import numpy as np\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\nprint(grid)\nprint(grid.shape)", "run": "import numpy as np\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\nprint(grid)\nprint(grid.shape)", "nav": "Marks Matrix & Axes"}, {"type": "predict", "topic": "axis", "title": "axis=0 — predict before you run", "code": "import numpy as np\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\nprint(grid.mean(axis=0))", "run": "import numpy as np\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\nprint(grid.mean(axis=0))", "expect": "[61.25 63.5  71.  ]", "why": "axis=0 collapses DOWN the rows — you get one number per COLUMN, i.e. each assessment's average across all students. 3 columns in, 3 numbers out.", "nav": "Marks Matrix & Axes"}, {"type": "mcq", "topic": "axis", "title": "So which axis for each STUDENT's average?", "code": "import numpy as np\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\n# I want ONE average per student (4 numbers out). Which line?", "options": ["grid.mean(axis=0)", "grid.mean(axis=1)", "grid.mean()", "grid.mean(axis=2)"], "answer": 1, "expect": "grid.mean(axis=1)", "why": "A student is a ROW. axis=1 collapses ACROSS the columns, giving one number per row — 4 students, 4 averages: [77. 52.33 87.33 44.33]. Rule of thumb: the axis you name is the one that DISAPPEARS.", "nav": "Marks Matrix & Axes"}, {"type": "content", "title": "Axes beyond 2D — 1D to 5D at a glance", "bullets": ["The same idea scales. shape lists the size of each axis; ndim is how many axes there are.", "1D is a row (axis 0). 2D adds axis 1 — our gradebook: axis 0 = students, axis 1 = assessments.", "3D stacks 2D sheets (axis 0 = which sheet); 4D is a row of 3D blocks; 5D is a grid of them.", "Key habit: the LAST two axes are the rows & columns you can 'see'; earlier axes just pick WHICH sheet or block."], "svg": "<svg viewBox=\"0 0 900 640\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Segoe UI,system-ui,sans-serif\">\n  <defs>\n    <marker id=\"axn\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"4\" orient=\"auto\">\n      <path d=\"M0,0 L8,4 L0,8 Z\" fill=\"#214B8C\"/>\n    </marker>\n  </defs>\n\n  <text x=\"20\" y=\"28\" font-size=\"15.5\" font-weight=\"700\" fill=\"#214B8C\">1D &#183; shape (5,)</text>\n  <text x=\"20\" y=\"46\" font-size=\"12\" fill=\"#5b6b80\">one row of marks</text>\n  <g transform=\"translate(30,60)\">\n    <rect x=\"0\"   y=\"0\" width=\"42\" height=\"38\" fill=\"#e7f0ff\" stroke=\"#214B8C\"/>\n    <rect x=\"42\"  y=\"0\" width=\"42\" height=\"38\" fill=\"#e7f0ff\" stroke=\"#214B8C\"/>\n    <rect x=\"84\"  y=\"0\" width=\"42\" height=\"38\" fill=\"#e7f0ff\" stroke=\"#214B8C\"/>\n    <rect x=\"126\" y=\"0\" width=\"42\" height=\"38\" fill=\"#e7f0ff\" stroke=\"#214B8C\"/>\n    <rect x=\"168\" y=\"0\" width=\"42\" height=\"38\" fill=\"#e7f0ff\" stroke=\"#214B8C\"/>\n    <line x1=\"0\" y1=\"54\" x2=\"215\" y2=\"54\" stroke=\"#214B8C\" stroke-width=\"1.5\" marker-end=\"url(#axn)\"/>\n    <text x=\"105\" y=\"72\" text-anchor=\"middle\" font-size=\"12\" fill=\"#22509a\">axis 0</text>\n  </g>\n\n  <text x=\"470\" y=\"28\" font-size=\"15.5\" font-weight=\"700\" fill=\"#214B8C\">2D &#183; shape (4, 3)</text>\n  <text x=\"470\" y=\"46\" font-size=\"12\" fill=\"#5b6b80\">the gradebook</text>\n  <g transform=\"translate(560,70)\">\n    <rect x=\"0\" y=\"0\"   width=\"40\" height=\"30\" fill=\"#e7f0ff\" stroke=\"#214B8C\"/><rect x=\"40\" y=\"0\"   width=\"40\" height=\"30\" fill=\"#e7f0ff\" stroke=\"#214B8C\"/><rect x=\"80\" y=\"0\"   width=\"40\" height=\"30\" fill=\"#e7f0ff\" stroke=\"#214B8C\"/>\n    <rect x=\"0\" y=\"30\"  width=\"40\" height=\"30\" fill=\"#e7f0ff\" stroke=\"#214B8C\"/><rect x=\"40\" y=\"30\"  width=\"40\" height=\"30\" fill=\"#e7f0ff\" stroke=\"#214B8C\"/><rect x=\"80\" y=\"30\"  width=\"40\" height=\"30\" fill=\"#e7f0ff\" stroke=\"#214B8C\"/>\n    <rect x=\"0\" y=\"60\"  width=\"40\" height=\"30\" fill=\"#e7f0ff\" stroke=\"#214B8C\"/><rect x=\"40\" y=\"60\"  width=\"40\" height=\"30\" fill=\"#e7f0ff\" stroke=\"#214B8C\"/><rect x=\"80\" y=\"60\"  width=\"40\" height=\"30\" fill=\"#e7f0ff\" stroke=\"#214B8C\"/>\n    <rect x=\"0\" y=\"90\"  width=\"40\" height=\"30\" fill=\"#e7f0ff\" stroke=\"#214B8C\"/><rect x=\"40\" y=\"90\"  width=\"40\" height=\"30\" fill=\"#e7f0ff\" stroke=\"#214B8C\"/><rect x=\"80\" y=\"90\"  width=\"40\" height=\"30\" fill=\"#e7f0ff\" stroke=\"#214B8C\"/>\n    <line x1=\"-10\" y1=\"0\" x2=\"-10\" y2=\"124\" stroke=\"#214B8C\" stroke-width=\"1.5\" marker-end=\"url(#axn)\"/>\n    <text x=\"-20\" y=\"62\" font-size=\"11.5\" fill=\"#22509a\" transform=\"rotate(-90,-20,62)\" text-anchor=\"middle\">axis 0 (students)</text>\n    <line x1=\"0\" y1=\"-10\" x2=\"120\" y2=\"-10\" stroke=\"#214B8C\" stroke-width=\"1.5\" marker-end=\"url(#axn)\"/>\n    <text x=\"60\" y=\"-16\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#22509a\">axis 1 (assessments)</text>\n  </g>\n\n  <text x=\"20\" y=\"250\" font-size=\"15.5\" font-weight=\"700\" fill=\"#214B8C\">3D &#183; shape (2, 3, 4)</text>\n  <text x=\"20\" y=\"268\" font-size=\"12\" fill=\"#5b6b80\">2D sheets stacked in depth</text>\n  <g transform=\"translate(80,300)\">\n    <rect x=\"28\" y=\"-18\" width=\"130\" height=\"90\" fill=\"#cfe0f7\" stroke=\"#214B8C\" opacity=\"0.55\"/>\n    <rect x=\"0\" y=\"10\" width=\"130\" height=\"90\" fill=\"#e7f0ff\" stroke=\"#214B8C\"/>\n    <line x1=\"0\" y1=\"10\" x2=\"28\" y2=\"-18\" stroke=\"#214B8C\"/>\n    <line x1=\"130\" y1=\"10\" x2=\"158\" y2=\"-18\" stroke=\"#214B8C\"/>\n    <line x1=\"130\" y1=\"100\" x2=\"158\" y2=\"72\" stroke=\"#214B8C\"/>\n    <line x1=\"-12\" y1=\"10\" x2=\"-12\" y2=\"104\" stroke=\"#214B8C\" stroke-width=\"1.5\" marker-end=\"url(#axn)\"/>\n    <text x=\"-22\" y=\"60\" font-size=\"11\" fill=\"#22509a\" transform=\"rotate(-90,-22,60)\" text-anchor=\"middle\">axis 1 (rows)</text>\n    <line x1=\"0\" y1=\"116\" x2=\"130\" y2=\"116\" stroke=\"#214B8C\" stroke-width=\"1.5\" marker-end=\"url(#axn)\"/>\n    <text x=\"65\" y=\"132\" text-anchor=\"middle\" font-size=\"11\" fill=\"#22509a\">axis 2 (cols)</text>\n    <line x1=\"150\" y1=\"18\" x2=\"178\" y2=\"-10\" stroke=\"#214B8C\" stroke-width=\"1.5\" marker-end=\"url(#axn)\"/>\n    <text x=\"192\" y=\"2\" font-size=\"11\" fill=\"#22509a\">axis 0 (depth)</text>\n  </g>\n\n  <text x=\"470\" y=\"250\" font-size=\"15.5\" font-weight=\"700\" fill=\"#214B8C\">4D &#183; shape (2, 2, 3, 4)</text>\n  <text x=\"470\" y=\"268\" font-size=\"12\" fill=\"#5b6b80\">a ROW of 3D blocks</text>\n  <g transform=\"translate(490,305)\">\n    <g>\n      <rect x=\"20\" y=\"-12\" width=\"72\" height=\"56\" fill=\"#cfe0f7\" stroke=\"#214B8C\" opacity=\"0.55\"/>\n      <rect x=\"6\" y=\"0\" width=\"72\" height=\"56\" fill=\"#e7f0ff\" stroke=\"#214B8C\"/>\n      <line x1=\"6\" y1=\"0\" x2=\"20\" y2=\"-12\" stroke=\"#214B8C\"/><line x1=\"78\" y1=\"0\" x2=\"92\" y2=\"-12\" stroke=\"#214B8C\"/><line x1=\"78\" y1=\"56\" x2=\"92\" y2=\"44\" stroke=\"#214B8C\"/>\n    </g>\n    <g transform=\"translate(140,0)\">\n      <rect x=\"20\" y=\"-12\" width=\"72\" height=\"56\" fill=\"#cfe0f7\" stroke=\"#214B8C\" opacity=\"0.55\"/>\n      <rect x=\"6\" y=\"0\" width=\"72\" height=\"56\" fill=\"#e7f0ff\" stroke=\"#214B8C\"/>\n      <line x1=\"6\" y1=\"0\" x2=\"20\" y2=\"-12\" stroke=\"#214B8C\"/><line x1=\"78\" y1=\"0\" x2=\"92\" y2=\"-12\" stroke=\"#214B8C\"/><line x1=\"78\" y1=\"56\" x2=\"92\" y2=\"44\" stroke=\"#214B8C\"/>\n    </g>\n    <line x1=\"0\" y1=\"78\" x2=\"230\" y2=\"78\" stroke=\"#214B8C\" stroke-width=\"1.5\" marker-end=\"url(#axn)\"/>\n    <text x=\"115\" y=\"94\" text-anchor=\"middle\" font-size=\"11\" fill=\"#22509a\">axis 0 = which 3D block  (axes 1,2,3 inside)</text>\n  </g>\n\n  <text x=\"20\" y=\"470\" font-size=\"15.5\" font-weight=\"700\" fill=\"#214B8C\">5D &#183; shape (2, 2, 2, 3, 4)</text>\n  <text x=\"20\" y=\"488\" font-size=\"12\" fill=\"#5b6b80\">a GRID of 3D blocks &#8212; axes 0,1 index the grid position; axes 2,3,4 live inside each block</text>\n  <g transform=\"translate(90,510)\">\n    <g transform=\"translate(0,0)\"><rect x=\"12\" y=\"-8\" width=\"50\" height=\"36\" fill=\"#cfe0f7\" stroke=\"#214B8C\" opacity=\"0.55\"/><rect x=\"4\" y=\"0\" width=\"50\" height=\"36\" fill=\"#e7f0ff\" stroke=\"#214B8C\"/><line x1=\"4\" y1=\"0\" x2=\"12\" y2=\"-8\" stroke=\"#214B8C\"/><line x1=\"54\" y1=\"0\" x2=\"62\" y2=\"-8\" stroke=\"#214B8C\"/></g>\n    <g transform=\"translate(110,0)\"><rect x=\"12\" y=\"-8\" width=\"50\" height=\"36\" fill=\"#cfe0f7\" stroke=\"#214B8C\" opacity=\"0.55\"/><rect x=\"4\" y=\"0\" width=\"50\" height=\"36\" fill=\"#e7f0ff\" stroke=\"#214B8C\"/><line x1=\"4\" y1=\"0\" x2=\"12\" y2=\"-8\" stroke=\"#214B8C\"/><line x1=\"54\" y1=\"0\" x2=\"62\" y2=\"-8\" stroke=\"#214B8C\"/></g>\n    <g transform=\"translate(0,60)\"><rect x=\"12\" y=\"-8\" width=\"50\" height=\"36\" fill=\"#cfe0f7\" stroke=\"#214B8C\" opacity=\"0.55\"/><rect x=\"4\" y=\"0\" width=\"50\" height=\"36\" fill=\"#e7f0ff\" stroke=\"#214B8C\"/><line x1=\"4\" y1=\"0\" x2=\"12\" y2=\"-8\" stroke=\"#214B8C\"/><line x1=\"54\" y1=\"0\" x2=\"62\" y2=\"-8\" stroke=\"#214B8C\"/></g>\n    <g transform=\"translate(110,60)\"><rect x=\"12\" y=\"-8\" width=\"50\" height=\"36\" fill=\"#cfe0f7\" stroke=\"#214B8C\" opacity=\"0.55\"/><rect x=\"4\" y=\"0\" width=\"50\" height=\"36\" fill=\"#e7f0ff\" stroke=\"#214B8C\"/><line x1=\"4\" y1=\"0\" x2=\"12\" y2=\"-8\" stroke=\"#214B8C\"/><line x1=\"54\" y1=\"0\" x2=\"62\" y2=\"-8\" stroke=\"#214B8C\"/></g>\n    <line x1=\"-10\" y1=\"0\" x2=\"-10\" y2=\"96\" stroke=\"#214B8C\" stroke-width=\"1.5\" marker-end=\"url(#axn)\"/>\n    <text x=\"-20\" y=\"48\" font-size=\"11\" fill=\"#22509a\" transform=\"rotate(-90,-20,48)\" text-anchor=\"middle\">axis 1</text>\n    <line x1=\"0\" y1=\"108\" x2=\"175\" y2=\"108\" stroke=\"#214B8C\" stroke-width=\"1.5\" marker-end=\"url(#axn)\"/>\n    <text x=\"87\" y=\"124\" text-anchor=\"middle\" font-size=\"11\" fill=\"#22509a\">axis 0</text>\n  </g>\n\n  <g transform=\"translate(430,505)\">\n    <rect x=\"0\" y=\"0\" width=\"440\" height=\"96\" rx=\"10\" fill=\"#f2f7ff\" stroke=\"#214B8C\" stroke-width=\"1.2\"/>\n    <text x=\"20\" y=\"30\" font-size=\"13\" font-weight=\"700\" fill=\"#214B8C\">Reading any shape</text>\n    <text x=\"20\" y=\"54\" font-size=\"12.5\" fill=\"#3a5170\">The LAST two axes are the rows &amp; columns you can see.</text>\n    <text x=\"20\" y=\"76\" font-size=\"12.5\" fill=\"#3a5170\">Earlier axes just pick WHICH sheet or block you are in.</text>\n  </g>\n</svg>", "code": "import numpy as np\nprint(np.arange(5).ndim,            np.arange(5).shape)             # 1D\nprint(np.arange(12).reshape(3,4).ndim,  np.arange(12).reshape(3,4).shape)   # 2D\nprint(np.arange(24).reshape(2,3,4).ndim, np.arange(24).reshape(2,3,4).shape) # 3D", "run": "import numpy as np\nfor a in (np.arange(5),\n          np.arange(12).reshape(3,4),\n          np.arange(24).reshape(2,3,4),\n          np.arange(48).reshape(2,2,3,4),\n          np.arange(96).reshape(2,2,2,3,4)):\n    print(f'{a.ndim}D  shape={a.shape}')", "nav": "Marks Matrix & Axes"}, {"type": "content", "title": "axis is a direction to walk", "bullets": ["A reduction collapses one or more axes. The axis you NAME is the one that disappears from the output shape.", "grid.sum(axis=0) walks down the students, so the student axis vanishes and you are left with one total per assessment: shape (3,).", "grid.sum(axis=1) walks across the assessments, so you get one total per student: shape (4,).", "Say it as a direction to walk, never as 'rows' or 'columns'. Those words swap meaning the moment you have three dimensions, and the direction never does."], "svg": "<svg viewBox=\"0 0 880 400\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Segoe UI,system-ui,sans-serif\">\n  <defs>\n    <marker id=\"ax0\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"4\" orient=\"auto\">\n      <path d=\"M0,0 L8,4 L0,8 Z\" fill=\"#c94b4b\"/>\n    </marker>\n    <marker id=\"ax1\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"4\" orient=\"auto\">\n      <path d=\"M0,0 L8,4 L0,8 Z\" fill=\"#1f7a4d\"/>\n    </marker>\n  </defs>\n\n  <text x=\"30\" y=\"26\" font-size=\"15\" font-weight=\"700\" fill=\"#214B8C\">The axis you name is the axis that disappears</text>\n\n  <g transform=\"translate(150,66)\">\n    <rect x=\"0\"   y=\"0\"   width=\"76\" height=\"40\" fill=\"#e7f0ff\" stroke=\"#214B8C\"/><rect x=\"76\"  y=\"0\"   width=\"76\" height=\"40\" fill=\"#e7f0ff\" stroke=\"#214B8C\"/><rect x=\"152\" y=\"0\"   width=\"76\" height=\"40\" fill=\"#e7f0ff\" stroke=\"#214B8C\"/>\n    <rect x=\"0\"   y=\"40\"  width=\"76\" height=\"40\" fill=\"#e7f0ff\" stroke=\"#214B8C\"/><rect x=\"76\"  y=\"40\"  width=\"76\" height=\"40\" fill=\"#e7f0ff\" stroke=\"#214B8C\"/><rect x=\"152\" y=\"40\"  width=\"76\" height=\"40\" fill=\"#e7f0ff\" stroke=\"#214B8C\"/>\n    <rect x=\"0\"   y=\"80\"  width=\"76\" height=\"40\" fill=\"#e7f0ff\" stroke=\"#214B8C\"/><rect x=\"76\"  y=\"80\"  width=\"76\" height=\"40\" fill=\"#e7f0ff\" stroke=\"#214B8C\"/><rect x=\"152\" y=\"80\"  width=\"76\" height=\"40\" fill=\"#e7f0ff\" stroke=\"#214B8C\"/>\n    <rect x=\"0\"   y=\"120\" width=\"76\" height=\"40\" fill=\"#e7f0ff\" stroke=\"#214B8C\"/><rect x=\"76\"  y=\"120\" width=\"76\" height=\"40\" fill=\"#e7f0ff\" stroke=\"#214B8C\"/><rect x=\"152\" y=\"120\" width=\"76\" height=\"40\" fill=\"#e7f0ff\" stroke=\"#214B8C\"/>\n\n    <text x=\"38\"  y=\"27\"  text-anchor=\"middle\" font-size=\"16\" font-weight=\"600\" fill=\"#12233b\">72</text>\n    <text x=\"114\" y=\"27\"  text-anchor=\"middle\" font-size=\"16\" font-weight=\"600\" fill=\"#12233b\">68</text>\n    <text x=\"190\" y=\"27\"  text-anchor=\"middle\" font-size=\"16\" font-weight=\"600\" fill=\"#12233b\">91</text>\n    <text x=\"38\"  y=\"67\"  text-anchor=\"middle\" font-size=\"16\" font-weight=\"600\" fill=\"#12233b\">55</text>\n    <text x=\"114\" y=\"67\"  text-anchor=\"middle\" font-size=\"16\" font-weight=\"600\" fill=\"#12233b\">62</text>\n    <text x=\"190\" y=\"67\"  text-anchor=\"middle\" font-size=\"16\" font-weight=\"600\" fill=\"#12233b\">40</text>\n    <text x=\"38\"  y=\"107\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"600\" fill=\"#12233b\">88</text>\n    <text x=\"114\" y=\"107\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"600\" fill=\"#12233b\">79</text>\n    <text x=\"190\" y=\"107\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"600\" fill=\"#12233b\">95</text>\n    <text x=\"38\"  y=\"147\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"600\" fill=\"#12233b\">30</text>\n    <text x=\"114\" y=\"147\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"600\" fill=\"#12233b\">45</text>\n    <text x=\"190\" y=\"147\" text-anchor=\"middle\" font-size=\"16\" font-weight=\"600\" fill=\"#12233b\">58</text>\n\n    <text x=\"114\" y=\"-30\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"#214B8C\">grid.shape = (4, 3)</text>\n    <text x=\"-96\" y=\"-8\" font-size=\"11.5\" fill=\"#5b6b80\">4 students</text>\n    <text x=\"240\" y=\"-8\" font-size=\"11.5\" fill=\"#5b6b80\">3 assessments</text>\n\n    <line x1=\"-18\" y1=\"0\" x2=\"-18\" y2=\"160\" stroke=\"#c94b4b\" stroke-width=\"2\" marker-end=\"url(#ax0)\"/>\n    <text x=\"-34\" y=\"80\" transform=\"rotate(-90,-34,80)\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#c94b4b\">axis 0</text>\n\n    <line x1=\"0\" y1=\"178\" x2=\"228\" y2=\"178\" stroke=\"#1f7a4d\" stroke-width=\"2\" marker-end=\"url(#ax1)\"/>\n    <text x=\"114\" y=\"196\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#1f7a4d\">axis 1</text>\n  </g>\n\n  <g transform=\"translate(450,50)\">\n    <rect x=\"0\" y=\"0\" width=\"410\" height=\"104\" rx=\"10\" fill=\"#fff5f5\" stroke=\"#c94b4b\" stroke-width=\"1.4\"/>\n    <text x=\"18\" y=\"26\" font-size=\"13.5\" font-family=\"Consolas,monospace\" font-weight=\"700\" fill=\"#8a2b2b\">grid.sum(axis=0)</text>\n    <text x=\"18\" y=\"48\" font-size=\"12.5\" fill=\"#3a5170\">walk DOWN the students &#8594; axis 0 collapses</text>\n    <text x=\"18\" y=\"72\" font-size=\"14\" font-family=\"Consolas,monospace\" fill=\"#12233b\">[245 254 284]&#160;&#160;&#160;shape (3,)</text>\n    <text x=\"18\" y=\"92\" font-size=\"11.5\" fill=\"#8a2b2b\">one total PER ASSESSMENT</text>\n  </g>\n\n  <g transform=\"translate(450,170)\">\n    <rect x=\"0\" y=\"0\" width=\"410\" height=\"104\" rx=\"10\" fill=\"#e9f7ef\" stroke=\"#1f7a4d\" stroke-width=\"1.4\"/>\n    <text x=\"18\" y=\"26\" font-size=\"13.5\" font-family=\"Consolas,monospace\" font-weight=\"700\" fill=\"#1f7a4d\">grid.sum(axis=1)</text>\n    <text x=\"18\" y=\"48\" font-size=\"12.5\" fill=\"#3a5170\">walk ACROSS the assessments &#8594; axis 1 collapses</text>\n    <text x=\"18\" y=\"72\" font-size=\"14\" font-family=\"Consolas,monospace\" fill=\"#12233b\">[231 157 262 133]&#160;&#160;&#160;shape (4,)</text>\n    <text x=\"18\" y=\"92\" font-size=\"11.5\" fill=\"#1f7a4d\">one total PER STUDENT</text>\n  </g>\n\n  <g transform=\"translate(450,290)\">\n    <rect x=\"0\" y=\"0\" width=\"410\" height=\"86\" rx=\"10\" fill=\"#f2f7ff\" stroke=\"#214B8C\" stroke-width=\"1.4\"/>\n    <text x=\"18\" y=\"26\" font-size=\"13.5\" font-family=\"Consolas,monospace\" font-weight=\"700\" fill=\"#214B8C\">grid.sum()</text>\n    <text x=\"18\" y=\"48\" font-size=\"12.5\" fill=\"#3a5170\">no axis named &#8594; every axis collapses</text>\n    <text x=\"18\" y=\"72\" font-size=\"14\" font-family=\"Consolas,monospace\" fill=\"#12233b\">783&#160;&#160;&#160;shape ()</text>\n  </g>\n\n  <text x=\"30\" y=\"290\" font-size=\"12.5\" fill=\"#5b6b80\">Say it as a direction to walk,</text>\n  <text x=\"30\" y=\"310\" font-size=\"12.5\" fill=\"#5b6b80\">not as &#8220;rows&#8221; or &#8220;columns&#8221; &#8212;</text>\n  <text x=\"30\" y=\"330\" font-size=\"12.5\" fill=\"#5b6b80\">those words swap meaning the</text>\n  <text x=\"30\" y=\"350\" font-size=\"12.5\" fill=\"#5b6b80\">moment you reach 3 dimensions.</text>\n</svg>", "nav": "Marks Matrix & Axes"}, {"type": "predict", "topic": "axis", "title": "Read the shapes, not the numbers", "code": "import numpy as np\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\n\nprint(grid.sum(axis=0), grid.sum(axis=0).shape)\nprint(grid.sum(axis=1), grid.sum(axis=1).shape)\nprint(grid.sum(),       grid.sum().shape)", "run": "import numpy as np\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\nprint('grid.shape      ', grid.shape)\nprint('sum(axis=0)     ', grid.sum(axis=0), grid.sum(axis=0).shape, ' per assessment')\nprint('sum(axis=1)     ', grid.sum(axis=1), grid.sum(axis=1).shape, ' per student')\nprint('sum()           ', grid.sum(), grid.sum().shape)\nprint()\nprint('mean(axis=1)    ', np.round(grid.mean(axis=1), 2))\nprint('std(axis=0)     ', np.round(grid.std(axis=0), 2))\nprint('min/max(axis=1) ', grid.min(axis=1), grid.max(axis=1))\nprint('argmax(axis=1)  ', grid.argmax(axis=1), ' <- WHICH assessment was best')", "expect": "axis=0 -> [245 254 284]      shape (3,)\naxis=1 -> [231 157 262 133]  shape (4,)\nno axis -> 783               shape ()", "why": "Check the output shapes against the input shape (4, 3). Naming axis 0 removed the 4; naming axis 1 removed the 3; naming neither removed both and left a zero-dimensional scalar. The family is consistent: mean, std, min, max, argmin, argmax, any and all all take the same axis argument and follow the same rule.", "nav": "Marks Matrix & Axes"}, {"type": "predict", "topic": "axis", "title": "Why keepdims exists", "code": "import numpy as np\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\n\n# normalise each student's row so it sums to 1\nprint(grid / grid.sum(axis=1))", "run": "import numpy as np\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\ntry:\n    grid / grid.sum(axis=1)\nexcept Exception as e:\n    print('grid / grid.sum(axis=1) ->', type(e).__name__)\n    print(' ', e)\nprint()\nprint('shapes: grid', grid.shape, ' sum(axis=1)', grid.sum(axis=1).shape)\nprint('align from the right: 3 meets 4 -> rule 3, refused.')\nprint()\ntotals = grid.sum(axis=1, keepdims=True)\nprint('with keepdims:', totals.shape)\nprint(np.round(grid / totals, 3))", "expect": "ValueError — operands could not be broadcast\ntogether with shapes (4,3) and (4,).", "why": "The reduction removed the axis, so the result is (4,), and aligning (4,3) with (4,) from the right puts 3 against 4. keepdims=True leaves the collapsed axis in place as a 1, giving (4,1), which then stretches correctly across the three assessments. Rule of thumb: if you are going to broadcast a reduction back against the original, reduce with keepdims=True.", "nav": "Marks Matrix & Axes"}, {"type": "section", "title": "Indexing & slicing 2D", "subtitle": "Reach one mark, one student, one assessment, or a block", "nav": "Indexing & Slicing"}, {"type": "predict", "topic": "indexing", "title": "One mark: [row, col]", "code": "import numpy as np\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\n# student 1, assessment 2\nprint(grid[1, 2])", "run": "import numpy as np\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\nprint(grid[1, 2])", "expect": "40", "why": "2D indexing is [row, col] in one bracket — no grid[1][2] chaining needed. Row 1 (second student), column 2 (third assessment) = 40.", "nav": "Indexing & Slicing"}, {"type": "predict", "topic": "indexing", "title": "A whole student vs a whole assessment", "code": "import numpy as np\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\nprint(grid[2])       # student 2, all assessments\nprint(grid[:, 0])    # assessment 0, all students", "run": "import numpy as np\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\nprint(grid[2])\nprint(grid[:, 0])", "expect": "[88 79 95]\n[72 55 88 30]", "why": "grid[2] grabs a ROW (one student across all assessments). grid[:, 0] means 'every row, column 0' — a whole COLUMN (one assessment across all students). The colon means 'all of this axis'.", "nav": "Indexing & Slicing"}, {"type": "predict", "topic": "slicing", "title": "A block: first two students, last two assessments", "code": "import numpy as np\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\nprint(grid[:2, 1:])", "run": "import numpy as np\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\nprint(grid[:2, 1:])", "expect": "[[68 91]\n [62 40]]", "why": "Slice both axes at once: rows :2 (students 0–1), columns 1: (assessments 1 onward). You carve out a sub-gradebook — no loops.", "nav": "Indexing & Slicing"}, {"type": "section", "title": "Finding the topper", "subtitle": "Reductions that return WHO, not just how much", "nav": "Finding the Topper"}, {"type": "predict", "topic": "argmax", "title": "Who topped the final assessment?", "code": "import numpy as np\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\nfinals = grid[:, 2]\nprint(finals)\nprint(finals.argmax())", "run": "import numpy as np\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\nfinals = grid[:, 2]\nprint(finals)\nprint(finals.argmax())", "expect": "[91 40 95 58]\n2", "why": "max() gives the top MARK (95). argmax() gives its INDEX (2) — i.e. WHICH student. In a gradebook you almost always want the who, not just the number.", "nav": "Finding the Topper"}, {"type": "predict", "topic": "reduction", "title": "Total per student, then the class topper", "code": "import numpy as np\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\ntotals = grid.sum(axis=1)\nprint(totals)\nprint('topper is student', totals.argmax())", "run": "import numpy as np\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\ntotals = grid.sum(axis=1)\nprint(totals)\nprint('topper is student', totals.argmax())", "expect": "[231 157 262 133]\ntopper is student 2", "why": "sum(axis=1) collapses each row to that student's total (the axis you name disappears — columns gone). argmax then names the overall topper. Two lines replace a whole nested loop.", "nav": "Finding the Topper"}, {"type": "predict", "topic": "masking", "title": "Who passed EVERYTHING?", "code": "import numpy as np\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\npassed_all = (grid >= 40).all(axis=1)\nprint(passed_all)\nprint(grid[passed_all])", "run": "import numpy as np\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\npassed_all = (grid >= 40).all(axis=1)\nprint(passed_all)\nprint(grid[passed_all])", "expect": "[ True  True  True False]\n[[72 68 91]\n [55 62 40]\n [88 79 95]]", "why": "(grid >= 40) is a full boolean matrix; .all(axis=1) asks 'True in every column of this row?' — one verdict per student. Using it as a row mask keeps only the students who cleared 40 everywhere. Masking + axis, combined.", "nav": "Finding the Topper"}, {"type": "content", "title": "Putting it together", "bullets": ["Almost every gradebook question is now one line: no loops, no indices, just a description of what you want.", "Who passed everything? (grid >= 40).all(axis=1). How many passed each assessment? (grid >= 40).sum(axis=0).", "Which assessment was hardest? grid.mean(axis=0).argmin(). Whose marks were most inconsistent? grid.std(axis=1).argmax().", "Notice the pattern: a ufunc or comparison produces an array, then a reduction along an axis collapses it into the answer. That is the shape of most NumPy code you will ever write."], "code": "import numpy as np\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\n\nprint((grid >= 40).all(axis=1))     # who passed everything\nprint((grid >= 40).sum(axis=0))     # how many passed each assessment\nprint(grid.mean(axis=0).argmin())   # hardest assessment", "run": "import numpy as np\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\nprint('passed everything  :', (grid >= 40).all(axis=1))\nprint('passes per assessment:', (grid >= 40).sum(axis=0))\nprint('hardest assessment :', grid.mean(axis=0).argmin(), '(means', np.round(grid.mean(axis=0), 1), ')')\nprint('most inconsistent  : student', grid.std(axis=1).argmax())\nprint('curved and capped  :')\nprint(np.minimum(grid + 5, 100))", "nav": "Finding the Topper"}, {"type": "section", "title": "Reshape", "subtitle": "Same marks, different shape — the layout is separate from the data", "nav": "Reshape"}, {"type": "predict", "topic": "reshape", "title": "A flat roll of 12 marks becomes a gradebook", "code": "import numpy as np\nflat = np.array([72,68,91,55,62,40,88,79,95,30,45,58])\nprint(flat.shape)\nprint(flat.reshape(4, 3))", "run": "import numpy as np\nflat = np.array([72,68,91,55,62,40,88,79,95,30,45,58])\nprint(flat.shape)\nprint(flat.reshape(4, 3))", "expect": "(12,)\n[[72 68 91]\n [55 62 40]\n [88 79 95]\n [30 45 58]]", "why": "12 marks, reshaped to 4 students × 3 assessments. The numbers never move — reshape just changes how the same contiguous block is read. Row-by-row fill order (C-order).", "nav": "Reshape"}, {"type": "mcq", "topic": "reshape", "title": "You have 60 marks, 3 assessments. What reshapes it?", "code": "import numpy as np\n# 60 marks total, 3 assessments per student.\n# You don't want to count the students by hand.\n# Which line lets NumPy figure out the row count?", "options": ["flat.reshape(60, 3)", "flat.reshape(3, -1)", "flat.reshape(-1, 3)", "flat.reshape(20)"], "answer": 2, "expect": "flat.reshape(-1, 3)", "why": "-1 means 'infer this dimension'. With 60 marks and 3 columns fixed, NumPy computes 20 rows. reshape(-1, 3) is the idiom for 'group into rows of 3, however many that takes'.", "nav": "Reshape"}, {"type": "content", "title": "reshape, and the -1 you do not have to compute", "bullets": ["reshape rewrites the shape field. The only requirement is that the new shape multiplies to the same size, which is checked against the header alone.", "Passing -1 for one axis means 'work this one out for me'. NumPy divides size by the other dimensions.", "reshape(-1) is the idiomatic 'make this one-dimensional'. reshape(3, -1) says 'three rows, however many columns that needs'.", "Only one axis may be -1, for the obvious reason: two unknowns and one equation has no unique solution."], "code": "import numpy as np\n\na = np.arange(12)\nprint(a.reshape(3, 4).shape)\nprint(a.reshape(3, -1).shape)   # -1 works out to 4\nprint(a.reshape(-1, 2).shape)   # -1 works out to 6\nprint(a.reshape(-1).shape)", "run": "import numpy as np\na = np.arange(12)\nfor shape in [(3, 4), (3, -1), (-1, 2), (-1,), (2, 2, 3)]:\n    r = a.reshape(shape)\n    print(f'reshape{str(shape):<10} -> shape {str(r.shape):<12} view: {np.shares_memory(a, r)}')\nprint()\ntry:\n    a.reshape(5, -1)\nexcept Exception as e:\n    print('reshape(5, -1) ->', e)", "nav": "Reshape"}, {"type": "content", "title": "ravel, flatten, squeeze, and adding an axis", "bullets": [".ravel() flattens and returns a view when it can. .flatten() flattens and always copies. Same output, different memory, so pick on purpose.", ".squeeze() removes axes of length 1 — useful for cleaning up after a keepdims reduction.", "The reverse is a[:, None] (or np.newaxis, which is the same object with a clearer name), which inserts an axis of length 1. That is how you make a row into a column for broadcasting.", "All four are header edits. None of them moves a value, except flatten, which promises not to share."], "code": "import numpy as np\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\n\nprint(np.shares_memory(grid, grid.ravel()))\nprint(np.shares_memory(grid, grid.flatten()))\n\nrow = np.array([72, 68, 91])\nprint(row.shape, row[:, None].shape)", "run": "import numpy as np\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\nprint('ravel   view?', np.shares_memory(grid, grid.ravel()))\nprint('flatten view?', np.shares_memory(grid, grid.flatten()))\nprint('T.ravel view?', np.shares_memory(grid, grid.T.ravel()), ' <- had to copy')\nprint()\nrow = np.array([72, 68, 91])\nprint('row          ', row.shape)\nprint('row[:, None] ', row[:, None].shape, ' (a column)')\nprint('row[None, :] ', row[None, :].shape, ' (a 1-row matrix)')\nprint()\ntotals = grid.sum(axis=1, keepdims=True)\nprint('keepdims gave', totals.shape, '-> squeeze gives', totals.squeeze().shape)", "nav": "Reshape"}, {"type": "section", "title": "Combining arrays", "subtitle": "concatenate, vstack, hstack — and why every one of them allocates", "nav": "Combining & Splitting Arrays"}, {"type": "content", "title": "concatenate is the general one", "bullets": ["np.concatenate([a, b], axis=0) joins along an existing axis. Every other combining function is a convenience wrapper around it.", "This CANNOT be a header edit. Two separate blocks cannot be made contiguous by describing them differently — so a new block is always allocated and both inputs are copied into it.", "The shapes must match on every axis except the one you are joining along. That check is pure header arithmetic, so it is instant.", "axis=0 stacks vertically, adding rows. axis=1 joins horizontally, adding columns. The axis you name is the one that GROWS — the mirror image of the reduction rule."], "code": "import numpy as np\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\n\nprint(np.concatenate([grid, grid], axis=0).shape)   # more students\nprint(np.concatenate([grid, grid], axis=1).shape)   # more assessments\nprint(np.shares_memory(grid, np.concatenate([grid, grid])))", "run": "import numpy as np\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\nprint('grid.shape                    ', grid.shape)\nprint('concatenate axis=0 (rows)     ', np.concatenate([grid, grid], axis=0).shape)\nprint('concatenate axis=1 (columns)  ', np.concatenate([grid, grid], axis=1).shape)\nprint('shares memory with grid?      ', np.shares_memory(grid, np.concatenate([grid, grid])))\nprint()\nextra = np.array([[80, 75, 70]])\nprint('adding one student:')\nprint(np.concatenate([grid, extra], axis=0))", "nav": "Combining & Splitting Arrays"}, {"type": "predict", "topic": "combine", "title": "vstack and hstack on 1D arrays", "code": "import numpy as np\n\nx = np.array([1, 2, 3])\ny = np.array([4, 5, 6])\n\nprint(np.vstack([x, y]).shape)\nprint(np.hstack([x, y]).shape)", "run": "import numpy as np\nx = np.array([1, 2, 3])\ny = np.array([4, 5, 6])\nprint('vstack:'); print(np.vstack([x, y]), np.vstack([x, y]).shape)\nprint()\nprint('hstack:'); print(np.hstack([x, y]), np.hstack([x, y]).shape)\nprint()\nprint('column_stack:'); print(np.column_stack([x, y]), np.column_stack([x, y]).shape)", "expect": "vstack -> shape (2, 3)   a 2-row matrix\nhstack -> shape (6,)     still 1-dimensional", "why": "This asymmetry catches everyone. vstack promotes each 1D input to a row and stacks them, so the result gains a dimension. hstack just joins them end to end along the only axis there is, so you get a longer 1D array. If you wanted two columns, np.column_stack is the one that says so. For 2D inputs both behave predictably — it is only the 1D case that surprises.", "nav": "Combining & Splitting Arrays"}, {"type": "content", "title": "split gives you views back", "bullets": ["np.split(a, 3) cuts an array into equal pieces; np.split(a, [2, 5]) cuts at the given indices instead.", "Combining allocates, but splitting does not. Each piece is a contiguous run of the original block, so each one is describable by an offset and a stride — a view.", "That is a pleasing symmetry worth pointing out: joining creates memory, cutting only creates headers.", "It is also a trap of the usual kind. Writing into a piece writes into the original, so copy the piece if you intend to modify it."], "code": "import numpy as np\n\nz = np.arange(12)\nparts = np.split(z, 3)\n\nprint([p.shape for p in parts])\nprint(np.shares_memory(z, parts[0]))", "run": "import numpy as np\nz = np.arange(12)\nparts = np.split(z, 3)\nprint('pieces :', [list(p) for p in parts])\nprint('views? :', [np.shares_memory(z, p) for p in parts])\nprint()\nparts[0][0] = 999\nprint('wrote 999 into parts[0][0]; z is now:', z)\nprint()\nprint('uneven cuts with explicit indices:', [list(p) for p in np.split(z, [2, 7])])", "nav": "Combining & Splitting Arrays"}, {"type": "predict", "topic": "combine", "title": "Why growing an array in a loop is quadratic", "code": "import numpy as np\n\n# building 20,000 marks by concatenating one at a time,\n# versus allocating once and filling.\n# How far apart should these be?", "run": "import numpy as np, time\n\nN = 20_000\n\nt = time.perf_counter()\nout = np.array([], dtype=int)\nfor i in range(N):\n    out = np.concatenate([out, [i]])\ngrow_ms = (time.perf_counter() - t) * 1000\n\nt = time.perf_counter()\nbuf = np.empty(N, dtype=int)\nfor i in range(N):\n    buf[i] = i\nfill_ms = (time.perf_counter() - t) * 1000\n\nprint(f'concatenate in a loop : {grow_ms:9.1f} ms')\nprint(f'preallocate and fill  : {fill_ms:9.1f} ms')\nprint(f'ratio                 : {grow_ms/max(fill_ms,1e-9):9.0f}x')\nprint()\nprint('same answer:', np.array_equal(out, buf))", "expect": "Growing by concatenation is hundreds of times slower,\nand the gap widens as N grows.", "why": "Every concatenate allocates a new block and copies everything so far. Doing that N times copies 1 + 2 + 3 + ... + N values, which is O(N²). Preallocating with np.empty and filling in place is O(N). A Python list does not have this problem because it over-allocates and appends amortise to O(1) — so if you truly must grow one element at a time, build a list and convert once at the end.", "nav": "Combining & Splitting Arrays"}, {"type": "mcq", "topic": "combine", "title": "Which of these does NOT allocate a new block?", "code": "import numpy as np\na = np.arange(12).reshape(3, 4)\n\n# which one is free?", "options": ["np.concatenate([a, a])", "np.vstack([a, a])", "np.split(a, 3)", "a.flatten()"], "answer": 2, "expect": "np.split(a, 3)", "why": "Splitting cuts along existing contiguous runs, so each piece is describable with an offset and the original strides — views, no allocation. Both concatenate and vstack must bring two separate blocks together, which cannot be done by describing memory differently. flatten always copies by definition. The general principle: joining creates memory, cutting creates headers.", "nav": "Combining & Splitting Arrays"}, {"type": "content", "title": "Recap", "bullets": ["reshape, ravel, squeeze, and adding an axis with None are all header edits — free, and they share memory.", "flatten is the copying twin of ravel; the difference is a guarantee, not a result.", "-1 in a reshape means 'derive this axis from size', and only one axis may be -1.", "concatenate, vstack and hstack always allocate. The axis you name is the one that grows.", "split returns views. Joining creates memory; cutting creates headers.", "Never grow an array in a loop. Preallocate with np.empty, or build a Python list and convert once."], "code": "import numpy as np\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\n\nprint(grid.reshape(-1).shape)\nprint(np.concatenate([grid, grid], axis=1).shape)\nprint([p.shape for p in np.split(grid, 2)])", "run": "import numpy as np\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\nprint('operation                  result shape   allocates?')\nprint('-' * 52)\nfor label, a in [('grid.reshape(-1)     ', grid.reshape(-1)),\n                 ('grid.ravel()         ', grid.ravel()),\n                 ('grid.flatten()       ', grid.flatten()),\n                 ('grid[:, None, :]     ', grid[:, None, :]),\n                 ('concatenate axis=0   ', np.concatenate([grid, grid], axis=0)),\n                 ('vstack               ', np.vstack([grid, grid])),\n                 ('split(grid, 2)[0]    ', np.split(grid, 2)[0])]:\n    print(f'{label} {str(a.shape):<14} {\"no\" if np.shares_memory(grid, a) else \"yes\"}')", "nav": "Combining & Splitting Arrays"}, {"type": "section", "title": "View or copy?", "subtitle": "The single most common source of silent bugs in student NumPy code. It is not a rule to memorise — it follows directly from what a header can and cannot describe. Part 2 then puts it to work on real, gappy data.", "nav": "Views & Copies"}, {"type": "content", "title": "Two possible endings, and only two", "bullets": ["Every operation that produces an array ends one of two ways: a new HEADER over the existing block, or a whole new BLOCK.", "A view is O(1) and shares memory. Writing through it changes the original, because there is only one set of bytes.", "A copy is O(n) and owns its memory. Writing through it leaves the original alone.", "The test for which you get: can the result be described by a start offset and a fixed stride per axis? If yes, a header is enough. If no, the values have to be gathered into a new block."], "svg": "<svg viewBox=\"0 0 880 420\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Segoe UI,system-ui,sans-serif\">\n  <defs>\n    <marker id=\"va\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\">\n      <path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#1f7a4d\"/>\n    </marker>\n    <marker id=\"vb\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\">\n      <path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#c94b4b\"/>\n    </marker>\n  </defs>\n\n  <text x=\"440\" y=\"24\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#214B8C\">Every NumPy operation ends in one of exactly two ways</text>\n\n  <g transform=\"translate(20,44)\">\n    <rect x=\"0\" y=\"0\" width=\"410\" height=\"336\" rx=\"12\" fill=\"#e9f7ef\" stroke=\"#1f7a4d\" stroke-width=\"1.6\"/>\n    <text x=\"205\" y=\"30\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#1f7a4d\">VIEW &#8212; a new header</text>\n    <text x=\"205\" y=\"52\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#1f7a4d\">b = a[0:2]&#160;&#160;&#183;&#160;&#160;a.T&#160;&#160;&#183;&#160;&#160;a.reshape(...)&#160;&#160;&#183;&#160;&#160;a.ravel()</text>\n\n    <rect x=\"40\" y=\"76\" width=\"150\" height=\"52\" rx=\"7\" fill=\"#fff\" stroke=\"#1f7a4d\" stroke-width=\"1.4\"/>\n    <text x=\"115\" y=\"98\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"#1f7a4d\">header of a</text>\n    <text x=\"115\" y=\"116\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#3a5170\">shape (4,3)</text>\n    <rect x=\"220\" y=\"76\" width=\"150\" height=\"52\" rx=\"7\" fill=\"#fff\" stroke=\"#1f7a4d\" stroke-width=\"1.4\"/>\n    <text x=\"295\" y=\"98\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"#1f7a4d\">header of b</text>\n    <text x=\"295\" y=\"116\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#3a5170\">shape (2,3)</text>\n\n    <path d=\"M115,132 L175,176\" stroke=\"#1f7a4d\" stroke-width=\"2\" marker-end=\"url(#va)\"/>\n    <path d=\"M295,132 L235,176\" stroke=\"#1f7a4d\" stroke-width=\"2\" marker-end=\"url(#va)\"/>\n\n    <rect x=\"40\" y=\"184\" width=\"330\" height=\"52\" fill=\"#fff\" stroke=\"#1f7a4d\" stroke-width=\"1.8\"/>\n    <line x1=\"95\" y1=\"184\" x2=\"95\" y2=\"236\" stroke=\"#bfe3ce\"/><line x1=\"150\" y1=\"184\" x2=\"150\" y2=\"236\" stroke=\"#bfe3ce\"/>\n    <line x1=\"205\" y1=\"184\" x2=\"205\" y2=\"236\" stroke=\"#bfe3ce\"/><line x1=\"260\" y1=\"184\" x2=\"260\" y2=\"236\" stroke=\"#bfe3ce\"/>\n    <line x1=\"315\" y1=\"184\" x2=\"315\" y2=\"236\" stroke=\"#bfe3ce\"/>\n    <text x=\"205\" y=\"216\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"#12233b\">ONE shared block</text>\n\n    <text x=\"205\" y=\"266\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#1f7a4d\">cost: O(1). No bytes are moved.</text>\n    <rect x=\"40\" y=\"282\" width=\"330\" height=\"38\" rx=\"7\" fill=\"#fff\" stroke=\"#1f7a4d\"/>\n    <text x=\"205\" y=\"306\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"#1f7a4d\">writing through b CHANGES a</text>\n  </g>\n\n  <g transform=\"translate(450,44)\">\n    <rect x=\"0\" y=\"0\" width=\"410\" height=\"336\" rx=\"12\" fill=\"#fff5f5\" stroke=\"#c94b4b\" stroke-width=\"1.6\"/>\n    <text x=\"205\" y=\"30\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#8a2b2b\">COPY &#8212; a new block</text>\n    <text x=\"205\" y=\"52\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#8a2b2b\">a[[0,2]]&#160;&#160;&#183;&#160;&#160;a[a&gt;40]&#160;&#160;&#183;&#160;&#160;a.flatten()&#160;&#160;&#183;&#160;&#160;a.astype(...)</text>\n\n    <rect x=\"40\" y=\"76\" width=\"150\" height=\"52\" rx=\"7\" fill=\"#fff\" stroke=\"#c94b4b\" stroke-width=\"1.4\"/>\n    <text x=\"115\" y=\"98\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"#8a2b2b\">header of a</text>\n    <text x=\"115\" y=\"116\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#3a5170\">shape (4,3)</text>\n    <rect x=\"220\" y=\"76\" width=\"150\" height=\"52\" rx=\"7\" fill=\"#fff\" stroke=\"#c94b4b\" stroke-width=\"1.4\"/>\n    <text x=\"295\" y=\"98\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"#8a2b2b\">header of c</text>\n    <text x=\"295\" y=\"116\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#3a5170\">shape (2,3)</text>\n\n    <path d=\"M115,132 L115,176\" stroke=\"#c94b4b\" stroke-width=\"2\" marker-end=\"url(#vb)\"/>\n    <path d=\"M295,132 L295,176\" stroke=\"#c94b4b\" stroke-width=\"2\" marker-end=\"url(#vb)\"/>\n\n    <rect x=\"30\" y=\"184\" width=\"170\" height=\"52\" fill=\"#fff\" stroke=\"#c94b4b\" stroke-width=\"1.8\"/>\n    <text x=\"115\" y=\"216\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#12233b\">block A</text>\n    <rect x=\"210\" y=\"184\" width=\"170\" height=\"52\" fill=\"#fff\" stroke=\"#c94b4b\" stroke-width=\"1.8\"/>\n    <text x=\"295\" y=\"216\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#12233b\">block C</text>\n\n    <text x=\"205\" y=\"266\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#8a2b2b\">cost: O(n). Every value is written again.</text>\n    <rect x=\"40\" y=\"282\" width=\"330\" height=\"38\" rx=\"7\" fill=\"#fff\" stroke=\"#c94b4b\"/>\n    <text x=\"205\" y=\"306\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"#8a2b2b\">writing through c leaves a alone</text>\n  </g>\n\n  <text x=\"440\" y=\"404\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#5b6b80\">The test: can the result be described by a start offset and fixed strides? Yes &#8594; view. No &#8594; copy.</text>\n</svg>", "nav": "Views & Copies"}, {"type": "content", "title": "Basic slicing gives a view", "bullets": ["a[1:3], a[:, 0], a[::2] — all of these are start, stop, step. Every one is expressible as an offset plus a stride, so a header is enough.", "Three ways to check, and they answer slightly different questions: np.shares_memory(a, b) asks whether the bytes overlap; b.base tells you which array owns them; b.flags.owndata says whether b allocated its own.", "Careful with .base: it points at the ultimate owner, not necessarily the array you sliced. Slicing a view gives you a view of the original owner.", "a.T and a.reshape(...) are views for the same reason — they only rewrite the shape and strides."], "code": "import numpy as np\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\n\nfirst_two = grid[0:2]\nprint(np.shares_memory(grid, first_two))\nprint(first_two.base is grid)\nprint(first_two.flags.owndata)", "run": "import numpy as np\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\nfor label, b in [('grid[0:2]  ', grid[0:2]), ('grid[:, 0] ', grid[:, 0]),\n                 ('grid[::2]  ', grid[::2]), ('grid.T     ', grid.T),\n                 ('grid.reshape(3,4)', grid.reshape(3, 4))]:\n    print(f'{label:<18} view: {np.shares_memory(grid, b)!s:<6} owndata: {b.flags.owndata}')\nprint()\nprint('grid owns its data:', grid.flags.owndata)\nprint('grid[0:2].base is grid:', grid[0:2].base is grid)", "nav": "Views & Copies"}, {"type": "predict", "topic": "view", "title": "The bug this causes", "code": "import numpy as np\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\n\ndef normalise_first_assessment(marks):\n    col = marks[:, 0]\n    col -= col.min()          # in place\n    return col / col.max()\n\nprint('before:'); print(grid)\nresult = normalise_first_assessment(grid)\nprint('after :'); print(grid)", "run": "import numpy as np\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\n\ndef normalise_first_assessment(marks):\n    col = marks[:, 0]\n    col -= col.min()\n    return col / col.max()\n\nprint('before:'); print(grid)\nresult = normalise_first_assessment(grid)\nprint()\nprint('returned:', np.round(result, 3))\nprint('after :'); print(grid)", "expect": "The returned values are correct.\nBut column 0 of grid has been overwritten:\n72,55,88,30 became 42,25,58,0.", "why": "marks[:, 0] is basic slicing, so col is a VIEW. The -= is in-place, so it writes straight through into the caller's block. Note what makes this class of bug survive testing: the return value is right. A unit test on the output catches nothing. The fixes are col = col - col.min() (rebinds to a new array) or marks[:, 0].copy() (states the intent).", "nav": "Views & Copies"}, {"type": "content", "title": "Fancy indexing and boolean masks give a copy", "bullets": ["a[[0, 3, 7]] picks positions with gaps of 3 then 4. No single stride describes that, so there is no header NumPy could hand you.", "a[a > 40] is worse: which positions are selected depends on the VALUES, so they can land anywhere at all.", "In both cases the result must be gathered into a fresh block. That is not a design choice — it is forced by what a header can express.", "The practical consequence is a trap: because the result is a temporary copy, assigning into it changes nothing you can see."], "code": "import numpy as np\n\nb = np.arange(10)\nprint(np.shares_memory(b, b[[0, 3, 7]]))\nprint(np.shares_memory(b, b[b > 4]))\n\nb[b > 4][0] = 999\nprint(b)", "run": "import numpy as np\nb = np.arange(10)\nprint('b[[0,3,7]] view?', np.shares_memory(b, b[[0, 3, 7]]))\nprint('b[b > 4]   view?', np.shares_memory(b, b[b > 4]))\nprint()\nb[b > 4][0] = 999\nprint('after b[b > 4][0] = 999 :', b)\nprint('nothing changed. we wrote into a temporary that was then discarded.')\nprint()\nb[b > 4] = 999\nprint('but b[b > 4] = 999 works  :', b)\nprint('because that is one assignment statement, not an index-then-assign.')", "nav": "Views & Copies"}, {"type": "mcq", "topic": "view", "title": "Which one of these shares memory with a?", "code": "import numpy as np\na = np.arange(12).reshape(3, 4)\n\n# which of these is a VIEW of a?", "options": ["a[a % 2 == 0]", "a.flatten()", "a[:, ::2]", "a.astype(np.float64)"], "answer": 2, "expect": "a[:, ::2]", "why": "a[:, ::2] is basic slicing — start 0, step 2 along the last axis — so a stride describes it and you get a view. The boolean mask selects value-dependent positions, so it must gather into a new block. flatten() is documented as always returning a copy (its sibling ravel() returns a view when it can). astype changes itemsize, so the bytes themselves must be rewritten.", "nav": "Views & Copies"}, {"type": "content", "title": "ravel versus flatten — the same result, different memory", "bullets": ["Both give you the array as one dimension. .flatten() ALWAYS copies. .ravel() returns a view whenever it can.", "When can it not? When the flat order cannot be expressed with strides over the existing block — for example after a transpose, where reading row by row means jumping around.", "So .ravel() is the fast default and .flatten() is the safe one. Choose deliberately rather than by habit.", "This is a good habit to build generally: when two functions do the same visible thing, one of them is usually paying for a guarantee."], "code": "import numpy as np\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\n\nprint(np.shares_memory(grid, grid.ravel()))\nprint(np.shares_memory(grid, grid.flatten()))\nprint(np.shares_memory(grid, grid.T.ravel()))", "run": "import numpy as np\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\nprint('grid.ravel()    view?', np.shares_memory(grid, grid.ravel()))\nprint('grid.flatten()  view?', np.shares_memory(grid, grid.flatten()))\nprint('grid.T.ravel()  view?', np.shares_memory(grid, grid.T.ravel()))\nprint()\nprint('the last one had to copy: reading the transpose in flat order')\nprint('means stepping 24, 24, 24, -64, 24, ... which no single stride covers.')", "nav": "Views & Copies"}, {"type": "content", "title": ".view() is a different thing from 'a view'", "bullets": ["Confusing name. A slice IS a view. But the METHOD .view() does something more specific: it reinterprets the same bytes under a different dtype.", "No conversion happens. The bits are unchanged; only the header's dtype field changes, so the same memory is read under new rules.", "Contrast .astype(), which converts values and therefore must allocate and write a new block.", "You will rarely need .view() in coursework, but it is the cleanest possible proof that dtype is metadata rather than a property of the values."], "code": "import numpy as np\n\nraw = np.array([1078530011], dtype=np.int32)\nprint(raw.view(np.float32))     # same 4 bytes, read as a float\nprint(raw.astype(np.float32))   # converted, new block", "run": "import numpy as np\nraw = np.array([1078530011], dtype=np.int32)\nprint('raw               :', raw)\nprint('raw.view(float32) :', raw.view(np.float32), ' <- reinterpreted')\nprint('raw.astype(float32):', raw.astype(np.float32), ' <- converted')\nprint()\nprint('view   shares memory:', np.shares_memory(raw, raw.view(np.float32)))\nprint('astype shares memory:', np.shares_memory(raw, raw.astype(np.float32)))", "nav": "Views & Copies"}, {"type": "predict", "topic": "view", "title": "A view keeps the whole block alive", "code": "import numpy as np\n\nbig = np.arange(2_000_000)     # 16 MB\nsmall = big[:10]               # I only want ten values\ndel big                        # ... so I can free the rest, right?\n\nprint(small.nbytes)\nprint(small.base.nbytes)", "run": "import numpy as np\nbig = np.arange(2_000_000)\nsmall = big[:10]\ndel big\nprint('small.nbytes       :', small.nbytes, 'bytes')\nprint('small.base.nbytes  :', small.base.nbytes, 'bytes  <- still alive')\nprint()\nsafe = np.arange(2_000_000)[:10].copy()\nprint('with .copy(), base :', safe.base)\nprint('now the 16 MB really is free.')", "expect": "small.nbytes is 80, but small.base.nbytes is 16,000,000.\nDeleting big freed the name, not the memory — the view\nstill references the whole block.", "why": "A view holds a reference to its base, so the base cannot be garbage collected while any view of it survives. Keeping a 10-element slice of a 16 MB array keeps all 16 MB resident. This is the one situation where .copy() is not paranoia but the correct engineering choice: copy small slices you intend to keep for a long time.", "nav": "Views & Copies"}, {"type": "content", "title": "Habits that prevent all of this", "bullets": ["If a function receives an array and modifies it, say so in the name or take a copy first. Silent mutation of a caller's data is the bug from slide 4.", "Prefer out-of-place arithmetic (b = a - x) over in-place (a -= x) unless you specifically want the in-place behaviour for memory reasons.", "When you are not sure, ask the array: np.shares_memory(a, b) settles it in one line and costs nothing.", "Copy deliberately, not defensively. A .copy() on every line throws away the reason NumPy is fast; a .copy() at the one boundary that matters costs you nothing.", "And remember the asymmetry: forgetting a copy gives you a wrong answer, while an unnecessary copy only costs time. When in doubt on shared data, copy."], "code": "import numpy as np\n\ndef safe_normalise(marks):\n    col = marks[:, 0].copy()     # explicit: we will not touch the caller's data\n    col = col - col.min()\n    return col / col.max()", "run": "import numpy as np\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\n\ndef safe_normalise(marks):\n    col = marks[:, 0].copy()\n    col = col - col.min()\n    return col / col.max()\n\nbefore = grid.copy()\nout = safe_normalise(grid)\nprint('result       :', np.round(out, 3))\nprint('grid intact? :', np.array_equal(grid, before))", "nav": "Views & Copies"}, {"type": "section", "title": "Random Numbers", "subtitle": "Reproducible randomness with a Generator you own, instead of one hidden global state.", "nav": "Random Numbers"}, {"type": "content", "title": "Random numbers: use a Generator, not the old functions", "bullets": ["You will see np.random.seed(42) and np.random.rand(...) everywhere online. That is the legacy interface, and it uses one global state shared by your whole program and every library in it.", "The modern way is rng = np.random.default_rng(42), which gives you an object you own and pass around. No hidden global, no action at a distance.", "Seeding is not about making things 'less random'. It is about reproducibility — your experiment, your marks, your figures must be regenerable next week, by you and by whoever reads your report.", "In a report, state the seed. A result nobody can reproduce is not a result."], "code": "import numpy as np\n\nrng = np.random.default_rng(42)\nprint(rng.random(3))\n\nrng2 = np.random.default_rng(42)\nprint(rng2.random(3))     # identical stream", "run": "import numpy as np\nrng = np.random.default_rng(42)\nprint('rng.random(3)      :', np.round(rng.random(3), 4))\nprint('same seed again    :', np.round(np.random.default_rng(42).random(3), 4))\nprint('different seed     :', np.round(np.random.default_rng(7).random(3), 4))\nprint()\nprint('identical?', np.array_equal(np.random.default_rng(1).random(5),\n                                   np.random.default_rng(1).random(5)))", "nav": "Random Numbers"}, {"type": "content", "title": "The four you will actually use", "bullets": ["rng.random(shape) gives floats uniform in [0, 1). Scale and shift it for any other range.", "rng.integers(low, high, size) gives integers, and high is EXCLUSIVE by default — rng.integers(0, 101) for marks out of 100.", "rng.choice(values, size, replace=..., p=...) samples from a set you supply, with or without replacement, optionally with weights.", "rng.normal(mean, sd, size) gives a bell curve — the natural way to fake a set of marks that looks like real marks.", "rng.permutation and rng.shuffle reorder things; permutation returns a new array, shuffle rearranges in place."], "code": "import numpy as np\n\nrng = np.random.default_rng(7)\nprint(rng.integers(0, 101, 5))            # 5 marks out of 100\nprint(rng.choice(['A', 'B', 'C'], 5))\nprint(rng.normal(70, 10, 5))\nprint(rng.permutation(np.arange(6)))", "run": "import numpy as np\nrng = np.random.default_rng(7)\nprint('random(3)          :', np.round(rng.random(3), 4))\nprint('integers(0,101,5)  :', rng.integers(0, 101, 5))\nprint('choice of grades   :', rng.choice(['A', 'B', 'C'], 5))\nprint('normal(70, 10, 5)  :', np.round(rng.normal(70, 10, 5), 1))\nprint('permutation        :', rng.permutation(np.arange(6)))\nprint()\nmarks = rng.normal(65, 12, (4, 3)).clip(0, 100).round().astype(int)\nprint('a fake gradebook:'); print(marks)\nprint('choice without replacement (pick 3 students):', rng.choice(4, 3, replace=False))", "nav": "Random Numbers"}, {"type": "section", "title": "Linear algebra", "subtitle": "Matrix multiplication, transposes, determinants and inverses", "nav": "Linear Algebra"}, {"type": "predict", "topic": "linalg", "title": "The one that catches everybody: * versus @", "code": "import numpy as np\n\nA = np.array([[2., 1.],\n              [1., 3.]])\nB = np.array([[1., 0.],\n              [0., 2.]])\n\nprint(A * B)     # ?\nprint(A @ B)     # ?", "run": "import numpy as np\nA = np.array([[2., 1.], [1., 3.]])\nB = np.array([[1., 0.], [0., 2.]])\nprint('A * B  (element-wise):'); print(A * B)\nprint()\nprint('A @ B  (matrix product):'); print(A @ B)\nprint()\nprint('np.dot(A, B) is the same as A @ B:', np.array_equal(A @ B, np.dot(A, B)))\nprint('for 1D, dot is the inner product:', np.dot([1, 2, 3], [4, 5, 6]))", "expect": "A * B = [[2. 0.]     A @ B = [[2. 2.]\n         [0. 6.]]             [1. 6.]]", "why": "In NumPy, * is ALWAYS element-wise — it is a ufunc like every other operator. Matrix multiplication is @ (or np.dot). This is the opposite of MATLAB, where * is the matrix product, which is why students arriving from MATLAB get silently wrong answers rather than errors. Both operations are legal here and both produce a 2×2 array, so nothing warns you.", "nav": "Linear Algebra"}, {"type": "content", "title": "Transpose is still just a header edit", "bullets": ["A.T swaps the entries of the strides tuple. No value moves, and the result shares memory with A.", "So transposing a large matrix costs nothing, which is worth knowing before you go out of your way to avoid it.", "The consequence is that A.T is not contiguous in the usual order, which is why some later operations quietly copy it — A.T.ravel() is the example from the last module.", "For higher dimensions, np.transpose(a, axes) lets you name the permutation; .T just reverses all axes."], "code": "import numpy as np\n\nA = np.array([[2., 1.],\n              [1., 3.]])\n\nprint(A.strides, A.T.strides)\nprint(np.shares_memory(A, A.T))", "run": "import numpy as np\nA = np.arange(6.).reshape(2, 3)\nprint('A:'); print(A)\nprint('A.T:'); print(A.T)\nprint()\nprint('A.shape  ', A.shape,  ' strides', A.strides)\nprint('A.T.shape', A.T.shape, ' strides', A.T.strides, ' <- swapped')\nprint('shares memory:', np.shares_memory(A, A.T))\nprint('A.T is C-contiguous?', A.T.flags.c_contiguous, ' F-contiguous?', A.T.flags.f_contiguous)", "nav": "Linear Algebra"}, {"type": "content", "title": "Determinant, inverse — and why you should not use the inverse", "bullets": ["np.linalg.det(A) gives the determinant, np.linalg.inv(A) the inverse. Both live in the np.linalg submodule.", "But the usual reason to want an inverse is to solve Ax = b, and for that you should use np.linalg.solve(A, b) instead.", "solve factorises A and does a triangular solve. Forming the inverse and multiplying does strictly more arithmetic and accumulates more rounding error, for the same answer.", "Watch the determinant output too: det of an integer-valued matrix comes back as 5.000000000000001, because it is computed by floating-point factorisation. Never test a determinant with == 0."], "code": "import numpy as np\n\nA = np.array([[2., 1.],\n              [1., 3.]])\nb = np.array([5., 10.])\n\nprint(np.linalg.det(A))\nprint(np.linalg.inv(A))\nprint(np.linalg.solve(A, b))     # preferred", "run": "import numpy as np\nA = np.array([[2., 1.], [1., 3.]])\nb = np.array([5., 10.])\nprint('det(A)      :', np.linalg.det(A), ' <- not exactly 5')\nprint('inv(A):'); print(np.round(np.linalg.inv(A), 4))\nprint()\nprint('solve(A, b) :', np.linalg.solve(A, b), ' <- preferred')\nprint('inv(A) @ b  :', np.linalg.inv(A) @ b, ' <- same answer, more work')\nprint()\nprint('check A @ x == b:', np.allclose(A @ np.linalg.solve(A, b), b))\nprint()\nprint('use np.allclose, never ==, on float results:')\nprint('  0.1 + 0.2 == 0.3        ->', 0.1 + 0.2 == 0.3)\nprint('  np.isclose(0.1+0.2, 0.3) ->', bool(np.isclose(0.1 + 0.2, 0.3)))", "nav": "Linear Algebra"}, {"type": "section", "title": "Missing data", "subtitle": "Real gradebooks have gaps: absentees, unmarked scripts, a scanner that failed. Everything you do about them is one of the two endings from Views & Copies — edit the block, or build a new one.", "nav": "Missing Data"}, {"type": "predict", "topic": "nan", "title": "NaN is not equal to itself", "code": "import numpy as np\n\nmarks = np.array(
