[72., np.nan, 91., 38.])\n\nprint(marks.mean())\nprint(np.nan == np.nan)", "run": "import numpy as np\nmarks = np.array([72., np.nan, 91., 38.])\nprint('marks       :', marks)\nprint('marks.mean():', marks.mean(), ' <- one gap poisoned everything')\nprint()\nprint('np.nan == np.nan :', np.nan == np.nan)\nprint('np.nan > 1       :', np.nan > 1)\nprint('np.nan < 1       :', np.nan < 1)\nprint()\nprint('so you can never find it with ==. use np.isnan:')\nprint('np.isnan(marks)  :', np.isnan(marks))\nprint('how many missing :', np.isnan(marks).sum())", "expect": "marks.mean() is nan\nnp.nan == np.nan is False", "why": "NaN means 'not a number', and the IEEE standard makes every comparison with it False — including equality with itself. That is deliberate: two unknowns should not be declared equal. Two consequences follow. Any arithmetic touching a NaN produces NaN, so one absent student ruins a whole class average. And == can never locate them; np.isnan is the only way.", "nav": "Missing Data"}, {"type": "content", "title": "NaN is a float, and that costs you", "bullets": ["np.nan is a floating-point value. There is no integer NaN, because every one of the 2⁶⁴ bit patterns of an int64 is already a valid integer — there is no spare pattern left to mean 'missing'.", "So the moment you want a missing marker in an array, that array becomes float64: eight bytes per slot, whether or not anything is actually missing.", "np.array([1, 2, np.nan]) silently gives float64. Asking for dtype=int raises instead.", "That is the real trade-off behind the -1 sentinel: -1 keeps the array integer and compact, but you must filter it yourself and remember it is not a mark. NaN filters itself, at four to eight times the memory."], "code": "import numpy as np\n\nprint(np.array([1, 2, np.nan]).dtype)\n\ntry:\n    np.array([1, 2, np.nan], dtype=int)\nexcept ValueError as e:\n    print(e)", "run": "import numpy as np\nprint('np.array([1, 2, np.nan]).dtype :', np.array([1, 2, np.nan]).dtype)\ntry:\n    np.array([1, 2, np.nan], dtype=int)\nexcept Exception as e:\n    print('dtype=int ->', type(e).__name__ + ':', e)\nprint()\nn = 222 * 30\nprint(f'a {n}-slot register: {n} bytes with an int8 -1 sentinel,')\nprint(f'                     {n*8} bytes once NaN forces float64.')", "nav": "Missing Data"}, {"type": "content", "title": "The nan-aware reductions", "bullets": ["For every reduction there is a twin that skips missing values: np.nanmean, np.nansum, np.nanstd, np.nanmin, np.nanmax, np.nanargmax.", "They take the same axis argument, so per-student and per-assessment statistics keep working with gaps in the data.", "To locate gaps use np.isnan; to count them, sum that mask, because summing booleans counts the Trues.", "To drop them, index with the negation: marks[~np.isnan(marks)]. Note that this flattens — you cannot keep a rectangle when different rows lose different numbers of values."], "code": "import numpy as np\nmarks = np.array([[72., np.nan, 91.],\n                  [55., 62.,    40.],\n                  [np.nan, 79., 95.]])\n\nprint(marks.mean(axis=1))          # poisoned\nprint(np.nanmean(marks, axis=1))   # skips the gaps\nprint(np.isnan(marks).sum())\nprint(marks[~np.isnan(marks)])", "run": "import numpy as np\nmarks = np.array([[72., np.nan, 91.],\n                  [55., 62.,    40.],\n                  [np.nan, 79., 95.]])\nprint(marks)\nprint()\nprint('mean(axis=1)    :', np.round(marks.mean(axis=1), 2), ' <- poisoned')\nprint('nanmean(axis=1) :', np.round(np.nanmean(marks, axis=1), 2), ' <- skips gaps')\nprint('nanmean(axis=0) :', np.round(np.nanmean(marks, axis=0), 2))\nprint()\nprint('where are they  :'); print(np.isnan(marks))\nprint('how many        :', np.isnan(marks).sum())\nprint('dropped (flat)  :', marks[~np.isnan(marks)])", "nav": "Missing Data"}, {"type": "content", "title": "np.where — the syntax", "bullets": ["THREE-ARGUMENT FORM: np.where(condition, x, y). Read it as an element-wise if-else — wherever condition is True take the value from x, otherwise take it from y.", "All three arguments broadcast together, so x and y can each be a single number, an array of the same shape, or anything that broadcasts to it. np.where(np.isnan(m), 0.0, m) is the standard fill.", "It returns a NEW array, always. It never modifies the input and never gives you a view — it has to allocate, because the values it picks come from two different places.", "ONE-ARGUMENT FORM: np.where(condition) does something completely different. It returns a TUPLE of index arrays saying where the condition is True, identical to np.nonzero. Passing exactly two arguments is an error.", "For more than two outcomes, nest it: np.where(m >= 80, 'A', np.where(m >= 40, 'B', 'F'))."], "code": "import numpy as np\nmarks = np.array([[72., np.nan, 91.],\n                  [55., 62.,    40.],\n                  [np.nan, 79., 95.]])\n\n# three-arg: element-wise if-else, returns a new array\nfilled = np.where(np.isnan(marks), 0.0, marks)\n\n# one-arg: returns a tuple of index arrays\nrows, cols = np.where(np.isnan(marks))", "run": "import numpy as np\nmarks = np.array([[72., np.nan, 91.],\n                  [55., 62.,    40.],\n                  [np.nan, 79., 95.]])\nprint('THREE-ARG  np.where(np.isnan(marks), 0.0, marks)')\nprint(np.where(np.isnan(marks), 0.0, marks))\nprint()\nprint('fill with each assessment average instead (broadcasts):')\nprint(np.round(np.where(np.isnan(marks), np.nanmean(marks, axis=0), marks), 1))\nprint()\nprint('ONE-ARG  np.where(np.isnan(marks))')\nidx = np.where(np.isnan(marks))\nprint('  returns a', type(idx).__name__, 'of', len(idx), 'index arrays:', idx)\nprint('  student', idx[0], 'assessment', idx[1])\nprint()\nscores = np.array([72, 35, 91, 38, 66])\nprint('labels        :', np.where(scores >= 40, 'PASS', 'FAIL'))\nprint('nested (A/B/F):', np.where(scores >= 80, 'A', np.where(scores >= 40, 'B', 'F')))\nprint()\ntry:\n    np.where(np.isnan(marks), 0.0)\nexcept Exception as e:\n    print('two arguments ->', type(e).__name__ + ':', e)", "nav": "Missing Data"}, {"type": "predict", "topic": "nan", "title": "Two ways to fill a gap — and Part 1 decides which you want", "code": "import numpy as np\n\na = np.array([72., np.nan, 91.])\nb = np.where(np.isnan(a), 0.0, a)     # build a new block\nprint(a)\n\nc = np.array([72., np.nan, 91.])\nc[np.isnan(c)] = 0.0                   # write into the existing block\nprint(c)", "run": "import numpy as np\n\na = np.array([72., np.nan, 91.])\nb = np.where(np.isnan(a), 0.0, a)\nprint('np.where     -> b:', b)\nprint('               a:', a, ' <- untouched')\nprint('               shares memory:', np.shares_memory(a, b))\nprint()\nc = np.array([72., np.nan, 91.])\nc[np.isnan(c)] = 0.0\nprint('mask assign  -> c:', c, ' <- the original itself changed')\nprint()\nprint('same result, opposite memory behaviour.')", "expect": "np.where leaves a as [72. nan 91.] and returns a new array.\nMask assignment changes c in place to [72. 0. 91.].", "why": "This is Part 1 applied to real data. np.where allocates a new block, so the caller's array is safe — use it when the original must survive, or when you are chaining expressions. Boolean-mask assignment writes through into the existing block, so it is free of allocation but mutates whatever you were handed. Recall from Part 1 that marks[mask] = value works while marks[mask][0] = value silently does nothing: the first is one assignment statement, the second indexes into a temporary copy and then throws it away.", "nav": "Missing Data"}, {"type": "mcq", "topic": "nan", "title": "How do you count the missing marks?", "code": "import numpy as np\nmarks = np.array([72., np.nan, 91., np.nan])\n\n# which line gives 2?", "options": ["(marks == np.nan).sum()", "np.isnan(marks).sum()", "marks.count(np.nan)", "len(marks[marks != marks.mean()])"], "answer": 1, "expect": "np.isnan(marks).sum()", "why": "Every comparison with NaN is False, so marks == np.nan gives an all-False array and sums to 0 — the dangerous wrong answer, because it runs without complaining. np.isnan produces a boolean mask, and summing booleans counts the Trues. NumPy arrays have no .count method. The last option is nonsense that reads plausibly, which is exactly why it is worth thirty seconds.", "nav": "Missing Data"}, {"type": "content", "title": "Putting both halves together", "bullets": ["From Views & Copies: every operation either edits a header over the existing block, or allocates a new one. Basic slicing, reshape and transpose are the first kind; fancy indexing, boolean masks, flatten and astype are the second.", "The bug to fear is a function that receives an array, slices it, and modifies the slice in place — the answer comes back correct while the caller's data is quietly destroyed.", "From Missing Data: NaN spreads through arithmetic, is never equal to anything, forces the array to float, and is found only with np.isnan.", "np.where(cond, x, y) is the element-wise if-else and always builds a new array. arr[mask] = value writes into the array you already have. Choosing between them IS the Part 1 question.", "The habit worth leaving with: before you modify an array, know whether you own its memory. np.shares_memory answers it in one line and costs nothing."], "code": "import numpy as np\nmarks = np.array([[72., np.nan, 91.],\n                  [55., 62.,    40.],\n                  [np.nan, 79., 95.]])\n\ndef filled_totals(m, weights):\n    m = np.where(np.isnan(m), np.nanmean(m, axis=0), m)   # new block: caller is safe\n    return m @ weights", "run": "import numpy as np\nmarks = np.array([[72., np.nan, 91.],\n                  [55., 62.,    40.],\n                  [np.nan, 79., 95.]])\n\ndef filled_totals(m, weights):\n    m = np.where(np.isnan(m), np.nanmean(m, axis=0), m)\n    return m @ weights\n\nbefore = marks.copy()\nweights = np.array([0.3, 0.3, 0.4])\nprint('weighted totals :', np.round(filled_totals(marks, weights), 2))\nprint('marks intact?   :', np.array_equal(marks, before, equal_nan=True))\nprint()\nprint('per student  :', np.round(np.nanmean(marks, axis=1), 1))\nprint('missing count:', int(np.isnan(marks).sum()))", "nav": "Missing Data"}, {"type": "content", "title": "Recap", "bullets": ["Random: use rng = np.random.default_rng(seed) rather than the global np.random functions, and record the seed in anything you report.", "* is element-wise; @ and np.dot are matrix multiplication. This bites every student arriving from MATLAB, and it fails silently.", "A.T is a header edit and costs nothing. np.linalg holds det, inv and solve — and solve is the right tool whenever you were reaching for inv.", "Compare floats with np.allclose or np.isclose, never with ==. That applies to determinants too.", "NaN is float-only, spreads through arithmetic, and is not equal to itself. Find it with np.isnan, skip it with the nan-aware reductions, replace it with np.where."], "code": "import numpy as np\n\nrng = np.random.default_rng(2026)\nmarks = rng.normal(65, 12, (4, 3)).clip(0, 100)\nmarks[1, 2] = np.nan\n\nprint(np.round(np.nanmean(marks, axis=1), 1))", "run": "import numpy as np\nrng = np.random.default_rng(2026)\nmarks = rng.normal(65, 12, (4, 3)).clip(0, 100).round()\nmarks[1, 2] = np.nan\nprint('a gradebook with one gap:'); print(marks)\nprint()\nprint('per student (nanmean) :', np.round(np.nanmean(marks, axis=1), 1))\nprint('per assessment        :', np.round(np.nanmean(marks, axis=0), 1))\nprint('missing count         :', int(np.isnan(marks).sum()))\nweights = np.array([0.3, 0.3, 0.4])\nfilled = np.where(np.isnan(marks), np.nanmean(marks), marks)\nprint('weighted totals       :', np.round(filled @ weights, 1))", "nav": "Missing Data"}, {"type": "section", "title": "Seeing the whole class at once", "subtitle": "From a raw array to a picture — the bridge to Lecture 9", "nav": "Wrap-up"}, {"type": "content", "title": "The shape of class performance", "bullets": ["We've reduced, masked, sliced and reshaped — all still numbers on a screen.", "One last move: colour each mark. NumPy normalises the grid to 0..1, then we map low → blue, high → red.", "Press R. The class's strengths and weak spots appear as a PICTURE — patterns your eye catches instantly.", "Here we coloured it by hand from the array. Lecture 9 hands that job to Matplotlib — then Pandas puts names back on the rows and columns."], "code": "import numpy as np\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\n# normalise every mark to 0..1 across the whole grid\nnorm = (grid - grid.min()) / (grid.max() - grid.min())\nprint(np.round(norm, 2))", "run": "import numpy as np\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\nnorm = (grid - grid.min()) / (grid.max() - grid.min())\n\n# build a coloured HTML table straight from the array (no plotting library)\ndef cell(v, t):\n    # v in 0..1 -> blue(low) to red(high)\n    r = int(60 + 175*v); b = int(235 - 175*v); g = int(90 + 40*(1-abs(0.5-v)*2))\n    fg = '#12233b' if 0.28 < v < 0.72 else '#ffffff'\n    return (f'<td style=\"background:rgb({r},{g},{b});color:{fg};'\n            f'padding:14px 20px;text-align:center;font:600 18px Consolas,monospace;'\n            f'border:2px solid #fff;border-radius:6px;\">{t}</td>')\n\nrows = ['<tr><th style=\"color:#5b6b80;font:600 13px sans-serif;padding:6px\">S%d</th>%s</tr>'\n        % (i, ''.join(cell(norm[i,j], grid[i,j]) for j in range(grid.shape[1])))\n        for i in range(grid.shape[0])]\nhdr = ('<tr><th></th>' + ''.join(\n        '<th style=\"color:#5b6b80;font:600 13px sans-serif;padding:6px\">A%d</th>' % j\n        for j in range(grid.shape[1])) + '</tr>')\nhtml = ('<div style=\"font:600 14px sans-serif;color:#214B8C;margin-bottom:8px\">'\n        'Class marks heatmap &mdash; blue = struggling, red = strong</div>'\n        '<table style=\"border-collapse:separate;border-spacing:0\">'\n        + hdr + ''.join(rows) + '</table>')\nprint('__HTML__' + html)", "nav": "Wrap-up"}, {"type": "content", "title": "What NumPy bought us — and what's still missing", "bullets": ["Speed: contiguous arrays instead of scattered boxed objects (the spine, made physical).", "Expressiveness: curve, mask, reduce and slice a whole gradebook with no loops.", "Vocabulary: shape, dtype, axis, broadcasting, masking — the words the rest of the course speaks.", "But our columns are still just 0, 1, 2. We think 'Quiz, Midsem, Final'. Putting NAMES on the axes is Pandas — next lecture."], "code": "import numpy as np\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\nprint('shape :', grid.shape)\nprint('dtype :', grid.dtype)\nprint('class mean per assessment:', grid.mean(axis=0))\nprint('each student total       :', grid.sum(axis=1))", "run": "import numpy as np\ngrid = np.array([[72, 68, 91],\n                 [55, 62, 40],\n                 [88, 79, 95],\n                 [30, 45, 58]])\nprint('shape :', grid.shape)\nprint('dtype :', grid.dtype)\nprint('class mean per assessment:', grid.mean(axis=0))\nprint('each student total       :', grid.sum(axis=1))", "nav": "Wrap-up"}];
const PY_LOADER = "./pyodide/pyodide.js";
const PY_INDEXURL = "./pyodide/";
const $ = s => document.querySelector(s);
let i = 0, py = null, pyReady = false, mcqDone = {};

const isFile = location.protocol === "file:";
if (isFile) $("#banner").style.display = "block";

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

// ---------- topic grouping (built once from DECK) ----------
const TOPICS = []; // {name, start, end} end exclusive
(function buildTopics(){
  let cur = null, start = 0;
  DECK.forEach((c, idx) => {
    if (c.nav !== cur) {
      if (cur !== null) TOPICS.push({name: cur, start, end: idx});
      cur = c.nav; start = idx;
    }
  });
  TOPICS.push({name: cur, start, end: DECK.length});
})();

function topicIndexForSlide(idx){
  return TOPICS.findIndex(t => idx >= t.start && idx < t.end);
}

function buildNavBar(){
  const bar = $("#navbar");
  // remove any existing segments (keep marker + tip which are always present)
  bar.querySelectorAll(".seg").forEach(n => n.remove());
  TOPICS.forEach((t, ti) => {
    const seg = document.createElement("div");
    seg.className = "seg";
    seg.style.flex = (t.end - t.start) + " 0 0";
    seg.dataset.ti = ti;
    seg.addEventListener("click", () => { i = t.start; render(); });
    seg.addEventListener("mouseenter", (e) => showTip(seg, t));
    seg.addEventListener("mouseleave", hideTip);
    bar.insertBefore(seg, $("#navmarker"));
  });
}

function showTip(seg, t){
  const tip = $("#navtip");
  tip.textContent = `${TOPICS.indexOf(t)+1}. ${t.name}  (slides ${t.start+1}\u2013${t.end})`;
  const barRect = $("#navbar").getBoundingClientRect();
  const segRect = seg.getBoundingClientRect();
  const left = segRect.left - barRect.left + segRect.width/2;
  tip.style.left = left + "px";
  tip.classList.add("show");
}
function hideTip(){ $("#navtip").classList.remove("show"); }

function renderNav(){
  const bar = $("#navbar");
  bar.querySelectorAll(".seg").forEach(seg => {
    const ti = parseInt(seg.dataset.ti);
    seg.classList.remove("past","current");
    if (ti < topicIndexForSlide(i)) seg.classList.add("past");
    if (ti === topicIndexForSlide(i)) seg.classList.add("current");
  });
  // marker position: proportional across whole bar by slide index
  const pct = (i + 0.5) / DECK.length * 100;
  $("#navmarker").style.left = `calc(${pct}% - 1px)`;

  const ti = topicIndexForSlide(i);
  const t = TOPICS[ti];
  $("#topicIdx").textContent = `${ti+1}/${TOPICS.length}`;
  $("#topicName").textContent = t.name;
  $("#slideCount").textContent = `Slide ${i+1} of ${DECK.length}`;
}

function render(){
  const c = DECK[i];
  const card = $("#card");
  let h = "";
  if(c.type==="section"){
    h += `<h1 class="sec">${esc(c.title)}</h1>`;
    if(c.subtitle) h += `<div class="sub">${esc(c.subtitle)}</div>`;
  } else if(c.type==="content"){
    h += `<h2 class="title">${esc(c.title)}</h2>`;
    if(c.bullets){h+='<ul class="b">';c.bullets.forEach(b=>h+=`<li>${esc(b)}</li>`);h+="</ul>";}
    if(c.svg) h += `<div class="svgwrap">${c.svg}</div>`;
    if(c.code) h += `<pre class="code">${esc(c.code)}</pre>`;
    h += `<div class="out" id="out"></div>`;
  } else if(c.type==="predict"){
    h += `<div><span class="chip predict">Predict</span>`;
    if(c.topic) h += `<span class="chip topic">${esc(c.topic)}</span>`;
    h += `</div><h2 class="title">${esc(c.title)}</h2>`;
    if(c.code) h += `<pre class="code">${esc(c.code)}</pre>`;
    h += `<div class="out" id="out"></div>`;
    h += `<div class="reveal" id="reveal"><div class="exp">${esc(c.expect||"")}</div>`;
    if(c.why) h += `<div class="why">${esc(c.why)}</div>`;
    h += `</div>`;
  } else if(c.type==="mcq"){
    h += `<div><span class="chip mcq">MCQ</span>`;
    if(c.topic) h += `<span class="chip topic">${esc(c.topic)}</span>`;
    h += `</div><h2 class="title">${esc(c.title)}</h2>`;
    if(c.code) h += `<pre class="code">${esc(c.code)}</pre>`;
    h += `<div class="opts" id="opts">`;
    c.options.forEach((o,k)=>{h+=`<button class="opt" data-k="${k}"><span class="k">${String.fromCharCode(65+k)}</span>${esc(o)}</button>`;});
    h += `</div>`;
    h += `<div class="reveal" id="reveal"><div class="exp">${esc(c.expect||"")}</div>`;
    if(c.why) h += `<div class="why">${esc(c.why)}</div>`;
    h += `</div>`;
  }
  card.innerHTML = h;
  if(c.type==="mcq"){
    card.querySelectorAll(".opt").forEach(b=>{
      b.addEventListener("click",()=>chooseMCQ(parseInt(b.dataset.k)));
    });
    if(mcqDone[i]!==undefined) markMCQ(mcqDone[i]);
  }
  // buttons availability
  const runnable = (c.type==="predict"||c.type==="content") && !!(c.run||c.code);
  $("#runBtn").disabled = !runnable || isFile;
  $("#revealBtn").disabled = !(c.type==="predict"||c.type==="mcq");
  $("#padBtn").disabled = isFile;
  $("#prevBtn").disabled = i===0;
  $("#nextBtn").disabled = i===DECK.length-1;
  renderNav();
  window.scrollTo({top:0, behavior:"instant"});
}

function chooseMCQ(k){ mcqDone[i]=k; markMCQ(k); }
function markMCQ(k){
  const c = DECK[i];
  const opts = $("#opts");
  if(!opts) return;
  opts.querySelectorAll(".opt").forEach(b=>{
    const bk=parseInt(b.dataset.k);
    b.classList.remove("correct","wrong");
    if(bk===c.answer) b.classList.add("correct");
    else if(bk===k) b.classList.add("wrong");
  });
  $("#reveal").classList.add("show");
}

function reveal(){
  const c = DECK[i];
  if(c.type==="predict"){ $("#reveal")?.classList.add("show"); }
  else if(c.type==="mcq"){
    const opts=$("#opts");
    opts?.querySelectorAll(".opt").forEach(b=>{
      if(parseInt(b.dataset.k)===c.answer) b.classList.add("correct");
    });
    $("#reveal")?.classList.add("show");
  }
}

function next(){ if(i<DECK.length-1){i++;render();} }
function prev(){ if(i>0){i--;render();} }

async function initPy(){
  if(isFile) return;
  try{
    const s=document.createElement("script"); s.src=PY_LOADER;
    s.onload=async()=>{
      py = await loadPyodide({indexURL: PY_INDEXURL});
      try{ await py.loadPackage("numpy"); }
      catch(err){ console.error("numpy failed to load:", err);
        alert("NumPy could not load from the pyodide/ folder.\nCopy the vetted v0.26.2 files into pyodide/ as described in the README."); }
      pyReady=true;
    };
    document.head.appendChild(s);
  }catch(e){ console.error(e); }
}

async function runInto(codeStr, outEl){
  if(!pyReady){ outEl.textContent="(Python still loading\u2026 try again in a moment)"; outEl.classList.add("show"); return; }
  outEl.classList.add("show"); outEl.textContent="running\u2026";
  const wrap = `
import sys, io
_b = io.StringIO(); _old = sys.stdout; sys.stdout=_b
try:
    exec(compile(__USRC__, '<cell>', 'exec'), {})
except Exception as _e:
    print(repr(_e))
finally:
    sys.stdout=_old
_out=_b.getvalue()
`;
  try{
    py.globals.set("__USRC__", codeStr);
    await py.runPythonAsync(wrap);
    let out = py.globals.get("_out") || "";
    outEl.innerHTML="";
    const mark = out.indexOf("__HTML__");
    if(mark !== -1){
      const pre = out.slice(0, mark);
      const htmlPart = out.slice(mark + 8);
      if(pre.trim().length){ const sp=document.createElement("span"); sp.textContent=pre; outEl.appendChild(sp); }
      const box=document.createElement("div"); box.innerHTML=htmlPart; outEl.appendChild(box);
    } else if(out.length){
      const pre=document.createElement("span"); pre.textContent=out; outEl.appendChild(pre);
    } else {
      outEl.textContent="(no output)";
    }
  }catch(e){ outEl.textContent=String(e); }
}

function runCurrent(){
  const c=DECK[i];
  const outEl=$("#out"); if(!outEl) return;
  runInto(c.run||c.code||"", outEl);
}

// scratchpad
function openPad(){
  if(isFile) return;
  const c=DECK[i];
  $("#padCode").value = c.run||c.code||"# scratchpad \u2014 type any Python\n";
  $("#padOut").classList.remove("show"); $("#padOut").innerHTML="";
  $("#scrim").classList.add("show"); $("#pad").classList.add("show");
  $("#padCode").focus();
}
function closePad(){ $("#scrim").classList.remove("show"); $("#pad").classList.remove("show"); }
function runPad(){ runInto($("#padCode").value, $("#padOut")); }

document.addEventListener("keydown",e=>{
  if($("#pad").classList.contains("show")){
    if(e.key==="Escape") closePad();
    if(e.key==="Enter" && (e.ctrlKey||e.metaKey)){ e.preventDefault(); runPad(); }
    if(e.key==="Tab"){ e.preventDefault(); const t=$("#padCode"); const s=t.selectionStart,en=t.selectionEnd;
      t.value=t.value.slice(0,s)+"    "+t.value.slice(en); t.selectionStart=t.selectionEnd=s+4; }
    return;
  }
  if(e.key===" "||e.key==="ArrowRight"){ e.preventDefault(); next(); }
  else if(e.key==="ArrowLeft"){ prev(); }
  else if(e.key==="r"||e.key==="R"){ if(!$("#runBtn").disabled) runCurrent(); }
  else if(e.key==="a"||e.key==="A"){ reveal(); }
  else if(e.key==="s"||e.key==="S"){ openPad(); }
});

window.addEventListener("DOMContentLoaded",()=>{
  $("#nextBtn").addEventListener("click",next);
  $("#prevBtn").addEventListener("click",prev);
  $("#runBtn").addEventListener("click",runCurrent);
  $("#revealBtn").addEventListener("click",reveal);
  $("#padBtn").addEventListener("click",openPad);
  $("#padRun").addEventListener("click",runPad);
  $("#padClose").addEventListener("click",closePad);
  $("#scrim").addEventListener("click",closePad);
  buildNavBar();
  render(); initPy();
});
</script>
</body>
</html>
