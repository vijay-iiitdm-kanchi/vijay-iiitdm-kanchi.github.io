<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CS3006 &middot; Introduction to Data Science &middot; Pandas &mdash; Full Deck</title>
<style>
  :root{ --brand:#214B8C; --ink:#12233b; --mut:#5b6b80; --bg:#f4f7fb;
         --card:#ffffff; --line:#dbe4f0; --amber:#e8a13a; --ok:#1f7a4d;
         --code:#0d1b2a; --codebg:#f6f8fc; --violet:#5b3a9e;
         --sidebar-w:300px; }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
       background:var(--bg);color:var(--ink);}
  header{background:var(--brand);color:#fff;padding:10px 18px;display:flex;
         align-items:center;justify-content:space-between;gap:12px;
         position:sticky;top:0;z-index:15;}
  header .left{display:flex;align-items:center;gap:12px;min-width:0}
  header .t{font-weight:600;font-size:15px;letter-spacing:.2px;white-space:nowrap;
             overflow:hidden;text-overflow:ellipsis}
  header .r{font-size:12px;opacity:.9;white-space:nowrap}
  #menuBtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);
           color:#fff;border-radius:8px;padding:7px 11px;font-size:15px;cursor:pointer;
           line-height:1;flex:none}
  #menuBtn:hover{background:rgba(255,255,255,.24)}
  #banner{display:none;background:#fff4e0;color:#7a4d00;border-bottom:1px solid #f0d7a8;
          padding:8px 18px;font-size:13px;}
  #banner code{background:#fae7c4;padding:1px 6px;border-radius:4px}

  #shell{display:flex;min-height:calc(100vh - 44px)}

  /* ---- Sidebar navigation ---- */
  #sidebar{width:var(--sidebar-w);flex:none;background:#fff;border-right:1px solid var(--line);
           overflow-y:auto;position:sticky;top:44px;height:calc(100vh - 44px);
           transition:margin-left .2s ease;padding-bottom:20px;}
  #sidebar .mod{border-bottom:1px solid var(--line)}
  #sidebar .modhead{display:flex;align-items:center;justify-content:space-between;gap:8px;
                     padding:12px 14px;cursor:pointer;user-select:none;background:#f8fafd;}
  #sidebar .modhead:hover{background:#eef3fb}
  #sidebar .modhead .num{display:inline-flex;align-items:center;justify-content:center;
                          width:20px;height:20px;border-radius:50%;background:var(--brand);
                          color:#fff;font-size:11px;font-weight:700;flex:none}
  #sidebar .modhead .mt{font-size:13px;font-weight:700;color:var(--ink);line-height:1.3}
  #sidebar .modhead .cnt{font-size:11px;color:var(--mut);flex:none}
  #sidebar .modhead .car{transition:transform .15s;color:var(--mut);font-size:11px;flex:none}
  #sidebar .mod.open .modhead .car{transform:rotate(90deg)}
  #sidebar .slist{display:none;padding:4px 0 8px}
  #sidebar .mod.open .slist{display:block}
  #sidebar .sitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
                   border:0;background:transparent;padding:7px 14px 7px 18px;font-size:12.5px;
                   color:#31435e;cursor:pointer;line-height:1.35}
  #sidebar .sitem:hover{background:#f2f7ff}
  #sidebar .sitem .si{flex:none;width:15px;text-align:center;color:var(--mut);font-size:11px}
  #sidebar .sitem .st{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
                       display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  #sidebar .sitem.current{background:#e7f0ff;color:var(--brand);font-weight:700;
                           border-left:3px solid var(--brand);padding-left:15px}
  #sidebar .sitem.done .si{color:var(--ok)}
  #sidebar.collapsed{margin-left:calc(-1 * var(--sidebar-w))}

  #scrimNav{display:none;position:fixed;inset:0;background:rgba(12,24,44,.4);z-index:12}
  #scrimNav.show{display:block}

  main{flex:1;min-width:0;max-width:960px;margin:0 auto;padding:22px 18px 110px;width:100%;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
        box-shadow:0 1px 3px rgba(20,40,80,.05);padding:26px 28px;min-height:340px;}
  .chip{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;
        letter-spacing:.6px;padding:3px 10px;border-radius:999px;margin-right:8px;}
  .chip.predict{background:#e7f0ff;color:#22509a}
  .chip.mcq{background:#efe7ff;color:#5b3a9e}
  .chip.topic{background:#eef3f9;color:#48607e}
  .chip.mod{background:#fdf3e3;color:#8a5a10}
  h1.sec{font-size:30px;color:var(--brand);margin:.2em 0 .1em}
  .sub{color:var(--mut);font-size:16px;margin-top:6px;line-height:1.5}
  h2.title{font-size:22px;margin:.1em 0 .7em;color:var(--ink)}
  ul.b{margin:.2em 0 1em;padding-left:0;list-style:none}
  ul.b li{position:relative;padding:6px 0 6px 26px;line-height:1.55;font-size:16px;color:#233a55}
  ul.b li::before{content:"\25B8";color:var(--brand);position:absolute;left:6px;top:6px;font-size:14px}
  pre.code{background:var(--codebg);border:1px solid var(--line);border-radius:10px;
           padding:16px 18px;font-family:"Cascadia Code",Consolas,"Courier New",monospace;
           font-size:20px;line-height:1.5;color:var(--code);overflow:auto;white-space:pre;}
  .out{margin-top:14px;background:#0d1b2a;color:#e6f0ff;border-radius:10px;padding:14px 16px;
       font-family:Consolas,monospace;font-size:18px;white-space:pre-wrap;display:none}
  .out.show{display:block}
  .out img{max-width:100%;background:#fff;border-radius:6px;display:block}
  .svgwrap{margin:.4em 0 1em;text-align:center}
  .svgwrap svg{max-width:100%;height:auto}
  .reveal{margin-top:16px;border-left:4px solid var(--brand);background:#f2f7ff;
          border-radius:0 10px 10px 0;padding:12px 16px;display:none}
  .reveal.show{display:block}
  .reveal .exp{font-family:Consolas,monospace;font-size:18px;color:#12233b;
               white-space:pre-wrap;margin-bottom:6px}
  .reveal .why{font-size:15px;color:#3a5170;line-height:1.5}
  .opts{margin:.4em 0 0}
  .opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;
       border-radius:10px;padding:12px 14px;margin:8px 0;font-size:16px;cursor:pointer;
       transition:.12s;color:#233a55}
  .opt:hover{border-color:var(--brand);background:#f7faff}
  .opt.correct{border-color:var(--ok);background:#e9f7ef;color:#155e37;font-weight:600}
  .opt.wrong{border-color:#c94b4b;background:#fbebeb;color:#8a2b2b}
  .opt .k{display:inline-block;width:22px;font-weight:700;color:var(--brand)}
  .crumb{font-size:12.5px;color:var(--mut);margin-bottom:10px}
  .crumb b{color:var(--brand)}
  footer{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
         padding:8px 18px;display:flex;align-items:center;gap:10px;justify-content:center;
         flex-wrap:wrap;}
  .pos{font-size:12.5px;color:var(--mut);min-width:190px;text-align:center}
  .pos b{color:var(--brand)}
  button.nav{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;
             font-size:14px;font-weight:600;color:var(--brand);cursor:pointer}
  button.nav:hover{background:#f2f7ff}
  button.nav:disabled{opacity:.4;cursor:default}
  .kbd{font-size:11px;color:var(--mut);margin:0 4px}
  /* scratchpad */
  #scrim{position:fixed;inset:0;background:rgba(12,24,44,.55);display:none;z-index:20}
  #scrim.show{display:block}
  #pad{position:fixed;z-index:21;left:50%;top:50%;transform:translate(-50%,-50%);
       width:min(880px,94vw);height:min(620px,90vh);background:#fff;border-radius:14px;
       box-shadow:0 20px 60px rgba(0,0,0,.4);display:none;flex-direction:column;overflow:hidden}
  #pad.show{display:flex}
  #pad .h{background:var(--violet);color:#fff;padding:10px 16px;font-weight:600;
          display:flex;justify-content:space-between;align-items:center}
  #pad textarea{flex:1;border:0;outline:0;resize:none;padding:16px;
                font-family:Consolas,monospace;font-size:18px;line-height:1.5;color:#0d1b2a}
  #pad .bar{border-top:1px solid var(--line);padding:8px 12px;display:flex;gap:10px;align-items:center}
  #padOut{background:#0d1b2a;color:#e6f0ff;font-family:Consolas,monospace;font-size:16px;
          padding:10px 14px;max-height:180px;overflow:auto;white-space:pre-wrap;display:none}
  #padOut.show{display:block}
  #padOut img{max-width:100%;background:#fff;border-radius:6px}

  @media (max-width: 860px){
    :root{ --sidebar-w:82vw; }
    #sidebar{position:fixed;left:0;top:44px;z-index:13;box-shadow:2px 0 16px rgba(0,0,0,.18)}
    #sidebar.collapsed{margin-left:calc(-1 * var(--sidebar-w))}
    header .r{display:none}
  }
</style>
</head>

<script>
const DECK = [{"type": "section", "title": "Why pandas, if you already have NumPy?", "subtitle": "You already know the parts that make NumPy fast: one dtype per array, contiguous memory, vectorized C loops instead of Python loops. This short deck is about the one thing that setup cannot do — and how pandas adds it back without throwing any of that away.", "_m": 0, "_nav": "Setting up the problem: one shared dtype"}, {"type": "content", "title": "The wall every real dataset hits", "bullets": ["A NumPy array is fast for exactly one reason: every element shares a single dtype, packed into one contiguous block.", "Real data almost never shares one dtype. A row of student records has a name (text), a branch (category), and marks (numbers) side by side.", "Force that into one 2D ndarray and NumPy has no way to keep three dtypes in one array — it has to pick ONE dtype for everything.", "That single choice is the whole motivation for this deck: what does NumPy do when you hand it mixed types, and what does it cost you?"], "code": "import numpy as np\n\ndata = np.array([\n    [\"Asha\", \"CSE\", 88],\n    [\"Ravi\", \"ECE\", 72],\n])\nprint(data)\nprint(data.dtype)", "run": "import numpy as np\n\ndata = np.array([\n    [\"Asha\", \"CSE\", 88],\n    [\"Ravi\", \"ECE\", 72],\n])\nprint(data)\nprint('dtype:', data.dtype)", "_m": 0, "_nav": "Mixed data types break a single NumPy array"}, {"type": "predict", "title": "Predict: what happened to the marks?", "code": "import numpy as np\n\ndata = np.array([\n    [\"Asha\", \"CSE\", 88],\n    [\"Ravi\", \"ECE\", 72],\n])\n\nprint(data.dtype)\nprint(data[:, 2] + 1)", "run": "import numpy as np\n\ndata = np.array([\n    [\"Asha\", \"CSE\", 88],\n    [\"Ravi\", \"ECE\", 72],\n])\nprint('dtype:', data.dtype)\nprint('marks column:', data[:, 2], ' (still looks numeric)')\ntry:\n    print(data[:, 2] + 1)\nexcept Exception as e:\n    print('error:', type(e).__name__, '-', e)", "expect": "dtype comes back as '<U21' — UNICODE STRINGS. 88 and 72 are\nnow the strings '88' and '72', not numbers. data[:, 2] + 1\nraises a TypeError: you can't add 1 to a string.", "why": "NumPy enforces one dtype for the whole array, so when it sees text and numbers together it has to find one dtype that can represent both — and the only type that can hold \"Asha\" and 88 without losing information is a string. So it silently converts 88 to '88'. Nothing warns you at creation time; you only find out once you try to do arithmetic and it fails, or worse, once it half-works in some other way you don't notice. This is the same dtype-promotion instinct you already know from missing values forcing float64 — pandas just hits it much harder, because real tables mix types on every row.", "topic": "dtype-wall", "_m": 0, "_nav": "See NumPy silently turn numbers into text"}, {"type": "section", "title": "What pandas adds — without taking anything away", "subtitle": "Two ideas fix the problem above: let every COLUMN keep its own dtype instead of forcing the whole table to one, and give every ROW a label instead of just a position. Everything else you already know about NumPy — dtypes, views, broadcasting — keeps working exactly as it did.", "_m": 0, "_nav": "The two fixes: per-column dtypes, row labels"}, {"type": "content", "title": "Fix #1: one dtype per column, not per table", "bullets": ["A DataFrame is column-oriented: name gets its own array, branch its own, marks its own — each with the dtype that actually fits its data.", "marks never gets forced into text just because name sits next to it in the same table.", "Underneath, each of those columns is still a NumPy array (or an Arrow-backed one) — pandas didn't invent a new storage idea, it just stopped insisting on ONE array for the whole table.", "That's the direct fix for the last slide's bug: heterogeneity moves from \"impossible\" to \"the normal case\"."], "code": "import pandas as pd\n\ndf = pd.DataFrame({\n    \"name\": [\"Asha\", \"Ravi\"],\n    \"branch\": [\"CSE\", \"ECE\"],\n    \"marks\": [88, 72],\n})\nprint(df.dtypes)\nprint(df[\"marks\"] + 1)", "run": "import pandas as pd\n\ndf = pd.DataFrame({\n    \"name\": [\"Asha\", \"Ravi\"],\n    \"branch\": [\"CSE\", \"ECE\"],\n    \"marks\": [88, 72],\n})\nprint(df)\nprint()\nprint(df.dtypes)\nprint()\nprint('marks + 1, still numeric:')\nprint(df['marks'] + 1)", "_m": 0, "_nav": "Each column keeps its own dtype"}, {"type": "content", "title": "Under the hood: the BlockManager", "bullets": ["A DataFrame is NOT literally “one NumPy array per column.” An internal object called the BlockManager groups columns of the SAME dtype into one shared 2D block.", "roll and marks are both int64, so they live together in one block. gpa and attendance are both float64, so they get a second block. name doesn't match either, so it gets a block of its own.", "This is completely invisible from the outside — df[\"marks\"] still behaves like its own column — but it changes what certain operations cost underneath, as the next two slides show.", "Rule of thumb: the number of blocks in a DataFrame is roughly the number of DISTINCT dtypes among its columns."], "svg": "<svg viewBox=\"0 0 880 420\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Segoe UI,system-ui,sans-serif\">\n  <defs>\n    <marker id=\"bg\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#1f7a4d\"/></marker>\n    <marker id=\"ba\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#c9891a\"/></marker>\n    <marker id=\"bv\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#5b3a9e\"/></marker>\n  </defs>\n  <text x=\"440\" y=\"24\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#214B8C\">One DataFrame, three blocks underneath</text>\n\n  <rect x=\"20\" y=\"48\" width=\"150\" height=\"52\" rx=\"7\" fill=\"#fff\" stroke=\"#1f7a4d\" stroke-width=\"1.6\"/>\n  <text x=\"95\" y=\"70\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#1f7a4d\">roll</text>\n  <text x=\"95\" y=\"88\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#3a5170\">int64</text>\n\n  <rect x=\"180\" y=\"48\" width=\"150\" height=\"52\" rx=\"7\" fill=\"#fff\" stroke=\"#1f7a4d\" stroke-width=\"1.6\"/>\n  <text x=\"255\" y=\"70\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#1f7a4d\">marks</text>\n  <text x=\"255\" y=\"88\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#3a5170\">int64</text>\n\n  <rect x=\"340\" y=\"48\" width=\"150\" height=\"52\" rx=\"7\" fill=\"#fff\" stroke=\"#c9891a\" stroke-width=\"1.6\"/>\n  <text x=\"415\" y=\"70\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#c9891a\">gpa</text>\n  <text x=\"415\" y=\"88\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#3a5170\">float64</text>\n\n  <rect x=\"500\" y=\"48\" width=\"150\" height=\"52\" rx=\"7\" fill=\"#fff\" stroke=\"#c9891a\" stroke-width=\"1.6\"/>\n  <text x=\"575\" y=\"70\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#c9891a\">attendance</text>\n  <text x=\"575\" y=\"88\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#3a5170\">float64</text>\n\n  <rect x=\"660\" y=\"48\" width=\"150\" height=\"52\" rx=\"7\" fill=\"#fff\" stroke=\"#5b3a9e\" stroke-width=\"1.6\"/>\n  <text x=\"735\" y=\"70\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#5b3a9e\">name</text>\n  <text x=\"735\" y=\"88\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#3a5170\">str</text>\n\n  <path d=\"M95,100 L170,178\" stroke=\"#1f7a4d\" stroke-width=\"2\" marker-end=\"url(#bg)\"/>\n  <path d=\"M255,100 L200,178\" stroke=\"#1f7a4d\" stroke-width=\"2\" marker-end=\"url(#bg)\"/>\n  <path d=\"M415,100 L420,178\" stroke=\"#c9891a\" stroke-width=\"2\" marker-end=\"url(#ba)\"/>\n  <path d=\"M575,100 L490,178\" stroke=\"#c9891a\" stroke-width=\"2\" marker-end=\"url(#ba)\"/>\n  <path d=\"M735,100 L735,178\" stroke=\"#5b3a9e\" stroke-width=\"2\" marker-end=\"url(#bv)\"/>\n\n  <rect x=\"20\" y=\"186\" width=\"310\" height=\"60\" rx=\"8\" fill=\"#e9f7ef\" stroke=\"#1f7a4d\" stroke-width=\"1.8\"/>\n  <text x=\"175\" y=\"210\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#1f7a4d\">block 0 &#183; int64</text>\n  <text x=\"175\" y=\"230\" text-anchor=\"middle\" font-size=\"12\" fill=\"#3a5170\">roll, marks &#8212; 2 columns, ONE buffer</text>\n\n  <rect x=\"340\" y=\"186\" width=\"310\" height=\"60\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#c9891a\" stroke-width=\"1.8\"/>\n  <text x=\"495\" y=\"210\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#c9891a\">block 1 &#183; float64</text>\n  <text x=\"495\" y=\"230\" text-anchor=\"middle\" font-size=\"12\" fill=\"#3a5170\">gpa, attendance &#8212; 2 columns, ONE buffer</text>\n\n  <rect x=\"660\" y=\"186\" width=\"150\" height=\"60\" rx=\"8\" fill=\"#efe7ff\" stroke=\"#5b3a9e\" stroke-width=\"1.8\"/>\n  <text x=\"735\" y=\"210\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"700\" fill=\"#5b3a9e\">block 2 &#183; str</text>\n  <text x=\"735\" y=\"230\" text-anchor=\"middle\" font-size=\"12\" fill=\"#3a5170\">name &#8212; its own block</text>\n\n  <text x=\"440\" y=\"288\" text-anchor=\"middle\" font-size=\"13\" fill=\"#12233b\" font-weight=\"700\">df[\"marks\"] still looks like its own column from the outside.</text>\n  <text x=\"440\" y=\"310\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#5b6b80\">Same dtype &#8594; same shared block. A different dtype always starts a new one.</text>\n  <text x=\"440\" y=\"336\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#5b6b80\">Number of blocks = number of DISTINCT dtypes among the columns (roughly).</text>\n</svg>", "_m": 0, "_nav": "Inside a DataFrame: columns grouped into blocks"}, {"type": "predict", "topic": "blockmanager", "title": "Predict: how many blocks, and is to_numpy() free?", "code": "import pandas as pd\nimport numpy as np\n\nsame  = pd.DataFrame({\"a\": [1, 2, 3], \"b\": [4, 5, 6], \"c\": [7, 8, 9]})     # all int64\nmixed = pd.DataFrame({\"a\": [1, 2, 3], \"b\": [4.0, 5.0, 6.0]})               # int64 + float64\n\nprint(\"same  blocks:\", len(same._mgr.blocks))\nprint(\"mixed blocks:\", len(mixed._mgr.blocks))\nprint(np.shares_memory(same.to_numpy(), same._mgr.blocks[0].values))", "run": "import pandas as pd\nimport numpy as np\n\nsame  = pd.DataFrame({\"a\": [1, 2, 3], \"b\": [4, 5, 6], \"c\": [7, 8, 9]})\nmixed = pd.DataFrame({\"a\": [1, 2, 3], \"b\": [4.0, 5.0, 6.0]})\n\n# _mgr is a PRIVATE, internal attribute -- we're only peeking at it here\n# to see the mechanism. Never rely on it in real code.\nprint(\"same  dtypes:\", dict(same.dtypes), \" -> blocks:\", len(same._mgr.blocks))\nprint(\"mixed dtypes:\", dict(mixed.dtypes), \" -> blocks:\", len(mixed._mgr.blocks))\nprint()\nprint(\"same.to_numpy() shares memory with its one block :\", np.shares_memory(same.to_numpy(), same._mgr.blocks[0].values))\nprint(\"mixed.to_numpy() dtype (had to upcast + copy)     :\", mixed.to_numpy().dtype)", "expect": "same (all int64) -> exactly 1 block. same.to_numpy() shares memory\nwith it -- essentially a free view.\nmixed (int64 + float64) -> 2 blocks, even though both columns are\nnumbers. to_numpy() has to upcast everything to float64 and\nallocate a brand new array -- no shared memory.", "why": "The BlockManager groups columns by EXACT dtype match, not by “is this numeric.” int64 and float64 are different dtypes, so they get different blocks even though both hold numbers. When you ask for one unified NumPy array with to_numpy() or .values, pandas can only hand you a view when there is exactly one block to return directly. With more than one block it has to find one dtype that fits every value, upcast everything to it, and copy the results into a fresh array — the same upcast-and-copy story from earlier in this deck, just triggered by a different cause.", "_m": 0, "_nav": "Count blocks and test if to_numpy() is free"}, {"type": "content", "title": "Why grouping into blocks actually matters", "bullets": ["pandas doesn't re-consolidate every time you add a column. Assigning df[\"new\"] = ... one column at a time, 61 times, leaves 61 separate single-column blocks — even though every one of them is int64.", "Build the exact same 61 columns in ONE constructor call instead (or call .copy() on the fragmented version), and they land in a single shared block, because pandas consolidates at construction time.", "That difference is measurable, not theoretical: on this machine, to_numpy() on the fragmented version took about twice as long as on the consolidated one — same data, same shape, same dtype.", "This is exactly why a common pandas performance tip is “don't grow a DataFrame column-by-column in a loop” — it isn't about typing more, it's about leaving the BlockManager with dozens of small blocks instead of one."], "svg": "<svg viewBox=\"0 0 880 400\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Segoe UI,system-ui,sans-serif\">\n  <text x=\"440\" y=\"24\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#214B8C\">Same 61 columns, same dtype &#8212; built two different ways</text>\n\n  <g transform=\"translate(20,44)\">\n    <rect x=\"0\" y=\"0\" width=\"400\" height=\"300\" rx=\"12\" fill=\"#fdf3e3\" stroke=\"#c9891a\" stroke-width=\"1.6\"/>\n    <text x=\"200\" y=\"30\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"#8a5a10\">df[\"c0\"]=...; df[\"c1\"]=...; one at a time</text>\n    <rect x=\"30\" y=\"50\" width=\"55\" height=\"34\" fill=\"#fff\" stroke=\"#c9891a\"/>\n    <rect x=\"95\" y=\"50\" width=\"55\" height=\"34\" fill=\"#fff\" stroke=\"#c9891a\"/>\n    <rect x=\"160\" y=\"50\" width=\"55\" height=\"34\" fill=\"#fff\" stroke=\"#c9891a\"/>\n    <rect x=\"225\" y=\"50\" width=\"55\" height=\"34\" fill=\"#fff\" stroke=\"#c9891a\"/>\n    <rect x=\"290\" y=\"50\" width=\"55\" height=\"34\" fill=\"#fff\" stroke=\"#c9891a\"/>\n    <text x=\"200\" y=\"72\" text-anchor=\"middle\" font-size=\"16\" fill=\"#8a5a10\">&#8230;</text>\n    <text x=\"200\" y=\"112\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#8a5a10\">61 columns &#8594; 61 SEPARATE blocks</text>\n    <text x=\"200\" y=\"132\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#8a5a10\">(each insert just appends a new one)</text>\n    <rect x=\"30\" y=\"160\" width=\"340\" height=\"40\" rx=\"6\" fill=\"#fff\" stroke=\"#c9891a\" stroke-width=\"1.6\"/>\n    <text x=\"200\" y=\"185\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#8a5a10\">to_numpy() must gather 61 buffers</text>\n    <text x=\"200\" y=\"240\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"700\" fill=\"#8a2b2b\">&#8776; 60&#8211;67 ms</text>\n    <text x=\"200\" y=\"262\" text-anchor=\"middle\" font-size=\"12\" fill=\"#5b6b80\">measured: 500 calls, this machine</text>\n  </g>\n\n  <g transform=\"translate(460,44)\">\n    <rect x=\"0\" y=\"0\" width=\"400\" height=\"300\" rx=\"12\" fill=\"#e9f7ef\" stroke=\"#1f7a4d\" stroke-width=\"1.6\"/>\n    <text x=\"200\" y=\"30\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"#1f7a4d\">pd.DataFrame({...all 61 columns...})</text>\n    <rect x=\"30\" y=\"50\" width=\"340\" height=\"34\" fill=\"#fff\" stroke=\"#1f7a4d\" stroke-width=\"1.6\"/>\n    <text x=\"200\" y=\"72\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#1f7a4d\">ONE buffer, 61 columns wide</text>\n    <text x=\"200\" y=\"112\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#1f7a4d\">built once &#8594; consolidated automatically</text>\n    <text x=\"200\" y=\"132\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#1f7a4d\">(same effect as calling .copy())</text>\n    <rect x=\"30\" y=\"160\" width=\"340\" height=\"40\" rx=\"6\" fill=\"#fff\" stroke=\"#1f7a4d\" stroke-width=\"1.6\"/>\n    <text x=\"200\" y=\"185\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#1f7a4d\">to_numpy() just reads ONE buffer</text>\n    <text x=\"200\" y=\"240\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"700\" fill=\"#1f7a4d\">&#8776; 27&#8211;37 ms</text>\n    <text x=\"200\" y=\"262\" text-anchor=\"middle\" font-size=\"12\" fill=\"#5b6b80\">measured: 500 calls, same machine</text>\n  </g>\n\n  <text x=\"440\" y=\"380\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#5b6b80\">Roughly twice as fast, purely from HOW the same data was assembled &#8212; not what's in it.</text>\n</svg>", "_m": 0, "_nav": "Why fragmented blocks make DataFrames slower"}, {"type": "mcq", "topic": "blockmanager", "title": "Which two of these columns land in the same block?", "code": "df = pd.DataFrame({\n    \"user_id\": [1, 2, 3],       # int64\n    \"score\":   [8.5, 9.0, 7.2], # float64\n    \"age\":     [21, 22, 20],    # int64\n    \"active\":  [True, False, True],  # bool\n    \"category\": [\"A\", \"B\", \"A\"],     # str\n})", "options": ["user_id and age — both int64", "user_id and score — both “numbers”", "score and active — both compact fixed-width types", "Every column gets its own block regardless of dtype"], "answer": 0, "why": "The BlockManager groups by EXACT dtype equality, not by any looser notion of “numeric” or “small.” user_id and age are both int64, so they share a block. score is float64 — a different dtype from int64 — so it does NOT join them, even though it's also a number. active (bool) and category (str) each get their own block too. Five columns here land in four blocks: {user_id, age}, {score}, {active}, {category}.", "_m": 0, "_nav": "Spot which columns share a block"}, {"type": "content", "title": "Where this goes next", "bullets": ["The BlockManager is invisible from the DataFrame's public API — df[\"col\"] always looks like its own column — but now you know why dtype changes cascade, why to_numpy() is sometimes instant and sometimes not, and why building a DataFrame column-by-column in a loop is a performance smell.", "It also explains the “object vs str” dtype question from before: whichever dtype a column has — int64, float64, the old object, or the new str — it's still just another kind of block. pandas 2.0 even added a whole new kind, backed by PyArrow, alongside the classic NumPy ones.", "None of this changes what you type day-to-day. It changes what you should expect when something is surprisingly fast, surprisingly slow, or a surprising dtype.", "From here, the curriculum continues outward: creating Series/DataFrames, reading and writing real files, exploring a dataset, selecting and assigning data, adding and dropping columns, grouping, and merging."], "code": "import pandas as pd\n\ndf = pd.DataFrame({\"name\": [\"Asha\", \"Ravi\"], \"marks\": [88, 72]})\nprint(len(df._mgr.blocks), \"blocks for\", len(df.columns), \"columns\")", "run": "import pandas as pd\n\ndf = pd.DataFrame({\"name\": [\"Asha\", \"Ravi\"], \"marks\": [88, 72]}, index=[\"s1\", \"s2\"])\nprint(df)\nprint()\nprint(len(df._mgr.blocks), \"blocks for\", len(df.columns), \"columns — one per distinct dtype.\")", "_m": 0, "_nav": "Recap: BlockManager wrap-up and what's next"}, {"type": "section", "title": "Part 1 · The two core objects", "subtitle": "Everything in pandas is built from exactly two structures: Series and DataFrame. Get comfortable with what each one actually IS — not just how to type it — and the rest of pandas (selecting, assigning, grouping, merging) is just this idea applied over and over.", "_m": 1, "_nav": "Series and DataFrame: the two core objects"}, {"type": "content", "title": "pd.Series — values with labels attached", "bullets": ["A Series is a one-dimensional array where every value has a LABEL — its index — not just a position.", "Build one from a list (labels default to 0, 1, 2, ...) or from a dict (keys become the labels automatically).", "Four attributes describe it completely: .index (the labels), .values (the data, usually a NumPy array), .dtype (one type for the whole Series), .shape.", "Think of a Series as a single column that remembers which row is which — that memory is the entire reason pandas exists."], "svg": "<svg viewBox=\"0 0 720 320\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Segoe UI,system-ui,sans-serif\">\n  <text x=\"360\" y=\"26\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#214B8C\">pd.Series: an index column, zipped to a values column</text>\n\n  <text x=\"150\" y=\"58\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"#3a5170\">index</text>\n  <text x=\"420\" y=\"58\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"#3a5170\">values</text>\n\n  <g font-size=\"13.5\">\n    <rect x=\"60\" y=\"70\" width=\"180\" height=\"46\" rx=\"6\" fill=\"#fff\" stroke=\"#214B8C\" stroke-width=\"1.6\"/>\n    <text x=\"150\" y=\"98\" text-anchor=\"middle\" fill=\"#12233b\" font-weight=\"600\">Asha</text>\n    <rect x=\"330\" y=\"70\" width=\"180\" height=\"46\" rx=\"6\" fill=\"#e9f7ef\" stroke=\"#1f7a4d\" stroke-width=\"1.6\"/>\n    <text x=\"420\" y=\"98\" text-anchor=\"middle\" fill=\"#1f7a4d\" font-weight=\"700\">88</text>\n    <line x1=\"240\" y1=\"93\" x2=\"330\" y2=\"93\" stroke=\"#9aa9bd\" stroke-dasharray=\"4 4\"/>\n\n    <rect x=\"60\" y=\"128\" width=\"180\" height=\"46\" rx=\"6\" fill=\"#fff\" stroke=\"#214B8C\" stroke-width=\"1.6\"/>\n    <text x=\"150\" y=\"156\" text-anchor=\"middle\" fill=\"#12233b\" font-weight=\"600\">Ravi</text>\n    <rect x=\"330\" y=\"128\" width=\"180\" height=\"46\" rx=\"6\" fill=\"#e9f7ef\" stroke=\"#1f7a4d\" stroke-width=\"1.6\"/>\n    <text x=\"420\" y=\"156\" text-anchor=\"middle\" fill=\"#1f7a4d\" font-weight=\"700\">72</text>\n    <line x1=\"240\" y1=\"151\" x2=\"330\" y2=\"151\" stroke=\"#9aa9bd\" stroke-dasharray=\"4 4\"/>\n\n    <rect x=\"60\" y=\"186\" width=\"180\" height=\"46\" rx=\"6\" fill=\"#fff\" stroke=\"#214B8C\" stroke-width=\"1.6\"/>\n    <text x=\"150\" y=\"214\" text-anchor=\"middle\" fill=\"#12233b\" font-weight=\"600\">Meera</text>\n    <rect x=\"330\" y=\"186\" width=\"180\" height=\"46\" rx=\"6\" fill=\"#e9f7ef\" stroke=\"#1f7a4d\" stroke-width=\"1.6\"/>\n    <text x=\"420\" y=\"214\" text-anchor=\"middle\" fill=\"#1f7a4d\" font-weight=\"700\">95</text>\n    <line x1=\"240\" y1=\"209\" x2=\"330\" y2=\"209\" stroke=\"#9aa9bd\" stroke-dasharray=\"4 4\"/>\n  </g>\n\n  <rect x=\"560\" y=\"70\" width=\"130\" height=\"162\" rx=\"8\" fill=\"#eef3f9\" stroke=\"#48607e\" stroke-width=\"1.3\"/>\n  <text x=\"625\" y=\"96\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#48607e\">one Series</text>\n  <text x=\"625\" y=\"118\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#3a5170\">dtype: int64</text>\n  <text x=\"625\" y=\"138\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#3a5170\">shape: (3,)</text>\n  <text x=\"625\" y=\"158\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#3a5170\">3 labels,</text>\n  <text x=\"625\" y=\"176\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#3a5170\">3 values,</text>\n  <text x=\"625\" y=\"194\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#3a5170\">zipped</text>\n  <text x=\"625\" y=\"212\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#3a5170\">together</text>\n\n  <text x=\"360\" y=\"292\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#5b6b80\">s.index &#8594; ['Asha','Ravi','Meera']      s.values &#8594; [88, 72, 95]</text>\n</svg>", "code": "import pandas as pd\n\nmarks = pd.Series([88, 72, 95], index=[\"Asha\", \"Ravi\", \"Meera\"])\nprint(marks)\nprint(marks.index.tolist(), marks.values, marks.dtype, marks.shape)", "run": "import pandas as pd\n\nmarks = pd.Series([88, 72, 95], index=[\"Asha\", \"Ravi\", \"Meera\"])\nprint(marks)\nprint()\nprint('index :', marks.index.tolist())\nprint('values:', marks.values)\nprint('dtype :', marks.dtype)\nprint('shape :', marks.shape)", "_m": 1, "_nav": "A Series is values with a label attached"}, {"type": "content", "title": "pd.DataFrame — several Series, one shared index", "bullets": ["A DataFrame is a dict-like collection of Series that all line up against the SAME index — row 2 of every column refers to the same real-world thing.", "Each column keeps its own dtype (name can be text while price is a number), but every column has the identical set of row labels.", ".shape, .columns, .dtypes, .index describe a DataFrame the same way the four Series attributes did — just one dimension bigger.", "df['price'] pulls out ONE of those Series. That column is not a copy of the concept — it IS a Series, with the DataFrame's index attached."], "svg": "<svg viewBox=\"0 0 780 300\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Segoe UI,system-ui,sans-serif\">\n  <text x=\"390\" y=\"24\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#214B8C\">Three Series, one shared index running through all of them</text>\n\n  <text x=\"90\" y=\"56\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#3a5170\">index</text>\n  <text x=\"250\" y=\"56\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#214B8C\">name</text>\n  <text x=\"440\" y=\"56\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#1f7a4d\">price</text>\n  <text x=\"630\" y=\"56\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#5b3a9e\">in_stock</text>\n\n  <g font-size=\"13\">\n    <!-- row 0 -->\n    <rect x=\"30\" y=\"68\" width=\"120\" height=\"40\" rx=\"5\" fill=\"#eef3f9\" stroke=\"#48607e\" stroke-width=\"1.3\"/>\n    <text x=\"90\" y=\"93\" text-anchor=\"middle\" fill=\"#48607e\" font-weight=\"700\">0</text>\n    <rect x=\"170\" y=\"68\" width=\"160\" height=\"40\" rx=\"5\" fill=\"#fff\" stroke=\"#214B8C\" stroke-width=\"1.4\"/>\n    <text x=\"250\" y=\"93\" text-anchor=\"middle\" fill=\"#12233b\">Notebook</text>\n    <rect x=\"360\" y=\"68\" width=\"160\" height=\"40\" rx=\"5\" fill=\"#fff\" stroke=\"#1f7a4d\" stroke-width=\"1.4\"/>\n    <text x=\"440\" y=\"93\" text-anchor=\"middle\" fill=\"#12233b\">40</text>\n    <rect x=\"550\" y=\"68\" width=\"160\" height=\"40\" rx=\"5\" fill=\"#fff\" stroke=\"#5b3a9e\" stroke-width=\"1.4\"/>\n    <text x=\"630\" y=\"93\" text-anchor=\"middle\" fill=\"#12233b\">True</text>\n\n    <!-- row 1 -->\n    <rect x=\"30\" y=\"118\" width=\"120\" height=\"40\" rx=\"5\" fill=\"#eef3f9\" stroke=\"#48607e\" stroke-width=\"1.3\"/>\n    <text x=\"90\" y=\"143\" text-anchor=\"middle\" fill=\"#48607e\" font-weight=\"700\">1</text>\n    <rect x=\"170\" y=\"118\" width=\"160\" height=\"40\" rx=\"5\" fill=\"#fff\" stroke=\"#214B8C\" stroke-width=\"1.4\"/>\n    <text x=\"250\" y=\"143\" text-anchor=\"middle\" fill=\"#12233b\">Pen</text>\n    <rect x=\"360\" y=\"118\" width=\"160\" height=\"40\" rx=\"5\" fill=\"#fff\" stroke=\"#1f7a4d\" stroke-width=\"1.4\"/>\n    <text x=\"440\" y=\"143\" text-anchor=\"middle\" fill=\"#12233b\">10</text>\n    <rect x=\"550\" y=\"118\" width=\"160\" height=\"40\" rx=\"5\" fill=\"#fff\" stroke=\"#5b3a9e\" stroke-width=\"1.4\"/>\n    <text x=\"630\" y=\"143\" text-anchor=\"middle\" fill=\"#12233b\">True</text>\n\n    <!-- row 2 -->\n    <rect x=\"30\" y=\"168\" width=\"120\" height=\"40\" rx=\"5\" fill=\"#eef3f9\" stroke=\"#48607e\" stroke-width=\"1.3\"/>\n    <text x=\"90\" y=\"193\" text-anchor=\"middle\" fill=\"#48607e\" font-weight=\"700\">2</text>\n    <rect x=\"170\" y=\"168\" width=\"160\" height=\"40\" rx=\"5\" fill=\"#fff\" stroke=\"#214B8C\" stroke-width=\"1.4\"/>\n    <text x=\"250\" y=\"193\" text-anchor=\"middle\" fill=\"#12233b\">Eraser</text>\n    <rect x=\"360\" y=\"168\" width=\"160\" height=\"40\" rx=\"5\" fill=\"#fff\" stroke=\"#1f7a4d\" stroke-width=\"1.4\"/>\n    <text x=\"440\" y=\"193\" text-anchor=\"middle\" fill=\"#12233b\">5</text>\n    <rect x=\"550\" y=\"168\" width=\"160\" height=\"40\" rx=\"5\" fill=\"#fff\" stroke=\"#5b3a9e\" stroke-width=\"1.4\"/>\n    <text x=\"630\" y=\"193\" text-anchor=\"middle\" fill=\"#12233b\">False</text>\n  </g>\n\n  <line x1=\"30\" y1=\"88\" x2=\"710\" y2=\"88\" stroke=\"#b9c9dc\" stroke-dasharray=\"3 5\"/>\n  <line x1=\"30\" y1=\"138\" x2=\"710\" y2=\"138\" stroke=\"#b9c9dc\" stroke-dasharray=\"3 5\"/>\n  <line x1=\"30\" y1=\"188\" x2=\"710\" y2=\"188\" stroke=\"#b9c9dc\" stroke-dasharray=\"3 5\"/>\n\n  <text x=\"390\" y=\"240\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#12233b\">df[\"price\"] pulls out just the middle column — as a Series, index and all.</text>\n  <text x=\"390\" y=\"264\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#5b6b80\">Row 2 means \"Eraser\" in every column, because all three columns share index label 2.</text>\n</svg>", "code": "import pandas as pd\n\nproducts = pd.DataFrame({\n    \"name\": [\"Notebook\", \"Pen\", \"Eraser\"],\n    \"price\": [40, 10, 5],\n    \"in_stock\": [True, True, False],\n})\nprint(products)\nprint(products.dtypes)", "run": "import pandas as pd\n\nproducts = pd.DataFrame({\n    \"name\": [\"Notebook\", \"Pen\", \"Eraser\"],\n    \"price\": [40, 10, 5],\n    \"in_stock\": [True, True, False],\n})\nprint(products)\nprint()\nprint(products.dtypes)\nprint()\nprint('products[\\'price\\'] is a:', type(products['price']).__name__)\nprint(products['price'])", "_m": 1, "_nav": "A DataFrame is Series sharing one index"}, {"type": "predict", "title": "Predict: what index do you get if you never give one?", "code": "import pandas as pd\n\ns = pd.Series([10, 20, 30])\nprint(s.index)\n\ndf = pd.DataFrame({\"a\": [1, 2], \"b\": [3, 4]})\nprint(df.index)", "run": "import pandas as pd\n\ns = pd.Series([10, 20, 30])\nprint('Series index:', s.index)\nprint()\ndf = pd.DataFrame({\"a\": [1, 2], \"b\": [3, 4]})\nprint('DataFrame index:', df.index)\nprint()\nprint('it is a real object, not just a range() -- it can still be sliced, compared, reused:')\nprint(list(s.index))", "expect": "Both print RangeIndex(start=0, stop=3, step=1) and\nRangeIndex(start=0, stop=2, step=1) — pandas quietly hands you\ninteger labels 0, 1, 2, ... when you don't supply your own.", "why": "A RangeIndex isn't a shortcut or a placeholder — it's a fully real Index object, just one that happens to hold consecutive integers. That matters in Part 3: .loc looks up LABELS, and when nobody set custom labels, the labels simply happen to equal the positions, which is exactly why .loc and .iloc so often look interchangeable on a freshly built DataFrame — and exactly why they stop agreeing the moment you sort, filter, or set a custom index.", "topic": "index", "_m": 1, "_nav": "What index appears if you don't set one"}, {"type": "mcq", "title": "A DataFrame column, once selected, is fundamentally a…", "code": "col = products[\"price\"]\n\n# what kind of object is col?", "options": ["Series", "one-dimensional NumPy array", "Python list", "a read-only view with no type of its own"], "answer": 0, "expect": "Series", "why": "products['price'] returns an actual pd.Series — with its own .index, .values, and .dtype — not a plain NumPy array or list. A Series happens to keep its data in a NumPy array underneath (as you saw in the earlier NumPy-to-pandas deck), but the object you're holding, the one with methods like .mean() and .value_counts(), is a Series.", "topic": "structures", "_m": 1, "_nav": "Identify what a selected column really is"}, {"type": "section", "title": "Part 2 · Building a DataFrame, four ways", "subtitle": "The same table can come from a dict, a NumPy array, a list of records, or a file. Each path makes a different assumption about your data, and each one can surprise you in its own particular way.", "_m": 1, "_nav": "Four ways to build the same DataFrame"}, {"type": "content", "title": "From a dictionary of lists — the everyday case", "bullets": ["Each key becomes a column name; each list becomes that column's values, top to bottom.", "Every list must be the same length — pandas will raise ValueError otherwise, rather than pad or guess.", "Column order follows dict insertion order (guaranteed since Python 3.7) — so the order you write the keys is the order you'll see the columns.", "This is the constructor you'll reach for most, because it's the shape data naturally has in memory: a handful of parallel lists."], "code": "import pandas as pd\n\nproducts = pd.DataFrame({\n    \"name\": [\"Notebook\", \"Pen\", \"Eraser\", \"Stapler\"],\n    \"price\": [40, 10, 5, 60],\n    \"in_stock\": [True, True, False, True],\n})\nprint(products)", "run": "import pandas as pd\n\nproducts = pd.DataFrame({\n    \"name\": [\"Notebook\", \"Pen\", \"Eraser\", \"Stapler\"],\n    \"price\": [40, 10, 5, 60],\n    \"in_stock\": [True, True, False, True],\n})\nprint(products)\nprint()\nprint(products.dtypes)\nprint()\ntry:\n    pd.DataFrame({\"a\": [1, 2, 3], \"b\": [1, 2]})\nexcept ValueError as e:\n    print('mismatched lengths ->', type(e).__name__ + ':', e)", "_m": 1, "_nav": "Building a DataFrame from a dict of lists"}, {"type": "content", "title": "From a NumPy array — you name the columns yourself", "bullets": ["pd.DataFrame(array, columns=[...], index=[...]) wraps a 2D array; without columns=, you get default integer column names 0, 1, 2, ....", "Because the SOURCE array is one dtype for the whole block, every resulting column starts out with that same dtype — wrapping it in a DataFrame doesn't retroactively split it into different types per column.", "This connects straight back to the BlockManager: a DataFrame built this way from one homogeneous array is already sitting in exactly one block, before you've touched anything.", "Useful whenever the numeric heavy-lifting already happened in NumPy and you now want row/column LABELS on top of the result."], "code": "import pandas as pd\nimport numpy as np\n\nscores = np.array([[85, 90, 78],\n                    [72, 88, 95]])\ndf = pd.DataFrame(scores, columns=[\"quiz1\", \"quiz2\", \"quiz3\"], index=[\"Asha\", \"Ravi\"])\nprint(df)\nprint(df.dtypes)", "run": "import pandas as pd\nimport numpy as np\n\nscores = np.array([[85, 90, 78],\n                    [72, 88, 95]])\ndf = pd.DataFrame(scores, columns=[\"quiz1\", \"quiz2\", \"quiz3\"], index=[\"Asha\", \"Ravi\"])\nprint(df)\nprint()\nprint(df.dtypes)\nprint()\nprint('blocks under the hood:', len(df._mgr.blocks), '(one homogeneous source array -> one block)')", "_m": 1, "_nav": "Building a DataFrame from a NumPy array"}, {"type": "predict", "title": "Predict: a list of dicts where one record is missing a key", "code": "import pandas as pd\n\nrecords = [\n    {\"name\": \"Notebook\", \"price\": 40},\n    {\"name\": \"Pen\", \"price\": 10, \"in_stock\": True},\n    {\"name\": \"Eraser\", \"price\": 5, \"in_stock\": False},\n]\ndf = pd.DataFrame(records)\nprint(df)\nprint(df.dtypes)", "run": "import pandas as pd\n\nrecords = [\n    {\"name\": \"Notebook\", \"price\": 40},\n    {\"name\": \"Pen\", \"price\": 10, \"in_stock\": True},\n    {\"name\": \"Eraser\", \"price\": 5, \"in_stock\": False},\n]\ndf = pd.DataFrame(records)\nprint(df)\nprint()\nprint(df.dtypes)", "expect": "The Notebook row gets in_stock = NaN, not an error and not a\nblank string. And the WHOLE in_stock column becomes dtype\nobject — even though every value that IS present is a clean\nTrue/False.", "why": "pd.DataFrame(list_of_dicts) unions the keys across every record to decide the full set of columns, then fills any record that's missing a key with NaN. This is the exact same instinct you've now seen three times: a missing value forces a dtype change, because there's no native NaN that fits neatly into a boolean column the way there's a float64 NaN for numbers. Practically: this constructor is forgiving about uneven records, but always check .dtypes afterward — an accidental object column hiding among your booleans is easy to miss.", "topic": "construction", "svg": "<svg viewBox=\"0 0 820 300\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Segoe UI,system-ui,sans-serif\">\n  <text x=\"410\" y=\"24\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#214B8C\">pandas unions the keys, then fills the gaps with NaN</text>\n\n  <rect x=\"20\" y=\"46\" width=\"220\" height=\"70\" rx=\"8\" fill=\"#fff\" stroke=\"#48607e\" stroke-width=\"1.4\"/>\n  <text x=\"130\" y=\"68\" text-anchor=\"middle\" font-size=\"12\" fill=\"#3a5170\">record 0</text>\n  <text x=\"130\" y=\"88\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#12233b\">name, price</text>\n  <text x=\"130\" y=\"106\" text-anchor=\"middle\" font-size=\"11\" fill=\"#8a5a10\">(no in_stock key)</text>\n\n  <rect x=\"300\" y=\"46\" width=\"220\" height=\"70\" rx=\"8\" fill=\"#fff\" stroke=\"#48607e\" stroke-width=\"1.4\"/>\n  <text x=\"410\" y=\"68\" text-anchor=\"middle\" font-size=\"12\" fill=\"#3a5170\">record 1</text>\n  <text x=\"410\" y=\"88\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#12233b\">name, price, in_stock</text>\n\n  <rect x=\"580\" y=\"46\" width=\"220\" height=\"70\" rx=\"8\" fill=\"#fff\" stroke=\"#48607e\" stroke-width=\"1.4\"/>\n  <text x=\"690\" y=\"68\" text-anchor=\"middle\" font-size=\"12\" fill=\"#3a5170\">record 2</text>\n  <text x=\"690\" y=\"88\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#12233b\">name, price, in_stock</text>\n\n  <path d=\"M130,116 L280,168\" stroke=\"#48607e\" stroke-width=\"1.6\" fill=\"none\"/>\n  <path d=\"M410,116 L410,168\" stroke=\"#48607e\" stroke-width=\"1.6\" fill=\"none\"/>\n  <path d=\"M690,116 L540,168\" stroke=\"#48607e\" stroke-width=\"1.6\" fill=\"none\"/>\n\n  <rect x=\"120\" y=\"172\" width=\"600\" height=\"94\" rx=\"8\" fill=\"#fdf3e3\" stroke=\"#c9891a\" stroke-width=\"1.6\"/>\n  <text x=\"420\" y=\"196\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"#8a5a10\">union of columns: name, price, in_stock</text>\n  <text x=\"270\" y=\"228\" text-anchor=\"middle\" font-size=\"13\" fill=\"#12233b\">Notebook, 40,</text>\n  <rect x=\"345\" y=\"212\" width=\"70\" height=\"26\" rx=\"4\" fill=\"#fff\" stroke=\"#8a2b2b\" stroke-width=\"1.4\"/>\n  <text x=\"380\" y=\"230\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"#8a2b2b\">NaN</text>\n  <text x=\"420\" y=\"256\" text-anchor=\"middle\" font-size=\"12\" fill=\"#8a5a10\">whole in_stock column &#8594; dtype object (True / False / NaN mixed)</text>\n</svg>", "_m": 1, "_nav": "A list of dicts with one missing key"}, {"type": "content", "title": "From a CSV — the same shape, arriving as text", "bullets": ["pd.read_csv(path) is the same operation as the dict constructor, except pandas has to first GUESS every column's dtype from plain text.", "This page has no real filesystem, so io.StringIO stands in for a file below; the reading code is identical to a real .csv on disk.", "Always check .dtypes right after reading — a stray blank cell in what looks like a whole-number column is invisible until you look.", "One constructor, one mental model: dict of lists, NumPy array, list of dicts, or CSV all end up as the exact same kind of object once they're loaded."], "code": "import pandas as pd\nfrom io import StringIO\n\ncsv_text = \"\"\"name,price,in_stock\nNotebook,40,True\nPen,10,True\n\"\"\"\ndf = pd.read_csv(StringIO(csv_text))\nprint(df)\nprint(df.dtypes)", "run": "import pandas as pd\nfrom io import StringIO\n\ncsv_text = \"\"\"name,price,in_stock\nNotebook,40,True\nPen,10,True\n\"\"\"\ndf = pd.read_csv(StringIO(csv_text))\nprint(df)\nprint()\nprint(df.dtypes)", "_m": 1, "_nav": "Reading a CSV: same shape, guessed dtypes"}, {"type": "mcq", "title": "Which constructor call raises an error rather than silently filling a gap?", "code": "# option A\npd.DataFrame({\"a\": [1, 2, 3], \"b\": [4, 5]})\n\n# option B\npd.DataFrame([{\"a\": 1, \"b\": 2}, {\"a\": 3}])", "options": ["Option A — mismatched list lengths in a dict of lists", "Option B — a missing key in a list of dicts", "Both raise an error", "Neither raises an error"], "answer": 0, "expect": "Option A — mismatched list lengths in a dict of lists", "why": "A dict of lists makes a strict promise: every list is a full column, so pandas has no way to guess which rows a shorter list's values belong to, and raises ValueError. A list of dicts makes a looser, per-record promise instead — each dict is independent, so a missing key just becomes NaN for that one record. Same underlying idea (uneven input), two different constructors, two different reactions.", "topic": "construction", "_m": 1, "_nav": "Which constructor errors instead of filling a gap"}, {"type": "section", "title": "Part 3 · Selection, slicing, and assignment", "subtitle": "Reading a value and writing one back use the exact same selectors. Most of pandas' reputation for 'gotchas' comes from one part of this story: reading is forgiving, writing is not.", "_m": 1, "_nav": "Selecting, slicing, and assigning values"}, {"type": "content", "title": ".loc (labels) vs .iloc (positions)", "bullets": ["df.loc[label] selects by the index LABEL. df.iloc[position] selects by integer POSITION, exactly like a plain Python list, regardless of what the labels actually are.", "Both take a second argument for columns: df.loc[row, col] or df.iloc[row_pos, col_pos].", "df.at[row, col] / df.iat[row, col] fetch a single scalar — the same idea as .loc/.iloc, just faster for exactly one value.", "Rule of thumb: reach for .loc when you're thinking in names (\"the Eraser row\"), .iloc when you're thinking in position (\"the third row, whatever it's called\")."], "code": "import pandas as pd\n\nproducts = pd.DataFrame({\"price\": [40, 10, 5, 60]}, index=[\"a\", \"b\", \"c\", \"d\"])\nprint(products.loc[\"c\"])\nprint(products.iloc[2])", "run": "import pandas as pd\n\nproducts = pd.DataFrame({\"price\": [40, 10, 5, 60]}, index=[\"a\", \"b\", \"c\", \"d\"])\nprint('loc[\\'c\\'] :'); print(products.loc['c'])\nprint()\nprint('iloc[2]   :'); print(products.iloc[2])\nprint()\nprint('at        :', products.at['c', 'price'], '   iat:', products.iat[2, 0])", "_m": 1, "_nav": ".loc by label vs .iloc by position"}, {"type": "predict", "title": "Predict: does .loc's slice end include the last label?", "code": "import pandas as pd\n\nproducts = pd.DataFrame({\"price\": [40, 10, 5, 60]}, index=[\"a\", \"b\", \"c\", \"d\"])\n\nprint(products.loc[\"a\":\"c\"])\nprint(products.iloc[0:2])", "run": "import pandas as pd\n\nproducts = pd.DataFrame({\"price\": [40, 10, 5, 60]}, index=[\"a\", \"b\", \"c\", \"d\"])\nprint('loc[\\'a\\':\\'c\\']  ->'); print(products.loc['a':'c'])\nprint('rows:', len(products.loc['a':'c']))\nprint()\nprint('iloc[0:2]      ->'); print(products.iloc[0:2])\nprint('rows:', len(products.iloc[0:2]))", "expect": "products.loc['a':'c'] returns THREE rows — a, b, AND c.\nproducts.iloc[0:2] returns TWO rows — c is excluded, exactly like\na normal Python list slice.", "why": "Every slice you've written elsewhere in Python — lists, strings, NumPy arrays, .iloc itself — excludes the stop value. .loc is the one deliberate exception: because labels aren't necessarily consecutive integers, \"up to but not including c\" is a much harder promise to keep than \"up to and including c\", so pandas chose the inclusive rule specifically for labels. Reaching for .iloc out of habit here is a common source of one-row-short bugs.", "topic": "indexing", "_m": 1, "_nav": "Does .loc's slice include the last label?"}, {"type": "predict", "title": "Predict: df['price'] vs df[['price']] — same numbers, different TYPE", "code": "import pandas as pd\n\nproducts = pd.DataFrame({\"name\": [\"Notebook\", \"Pen\"], \"price\": [40, 10]})\n\na = products[\"price\"]\nb = products[[\"price\"]]\nprint(type(a), type(b))\nprint(a.shape, b.shape)", "run": "import pandas as pd\n\nproducts = pd.DataFrame({\"name\": [\"Notebook\", \"Pen\"], \"price\": [40, 10]})\na = products['price']\nb = products[['price']]\nprint('single bracket ->', type(a).__name__, ' shape:', a.shape)\nprint(a)\nprint()\nprint('double bracket ->', type(b).__name__, ' shape:', b.shape)\nprint(b)", "expect": "a is a Series with shape (2,). b is a DataFrame with shape (2, 1)\n— same underlying numbers, one fewer or one more dimension.", "why": "A single label collapses a dimension, exactly like NumPy's a[0] versus a[0:1]: df['price'] asks for ONE column by name and hands back a 1D Series. df[['price']] asks for a LIST of column names — even a list of length one — and a list of labels always keeps you at 2D, returning a DataFrame. This is worth internalizing because the two look almost identical to type but behave very differently: a Series has no .columns, and plotting/merging code often expects one or the other specifically.", "topic": "selection", "_m": 1, "_nav": "df['col'] vs df[['col']]: same data, different type"}, {"type": "content", "title": "Boolean indexing and conditional assignment", "bullets": ["df[condition] keeps only the rows where condition (a boolean Series) is True. Combine conditions with & / | / ~, each side in its own parentheses — not the plain Python and/or/not.", "df.loc[condition, 'col'] = value is the safe pattern for writing conditionally: one call, naming both the rows AND the column together.", "df['new_col'] = value (no condition) broadcasts one value, or an equal-length array, to an entire new or existing column.", "The next slide is about what goes wrong the moment this one-call rule gets split into two."], "code": "products.loc[products[\"price\"] > 20, \"tier\"] = \"premium\"\nproducts.loc[products[\"price\"] <= 20, \"tier\"] = \"budget\"", "run": "import pandas as pd\n\nproducts = pd.DataFrame({\n    \"name\": [\"Notebook\", \"Pen\", \"Eraser\", \"Stapler\"],\n    \"price\": [40, 10, 5, 60],\n})\nprint(products[products['price'] > 20])\nprint()\nproducts.loc[products['price'] > 20, 'tier'] = 'premium'\nproducts.loc[products['price'] <= 20, 'tier'] = 'budget'\nprint(products)", "_m": 1, "_nav": "Filtering rows and assigning with a condition"}, {"type": "predict", "title": "The bug this causes: chained indexing", "code": "import pandas as pd\n\nproducts = pd.DataFrame({\"name\": [\"Notebook\", \"Pen\", \"Eraser\"], \"price\": [40, 10, 5]})\n\nproducts[products[\"price\"] < 20][\"price\"] = 0   # \"zero out the cheap ones\"\n\nprint(products)", "run": "import pandas as pd\nimport warnings\n\nproducts = pd.DataFrame({\"name\": [\"Notebook\", \"Pen\", \"Eraser\"], \"price\": [40, 10, 5]})\n\nwith warnings.catch_warnings(record=True) as caught:\n    warnings.simplefilter('always')\n    products[products['price'] < 20]['price'] = 0\n    for w in caught:\n        print('warning:', w.category.__name__)\n\nprint()\nprint('after the assignment, unchanged:')\nprint(products)\nprint()\nproducts.loc[products['price'] < 20, 'price'] = 0\nprint('after products.loc[cond, \\'price\\'] = 0, correct:')\nprint(products)", "expect": "Pen and Eraser still show their original prices. pandas raises a\nSettingWithCopyWarning, and the assignment has no visible effect\non products at all.", "why": "products[products['price'] < 20] is evaluated first, entirely on its own, and pandas cannot promise whether that boolean-filtered result is a view into products or an independent copy. The ['price'] = 0 then writes into THAT intermediate result — which is likely a copy about to be discarded. Two separate square-bracket operations is a read followed by a write to something that might not be products at all. The fix is always the same shape: do it as one call, df.loc[condition, 'col'] = value — exactly the pattern from the previous slide.", "topic": "chained-assignment", "_m": 1, "_nav": "The chained-indexing bug that silently fails"}, {"type": "mcq", "title": "Which one of these reliably changes the original DataFrame?", "code": "df = pd.DataFrame({\"price\": [40, 10, 5]})\n\n# which one is guaranteed to update df itself?", "options": ["df[df[\"price\"] < 20][\"price\"] = 0", "df.loc[df[\"price\"] < 20, \"price\"] = 0", "df[\"price\"][df[\"price\"] < 20] = 0", "(df[df[\"price\"] < 20])[\"price\"] = 0"], "answer": 1, "expect": "df.loc[df[\"price\"] < 20, \"price\"] = 0", "why": "Only option B is a single call — one .loc naming both the row filter and the column together, so pandas can resolve it as one write straight into df. The other three all chain two separate square-bracket lookups, exactly the SettingWithCopyWarning pattern from the previous slide: each one risks writing into a discarded intermediate object instead of df.", "topic": "chained-assignment", "_m": 1, "_nav": "Which edit actually changes the original DataFrame"}, {"type": "content", "title": "Putting Part 1–3 together", "bullets": ["A Series is values plus labels. A DataFrame is several Series that all share one set of labels — that shared index is the organizing idea behind everything else.", "However a DataFrame gets built — dict, NumPy array, list of dicts, or CSV — it ends up as exactly the same kind of object, though each path makes its own assumptions worth checking with .dtypes.", "df['col'] loses a dimension (Series); df[['col']] keeps it (DataFrame) — the same single-label-vs-list-of-labels rule governs .loc and .iloc too.", "One habit protects you from the single biggest pandas gotcha: never split a row filter and a column write across two separate square-bracket calls. Combine them into one df.loc[condition, 'col'] = value every time."], "code": "import pandas as pd\n\nproducts = pd.DataFrame({\"name\": [\"Notebook\", \"Pen\"], \"price\": [40, 10]})\nproducts.loc[products[\"price\"] < 20, \"tier\"] = \"budget\"\nprint(products)", "run": "import pandas as pd\n\nproducts = pd.DataFrame({\"name\": [\"Notebook\", \"Pen\", \"Eraser\", \"Stapler\"], \"price\": [40, 10, 5, 60]}, index=[\"a\", \"b\", \"c\", \"d\"])\nproducts.loc[products['price'] < 20, 'tier'] = 'budget'\nproducts.loc[products['price'] >= 20, 'tier'] = 'premium'\nprint(products)\nprint()\nprint('one column, as a Series:', type(products['tier']).__name__)\nprint('same column, kept 2D   :', type(products[['tier']]).__name__)", "_m": 1, "_nav": "Recap: Series, DataFrame, and selection together"}, {"type": "section", "title": "Part 1 · Getting a table in, and back out", "subtitle": "Every analysis starts the same way: a file becomes a DataFrame. This part is one small running example — an orders sheet — read in from three different formats and written back out, so you can see that it's the exact same object no matter which door it came through.", "_m": 2, "_nav": "One file, three formats, into a DataFrame"}, {"type": "content", "title": "One DataFrame, four doors in and out", "bullets": ["pd.read_csv(path) and pd.read_excel(path) and pd.read_json(path) all end at the SAME kind of object — a DataFrame — just starting from different file formats.", "df.to_csv(path) is the mirror image: the same table, written back out. Every read_* function has a matching to_* method.", "This page has no real filesystem, so io.StringIO / io.BytesIO stand in for files below — the reading code itself is identical to a real file on disk.", "The one thing that changes between formats is how much pandas has to GUESS. A CSV is plain text with no type information at all; a well-formed JSON file already carries some of it."], "svg": "<svg viewBox=\"0 0 780 300\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Segoe UI,system-ui,sans-serif\">\n  <defs>\n    <marker id=\"ia\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#1f7a4d\"/></marker>\n    <marker id=\"oa\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#c9891a\"/></marker>\n  </defs>\n  <text x=\"390\" y=\"24\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#214B8C\">Different doors in, one object inside, one door back out</text>\n\n  <rect x=\"30\" y=\"60\" width=\"140\" height=\"46\" rx=\"7\" fill=\"#fff\" stroke=\"#1f7a4d\" stroke-width=\"1.5\"/>\n  <text x=\"100\" y=\"88\" text-anchor=\"middle\" font-size=\"13\" fill=\"#1f7a4d\" font-weight=\"700\">orders.csv</text>\n  <rect x=\"30\" y=\"126\" width=\"140\" height=\"46\" rx=\"7\" fill=\"#fff\" stroke=\"#1f7a4d\" stroke-width=\"1.5\"/>\n  <text x=\"100\" y=\"154\" text-anchor=\"middle\" font-size=\"13\" fill=\"#1f7a4d\" font-weight=\"700\">orders.json</text>\n  <rect x=\"30\" y=\"192\" width=\"140\" height=\"46\" rx=\"7\" fill=\"#fff\" stroke=\"#1f7a4d\" stroke-width=\"1.5\"/>\n  <text x=\"100\" y=\"220\" text-anchor=\"middle\" font-size=\"13\" fill=\"#1f7a4d\" font-weight=\"700\">orders.xlsx</text>\n\n  <path d=\"M170,83 L300,140\" stroke=\"#1f7a4d\" stroke-width=\"1.8\" marker-end=\"url(#ia)\" fill=\"none\"/>\n  <path d=\"M170,149 L300,148\" stroke=\"#1f7a4d\" stroke-width=\"1.8\" marker-end=\"url(#ia)\" fill=\"none\"/>\n  <path d=\"M170,215 L300,156\" stroke=\"#1f7a4d\" stroke-width=\"1.8\" marker-end=\"url(#ia)\" fill=\"none\"/>\n\n  <rect x=\"310\" y=\"106\" width=\"180\" height=\"86\" rx=\"10\" fill=\"#eef3f9\" stroke=\"#214B8C\" stroke-width=\"1.8\"/>\n  <text x=\"400\" y=\"140\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"700\" fill=\"#214B8C\">pd.DataFrame</text>\n  <text x=\"400\" y=\"162\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#3a5170\">same object,</text>\n  <text x=\"400\" y=\"178\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#3a5170\">no matter the source</text>\n\n  <path d=\"M490,148 L620,148\" stroke=\"#c9891a\" stroke-width=\"1.8\" marker-end=\"url(#oa)\" fill=\"none\"/>\n  <rect x=\"630\" y=\"126\" width=\"140\" height=\"46\" rx=\"7\" fill=\"#fdf3e3\" stroke=\"#c9891a\" stroke-width=\"1.5\"/>\n  <text x=\"700\" y=\"154\" text-anchor=\"middle\" font-size=\"13\" fill=\"#8a5a10\" font-weight=\"700\">.to_csv()</text>\n\n  <text x=\"390\" y=\"268\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#5b6b80\">read_csv &#183; read_json &#183; read_excel  &#8594;  ONE DataFrame  &#8594;  to_csv (or to_json, to_excel...)</text>\n</svg>", "_m": 2, "_nav": "CSV, Excel, JSON: different doors, same DataFrame"}, {"type": "content", "title": "pd.read_csv() — the default path in", "bullets": ["Plain text, comma-separated by default. pandas infers each column's dtype from what the text looks like — no schema is stored in the file itself.", "Common arguments: sep (change the delimiter), header (which row has column names), index_col (use a column as the row index instead of a default RangeIndex).", "This is almost always the first line of an analysis script: one function call, and you have a DataFrame.", "Always run .head() and .dtypes right after reading — the next Part is entirely about that habit."], "code": "import pandas as pd\nfrom io import StringIO\n\ncsv_text = \"\"\"order_id,item,quantity,price,region\n1001,Notebook,5,40,North\n1002,Pen,10,10,South\n\"\"\"\norders = pd.read_csv(StringIO(csv_text))\nprint(orders)", "run": "import pandas as pd\nfrom io import StringIO\n\ncsv_text = \"\"\"order_id,item,quantity,price,region\n1001,Notebook,5,40,North\n1002,Pen,10,10,South\n1003,Eraser,3,5,North\n1004,Notebook,2,60,East\n1005,Stapler,7,10,South\n1006,Pen,4,5,North\n1007,Notebook,6,40,East\n1008,Eraser,8,5,South\n\"\"\"\norders = pd.read_csv(StringIO(csv_text))\nprint(orders)\nprint()\nprint(orders.dtypes)", "_m": 2, "_nav": "pd.read_csv(): the default way to load data"}, {"type": "content", "title": "pd.read_json() — same table, a different bracket style", "bullets": ["The most common shape is orient=\"records\": a list of objects, one per row, exactly like a list of dicts you'd hand to the DataFrame constructor directly.", "pd.read_json(path) and df.to_json(path) are mirror images, same as the CSV pair — you can round-trip a DataFrame through JSON and get the same table back.", "JSON keeps a little more type information than CSV (true/false, nested numbers), but pandas still applies its own inference on top once the file is parsed.", "Reach for this when your data is already coming from a web API or a JavaScript-based system — JSON is that world's CSV."], "code": "import pandas as pd\nfrom io import StringIO\n\njson_text = orders.to_json(orient=\"records\")\nback = pd.read_json(StringIO(json_text))\nprint(back)", "run": "import pandas as pd\nfrom io import StringIO\n\norders = pd.DataFrame({\n    \"order_id\": [1001, 1002, 1003],\n    \"item\": [\"Notebook\", \"Pen\", \"Eraser\"],\n    \"quantity\": [5, 10, 3],\n})\njson_text = orders.to_json(orient='records')\nprint('what a records-oriented JSON file looks like:')\nprint(json_text)\nprint()\nback = pd.read_json(StringIO(json_text))\nprint('read back in:')\nprint(back)\nprint(back.dtypes)", "_m": 2, "_nav": "pd.read_json(): the same table, different brackets"}, {"type": "content", "title": "pd.read_excel() — worth knowing, one caveat worth knowing too", "bullets": ["Same idea again: pd.read_excel(path) reads a sheet into a DataFrame; sheet_name= picks which sheet if there's more than one; df.to_excel(path) writes one back.", "Unlike CSV and JSON, pandas does NOT implement the .xlsx format itself — it delegates to a separate engine library, openpyxl by default.", "That engine is a normal Python package, not built into pandas, so it has to actually be installed / loadable wherever your code runs.", "The cell below tries a real Excel round-trip and tells you plainly which case you're in — don't worry if this particular one shows the “not available” message on a classroom laptop; that's the point of the demo, not a bug in it."], "code": "import pandas as pd\nfrom io import BytesIO\n\nbuf = BytesIO()\norders.to_excel(buf, index=False)\nbuf.seek(0)\nback = pd.read_excel(buf)\nprint(back)", "run": "import pandas as pd\nfrom io import BytesIO\n\norders = pd.DataFrame({\"item\": [\"Notebook\", \"Pen\"], \"price\": [40, 10]})\nbuf = BytesIO()\ntry:\n    orders.to_excel(buf, index=False)\n    buf.seek(0)\n    back = pd.read_excel(buf)\n    print('this environment DOES have an Excel engine installed:')\n    print(back)\nexcept ImportError as e:\n    print('this environment does NOT have an Excel engine installed:')\n    print(' ', e)\n    print()\n    print('pandas does not read/write .xlsx itself -- it hands the job to an')\n    print('engine library (openpyxl, by default). read_csv / to_csv / read_json')\n    print('never hit this, because pandas implements those formats itself,')\n    print('with no external engine required.')", "_m": 2, "_nav": "pd.read_excel(): sheets in and out, one caveat"}, {"type": "predict", "title": "The gotcha: forgetting index=False", "code": "orders.to_csv(\"orders_out.csv\")          # default: index=True\nreloaded = pd.read_csv(\"orders_out.csv\")\nprint(reloaded.columns.tolist())", "run": "import pandas as pd\nfrom io import StringIO\n\norders = pd.DataFrame({\"item\": [\"Notebook\", \"Pen\", \"Eraser\"], \"price\": [40, 10, 5]})\n\ncsv_default = orders.to_csv()               # index=True by default\nprint('first line of the file:', csv_default.splitlines()[0])\nreloaded = pd.read_csv(StringIO(csv_default))\nprint('columns after reading it back:', reloaded.columns.tolist())\nprint()\ncsv_clean = orders.to_csv(index=False)\nreloaded_clean = pd.read_csv(StringIO(csv_clean))\nprint('columns with to_csv(index=False):', reloaded_clean.columns.tolist())", "expect": "The reloaded file has an extra column called \"Unnamed: 0\" sitting\nbefore order_id — the old index, saved as a nameless column, and\nread back in as if it were real data.", "why": "to_csv() writes the DataFrame's index as an extra leading column by default, because in general that index might carry meaningful labels you'd want to keep. But a plain 0,1,2,... RangeIndex almost never carries useful information — it's just position — and read_csv has no way to know that the leading column used to be an index rather than a real column, so it happily reads it back as \"Unnamed: 0\". The fix is to be explicit both ways: to_csv(index=False) when you don't need the index saved, or index_col=0 on the read side if you do.", "topic": "io", "_m": 2, "_nav": "The gotcha: forgetting index=False on write"}, {"type": "section", "title": "Part 2 · Look before you touch", "subtitle": "The five or six seconds it takes to run these calls on a freshly loaded DataFrame catch more bugs than almost anything else in this course. Every one of them answers a specific, narrow question — know which one to reach for.", "_m": 2, "_nav": "Always inspect a table before trusting it"}, {"type": "content", "title": ".head() / .tail() — does this even look right?", "bullets": [".head(n) shows the first n rows (default 5); .tail(n) shows the last n. Both return a DataFrame, so you can chain further calls onto them.", "This is the very first thing to run after ANY read_* call — a wrong separator, a shifted header row, or a garbled encoding usually announces itself immediately here.", ".tail() specifically catches a different class of bug: a file with junk summary rows or totals appended at the very end.", "Neither one changes the DataFrame — they're just a window onto it."], "code": "orders = pd.DataFrame({\n    \"order_id\": [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008],\n    \"item\":     [\"Notebook\", \"Pen\", \"Eraser\", \"Notebook\", \"Stapler\", \"Pen\", \"Notebook\", \"Eraser\"],\n    \"quantity\": [5, 10, 3, 2, 7, 4, 6, 8],\n    \"price\":    [40, 10, 5, 60, 10, 5, 40, 5],\n    \"region\":   [\"North\", \"South\", \"North\", \"East\", \"South\", \"North\", \"East\", \"South\"],\n})\nprint(orders.head(3))\nprint(orders.tail(3))", "run": "import pandas as pd\n\norders = pd.DataFrame({\n    \"order_id\": [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008],\n    \"item\":     [\"Notebook\", \"Pen\", \"Eraser\", \"Notebook\", \"Stapler\", \"Pen\", \"Notebook\", \"Eraser\"],\n    \"quantity\": [5, 10, 3, 2, 7, 4, 6, 8],\n    \"price\":    [40, 10, 5, 60, 10, 5, 40, 5],\n    \"region\":   [\"North\", \"South\", \"North\", \"East\", \"South\", \"North\", \"East\", \"South\"],\n})\nprint(orders.head(3))\nprint()\nprint(orders.tail(3))", "_m": 2, "_nav": ".head() / .tail(): a first sanity check"}, {"type": "content", "title": ".shape, .columns, .dtypes — size and layout, no truncation", "bullets": [".shape gives (rows, columns) as a plain tuple — the fastest way to sanity-check that a file loaded the number of rows you expected.", ".columns lists the column labels in order; .dtypes lists each column's dtype in the same order, lined up one-to-one.", "These three never scroll or truncate output, unlike printing the whole DataFrame — they work exactly the same on 8 rows or 8 million.", "Checking .dtypes here is what catches the bug on the very next slide."], "code": "orders = pd.DataFrame({\n    \"order_id\": [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008],\n    \"item\":     [\"Notebook\", \"Pen\", \"Eraser\", \"Notebook\", \"Stapler\", \"Pen\", \"Notebook\", \"Eraser\"],\n    \"quantity\": [5, 10, 3, 2, 7, 4, 6, 8],\n    \"price\":    [40, 10, 5, 60, 10, 5, 40, 5],\n    \"region\":   [\"North\", \"South\", \"North\", \"East\", \"South\", \"North\", \"East\", \"South\"],\n})\nprint(orders.shape)\nprint(orders.columns.tolist())\nprint(orders.dtypes)", "run": "import pandas as pd\n\norders = pd.DataFrame({\n    \"order_id\": [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008],\n    \"item\":     [\"Notebook\", \"Pen\", \"Eraser\", \"Notebook\", \"Stapler\", \"Pen\", \"Notebook\", \"Eraser\"],\n    \"quantity\": [5, 10, 3, 2, 7, 4, 6, 8],\n    \"price\":    [40, 10, 5, 60, 10, 5, 40, 5],\n    \"region\":   [\"North\", \"South\", \"North\", \"East\", \"South\", \"North\", \"East\", \"South\"],\n})\nprint('shape  :', orders.shape)\nprint('columns:', orders.columns.tolist())\nprint(orders.dtypes)", "_m": 2, "_nav": ".shape, .columns, .dtypes: size and layout at a glance"}, {"type": "predict", "title": "Predict: one blank cell in the quantity column", "code": "csv_text = \"\"\"order_id,item,quantity\n1001,Notebook,5\n1002,Pen,\n1003,Eraser,3\n\"\"\"\norders = pd.read_csv(StringIO(csv_text))\nprint(orders)\nprint(orders[\"quantity\"].dtype)", "run": "import pandas as pd\nfrom io import StringIO\n\ncsv_text = \"\"\"order_id,item,quantity\n1001,Notebook,5\n1002,Pen,\n1003,Eraser,3\n\"\"\"\norders = pd.read_csv(StringIO(csv_text))\nprint(orders)\nprint()\nprint('quantity dtype :', orders['quantity'].dtype)\nprint('order_id dtype :', orders['order_id'].dtype, ' <- no gaps, stayed int64')", "expect": "Row 1002's quantity reads as NaN, and the WHOLE quantity column\nbecomes float64 — even though 5 and 3 are whole numbers. order_id\nhas no gaps and stays int64.", "why": "One blank cell was enough to change the dtype of an entire column, for the reason you've now seen several times: there is no integer NaN, so the moment a column needs to represent a missing value, pandas is forced to promote it to float64. This is completely silent — nothing warns you — which is exactly why checking .dtypes right after reading a file, every single time, is worth the two seconds it costs.", "topic": "missing", "_m": 2, "_nav": "One blank cell in the quantity column"}, {"type": "content", "title": ".info() — dtype and non-null count, together", "bullets": ["One call that shows every column's dtype AND how many non-null values it has — a row count lower than the total tells you immediately where the gaps are.", "Also reports the Index type and total memory usage, which matters once a DataFrame stops being 8 rows.", ".info() prints directly rather than returning something — you can't chain onto it or assign its result.", "This is usually the single most useful command to run right after .head() on an unfamiliar file."], "code": "orders = pd.DataFrame({\n    \"order_id\": [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008],\n    \"item\":     [\"Notebook\", \"Pen\", \"Eraser\", \"Notebook\", \"Stapler\", \"Pen\", \"Notebook\", \"Eraser\"],\n    \"quantity\": [5, 10, 3, 2, 7, 4, 6, 8],\n    \"price\":    [40, 10, 5, 60, 10, 5, 40, 5],\n    \"region\":   [\"North\", \"South\", \"North\", \"East\", \"South\", \"North\", \"East\", \"South\"],\n})\norders.info()", "run": "import pandas as pd\n\norders = pd.DataFrame({\n    \"order_id\": [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008],\n    \"item\":     [\"Notebook\", \"Pen\", \"Eraser\", \"Notebook\", \"Stapler\", \"Pen\", \"Notebook\", \"Eraser\"],\n    \"quantity\": [5, 10, 3, 2, 7, 4, 6, 8],\n    \"price\":    [40, 10, 5, 60, 10, 5, 40, 5],\n    \"region\":   [\"North\", \"South\", \"North\", \"East\", \"South\", \"North\", \"East\", \"South\"],\n})\norders.info()", "_m": 2, "_nav": ".info(): dtypes and non-null counts together"}, {"type": "content", "title": ".describe() — the numeric columns, summarized", "bullets": ["By default, .describe() only summarizes NUMERIC columns: count, mean, std, min, the quartiles, and max.", "Text columns are silently excluded unless you ask otherwise — pass include=\"all\" to see every column, with count / unique / top / freq filling in for text instead of mean / std.", "This is a fast way to spot an impossible value — a negative price, a quantity of zero, a max that's an obvious typo — before it corrupts a downstream calculation.", "Like .info(), it's a first-five-minutes command, not something you'd build a report around."], "code": "orders = pd.DataFrame({\n    \"order_id\": [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008],\n    \"item\":     [\"Notebook\", \"Pen\", \"Eraser\", \"Notebook\", \"Stapler\", \"Pen\", \"Notebook\", \"Eraser\"],\n    \"quantity\": [5, 10, 3, 2, 7, 4, 6, 8],\n    \"price\":    [40, 10, 5, 60, 10, 5, 40, 5],\n    \"region\":   [\"North\", \"South\", \"North\", \"East\", \"South\", \"North\", \"East\", \"South\"],\n})\nprint(orders.describe())\nprint(orders.describe(include=\"all\"))", "run": "import pandas as pd\n\norders = pd.DataFrame({\n    \"order_id\": [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008],\n    \"item\":     [\"Notebook\", \"Pen\", \"Eraser\", \"Notebook\", \"Stapler\", \"Pen\", \"Notebook\", \"Eraser\"],\n    \"quantity\": [5, 10, 3, 2, 7, 4, 6, 8],\n    \"price\":    [40, 10, 5, 60, 10, 5, 40, 5],\n    \"region\":   [\"North\", \"South\", \"North\", \"East\", \"South\", \"North\", \"East\", \"South\"],\n})\nprint('numeric columns only (the default):')\nprint(orders.describe())\nprint()\nprint('include=\"all\" -- text columns get count / unique / top / freq instead:')\nprint(orders.describe(include='all'))", "_m": 2, "_nav": ".describe(): a quick summary of numeric columns"}, {"type": "mcq", "title": "Which single call tells you the FASTEST that a column has missing values?", "code": "orders = pd.DataFrame({\"quantity\": [5, None, 3, None]})\n\n# fastest way to notice the gaps?", "options": ["orders.describe()", "orders.info()", "print(orders)", "orders.dtypes"], "answer": 1, "expect": "orders.info()", "why": ".info() lists a non-null count for every column right next to its dtype, so a count lower than the row total tells you immediately, and which column. describe() only covers numeric summary statistics by default and won't flag a text column's gaps. Printing the whole DataFrame works for four rows and stops working at four thousand. dtypes shows you the SYMPTOM (float64 where you expected int64) but not the actual count of gaps.", "topic": "inspection", "_m": 2, "_nav": "Fastest way to spot missing values"}, {"type": "section", "title": "Part 3 · From a column to one number (or a few)", "subtitle": "Inspection tells you the shape of what you loaded. This part turns individual columns into the numbers and counts you'll actually reason about — and the two gotchas here are both about what a summary quietly leaves out.", "_m": 2, "_nav": "Turning a column into a single number"}, {"type": "content", "title": ".mean() and .median() — two different “averages”", "bullets": [".mean() adds every value and divides by the count. .median() sorts the values and takes the middle one (or the average of the middle two).", "Both skip NaN by default — skipna=True is the default for every one of these summary methods, not just these two.", "Called on a whole DataFrame, both return one number PER numeric column, as a S
