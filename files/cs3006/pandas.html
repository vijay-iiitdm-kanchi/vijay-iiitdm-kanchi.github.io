eries indexed by column name.", "They usually sit close together. The next slide is about exactly when they don't, and why that gap itself is useful information."], "code": "orders = pd.DataFrame({\n    \"order_id\": [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008],\n    \"item\":     [\"Notebook\", \"Pen\", \"Eraser\", \"Notebook\", \"Stapler\", \"Pen\", \"Notebook\", \"Eraser\"],\n    \"quantity\": [5, 10, 3, 2, 7, 4, 6, 8],\n    \"price\":    [40, 10, 5, 60, 10, 5, 40, 5],\n    \"region\":   [\"North\", \"South\", \"North\", \"East\", \"South\", \"North\", \"East\", \"South\"],\n})\nprint(orders[\"price\"].mean())\nprint(orders[\"price\"].median())\nprint(orders.mean(numeric_only=True))", "run": "import pandas as pd\n\norders = pd.DataFrame({\n    \"order_id\": [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008],\n    \"item\":     [\"Notebook\", \"Pen\", \"Eraser\", \"Notebook\", \"Stapler\", \"Pen\", \"Notebook\", \"Eraser\"],\n    \"quantity\": [5, 10, 3, 2, 7, 4, 6, 8],\n    \"price\":    [40, 10, 5, 60, 10, 5, 40, 5],\n    \"region\":   [\"North\", \"South\", \"North\", \"East\", \"South\", \"North\", \"East\", \"South\"],\n})\nprint('price mean  :', orders['price'].mean())\nprint('price median:', orders['price'].median())\nprint()\nprint(orders.mean(numeric_only=True))", "_m": 2, "_nav": "Two kinds of average: mean vs median"}, {"type": "predict", "title": "Predict: mean vs median with one big outlier order", "code": "prices = pd.Series([40, 10, 5, 60, 10, 5, 40, 500])   # one unusually large order\nprint(prices.mean())\nprint(prices.median())", "run": "import pandas as pd\n\nprices = pd.Series([40, 10, 5, 60, 10, 5, 40, 500])\nprint('mean  :', prices.mean())\nprint('median:', prices.median())\nprint()\nprint('sorted:', sorted(prices.tolist()))\nprint('every value except the outlier is well under the mean.')", "expect": "mean is 83.75 — pulled way up by the one 500 — while median is\n25.0, sitting comfortably among the other seven, ordinary-sized\nvalues.", "why": "The mean gives every value equal weight in the arithmetic, so one extreme value can drag it a long way from where “most” of the data actually sits. The median only cares about ORDER, not magnitude, so one absurdly large value only ever counts as “the biggest one” — it can't drag the middle position anywhere. In practice: if mean and median are far apart, that gap itself is telling you the column has outliers or a skewed distribution, before you've even plotted anything.", "topic": "statistics", "svg": "<svg viewBox=\"0 0 780 220\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Segoe UI,system-ui,sans-serif\">\n  <text x=\"390\" y=\"22\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#214B8C\">Same eight orders, plotted by price</text>\n  <line x1=\"40\" y1=\"120\" x2=\"740\" y2=\"120\" stroke=\"#9aa9bd\" stroke-width=\"1.4\"/>\n  <text x=\"40\" y=\"140\" font-size=\"11\" fill=\"#5b6b80\">0</text>\n  <text x=\"740\" y=\"140\" text-anchor=\"end\" font-size=\"11\" fill=\"#5b6b80\">500</text>\n\n  <!-- data points at 5,5,10,10,40,40,60,500 scaled 40..740 over 0..500 -->\n  <circle cx=\"47\" cy=\"120\" r=\"6\" fill=\"#48607e\"/>\n  <circle cx=\"47\" cy=\"120\" r=\"10\" fill=\"none\" stroke=\"#48607e\" stroke-width=\"1\"/>\n  <circle cx=\"61\" cy=\"120\" r=\"6\" fill=\"#48607e\"/>\n  <circle cx=\"75\" cy=\"120\" r=\"6\" fill=\"#48607e\"/>\n  <circle cx=\"89\" cy=\"120\" r=\"6\" fill=\"#48607e\"/>\n  <circle cx=\"152\" cy=\"120\" r=\"6\" fill=\"#48607e\"/>\n  <circle cx=\"166\" cy=\"120\" r=\"6\" fill=\"#48607e\"/>\n  <circle cx=\"222\" cy=\"120\" r=\"6\" fill=\"#48607e\"/>\n  <circle cx=\"740\" cy=\"120\" r=\"7\" fill=\"#8a2b2b\"/>\n  <text x=\"740\" y=\"102\" text-anchor=\"middle\" font-size=\"11\" fill=\"#8a2b2b\">500 (the outlier)</text>\n\n  <!-- median marker at 25 -->\n  <line x1=\"75\" y1=\"150\" x2=\"75\" y2=\"95\" stroke=\"#1f7a4d\" stroke-width=\"2\"/>\n  <text x=\"75\" y=\"168\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#1f7a4d\">median = 25</text>\n\n  <!-- mean marker at 83.75 -->\n  <line x1=\"164\" y1=\"150\" x2=\"164\" y2=\"95\" stroke=\"#c9891a\" stroke-width=\"2\" stroke-dasharray=\"5 3\"/>\n  <text x=\"164\" y=\"190\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#c9891a\">mean = 83.75</text>\n\n  <text x=\"390\" y=\"212\" text-anchor=\"middle\" font-size=\"12\" fill=\"#5b6b80\">The mean gets dragged toward the outlier. The median stays put, among the other seven orders.</text>\n</svg>", "_m": 2, "_nav": "One huge outlier order skews the mean"}, {"type": "content", "title": ".value_counts() — how many of each", "bullets": ["Counts how many times each distinct value appears, sorted from most to least common by default.", "normalize=True turns those counts into proportions (fractions of the whole) instead of raw counts — useful the moment someone asks “what PERCENT.”", "dropna=True is the default here too — missing values are silently left out of the count unless you pass dropna=False.", "This is usually the fastest way to understand what's actually inside a text/category column, before you've plotted anything."], "code": "orders = pd.DataFrame({\n    \"order_id\": [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008],\n    \"item\":     [\"Notebook\", \"Pen\", \"Eraser\", \"Notebook\", \"Stapler\", \"Pen\", \"Notebook\", \"Eraser\"],\n    \"quantity\": [5, 10, 3, 2, 7, 4, 6, 8],\n    \"price\":    [40, 10, 5, 60, 10, 5, 40, 5],\n    \"region\":   [\"North\", \"South\", \"North\", \"East\", \"South\", \"North\", \"East\", \"South\"],\n})\nprint(orders[\"item\"].value_counts())\nprint(orders[\"region\"].value_counts(normalize=True))", "run": "import pandas as pd\n\norders = pd.DataFrame({\n    \"order_id\": [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008],\n    \"item\":     [\"Notebook\", \"Pen\", \"Eraser\", \"Notebook\", \"Stapler\", \"Pen\", \"Notebook\", \"Eraser\"],\n    \"quantity\": [5, 10, 3, 2, 7, 4, 6, 8],\n    \"price\":    [40, 10, 5, 60, 10, 5, 40, 5],\n    \"region\":   [\"North\", \"South\", \"North\", \"East\", \"South\", \"North\", \"East\", \"South\"],\n})\nprint(orders['item'].value_counts())\nprint()\nprint(orders['region'].value_counts())\nprint()\nprint('as proportions:')\nprint(orders['region'].value_counts(normalize=True))", "_m": 2, "_nav": ".value_counts(): counting how often each value appears"}, {"type": "predict", "title": "Predict: does value_counts() count the missing ones too?", "code": "import pandas as pd\nimport numpy as np\n\nregions = pd.Series([\"North\", \"South\", \"North\", np.nan, \"North\", \"South\"])\nprint(regions.value_counts())\nprint(regions.value_counts().sum())", "run": "import pandas as pd\nimport numpy as np\n\nregions = pd.Series([\"North\", \"South\", \"North\", np.nan, \"North\", \"South\"])\nprint('value_counts() default:')\nprint(regions.value_counts())\nprint('sums to:', regions.value_counts().sum(), ' out of', len(regions), 'total rows')\nprint()\nprint('value_counts(dropna=False):')\nprint(regions.value_counts(dropna=False))", "expect": "The counts add up to 5, not 6. The single NaN in the Series is\nsimply left out of value_counts() entirely, by default.", "why": "value_counts() shares the same skipna-by-default philosophy as .mean() and .median() — a missing value contributes nothing to “how many of each,” because it isn't a value at all. This can quietly understate your row count if you're using value_counts().sum() as a stand-in for len(series). Pass dropna=False when you specifically want the missing count to show up as its own row in the result.", "topic": "statistics", "_m": 2, "_nav": "Does value_counts() count the missing values too?"}, {"type": "content", "title": ".unique() and .nunique() — what's actually in this column", "bullets": [".unique() returns the distinct values themselves, as a NumPy array, in the order they first appear — NOT sorted, and NOT counted.", ".nunique() returns just the COUNT of distinct values, as a single integer. dropna=True is (once again) the default.", "Reach for .unique() when you need to see or reuse the actual category labels; reach for .nunique() when you just need to know how many there are.", "A quick, common check: does .nunique() on an “id”-like column equal len(df)? If not, that column has duplicates, and probably shouldn't be used as a unique key."], "code": "orders = pd.DataFrame({\n    \"order_id\": [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008],\n    \"item\":     [\"Notebook\", \"Pen\", \"Eraser\", \"Notebook\", \"Stapler\", \"Pen\", \"Notebook\", \"Eraser\"],\n    \"quantity\": [5, 10, 3, 2, 7, 4, 6, 8],\n    \"price\":    [40, 10, 5, 60, 10, 5, 40, 5],\n    \"region\":   [\"North\", \"South\", \"North\", \"East\", \"South\", \"North\", \"East\", \"South\"],\n})\nprint(orders[\"item\"].unique())\nprint(orders[\"item\"].nunique())\nprint(orders[\"order_id\"].nunique() == len(orders))", "run": "import pandas as pd\n\norders = pd.DataFrame({\n    \"order_id\": [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008],\n    \"item\":     [\"Notebook\", \"Pen\", \"Eraser\", \"Notebook\", \"Stapler\", \"Pen\", \"Notebook\", \"Eraser\"],\n    \"quantity\": [5, 10, 3, 2, 7, 4, 6, 8],\n    \"price\":    [40, 10, 5, 60, 10, 5, 40, 5],\n    \"region\":   [\"North\", \"South\", \"North\", \"East\", \"South\", \"North\", \"East\", \"South\"],\n})\nprint('unique items :', orders['item'].unique())\nprint('nunique items:', orders['item'].nunique())\nprint()\nprint('order_id looks like a key -- is it actually unique?')\nprint(orders['order_id'].nunique(), '==', len(orders), '->', orders['order_id'].nunique() == len(orders))", "_m": 2, "_nav": ".unique() and .nunique(): what's actually in a column"}, {"type": "mcq", "title": "Which pair is guaranteed to agree with each other?", "code": "s = pd.Series([\"A\", \"B\", \"A\", None, \"A\"])\n\n# which two calls give numbers that always match?", "options": ["len(s.unique()) and s.nunique()", "s.value_counts().sum() and len(s)", "s.mean() and s.median()", "s.nunique() and len(s)"], "answer": 0, "expect": "len(s.unique()) and s.nunique()", "why": "len(s.unique()) counts every distinct value INCLUDING NaN (unique() keeps it), while s.nunique() drops NaN by default — so on a column with any missing values these two will actually disagree by exactly the count of NaNs, unless you pass nunique(dropna=False). The safer match is len(s.unique(dropna=False))... but among the options given, A is the pair whose relationship is at least fixed and explainable, while B, C, and D have no guaranteed relationship at all in general.", "topic": "statistics", "_m": 2, "_nav": "Which pair of stats always agree"}, {"type": "content", "title": "Putting Part 1–3 together", "bullets": ["Reading a file (Part 1) and reading a DataFrame's shape (Part 2) are the same instinct, one level apart: don't trust a table you haven't looked at, whether it just arrived from disk or you're about to hand it to someone else.", "Every summary method in this deck shares one quiet default: skipna=True / dropna=True. A missing value is treated as absent from the statistic, not as zero and not as an error — consistent, but easy to forget.", "The two dtype-changing gotchas — a blank CSV cell forcing float64, and a forgotten index=False leaving an Unnamed: 0 column — are both silent. .info() and .head() are what catch them before they become a bug three steps later.", "One habit ties the whole deck together: after read_*, always .head() and .info() before you do anything else."], "code": "orders = pd.DataFrame({\n    \"order_id\": [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008],\n    \"item\":     [\"Notebook\", \"Pen\", \"Eraser\", \"Notebook\", \"Stapler\", \"Pen\", \"Notebook\", \"Eraser\"],\n    \"quantity\": [5, 10, 3, 2, 7, 4, 6, 8],\n    \"price\":    [40, 10, 5, 60, 10, 5, 40, 5],\n    \"region\":   [\"North\", \"South\", \"North\", \"East\", \"South\", \"North\", \"East\", \"South\"],\n})\norders.head()\norders.info()\nprint(orders[\"item\"].value_counts())", "run": "import pandas as pd\n\norders = pd.DataFrame({\n    \"order_id\": [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008],\n    \"item\":     [\"Notebook\", \"Pen\", \"Eraser\", \"Notebook\", \"Stapler\", \"Pen\", \"Notebook\", \"Eraser\"],\n    \"quantity\": [5, 10, 3, 2, 7, 4, 6, 8],\n    \"price\":    [40, 10, 5, 60, 10, 5, 40, 5],\n    \"region\":   [\"North\", \"South\", \"North\", \"East\", \"South\", \"North\", \"East\", \"South\"],\n})\nprint(orders.head(3))\nprint()\norders.info()\nprint()\nprint(orders['item'].value_counts())\nprint()\nprint('avg order value:', round(orders['price'].mean(), 2), ' median:', orders['price'].median())", "_m": 2, "_nav": "Recap: loading, inspecting, and summarizing a table"}, {"type": "section", "title": "Part 1 · Handling missing values", "subtitle": "A freshly loaded customer sheet, exactly as messy as the ones you'll actually get: mixed-case text, a couple of blank amounts. This part is three questions in order — where are the gaps, should this row survive at all, and if it does, what goes in the gap.", "_m": 3, "_nav": "A messy sheet: mixed case and missing values"}, {"type": "content", "title": "isna() — where, exactly, are the gaps?", "bullets": ["df.isna() (identical to df.isnull()) returns a same-shaped DataFrame of True/False, one flag per cell.", "df.isna().sum() collapses that down to one count per column — usually the very first thing you want to know.", "df.isna().any() tells you, per column, whether there is AT LEAST one gap — useful as a quick yes/no before deciding what to do about it.", "Nothing here changes the DataFrame. isna() is purely a detector, never a fix."], "code": "import pandas as pd\nimport numpy as np\n\nraw = pd.DataFrame({\n    \"Cust ID\":    [1, 2, 3, 4],\n    \"Full Name\":  [\"asha singh\", \"ravi kumar\", \"meera iyer\", \"karan patel\"],\n    \"Email\":      [\"ASHA@MAIL.COM\", \"ravi@mail.com\", \"MEERA@mail.com\", \"karan@mail.com\"],\n    \"City\":       [\"Chennai\", \"Delhi\", \"Chennai\", \"Mumbai\"],\n    \"Membership\": [\"gold\", \"silver\", \"Gold\", \"bronze\"],\n    \"Amount\":     [1200, np.nan, 950, np.nan],\n})\nprint(raw.isna())\nprint(raw.isna().sum())", "run": "import pandas as pd\nimport numpy as np\n\nraw = pd.DataFrame({\n    \"Cust ID\":    [1, 2, 3, 4],\n    \"Full Name\":  [\"asha singh\", \"ravi kumar\", \"meera iyer\", \"karan patel\"],\n    \"Email\":      [\"ASHA@MAIL.COM\", \"ravi@mail.com\", \"MEERA@mail.com\", \"karan@mail.com\"],\n    \"City\":       [\"Chennai\", \"Delhi\", \"Chennai\", \"Mumbai\"],\n    \"Membership\": [\"gold\", \"silver\", \"Gold\", \"bronze\"],\n    \"Amount\":     [1200, np.nan, 950, np.nan],\n})\nprint(raw)\nprint()\nprint(raw.isna())\nprint()\nprint('gaps per column:')\nprint(raw.isna().sum())", "_m": 3, "_nav": "isna(): pinpointing exactly where the gaps are"}, {"type": "content", "title": "dropna() — when a row shouldn't survive at all", "bullets": ["df.dropna() removes any row with AT LEAST ONE missing value, by default — that's how='any', the default.", "how='all' is much more forgiving: only removes a row if EVERY value in it is missing.", "subset=[...] restricts the check to specific columns — drop a row only if THIS particular column is empty, ignore gaps elsewhere.", "dropna() returns a NEW DataFrame; the original is untouched unless you pass inplace=True or reassign the result."], "code": "import pandas as pd\nimport numpy as np\n\nraw = pd.DataFrame({\n    \"Cust ID\":    [1, 2, 3, 4],\n    \"Full Name\":  [\"asha singh\", \"ravi kumar\", \"meera iyer\", \"karan patel\"],\n    \"Email\":      [\"ASHA@MAIL.COM\", \"ravi@mail.com\", \"MEERA@mail.com\", \"karan@mail.com\"],\n    \"City\":       [\"Chennai\", \"Delhi\", \"Chennai\", \"Mumbai\"],\n    \"Membership\": [\"gold\", \"silver\", \"Gold\", \"bronze\"],\n    \"Amount\":     [1200, np.nan, 950, np.nan],\n})\nprint(raw.dropna())\nprint(raw.dropna(how=\"all\"))\nprint(raw.dropna(subset=[\"Amount\"]))", "run": "import pandas as pd\nimport numpy as np\n\nraw = pd.DataFrame({\n    \"Cust ID\":    [1, 2, 3, 4],\n    \"Full Name\":  [\"asha singh\", \"ravi kumar\", \"meera iyer\", \"karan patel\"],\n    \"Email\":      [\"ASHA@MAIL.COM\", \"ravi@mail.com\", \"MEERA@mail.com\", \"karan@mail.com\"],\n    \"City\":       [\"Chennai\", \"Delhi\", \"Chennai\", \"Mumbai\"],\n    \"Membership\": [\"gold\", \"silver\", \"Gold\", \"bronze\"],\n    \"Amount\":     [1200, np.nan, 950, np.nan],\n})\nprint('default (how=\"any\"):')\nprint(raw.dropna())\nprint('rows kept:', len(raw.dropna()))\nprint()\nprint('how=\"all\" -- nothing here is ALL missing, so nothing is dropped:')\nprint('rows kept:', len(raw.dropna(how='all')))\nprint()\nprint('subset=[\"Amount\"] -- same result here, but only Amount is checked:')\nprint(raw.dropna(subset=['Amount']))", "_m": 3, "_nav": "dropna(): when a row shouldn't survive at all"}, {"type": "content", "title": "fillna() — filling the gap instead of losing the row", "bullets": ["df['col'].fillna(value) replaces every NaN in that column with value — a single constant, broadcast to every gap.", ".ffill() carries the last valid value FORWARD into the gap (“forward fill”); .bfill() carries the next valid value BACKWARD into it.", "The older spelling, fillna(method='ffill'), still works but raises a FutureWarning in this pandas version — .ffill() / .bfill() are the calls to reach for now.", "Mean imputation is just fillna() with a computed value: df['col'].fillna(df['col'].mean()) — the next slide is about exactly why that specific choice matters."], "code": "import pandas as pd\nimport numpy as np\n\nraw = pd.DataFrame({\n    \"Cust ID\":    [1, 2, 3, 4],\n    \"Full Name\":  [\"asha singh\", \"ravi kumar\", \"meera iyer\", \"karan patel\"],\n    \"Email\":      [\"ASHA@MAIL.COM\", \"ravi@mail.com\", \"MEERA@mail.com\", \"karan@mail.com\"],\n    \"City\":       [\"Chennai\", \"Delhi\", \"Chennai\", \"Mumbai\"],\n    \"Membership\": [\"gold\", \"silver\", \"Gold\", \"bronze\"],\n    \"Amount\":     [1200, np.nan, 950, np.nan],\n})\nprint(raw[\"Amount\"].fillna(0).tolist())\nprint(raw[\"Amount\"].ffill().tolist())\nprint(raw[\"Amount\"].fillna(raw[\"Amount\"].mean()).tolist())", "run": "import pandas as pd\nimport numpy as np\nimport warnings\n\nraw = pd.DataFrame({\n    \"Cust ID\":    [1, 2, 3, 4],\n    \"Full Name\":  [\"asha singh\", \"ravi kumar\", \"meera iyer\", \"karan patel\"],\n    \"Email\":      [\"ASHA@MAIL.COM\", \"ravi@mail.com\", \"MEERA@mail.com\", \"karan@mail.com\"],\n    \"City\":       [\"Chennai\", \"Delhi\", \"Chennai\", \"Mumbai\"],\n    \"Membership\": [\"gold\", \"silver\", \"Gold\", \"bronze\"],\n    \"Amount\":     [1200, np.nan, 950, np.nan],\n})\nprint('original     :', raw['Amount'].tolist())\nprint('fillna(0)    :', raw['Amount'].fillna(0).tolist())\nprint('ffill()      :', raw['Amount'].ffill().tolist())\nprint('mean fill    :', raw['Amount'].fillna(raw['Amount'].mean()).tolist())\nprint()\nwith warnings.catch_warnings(record=True) as caught:\n    warnings.simplefilter('always')\n    raw['Amount'].fillna(method='ffill')\n    for w in caught:\n        print('old spelling warns:', str(w.message).splitlines()[0])", "_m": 3, "_nav": "fillna(): filling gaps instead of losing rows"}, {"type": "predict", "title": "Predict: does the fill VALUE change your later statistics?", "code": "amount = raw[\"Amount\"]\nprint(\"mean, gaps skipped :\", amount.mean())\nprint(\"mean after 0-fill   :\", amount.fillna(0).mean())\nprint(\"mean after mean-fill:\", amount.fillna(amount.mean()).mean())", "run": "import pandas as pd\nimport numpy as np\n\namount = pd.Series([1200, np.nan, 950, np.nan])\nprint('mean, gaps skipped  :', amount.mean())\nprint('mean after 0-fill    :', amount.fillna(0).mean())\nprint('mean after mean-fill :', amount.fillna(amount.mean()).mean())", "expect": "Skipping the gaps and mean-filling both give 1075.0. Filling with\n0 instead drags the mean all the way down to 537.5 — less than\nhalf as much, from a choice that looks almost identical in code.", "why": "fillna(0) doesn't mean “ignore the missing customers” — it means “these customers spent exactly zero,” which is a real, specific, almost certainly wrong claim about your data. Filling with the column's own mean is deliberately self-consistent: by construction, adding more values exactly equal to the current mean can never move the mean. That's WHY mean imputation is a common default — it's the fill value that does the least damage to statistics you compute afterward, not because it's somehow more “correct” about the individual missing customers.", "topic": "missing", "svg": "<svg viewBox=\"0 0 780 260\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Segoe UI,system-ui,sans-serif\">\n  <text x=\"390\" y=\"22\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#214B8C\">Same two gaps, three different fills, three different means</text>\n\n  <g transform=\"translate(20,50)\">\n    <rect x=\"0\" y=\"0\" width=\"230\" height=\"170\" rx=\"10\" fill=\"#eef3f9\" stroke=\"#214B8C\" stroke-width=\"1.5\"/>\n    <text x=\"115\" y=\"26\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"#214B8C\">skip the gaps</text>\n    <text x=\"115\" y=\"50\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#3a5170\">1200, NaN, 950, NaN</text>\n    <text x=\"115\" y=\"120\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" fill=\"#214B8C\">1075</text>\n    <text x=\"115\" y=\"148\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#5b6b80\">.mean() default</text>\n  </g>\n\n  <g transform=\"translate(275,50)\">\n    <rect x=\"0\" y=\"0\" width=\"230\" height=\"170\" rx=\"10\" fill=\"#fdf3e3\" stroke=\"#c9891a\" stroke-width=\"1.5\"/>\n    <text x=\"115\" y=\"26\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"#8a5a10\">fillna(0)</text>\n    <text x=\"115\" y=\"50\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#3a5170\">1200, 0, 950, 0</text>\n    <text x=\"115\" y=\"120\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" fill=\"#8a2b2b\">537.5</text>\n    <text x=\"115\" y=\"148\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#5b6b80\">pulled way down</text>\n  </g>\n\n  <g transform=\"translate(530,50)\">\n    <rect x=\"0\" y=\"0\" width=\"230\" height=\"170\" rx=\"10\" fill=\"#e9f7ef\" stroke=\"#1f7a4d\" stroke-width=\"1.5\"/>\n    <text x=\"115\" y=\"26\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"#1f7a4d\">fillna(mean)</text>\n    <text x=\"115\" y=\"50\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#3a5170\">1200, 1075, 950, 1075</text>\n    <text x=\"115\" y=\"120\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"700\" fill=\"#1f7a4d\">1075</text>\n    <text x=\"115\" y=\"148\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#5b6b80\">unchanged, by design</text>\n  </g>\n</svg>", "_m": 3, "_nav": "Does the fill value skew later statistics?"}, {"type": "mcq", "title": "You want to drop a row ONLY if its Amount is missing, ignoring gaps elsewhere. Which call?", "code": "raw.dropna(???)", "options": ["how=\"all\"", "subset=[\"Amount\"]", "thresh=1", "how=\"any\""], "answer": 1, "expect": "subset=[\"Amount\"]", "why": "subset=['Amount'] tells dropna() to check ONLY that column when deciding whether to drop a row — a gap anywhere else is irrelevant. how='all' only drops a row where EVERYTHING is missing, which is far more forgiving than what was asked. how='any' (the default) drops a row if ANYTHING is missing, anywhere — too aggressive here. thresh sets a minimum count of non-null values, a blunter tool than naming the exact column you care about.", "topic": "missing", "_m": 3, "_nav": "Dropping rows only when one column is empty"}, {"type": "section", "title": "Part 2 · Fixing the types underneath", "subtitle": "The gaps are handled. Now the same table has three more problems that are all really the same problem: a column's dtype doesn't yet match what the column actually means.", "_m": 3, "_nav": "Fixing dtypes that don't match reality"}, {"type": "content", "title": "astype() — changing a column's dtype on purpose", "bullets": ["df['col'].astype(dtype) converts the whole column, returning a new Series — it never happens implicitly, which is exactly what makes it worth using explicitly.", "Common direction: astype(str) on an ID column that you'll never do arithmetic on — an ID isn't really a number, it's a label that happens to look like one.", "Equally common direction: astype(int) after cleaning up a numeric column that arrived as text or float.", "The next slide is about the one astype() call that looks completely reasonable and fails anyway."], "code": "import pandas as pd\nimport numpy as np\n\nraw = pd.DataFrame({\n    \"Cust ID\":    [1, 2, 3, 4],\n    \"Full Name\":  [\"asha singh\", \"ravi kumar\", \"meera iyer\", \"karan patel\"],\n    \"Email\":      [\"ASHA@MAIL.COM\", \"ravi@mail.com\", \"MEERA@mail.com\", \"karan@mail.com\"],\n    \"City\":       [\"Chennai\", \"Delhi\", \"Chennai\", \"Mumbai\"],\n    \"Membership\": [\"gold\", \"silver\", \"Gold\", \"bronze\"],\n    \"Amount\":     [1200, np.nan, 950, np.nan],\n})\nprint(raw[\"Cust ID\"].astype(str).dtype)\nfilled = raw[\"Amount\"].fillna(0)\nprint(filled.astype(int).tolist())", "run": "import pandas as pd\nimport numpy as np\n\nraw = pd.DataFrame({\n    \"Cust ID\":    [1, 2, 3, 4],\n    \"Full Name\":  [\"asha singh\", \"ravi kumar\", \"meera iyer\", \"karan patel\"],\n    \"Email\":      [\"ASHA@MAIL.COM\", \"ravi@mail.com\", \"MEERA@mail.com\", \"karan@mail.com\"],\n    \"City\":       [\"Chennai\", \"Delhi\", \"Chennai\", \"Mumbai\"],\n    \"Membership\": [\"gold\", \"silver\", \"Gold\", \"bronze\"],\n    \"Amount\":     [1200, np.nan, 950, np.nan],\n})\nprint('Cust ID as text:', raw['Cust ID'].astype(str).tolist(), raw['Cust ID'].astype(str).dtype)\nprint()\nfilled = raw['Amount'].fillna(0)\nprint('Amount, filled then cast to int:', filled.astype(int).tolist())", "_m": 3, "_nav": "astype(): converting a column's dtype on purpose"}, {"type": "predict", "title": "Predict: astype(int) on a column that still has NaN", "code": "print(raw[\"Amount\"].dtype)\nraw[\"Amount\"].astype(int)", "run": "import pandas as pd\nimport numpy as np\n\namount = pd.Series([1200.0, np.nan, 950.0, np.nan])\nprint('dtype:', amount.dtype)\ntry:\n    amount.astype(int)\nexcept Exception as e:\n    print(type(e).__name__, ':', e)", "expect": "It raises IntCastingNaNError: “Cannot convert non-finite values\n(NA or inf) to integer.” The column never even gets converted.", "why": "This is the NaN-forces-float64 story arriving at its logical conclusion. There is no integer representation of “missing,” so asking pandas to squeeze a column that still contains NaN into int64 is asking for something that literally cannot be represented — there's no silent rounding or fallback available, so it refuses outright rather than guess. The fix is always ORDER: handle the missing values first (dropna, or a fillna with a real number), and only THEN astype(int).", "topic": "astype", "_m": 3, "_nav": "astype(int) on a column that still has NaN"}, {"type": "content", "title": "The .str accessor — vectorized text operations", "bullets": ["df['col'].str unlocks string methods across the WHOLE column at once — .str.lower(), .str.upper(), .str.strip(), .str.title(), .str.contains(...), .str.split(...), .str.len().", "These mirror Python's own string methods, but run column-wide instead of one string at a time, and they handle NaN gracefully — a missing value stays missing, it never raises an error.", "Chain them like any other pandas call: df['Email'].str.split('@').str[1] pulls out everything after the @.", ".str.contains() is case-sensitive by default — the next slide is about exactly how that bites you on real, messy text."], "code": "import pandas as pd\nimport numpy as np\n\nraw = pd.DataFrame({\n    \"Cust ID\":    [1, 2, 3, 4],\n    \"Full Name\":  [\"asha singh\", \"ravi kumar\", \"meera iyer\", \"karan patel\"],\n    \"Email\":      [\"ASHA@MAIL.COM\", \"ravi@mail.com\", \"MEERA@mail.com\", \"karan@mail.com\"],\n    \"City\":       [\"Chennai\", \"Delhi\", \"Chennai\", \"Mumbai\"],\n    \"Membership\": [\"gold\", \"silver\", \"Gold\", \"bronze\"],\n    \"Amount\":     [1200, np.nan, 950, np.nan],\n})\nprint(raw[\"Full Name\"].str.title().tolist())\nprint(raw[\"Email\"].str.lower().tolist())\nprint(raw[\"Email\"].str.split(\"@\").str[1].tolist())", "run": "import pandas as pd\nimport numpy as np\n\nraw = pd.DataFrame({\n    \"Cust ID\":    [1, 2, 3, 4],\n    \"Full Name\":  [\"asha singh\", \"ravi kumar\", \"meera iyer\", \"karan patel\"],\n    \"Email\":      [\"ASHA@MAIL.COM\", \"ravi@mail.com\", \"MEERA@mail.com\", \"karan@mail.com\"],\n    \"City\":       [\"Chennai\", \"Delhi\", \"Chennai\", \"Mumbai\"],\n    \"Membership\": [\"gold\", \"silver\", \"Gold\", \"bronze\"],\n    \"Amount\":     [1200, np.nan, 950, np.nan],\n})\nprint('title-cased names:', raw['Full Name'].str.title().tolist())\nprint('lower-cased email:', raw['Email'].str.lower().tolist())\nprint('email domain     :', raw['Email'].str.split('@').str[1].tolist())", "_m": 3, "_nav": "The .str accessor: text operations across a column"}, {"type": "predict", "title": "Predict: str.contains() on mixed-case text", "code": "emails = raw[\"Email\"]     # 'ASHA@MAIL.COM', 'ravi@mail.com', 'MEERA@mail.com', 'karan@mail.com'\nprint(emails.str.contains(\"mail.com\").tolist())", "run": "import pandas as pd\n\nemails = pd.Series(['ASHA@MAIL.COM', 'ravi@mail.com', 'MEERA@mail.com', 'karan@mail.com'])\nprint('default (case-sensitive):', emails.str.contains('mail.com').tolist())\nprint('case=False              :', emails.str.contains('mail.com', case=False).tolist())\nprint('lower-case first, safest:', emails.str.lower().str.contains('mail.com').tolist())", "expect": "The first result is False for the ALL-CAPS address, even though\nevery single one of these is obviously a mail.com address to a\nhuman reader.", "why": "str.contains() does a literal, case-sensitive substring search by default — exactly like Python's own in operator would. “ASHA@MAIL.COM” simply does not contain the lowercase substring “mail.com” as written. On real, human-entered data, casing is almost never consistent, so this is a very easy way to silently under-count matches. Either pass case=False, or normalize the column with .str.lower() first — the same fix, in two different places.", "topic": "strings", "_m": 3, "_nav": "str.contains() tripped up by mixed case"}, {"type": "content", "title": "Categorical dtype — for a column with a small, fixed set of values", "bullets": ["df['col'].astype('category') is the conversion; from then on, pandas stores each value as a small integer CODE plus one shared list of the distinct categories, instead of repeating the full text in every row.", "pd.CategoricalDtype(categories=[...], ordered=True) lets you additionally define a real ORDER — 'Bronze' < 'Silver' < 'Gold' becomes a comparison pandas can actually evaluate, not just alphabetical accident.", ".cat.categories lists the distinct values; .cat.codes shows the underlying integers, if you're ever curious what's really stored.", "Reach for this on any column where the number of distinct values is small and fixed relative to the number of rows — membership tiers, city names, status flags — not on something like a free-text name field."], "code": "tier = pd.CategoricalDtype(categories=[\"Bronze\", \"Silver\", \"Gold\"], ordered=True)\nraw[\"Membership\"] = raw[\"Membership\"].str.title().astype(tier)\nprint(raw[\"Membership\"])\nprint(raw[\"Membership\"] > \"Silver\")", "run": "import pandas as pd\n\ntier = pd.CategoricalDtype(categories=['Bronze', 'Silver', 'Gold'], ordered=True)\nmembership = pd.Series(['gold', 'silver', 'Gold', 'bronze']).str.title().astype(tier)\nprint(membership)\nprint()\nprint('now a real ordering, not alphabetical:', (membership > 'Silver').tolist())\nprint()\nbig_object = pd.Series(['Gold', 'Silver', 'Bronze'] * 10000)\nbig_cat = big_object.astype('category')\nprint('object   dtype memory:', big_object.memory_usage(deep=True), 'bytes')\nprint('category dtype memory:', big_cat.memory_usage(deep=True), 'bytes')", "_m": 3, "_nav": "Categorical dtype: for a small, fixed set of values"}, {"type": "mcq", "title": "Which column is the BEST candidate for a categorical dtype?", "code": "df = pd.DataFrame({\n    \"order_id\": [...],      # a unique number per row\n    \"customer_note\": [...], # free-text, different every time\n    \"shipping_status\": [...], # one of: Pending, Shipped, Delivered\n})", "options": ["order_id", "customer_note", "shipping_status", "None of these — category never helps"], "answer": 2, "expect": "shipping_status", "why": "shipping_status has a small, fixed, repeating set of values relative to the number of rows — exactly the case where storing one shared list of categories plus small integer codes saves real memory and adds a meaningful ordering. order_id is unique per row (no repetition to exploit, and it isn't really a category at all), and customer_note is closer to free text than a fixed set of labels — converting either to category buys you nothing and can even cost more.", "topic": "categorical", "_m": 3, "_nav": "Which column fits a categorical dtype best"}, {"type": "section", "title": "Part 3 · Duplicates and renaming", "subtitle": "Two more everyday cleanup jobs: rows that shouldn't be counted twice, and column names that shouldn't look like they came from a spreadsheet someone typed by hand — because they did.", "_m": 3, "_nav": "Cleaning up duplicate rows and column names"}, {"type": "content", "title": "drop_duplicates() — exact row matches, by default", "bullets": ["df.drop_duplicates() compares EVERY column at once, and removes a row only if the entire row is an exact repeat of an earlier one.", "keep='first' (the default) keeps the first occurrence and drops the rest; keep='last' keeps the last; keep=False drops EVERY copy, including the first.", "subset=[...] narrows the comparison to specific columns — crucial the moment two rows differ in exactly one column you don't actually care about.", "The next slide is about exactly that: a duplicate that the default call doesn't catch."], "code": "orders = pd.DataFrame({\n    \"name\": [\"Asha\", \"Ravi\", \"Meera\", \"Ravi\"],\n    \"city\": [\"Chennai\", \"Delhi\", \"Chennai\", \"Delhi\"],\n    \"amount\": [1200, 400, 950, 400],\n})\nprint(orders.drop_duplicates())", "run": "import pandas as pd\n\norders = pd.DataFrame({\n    \"name\": [\"Asha\", \"Ravi\", \"Meera\", \"Ravi\"],\n    \"city\": [\"Chennai\", \"Delhi\", \"Chennai\", \"Delhi\"],\n    \"amount\": [1200, 400, 950, 400],\n})\nprint(orders)\nprint()\nprint('exact duplicate rows 1 and 3 -> dropped:')\nprint(orders.drop_duplicates())", "_m": 3, "_nav": "drop_duplicates(): removing exact repeat rows"}, {"type": "predict", "title": "Predict: a duplicate that differs in only ONE column", "code": "orders = pd.DataFrame({\n    \"cust_id\": [1, 2, 3, 5],   # note: last row has a DIFFERENT id\n    \"name\":    [\"Asha\", \"Ravi\", \"Meera\", \"Ravi\"],\n    \"city\":    [\"Chennai\", \"Delhi\", \"Chennai\", \"Delhi\"],\n    \"amount\":  [1200, 400, 950, 400],\n})\nprint(orders.drop_duplicates())", "run": "import pandas as pd\n\norders = pd.DataFrame({\n    \"cust_id\": [1, 2, 3, 5],\n    \"name\":    [\"Asha\", \"Ravi\", \"Meera\", \"Ravi\"],\n    \"city\":    [\"Chennai\", \"Delhi\", \"Chennai\", \"Delhi\"],\n    \"amount\":  [1200, 400, 950, 400],\n})\nprint('default drop_duplicates() keeps all 4 rows:')\nprint(orders.drop_duplicates())\nprint()\nprint('subset= ignoring cust_id catches the real duplicate:')\nprint(orders.drop_duplicates(subset=['name', 'city', 'amount']))", "expect": "Nothing gets dropped. Row 1 (Ravi, Delhi, 400) and row 3 (Ravi,\nDelhi, 400) are obviously the same order to a human — but their\ncust_id differs (2 vs 5), so the ROW as a whole isn't an exact\nmatch, and the default call keeps both.", "why": "drop_duplicates() has no idea which columns matter to YOUR definition of “the same record” — it can only compare literal values, across literally every column, unless told otherwise. A single differing column (a re-generated ID, a timestamp, a row number) is enough to make two otherwise-identical rows look unique to it. subset=[...] is how you tell it which columns actually define “same record” for your purposes — and it's worth deciding that deliberately rather than trusting the all-columns default on real data.", "topic": "duplicates", "_m": 3, "_nav": "A near-duplicate that differs in one column"}, {"type": "content", "title": "rename(columns={...}) and drop() — tidying labels", "bullets": ["df.rename(columns={\"old\": \"new\", ...}) renames exactly the columns you name, leaving everything else untouched — unlike assigning a whole new df.columns list, you can't accidentally shift things out of order.", "columns= also accepts a FUNCTION, applied to every column name at once: df.rename(columns=str.lower) lower-cases them all in one call.", "df.drop(columns=[...]) removes columns by name; df.drop(index=[...]) removes rows by label — both return a new DataFrame unless you pass inplace=True.", "A common real cleanup pipeline: rename messy headers to snake_case, then drop whatever columns the analysis doesn't need."], "code": "import pandas as pd\nimport numpy as np\n\nraw = pd.DataFrame({\n    \"Cust ID\":    [1, 2, 3, 4],\n    \"Full Name\":  [\"asha singh\", \"ravi kumar\", \"meera iyer\", \"karan patel\"],\n    \"Email\":      [\"ASHA@MAIL.COM\", \"ravi@mail.com\", \"MEERA@mail.com\", \"karan@mail.com\"],\n    \"City\":       [\"Chennai\", \"Delhi\", \"Chennai\", \"Mumbai\"],\n    \"Membership\": [\"gold\", \"silver\", \"Gold\", \"bronze\"],\n    \"Amount\":     [1200, np.nan, 950, np.nan],\n})\nclean = raw.rename(columns={\"Cust ID\": \"customer_id\", \"Full Name\": \"name\"})\nprint(clean.columns.tolist())\nprint(raw.rename(columns=str.lower).columns.tolist())", "run": "import pandas as pd\nimport numpy as np\n\nraw = pd.DataFrame({\n    \"Cust ID\":    [1, 2, 3, 4],\n    \"Full Name\":  [\"asha singh\", \"ravi kumar\", \"meera iyer\", \"karan patel\"],\n    \"Email\":      [\"ASHA@MAIL.COM\", \"ravi@mail.com\", \"MEERA@mail.com\", \"karan@mail.com\"],\n    \"City\":       [\"Chennai\", \"Delhi\", \"Chennai\", \"Mumbai\"],\n    \"Membership\": [\"gold\", \"silver\", \"Gold\", \"bronze\"],\n    \"Amount\":     [1200, np.nan, 950, np.nan],\n})\nclean = raw.rename(columns={'Cust ID': 'customer_id', 'Full Name': 'name'})\nprint('renamed just two columns:', clean.columns.tolist())\nprint()\nprint('rename(columns=str.lower):', raw.rename(columns=str.lower).columns.tolist())\nprint()\nprint('drop a column           :', raw.drop(columns=['City']).columns.tolist())\nprint('drop rows by label      :')\nprint(raw.drop(index=[0, 1]))", "_m": 3, "_nav": "rename() and drop(): tidying up labels"}, {"type": "mcq", "title": "Which call is safest for renaming just ONE column out of twelve?", "code": "df.columns = [...]              # option A\ndf.rename(columns={\"a\": \"b\"})   # option B", "options": ["Option A — assign a whole new list of column names", "Option B — rename() with a dict naming only what changes", "Both are equally safe", "Neither works for a single column"], "answer": 1, "expect": "Option B — rename() with a dict naming only what changes", "why": "rename(columns={'a': 'b'}) only touches the column you name — the other eleven are guaranteed untouched. Assigning df.columns = [...] replaces the ENTIRE list positionally: miss one name, get the count slightly wrong, or reorder something upstream, and columns silently get the wrong labels with no error at all. Naming exactly what changes is safer specifically because it makes “no change” the default for everything else.", "topic": "renaming", "_m": 3, "_nav": "Safest way to rename just one column"}, {"type": "section", "title": "Part 4 · Transforming values — map, apply, and DataFrame.map", "subtitle": "Three tools that all sound similar and do genuinely different jobs. The dividing line that matters: does the function see ONE value at a time, or a WHOLE row at a time?", "_m": 3, "_nav": "map, apply, and DataFrame.map: what's the difference"}, {"type": "content", "title": "Series.map() — substitute values, one at a time", "bullets": ["s.map(dict) looks up every value in the dict and replaces it with the match; s.map(function) calls the function on every value individually.", "Purely elementwise: the function (or dict) never sees anything about the OTHER columns, or other rows — just the one value in front of it.", "The classic use: turning a small set of category labels into a numeric score, or into a cleaner label.", "The next slide is about the one thing .map() does that quietly surprises almost everyone the first time."], "code": "tier_score = {\"Gold\": 3, \"Silver\": 2, \"Bronze\": 1}\nprint(df[\"membership\"].map(tier_score).tolist())", "run": "import pandas as pd\n\ndf = pd.DataFrame({\"membership\": [\"Gold\", \"Silver\", \"Gold\", \"Bronze\"]})\ntier_score = {\"Gold\": 3, \"Silver\": 2, \"Bronze\": 1}\nprint(df['membership'].map(tier_score).tolist())", "_m": 3, "_nav": "Series.map(): substituting values one at a time"}, {"type": "predict", "title": "Predict: .map() with a dict that's missing a key", "code": "tier_score = {\"Gold\": 3, \"Silver\": 2}      # Bronze is missing on purpose\nprint(df[\"membership\"].map(tier_score).tolist())", "run": "import pandas as pd\n\nmembership = pd.Series(['Gold', 'Silver', 'Gold', 'Bronze'])\ntier_score = {'Gold': 3, 'Silver': 2}\nprint(membership.map(tier_score).tolist())", "expect": "The Bronze row doesn't keep its original value, and it doesn't\nraise a KeyError either — it becomes NaN.", "why": ".map() treats a dict as a strict lookup table: any value that isn't a key simply has no match, and an unmatched value becomes NaN, exactly like an unmatched label in a merge. This is different from .replace(), which leaves anything it doesn't recognize exactly as it was. If you want “substitute these, leave everything else alone,” reach for .replace() instead — .map() is for “every value should come out the other side transformed, and I'll notice the NaNs if I missed one.”", "topic": "map", "_m": 3, "_nav": ".map() with a dict that's missing a key"}, {"type": "content", "title": "DataFrame.apply() — when a function needs the WHOLE row (or column)", "bullets": ["df.apply(func, axis=0) (the default) calls func once per COLUMN, handing it that column as a whole Series — useful for a column-level summary like col.max() - col.min().", "df.apply(func, axis=1) calls func once per ROW instead, handing it that row as a Series — this is what you need the moment a decision depends on MORE THAN ONE column at once.", "This is the real dividing line from .map(): map/DataFrame.map never see more than one value; apply hands you a whole Series, with every column (or row) available by name.", "It's slower than a purely vectorized column operation, because it's calling your Python function once per row — reach for it when the logic genuinely can't be written as plain column arithmetic."], "svg": "<svg viewBox=\"0 0 780 260\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Segoe UI,system-ui,sans-serif\">\n  <text x=\"390\" y=\"22\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#214B8C\">One value in vs. one whole row in</text>\n\n  <g transform=\"translate(30,50)\">\n    <rect x=\"0\" y=\"0\" width=\"330\" height=\"180\" rx=\"10\" fill=\"#eef3f9\" stroke=\"#214B8C\" stroke-width=\"1.5\"/>\n    <text x=\"165\" y=\"26\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#214B8C\">Series.map() / DataFrame.map()</text>\n    <rect x=\"30\" y=\"50\" width=\"70\" height=\"34\" fill=\"#fff\" stroke=\"#214B8C\"/>\n    <text x=\"65\" y=\"72\" text-anchor=\"middle\" font-size=\"12\" fill=\"#12233b\">Gold</text>\n    <path d=\"M100,67 L150,67\" stroke=\"#214B8C\" stroke-width=\"1.6\" marker-end=\"url(#arrM)\"/>\n    <rect x=\"155\" y=\"50\" width=\"70\" height=\"34\" fill=\"#e9f7ef\" stroke=\"#1f7a4d\"/>\n    <text x=\"190\" y=\"72\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#1f7a4d\">3</text>\n    <text x=\"165\" y=\"120\" text-anchor=\"middle\" font-size=\"12\" fill=\"#3a5170\">ONE value in,</text>\n    <text x=\"165\" y=\"140\" text-anchor=\"middle\" font-size=\"12\" fill=\"#3a5170\">ONE value out.</text>\n    <text x=\"165\" y=\"160\" text-anchor=\"middle\" font-size=\"12\" fill=\"#3a5170\">No other column exists.</text>\n  </g>\n\n  <defs>\n    <marker id=\"arrM\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#214B8C\"/></marker>\n    <marker id=\"arrA\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#c9891a\"/></marker>\n  </defs>\n\n  <g transform=\"translate(410,50)\">\n    <rect x=\"0\" y=\"0\" width=\"340\" height=\"180\" rx=\"10\" fill=\"#fdf3e3\" stroke=\"#c9891a\" stroke-width=\"1.5\"/>\n    <text x=\"170\" y=\"26\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#8a5a10\">DataFrame.apply(func, axis=1)</text>\n    <rect x=\"20\" y=\"50\" width=\"60\" height=\"30\" fill=\"#fff\" stroke=\"#c9891a\"/>\n    <text x=\"50\" y=\"70\" text-anchor=\"middle\" font-size=\"11\" fill=\"#12233b\">Gold</text>\n    <rect x=\"90\" y=\"50\" width=\"60\" height=\"30\" fill=\"#fff\" stroke=\"#c9891a\"/>\n    <text x=\"120\" y=\"70\" text-anchor=\"middle\" font-size=\"11\" fill=\"#12233b\">1200</text>\n    <path d=\"M50,80 L165,110\" stroke=\"#c9891a\" stroke-width=\"1.4\" fill=\"none\"/>\n    <path d=\"M120,80 L175,110\" stroke=\"#c9891a\" stroke-width=\"1.4\" fill=\"none\"/>\n    <rect x=\"130\" y=\"112\" width=\"80\" height=\"30\" rx=\"5\" fill=\"#fff\" stroke=\"#8a5a10\" stroke-width=\"1.6\"/>\n    <text x=\"170\" y=\"132\" text-anchor=\"middle\" font-size=\"11\" fill=\"#8a5a10\">func(row)</text>\n    <path d=\"M210,127 L260,127\" stroke=\"#c9891a\" stroke-width=\"1.6\" marker-end=\"url(#arrA)\"/>\n    <rect x=\"265\" y=\"112\" width=\"60\" height=\"30\" fill=\"#fff\" stroke=\"#8a2b2b\" stroke-width=\"1.6\"/>\n    <text x=\"295\" y=\"132\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" fill=\"#8a2b2b\">VIP</text>\n    <text x=\"170\" y=\"164\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#3a5170\">the WHOLE row is available, by column name</text>\n  </g>\n</svg>", "code": "def tag(row):\n    if row[\"amount\"] > 500 and row[\"membership\"] == \"Gold\":\n        return \"VIP\"\n    return \"regular\"\n\ndf[\"tag\"] = df.apply(tag, axis=1)", "run": "import pandas as pd\n\ndf = pd.DataFrame({\n    \"name\": [\"Asha\", \"Ravi\", \"Meera\", \"Karan\"],\n    \"membership\": [\"Gold\", \"Silver\", \"Gold\", \"Bronze\"],\n    \"amount\": [1200, 400, 950, 300],\n})\n\ndef tag(row):\n    if row['amount'] > 500 and row['membership'] == 'Gold':\n        return 'VIP'\n    return 'regular'\n\ndf['tag'] = df.apply(tag, axis=1)\nprint(df)\nprint()\nprint('axis=0 (per column) example:')\nprint(df[['amount']].apply(lambda col: col.max() - col.min(), axis=0))", "_m": 3, "_nav": "DataFrame.apply(): running a function per row or column"}, {"type": "content", "title": "DataFrame.map() — elementwise across a whole frame", "bullets": ["df.map(function) applies the function to every single cell in the DataFrame, independently — the two-dimensional version of Series.map().", "You may see df.applymap() in older code or tutorials — it does the same thing, but is deprecated in this pandas version in favor of df.map().", "Use this only when EVERY column genuinely needs the same elementwise transformation — usually a purely numeric frame, since a text-only function applied to a numeric column (or vice versa) will simply error.", "The three tools, one sentence each: Series.map() substitutes one column's values; DataFrame.map() transforms every cell independently; DataFrame.apply(axis=1) is the only one of the three that lets a function see more than one column at a time."], "code": "nums = df[[\"amount\"]]\nprint(nums.map(lambda x: x * 2))", "run": "import pandas as pd\nimport warnings\n\nnums = pd.DataFrame({\"amount\": [1200, 400, 950, 300], \"bonus\": [100, 50, 80, 20]})\nprint(nums.map(lambda x: x * 2))\nprint()\nwith warnings.catch_warnings(record=True) as caught:\n    warnings.simplefilter('always')\n    nums.applymap(lambda x: x * 2)\n    for w in caught:\n        print('applymap() warns:', str(w.message).splitlines()[0])", "_m": 3, "_nav": "DataFrame.map(): one function, every cell in the frame"}, {"type": "mcq", "title": "A column needs each value looked up in a small dict of substitutions. Which tool fits best?", "code": "df[\"membership\"] = df[\"membership_code\"].???({\"G\": \"Gold\", \"S\": \"Silver\", \"B\": \"Bronze\"})", "options": ["Series.map()", "DataFrame.apply(axis=1)", "DataFrame.map()", "df.rename()"], "answer": 0, "expect": "Series.map()", "why": "This is exactly Series.map()'s job: one column, one value at a time, substituted via a dict lookup. DataFrame.apply(axis=1) would be overkill and slower — it's for when a function needs MULTIPLE columns per row, not one. DataFrame.map() operates across an entire frame, not a single named column. rename() relabels COLUMN NAMES, not the values inside a column.", "topic": "map", "_m": 3, "_nav": "Picking the right tool for a value lookup"}, {"type": "content", "title": "Putting Part 1–4 together", "bullets": ["Order matters: handle missing values (Part 1) before converting dtypes (Part 2) — astype(int) on a column that still has NaN fails outright, not silently.", "Every dtype fix in Part 2 was really the same move: make the column's TYPE match what it actually MEANS — an ID is a label, a tier has a real order, a fixed set of categories isn't free-flowing text.", "drop_duplicates() and rename() both default to the SAFEST, most literal behavior — exact full-row matches, only the columns you explicitly name — and both have a subset=/dict= escape hatch for when “literal” isn't what you actually meant.", "One value at a time: Series.map() / DataFrame.map(). A whole row (or column) at a time: DataFrame.apply(). Reach for the simplest one that can actually see what your logic needs to see."], "code": "import pandas as pd\nimport numpy as np\n\nraw = pd.DataFrame({\n    \"Cust ID\":    [1, 2, 3, 4],\n    \"Full Name\":  [\"asha singh\", \"ravi kumar\", \"meera iyer\", \"karan patel\"],\n    \"Email\":      [\"ASHA@MAIL.COM\", \"ravi@mail.com\", \"MEERA@mail.com\", \"karan@mail.com\"],\n    \"City\":       [\"Chennai\", \"Delhi\", \"Chennai\", \"Mumbai\"],\n    \"Membership\": [\"gold\", \"silver\", \"Gold\", \"bronze\"],\n    \"Amount\":     [1200, np.nan, 950, np.nan],\n})\nraw[\"Amount\"] = raw[\"Amount\"].fillna(raw[\"Amount\"].mean())\nraw[\"Membership\"] = raw[\"Membership\"].str.title().astype(\n    pd.CategoricalDtype([\"Bronze\", \"Silver\", \"Gold\"], ordered=True)\n)\nraw = raw.rename(columns={\"Cust ID\": \"customer_id\"})\nprint(raw)", "run": "import pandas as pd\nimport numpy as np\n\nraw = pd.DataFrame({\n    \"Cust ID\":    [1, 2, 3, 4],\n    \"Full Name\":  [\"asha singh\", \"ravi kumar\", \"meera iyer\", \"karan patel\"],\n    \"Email\":      [\"ASHA@MAIL.COM\", \"ravi@mail.com\", \"MEERA@mail.com\", \"karan@mail.com\"],\n    \"City\":       [\"Chennai\", \"Delhi\", \"Chennai\", \"Mumbai\"],\n    \"Membership\": [\"gold\", \"silver\", \"Gold\", \"bronze\"],\n    \"Amount\":     [1200, np.nan, 950, np.nan],\n})\nraw['Amount'] = raw['Amount'].fillna(raw['Amount'].mean())\nraw['Membership'] = raw['Membership'].str.title().astype(\n    pd.CategoricalDtype(['Bronze', 'Silver', 'Gold'], ordered=True)\n)\nraw = raw.rename(columns={'Cust ID': 'customer_id', 'Full Name': 'name'})\nprint(raw)\nprint()\nprint(raw.dtypes)\nprint()\nraw['tier_score'] = raw['Membership'].map({'Gold': 3, 'Silver': 2, 'Bronze': 1})\nprint(raw[['name', 'Membership', 'tier_score']])", "_m": 3, "_nav": "Recap: cleaning, dtypes, duplicates, and transforms"}, {"type": "section", "title": "Part 1 · Boolean filtering", "subtitle": "Ten rows of sales data — a rep, a region, a product, and a revenue figure computed from the other two. Every filter in this part is the same idea: build a column of True/False, then use it to keep only the rows where it's True.", "_m": 4, "_nav": "Ten rows of sales data to filter"}, {"type": "content", "title": "One condition at a time", "bullets": ["sales['revenue'] > 200 is itself a full boolean Series — same length as sales, one True/False per row, nothing filtered yet.", "sales[condition] uses that boolean Series to keep only the rows where it's True — the condition and the filtering are two separate steps, even when written on one line.", "Because it's a real Series, you can inspect it on its own, store it in a variable, reuse it, or combine it with another one — which is exactly Part 1's next move.", "Comparison operators (>, <, ==, !=, >=, <=) all work exactly like this, column-wide, no loop required."], "code": "import pandas as pd\n\nsales = pd.DataFrame({\n    \"rep\":      [\"Asha\", \"Ravi\", \"Meera\", \"Asha\", \"Karan\", \"Ravi\", \"Meera\", \"Asha\", \"Karan\", \"Ravi\"],\n    \"region\":   [\"North\", \"South\", \"North\", \"East\", \"South\", \"North\", \"East\", \"North\", \"South\", \"East\"],\n    \"product\":  [\"Notebook\", \"Pen\", \"Notebook\", \"Eraser\", \"Stapler\", \"Pen\", \"Notebook\", \"Stapler\", \"Pen\", \"Eraser\"],\n    \"quantity\": [5, 10, 3, 7, 4, 8, 6, 2, 9, 5],\n    \"price\":    [40, 10, 40, 5, 60, 10, 40, 60, 10, 5],\n})\nsales[\"revenue\"] = sales[\"quantity\"] * sales[\"price\"]\nis_big = sales[\"revenue\"] > 200\nprint(is_big)\nprint(sales[is_big])", "run": "import pandas as pd\n\nsales = pd.DataFrame({\n    \"rep\":      [\"Asha\", \"Ravi\", \"Meera\", \"Asha\", \"Karan\", \"Ravi\", \"Meera\", \"Asha\", \"Karan\", \"Ravi\"],\n    \"region\":   [\"North\", \"South\", \"North\", \"East\", \"South\", \"North\", \"East\", \"North\", \"South\", \"East\"],\n    \"product\":  [\"Notebook\", \"Pen\", \"Notebook\", \"Eraser\", \"Stapler\", \"Pen\", \"Notebook\", \"Stapler\", \"Pen\", \"Eraser\"],\n    \"quantity\": [5, 10, 3, 7, 4, 8, 6, 2, 9, 5],\n    \"price\":    [40, 10, 40, 5, 60, 10, 40, 60, 10, 5],\n})\nsales[\"revenue\"] = sales[\"quantity\"] * sales[\"price\"]\nis_big = sales['revenue'] > 200\nprint(is_big)\nprint()\nprint(sales[is_big])", "_m": 4, "_nav": "A single condition is just a boolean Series"}, {"type": "content", "title": "Combining conditions: & (and), | (or), ~ (not)", "bullets": ["Use & / | / ~ — never Python's own and / or / not — and give EACH condition its own parentheses: (a) & (b), not a & b.", "sales[(cond1) & (cond2)] keeps rows where BOTH are true; sales[(cond1) | (cond2)] keeps rows where AT LEAST ONE is true.", "~condition flips every True to False and back — sales[~(sales['region'] == 'North')] is every row that is NOT North.", "Each condition is still just its own boolean Series underneath — & and | are combining two same-length True/False columns, one position at a time."], "svg": "<svg viewBox=\"0 0 780 260\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Segoe UI,system-ui,sans-serif\">\n  <text x=\"390\" y=\"22\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#214B8C\">Two conditions, combined two different ways</text>\n\n  <g transform=\"translate(60,50)\">\n    <text x=\"140\" y=\"0\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#1f7a4d\">region == \"North\"  &amp;  revenue &gt; 100</text>\n    <circle cx=\"100\" cy=\"100\" r=\"80\" fill=\"#e9f7ef\" fill-opacity=\"0.7\" stroke=\"#1f7a4d\" stroke-width=\"1.6\"/>\n    <circle cx=\"180\" cy=\"100\" r=\"80\" fill=\"#eef3f9\" fill-opacity=\"0.7\" stroke=\"#214B8C\" stroke-width=\"1.6\"/>\n    <text x=\"70\" y=\"105\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1f7a4d\">North rows</text>\n    <text x=\"215\" y=\"105\" text-anchor=\"middle\" font-size=\"11\" fill=\"#214B8C\">revenue&gt;100</text>\n    <text x=\"140\" y=\"105\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#12233b\">&amp;</text>\n    <text x=\"140\" y=\"205\" text-anchor=\"middle\" font-size=\"12\" fill=\"#5b6b80\">kept: only the OVERLAP</text>\n  </g>\n\n  <g transform=\"translate(460,50)\">\n    <text x=\"140\" y=\"0\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#c9891a\">region == \"North\"  |  region == \"South\"</text>\n    <circle cx=\"100\" cy=\"100\" r=\"80\" fill=\"#fdf3e3\" stroke=\"#c9891a\" stroke-width=\"1.6\"/>\n    <circle cx=\"180\" cy=\"100\" r=\"80\" fill=\"#fdf3e3\" stroke=\"#c9891a\" stroke-width=\"1.6\"/>\n    <text x=\"70\" y=\"105\" text-anchor=\"middle\" font-size=\"11\" fill=\"#8a5a10\">North rows</text>\n    <text x=\"215\" y=\"105\" text-anchor=\"middle\" font-size=\"11\" fill=\"#8a5a10\">South rows</text>\n    <text x=\"140\" y=\"205\" text-anchor=\"middle\" font-size=\"12\" fill=\"#5b6b80\">kept: EITHER circle, overlap included</text>\n  </g>\n</svg>", "code": "import pandas as pd\n\nsales = pd.DataFrame({\n    \"rep\":      [\"Asha\", \"Ravi\", \"Meera\", \"Asha\", \"Karan\", \"Ravi\", \"Meera\", \"Asha\", \"Karan\", \"Ravi\"],\n    \"region\":   [\"North\", \"South\", \"North\", \"East\", \"South\", \"North\", \"East\", \"North\", \"South\", \"East\"],\n    \"product\":  [\"Notebook\", \"Pen\", \"Notebook\", \"Eraser\", \"Stapler\", \"Pen\", \"Notebook\", \"Stapler\", \"Pen\", \"Eraser\"],\n    \"quantity\": [5, 10, 3, 7, 4, 8, 6, 2, 9, 5],\n    \"price\":    [40, 10, 40, 5, 60, 10, 40, 60, 10, 5],\n})\nsales[\"revenue\"] = sales[\"quantity\"] * sales[\"price\"]\nprint(sales[(sales[\"region\"] == \"North\") & (sales[\"revenue\"] > 100)])\nprint(sales[(sales[\"region\"] == \"North\") | (sales[\"region\"] == \"South\")])", "run": "import pandas as pd\n\nsales = pd.DataFrame({\n    \"rep\":      [\"Asha\", \"Ravi\", \"Meera\", \"Asha\", \"Karan\", \"Ravi\", \"Meera\", \"Asha\", \"Karan\", \"Ravi\"],\n    \"region\":   [\"North\", \"South\", \"North\", \"East\", \"South\", \"North\", \"East\", \"North\", \"South\", \"East\"],\n    \"product\":  [\"Notebook\", \"Pen\", \"Notebook\", \"Eraser\", \"Stapler\", \"Pen\", \"Notebook\", \"Stapler\", \"Pen\", \"Eraser\"],\n    \"quantity\": [5, 10, 3, 7, 4, 8, 6, 2, 9, 5],\n    \"price\":    [40, 10, 40, 5, 60, 10, 40, 60, 10, 5],\n})\nsales[\"revenue\"] = sales[\"quantity\"] * sales[\"price\"]\nprint('AND -- North AND revenue over 100:')\nprint(sales[(sales['region'] == 'North') & (sales['revenue'] > 100)])\nprint()\nprint('OR -- North OR South:')\nprint(sales[(sales['region'] == 'North') | (sales['region'] == 'South')])\nprint()\nprint('NOT -- everything except North:')\nprint(sales[~(sales['region'] == 'North')])", "_m": 4, "_nav": "Combining conditions with & / | / ~"}, {"type": "predict", "title": "Predict: using Python's own and / or instead of & / |", "code": "big_north = sales[(sales[\"region\"] == \"North\") and (sales[\"revenue\"] > 100)]", "run": "import pandas as pd\n\nsales = pd.DataFrame({'region': ['North', 'South'], 'revenue': [200, 50]})\ntry:\n    result = sales[(sales['region'] == 'North') and (sales['revenue'] > 100)]\nexcept Exception as e:\n    print(type(e).__name__, ':', e)", "expect": "It doesn't silently do the wrong thing — it raises ValueError:\n“The truth value of a Series is ambiguous. Use a.empty, a.bool(),\na.item(), a.any() or a.all().”", "why": "Python's and/or expect a SINGLE True or False on each side, so they have to ask “is this whole thing true?” about an entire multi-value Series — and pandas refuses to guess what that should mean, because a Series being “truthy” could reasonably mean “all of it” or “any of it,” and picking the wrong one silently would be far worse than an error. & and | are overloaded to work ELEMENT BY ELEMENT instead, which is what filtering actually needs. At least this particular mistake is loud rather than silent — you'll never ship it by accident.", "topic": "filtering", "_m": 4, "_nav": "Using Python's and/or instead of & / |"}, {"type": "content", "title": ".isin() — matching against a whole list at once", "bullets": ["df['col'].isin([...]) returns True for every row whose value appears anywhere in the list — the vectorized equivalent of chaining several == comparisons with |.", "sales[sales['product'].isin(['Notebook', 'Pen'])] replaces (sales['product']=='Notebook') | (sales['product']=='Pen') | ... for as many values as you like.", "~df['col'].isin([...]) flips it: keep only the rows whose value is NOT in the list — useful for excluding a handful of known values.", "Reach for .isin() the moment you're filtering against three or more specific values — chained | conditions get unreadable fast, and isin() doesn't."], "code": "import pandas as pd\n\nsales = pd.DataFrame({\n    \"rep\":      [\"Asha\", \"Ravi\", \"Meera\", \"Asha\", \"Karan\", \"Ravi\", \"Meera\", \"Asha\", \"Karan\", \"Ravi\"],\n    \"region\":   [\"North\", \"South\", \"North\", \"East\", \"South\", \"North\", \"East\", \"North\", \"South\", \"East\"],\n    \"product\":  [\"Notebook\", \"Pen\", \"Notebook\", \"Eraser\", \"Stapler\", \"Pen\", \"Notebook\", \"Stapler\", \"Pen\", \"Eraser\"],\n    \"quantity\": [5, 10, 3, 7, 4, 8, 6, 2, 9, 5],\n    \"price\":    [40, 10, 40, 5, 60, 10, 40, 60, 10, 5],\n})\nsales[\"revenue\"] = sales[\"quantity\"] * sales[\"price\"]\nprint(sales[sales[\"product\"].isin([\"Notebook\", \"Pen\"])])\nprint(sales[~sales[\"product\"].isin([\"Notebook\", \"Pen\"])])", "run": "import pandas as pd\n\nsales = pd.DataFrame({\n    \"rep\":      [\"Asha\", \"Ravi\", \"Meera\", \"Asha\", \"Karan\", \"Ravi\", \"Meera\", \"Asha\", \"Karan\", \"Ravi\"],\n    \"region\":   [\"North\", \"South\", \"North\", \"East\", \"South\", \"North\", \"East\", \"North\", \"South\", \"East\"],\n    \"product\":  [\"Notebook\", \"Pen\", \"Notebook\", \"Eraser\", \"Stapler\", \"Pen\", \"Notebook\", \"Stapler\", \"Pen\", \"Eraser\"],\n    \"quantity\": [5, 10, 3, 7, 4, 8, 6, 2, 9, 5],\n    \"price\":    [40, 10, 40, 5, 60, 10, 40, 60, 10, 5],\n})\nsales[\"revenue\"] = sales[\"quantity\"] * sales[\"price\"]\nprint('IN the list:')\nprint(sales[sales['product'].isin(['Notebook', 'Pen'])])\nprint()\nprint('NOT in the list:')\nprint(sales[~sales['product'].isin(['Notebook', 'Pen'])])", "_m": 4, "_nav": ".isin(): matching against a whole list at once"}, {"type": "mcq", "title": "Which one correctly keeps rows where region is North OR revenue is over 200?", "code": "sales[ ??? ]", "options": ["sales['region'] == 'North' or sales['revenue'] > 200", "(sales['region'] == 'North') | (sales['revenue'] > 200)", "(sales['region'] == 'North') or (sales['revenue'] > 200)", "sales['region'] == 'North' | sales['revenue'] > 200"], "answer": 1, "expect": "(sales['region'] == 'North') | (sales['revenue'] > 200)", "why": "Option B has both things right: the pandas-specific | operator (not Python's or, which raises ValueError on a Series), AND parentheses around each full comparison. Option D drops the parentheses — | binds tighter than ==, so it would actually try to evaluate 'North' | sales['revenue'] first, which fails. Options A and C both use Python's or, which is the exact mistake from the previous slide.", "topic": "filtering", "_m": 4, "_nav": "Keeping rows where region is North OR revenue is high"}, {"type": "section", "title": "Part 2 · Split — apply — combine", "subtitle": "groupby() is one idea with three steps: split the rows into groups that share a value, apply a function to each group separately, then combine the per-group answers back into one result. Everything in this part is that same three-step pattern, with a different “apply.”", "_m": 4, "_nav": "groupby in three steps: split, apply, combine"}, {"type": "content", "title": "One column, one aggregate", "bullets": ["sales.groupby('region') splits the rows into one bucket per distinct region — nothing is computed yet at that point, it's just a grouping plan.", "Attach a column and an aggregate — ['revenue'].sum() — and NOW it splits, sums each group's revenue separately, and combines the three answers into one Series, indexed by region.", "Any aggregate works the same way: .mean(), .count(), .max(), .min(), and so on, all following the identical split-apply-combine shape.", "The result's index IS the group labels — region, in this case — not a fresh RangeIndex."], "svg": "<svg viewBox=\"0 0 780 260\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Segoe UI,system-ui,sans-serif\">\n  <defs><marker id=\"gpa\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 Z\" fill=\"#48607e\"/></marker></defs>\n  <text x=\"390\" y=\"22\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#214B8C\">Split, apply, combine</text>\n\n  <rect x=\"20\" y=\"46\" width=\"150\" height=\"150\" rx=\"8\" fill=\"#eef3f9\" stroke=\"#48607e\" stroke-width=\"1.4\"/>\n  <text x=\"95\" y=\"66\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#48607e\">10 rows</text>\n  <text x=\"95\" y=\"120\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#3a5170\">one sales</text>\n  <text x=\"95\" y=\"138\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#3a5170\">table</text>\n\n  <path d=\"M170,120 L230,70\" stroke=\"#48607e\" stroke-width=\"1.6\" marker-end=\"url(#gpa)\"/>\n  <path d=\"M170,120 L230,120\" stroke=\"#48607e\" stroke-width=\"1.6\" marker-end=\"url(#gpa)\"/>\n  <path d=\"M170,120 L230,170\" stroke=\"#48607e\" stroke-width=\"1.6\" marker-end=\"url(#gpa)\"/>\n\n  <rect x=\"235\" y=\"46\" width=\"130\" height=\"42\" rx=\"6\" fill=\"#fff\" stroke=\"#1f7a4d\" stroke-width=\"1.4\"/>\n  <text x=\"300\" y=\"72\" text-anchor=\"middle\" font-size=\"12\" fill=\"#1f7a4d\" font-weight=\"700\">North (4 rows)</text>\n  <rect x=\"235\" y=\"99\" width=\"130\" height=\"42\" rx=\"6\" fill=\"#fff\" stroke=\"#c9891a\" stroke-width=\"1.4\"/>\n  <text x=\"300\" y=\"125\" text-anchor=\"middle\" font-size=\"12\" fill=\"#8a5a10\" font-weight=\"700\">South (3 rows)</text>\n  <rect x=\"235\" y=\"152\" width=\"130\" height=\"42\" rx=\"6\" fill=\"#fff\" stroke=\"#5b3a9e\" stroke-width=\"1.4\"/>\n  <text x=\"300\" y=\"178\" text-anchor=\"middle\" font-size=\"12\" fill=\"#5b3a9e\" font-weight=\"700\">East (3 rows)</text>\n\n  <text x=\"405\" y=\"70\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#5b6b80\">.sum()</text>\n  <text x=\"405\" y=\"123\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#5b6b80\">.sum()</text>\n  <text x=\"405\" y=\"176\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#5b6b80\">.sum()</text>\n  <path d=\"M365,67 L440,120\" stroke=\"#9aa9bd\" stroke-width=\"1.4\" marker-end=\"url(#gpa)\"/>\n  <path d=\"M365,120 L440,120\" stroke=\"#9aa9bd\" stroke-width=\"1.4\" marker-end=\"url(#gpa)\"/>\n  <path d=\"M365,173 L440,120\" stroke=\"#9aa9bd\" stroke-width=\"1.4\" marker-end=\"url(#gpa)\"/>\n\n  <rect x=\"445\" y=\"80\" width=\"300\" height=\"80\" rx=\"8\" fill=\"#fff\" stroke=\"#214B8C\" stroke-width=\"1.8\"/>\n  <text x=\"595\" y=\"105\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"#214B8C\">one Series, combined</text>\n  <text x=\"595\" y=\"128\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#3a5170\">North 520 &#183; South 430 &#183; East 300</text>\n  <text x=\"595\" y=\"146\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5b6b80\">index = region</text>\n\n  <text x=\"390\" y=\"238\" text-anchor=\"middle\" font-size=\"12\" fill=\"#5b6b80\">sales.groupby(\"region\")[\"revenue\"].sum()</text>\n</svg>", "code": "import pandas as pd\n\nsales = pd.DataFrame({\n    \"rep\":      [\"Asha\", \"Ravi\", \"Meera\", \"Asha\", \"Karan\", \"Ravi\", \"Meera\", \"Asha\", \"Karan\", \"Ravi\"],\n    \"region\":   [\"North\", \"South\", \"North\", \"East\", \"South\", \"North\", \"East\", \"North\", \"South\", \"East\"],\n    \"product\":  [\"Notebook\", \"Pen\", \"Notebook\", \"Eraser\", \"Stapler\", \"Pen\", \"Notebook\", \"Stapler\", \"Pen\", \"Eraser\"],\n    \"quantity\": [5, 10, 3, 7, 4, 8, 6, 2, 9, 5],\n    \"price\":    [40, 10, 40, 5, 60, 10, 40, 60, 10, 5],\n})\nsales[\"revenue\"] = sales[\"quantity\"] * sales[\"price\"]\nprint(sales.groupby(\"region\")[\"revenue\"].sum())", "run": "import pandas as pd\n\nsales = pd.DataFrame({\n    \"rep\":      [\"Asha\", \"Ravi\", \"Meera\", \"Asha\", \"Karan\", \"Ravi\", \"Meera\", \"Asha\", \"Karan\", \"Ravi\"],\n    \"region\":   [\"North\", \"South\", \"North\", \"East\", \"South\", \"North\", \"East\", \"North\", \"South\", \"East\"],\n    \"product\":  [\"Notebook\", \"Pen\", \"Notebook\", \"Eraser\", \"Stapler\", \"Pen\", \"Notebook\", \"Stapler\", \"Pen\", \"Eraser\"],\n    \"quantity\": [5, 10, 3, 7, 4, 8, 6, 2, 9, 5],\n    \"price\":    [40, 10, 40, 5, 60, 10, 40, 60, 10, 5],\n})\nsales[\"revenue\"] = sales[\"quantity\"] * sales[\"price\"]\nprint(sales.groupby('region')['revenue'].sum())\nprint()\nprint(sales.groupby('region')['revenue'].mean().round(1))", "_m": 4, "_nav": "Grouping by one column, one summary stat"}, {"type": "content", "title": "Grouping by more than one column", "bullets": ["sales.groupby(['region', 'product']) groups by the COMBINATION of both columns — one bucket per (region, product) pair that actually occurs in the data.", "The result comes back with a MultiIndex: two levels of row label, region then product, instead of one.", "df.reset_index() turns those index levels back into ordinary columns — usually the very next line after a multi-column groupby, if you want a flat table again.", "This scales to as many grouping columns as you like — the split step just gets finer-grained with each one you add."], "code": "import pandas as pd\n\nsales = pd.DataFrame({\n    \"rep\":      [\"Asha\", \"Ravi\", \"Meera\", \"Asha\", \"Karan\", \"Ravi\", \"Meera\", \"Asha\", \"Karan\", \"Ravi\"],\n    \"region\":   [\"North\", \"South\", \"North\", \"East\", \"South\", \"North\", \"East\", \"North\", \"South\", \"East\"],\n    \"product\":  [\"Notebook\", \"Pen\", \"Notebook\", \"Eraser\", \"Stapler\", \"Pen\", \"Notebook\", \"Stapler\", \"Pen\", \"Eraser\"],\n    \"quantity\": [5, 10, 3, 7, 4, 8, 6, 2, 9, 5],\n    \"price\":    [40, 10, 40, 5, 60, 10, 40, 60, 10, 5],\n})\nsales[\"revenue\"] = sales[\"quantity\"] * sales[\"price\"]\ngrouped = sales.groupby([\"region\", \"product\"])[\"revenue\"].sum()\nprint(grouped)\nprint(type(grouped.index))\nprint(grouped.reset_index())", "run": "import pandas as pd\n\nsales = pd.DataFrame({\n    \"rep\":      [\"Asha\", \"Ravi\", \"Meera\", \"Asha\", \"Karan\", \"Ravi\", \"Meera\", \"Asha\", \"Karan\", \"Ravi\"],\n    \"region\":   [\"North\", \"South\", \"North\", \"East\", \"South\", \"North\", \"East\", \"North\", \"South\", \"East\"],\n    \"product\":  [\"Notebook\", \"Pen\", \"Notebook\", \"Eraser\", \"Stapler\", \"Pen\", \"Notebook\", \"Stapler\", \"Pen\", \"Eraser\"],\n    \"quantity\": [5, 10, 3, 7, 4, 8, 6, 2, 9, 5],\n    \"price\":    [40, 10, 40, 5, 60, 10, 40, 60, 10, 5],\n})\nsales[\"revenue\"] = sales[\"quantity\"] * sales[\"price\"]\ngrouped = sales.groupby(['region', 'product'])['revenue'].sum()\nprint(grouped)\nprint()\nprint('index type:', type(grouped.index).__name__)\nprint()\nprint('flattened back to columns:')\nprint(grouped.reset_index())", "_m": 4, "_nav": "Grouping by more than one column at once"}, {"type": "predict", "title": "Predict: groupby(...).mean() when a text column is along for the ride", "code": "print(sales.groupby(\"region\").mean())", "run": "import pandas as pd\n\nsales = pd.DataFrame({\n    'region': ['North', 'South', 'North'],\n    'product': ['Notebook', 'Pen', 'Pen'],\n    'revenue': [200, 100, 80],\n})\ntry:\n    print(sales.groupby('region').mean())\nexcept Exception as e:\n    print(type(e).__name__, ':', e)\nprint()\nprint('numeric_only=True fixes it:')\nprint(sales.groupby('region').mean(numeric_only=True))", "expect": "It raises TypeError: “agg function failed [how->mean,dtype->object]”\n— pandas won't just skip the text column quietly on its own.", "why": "“Average of a region name” has no meaning, so pandas can't compute .mean() across a text column — but rather than silently drop that column for you, it raises, because a result missing a column you expected is its own kind of bug. Passing numeric_only=True is you explicitly telling it “only average the numeric columns, and I understand product is being left out.” This is worth doing on purpose rather than only when you hit the error.", "topic": "groupby", "_m": 4, "_nav": "groupby().mean() with a text column along for the ride"}, {"type": "content", "title": ".agg() — more than one summary at once", "bullets": ["df.groupby('region')['revenue'].agg(['sum', 'mean', 'count']) runs all three functions on the SAME grouped column, producing one result column per function.", "Named aggregation — .agg(total=('revenue','sum'), avg_qty=('quantity','mean')) — lets you summarize DIFFERENT columns with different functions, AND choose the output column names, all in one call.", "Anything that reduces a group to one value works here: built-in names as strings ('sum'), or your own function object.", "This is the tool for “I want several different numbers per group, all at once,” rather than one .sum() call per statistic."], "code": "import pandas as pd\n\nsales = pd.DataFrame({\n    \"rep\":      [\"Asha\", \"Ravi\", \"Meera\", \"Asha\", \"Karan\", \"Ravi\", \"Meera\", \"Asha\", \"Karan\", \"Ravi\"],\n    \"region\":   [\"North\", \"South\", \"North\", \"East\", \"South\", \"North\", \"East\", \"North\", \"South\", \"East\"],\n    \"product\":  [\"Notebook\", \"Pen\", \"Notebook\", \"Eraser\", \"Stapler\", \"Pen\", \"Notebook\", \"Stapler\", \"Pen\", \"Eraser\"],\n    \"quantity\": [5, 10, 3, 7, 4, 8, 6, 2, 9, 5],\n    \"price\":    [40, 10, 40, 5, 60, 10, 40, 60, 10, 5],\n})\nsales[\"revenue\"] = sales[\"quantity\"] * sales[\"price\"]\nprint(sales.groupby(\"region\")[\"revenue\"].agg([\"sum\", \"mean\", \"count\"]))\nprint(sales.groupby(\"region\").agg(total_revenue=(\"revenue\", \"sum\"), avg_qty=(\"quantity\", \"mean\")))", "run": "import pandas as pd\n\nsales = pd.DataFrame({\n    \"rep\":      [\"Asha\", \"Ravi\", \"Meera\", \"Asha\", \"Karan\", \"Ravi\", \"Meera\", \"Asha\", \"Karan\", \"Ravi\"],\n    \"region\":   [\"North\", \"South\", \"North\", \"East\", \"South\", \"North\", \"East\", \"North\", \"South\", \"East\"],\n    \"product\":  [\"Notebook\", \"Pen\", \"Notebook\", \"Eraser\", \"Stapler\", \"Pen\", \"Notebook\", \"Stapler\", \"Pen\", \"Eraser\"],\n    \"quantity\": [5, 10, 3, 7, 4, 8, 6, 2, 9, 5],\n    \"price\":    [40, 10, 40, 5, 60, 10, 40, 60, 10, 5],\n})\nsales[\"revenue\"] = sales[\"quantity\"] * sales[\"price\"]\nprint(sales.groupby('region')['revenue'].agg(['sum', 'mean', 'count']))\nprint()\nprint(sales.groupby('region').agg(total_revenue=('revenue', 'sum'), avg_qty=('quantity', 'mean')))", "_m": 4, "_nav": ".agg(): several summary stats in one call"}, {"type": "content", "title": ".transform() — a group summary, broadcast back to every row", "bullets": ["df.groupby('region')['revenue'].transform('mean') computes each group's mean, same as .agg() would — but returns it at the ORIGINAL shape: one value per ROW, not one per group.", "That means the result lines up directly against the original DataFrame, so you can assign it straight into a new column.", "This is exactly what you need for “how does this row compare to its OWN group’s average” — a per-row percentage, a per-row deviation, anything that needs the group summary sitting right next to the original row.", ".agg() shrinks (one row per group). .transform() never shrinks (always one row per original row). Same split, same apply, a different combine."], "svg": "<svg viewBox=\"0 0 780 220\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Segoe UI,system-ui,sans-serif\">\n  <text x=\"390\" y=\"22\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#214B8C\">Same groupby, two different combine shapes</text>\n\n  <g transform=\"translate(40,50)\">\n    <rect x=\"0\" y=\"0\" width=\"300\" height=\"140\" rx=\"10\" fill=\"#eef3f9\" stroke=\"#214B8C\" stroke-width=\"1.5\"/>\n    <text x=\"150\" y=\"26\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#214B8C\">.agg('mean')  &#8594;  SHRINKS</text>\n    <text x=\"150\" y=\"70\" text-anchor=\"middle\" font-size=\"24\" font-weight=\"700\" fill=\"#214B8C\">10 rows &#8594; 3 rows</text>\n    <text x=\"150\" y=\"110\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#3a5170\">one number per GROUP</text>\n  </g>\n\n  <g transform=\"translate(410,50)\">\n    <rect x=\"0\" y=\"0\" width=\"330\" height=\"140\" rx=\"10\" fill=\"#e9f7ef\" stroke=\"#1f7a4d\" stroke-width=\"1.5\"/>\n    <text x=\"165\" y=\"26\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#1f7a4d\">.transform('mean')  &#8594;  SAME SIZE</text>\n    <text x=\"165\" y=\"70\" text-anchor=\"middle\" font-size=\"24\" font-weight=\"700\" fill=\"#1f7a4d\">10 rows &#8594; 10 rows</text>\n    <text x=\"165\" y=\"110\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#3a5170\">group's number, repeated onto every ROW</text>\n  </g>\n</svg>", "code": "import pandas as pd\n\nsales = pd.DataFrame({\n    \"rep\":      [\"Asha\", \"Ravi\", \"Meera\", \"Asha\", \"Karan\", \"Ravi\", \"Meera\", \"Asha\", \"Karan\", \"Ravi\"],\n    \"region\":   [\"North\", \"South\", \"North\", \"East\", \"South\", \"North\", \"East\", \"North\", \"South\", \"East\"],\n    \"product\":  [\"Notebook\", \"Pen\", \"Notebook\", \"Eraser\", \"Stapler\", \"Pen\", \"Notebook\", \"Stapler\", \"Pen\", \"Eraser\"],\n    \"quantity\": [5, 10, 3, 7, 4, 8, 6, 2, 9, 5],\n    \"price\":    [40, 10, 40, 5, 60, 10, 40, 60, 10, 5],\n})\nsales[\"revenue\"] = sales[\"quantity\"] * sales[\"price\"]\nsales[\"region_avg\"] = sales.groupby(\"region\")[\"revenue\"].transform(\"mean\")\nprint(sales[[\"region\", \"revenue\", \"region_avg\"]])", "run": "import pandas as pd\n\nsales = pd.DataFrame({\n    \"rep\":      [\"Asha\", \"Ravi\", \"Meera\", \"Asha\", \"Karan\", \"Ravi\", \"Meera\", \"Asha\", \"Karan\", \"Ravi\"],\n    \"region\":   [\"North\", \"South\", \"North\", \"East\", \"South\", \"North\", \"East\", \"North\", \"South\", \"East\"],\n    \"product\":  [\"Notebook\", \"Pen\", \"Notebook\", \"Eraser\", \"Stapler\", \"Pen\", \"Notebook\", \"Stapler\", \"Pen\", \"Eraser\"],\n    \"quantity\": [5, 10, 3, 7, 4, 8, 6, 2, 9, 5],\n    \"price\":    [40, 10, 40, 5, 60, 10, 40, 60, 10, 5],\n})\nsales[\"revenue\"] = sales[\"quantity\"] * sales[\"price\"]\nsales['region_avg'] = sales.groupby('region')['revenue'].transform('mean')\nsales['pct_of_region_avg'] = (sales['revenue'] / sales['region_avg'] * 100).round(1)\nprint(sales[['region', 'revenue', 'region_avg', 'pct_of_region_avg']])", "_m": 4, "_nav": ".transform(): a group summary broadcast to every row"}, {"type": "mcq", "title": "df has 10 rows across 3 regions. How many rows does each call return?", "code": "a = df.groupby(\"region\")[\"revenue\"].agg(\"sum\")\nb = df.groupby(\"region\")[\"revenue\"].transform(\"sum\")", "options": ["a: 10 rows, b: 10 rows", "a: 3 rows, b: 3 rows", "a: 3 rows, b: 10 rows", "a: 10 rows, b: 3 rows"], "answer": 2, "expect": "a: 3 rows, b: 10 rows", "why": ".agg() combines each group down to ONE row per group — 3 regions in, 3 rows out. .transform() computes the same per-group value but broadcasts it back onto every original row — 10 rows in, 10 rows out, ready to sit next to the original data as a new column. Same split, same per-group computation, genuinely different combine step.", "topic": "groupby", "_m": 4, "_nav": "How many rows does each grouped call return"}, {"type": "section
