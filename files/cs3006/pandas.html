", "title": "Part 3 · Sorting and ranking", "subtitle": "The data is filtered and summarized. The last step is almost always putting it in order — by value, back by label, or just pulling out the top few rows without sorting the whole thing.", "_m": 4, "_nav": "Putting the results in order"}, {"type": "content", "title": "sort_values() — order by one or more columns", "bullets": ["df.sort_values('col') sorts ascending by default; ascending=False reverses it.", "df.sort_values(['col1', 'col2']) sorts by col1 first, using col2 only to break ties within equal col1 values.", "ascending can be a LIST too — ascending=[True, False] sorts col1 ascending but col2 descending, independently.", "Like almost everything else in this deck, it returns a NEW DataFrame; the original keeps its original order unless you reassign or pass inplace=True."], "code": "import pandas as pd\n\nsales = pd.DataFrame({\n    \"rep\":      [\"Asha\", \"Ravi\", \"Meera\", \"Asha\", \"Karan\", \"Ravi\", \"Meera\", \"Asha\", \"Karan\", \"Ravi\"],\n    \"region\":   [\"North\", \"South\", \"North\", \"East\", \"South\", \"North\", \"East\", \"North\", \"South\", \"East\"],\n    \"product\":  [\"Notebook\", \"Pen\", \"Notebook\", \"Eraser\", \"Stapler\", \"Pen\", \"Notebook\", \"Stapler\", \"Pen\", \"Eraser\"],\n    \"quantity\": [5, 10, 3, 7, 4, 8, 6, 2, 9, 5],\n    \"price\":    [40, 10, 40, 5, 60, 10, 40, 60, 10, 5],\n})\nsales[\"revenue\"] = sales[\"quantity\"] * sales[\"price\"]\nprint(sales.sort_values(\"revenue\", ascending=False).head(3))\nprint(sales.sort_values([\"region\", \"revenue\"], ascending=[True, False]))", "run": "import pandas as pd\n\nsales = pd.DataFrame({\n    \"rep\":      [\"Asha\", \"Ravi\", \"Meera\", \"Asha\", \"Karan\", \"Ravi\", \"Meera\", \"Asha\", \"Karan\", \"Ravi\"],\n    \"region\":   [\"North\", \"South\", \"North\", \"East\", \"South\", \"North\", \"East\", \"North\", \"South\", \"East\"],\n    \"product\":  [\"Notebook\", \"Pen\", \"Notebook\", \"Eraser\", \"Stapler\", \"Pen\", \"Notebook\", \"Stapler\", \"Pen\", \"Eraser\"],\n    \"quantity\": [5, 10, 3, 7, 4, 8, 6, 2, 9, 5],\n    \"price\":    [40, 10, 40, 5, 60, 10, 40, 60, 10, 5],\n})\nsales[\"revenue\"] = sales[\"quantity\"] * sales[\"price\"]\nprint('highest revenue first:')\nprint(sales.sort_values('revenue', ascending=False).head(3))\nprint()\nprint('by region, then revenue high-to-low within each region:')\nprint(sales.sort_values(['region', 'revenue'], ascending=[True, False]))", "_m": 4, "_nav": "sort_values(): ordering rows by column values"}, {"type": "content", "title": "sort_index() — back to the original row order", "bullets": ["df.sort_index() sorts by the ROW LABEL, not by any column's values — the mirror image of sort_values().", "The most common use: after a sort_values() or a filter has scrambled the row order, sort_index() puts everything back exactly the way it started, because the original labels never changed.", "Also works on columns: df.sort_index(axis=1) alphabetizes the column names instead of the rows.", "Because the index is a real object (Part 1 of the very first deck in this series), sorting by it is just as legitimate an operation as sorting by any column's values."], "code": "import pandas as pd\n\nsales = pd.DataFrame({\n    \"rep\":      [\"Asha\", \"Ravi\", \"Meera\", \"Asha\", \"Karan\", \"Ravi\", \"Meera\", \"Asha\", \"Karan\", \"Ravi\"],\n    \"region\":   [\"North\", \"South\", \"North\", \"East\", \"South\", \"North\", \"East\", \"North\", \"South\", \"East\"],\n    \"product\":  [\"Notebook\", \"Pen\", \"Notebook\", \"Eraser\", \"Stapler\", \"Pen\", \"Notebook\", \"Stapler\", \"Pen\", \"Eraser\"],\n    \"quantity\": [5, 10, 3, 7, 4, 8, 6, 2, 9, 5],\n    \"price\":    [40, 10, 40, 5, 60, 10, 40, 60, 10, 5],\n})\nsales[\"revenue\"] = sales[\"quantity\"] * sales[\"price\"]\nshuffled = sales.sample(frac=1, random_state=0)\nprint(shuffled.index.tolist())\nprint(shuffled.sort_index().index.tolist())", "run": "import pandas as pd\n\nsales = const MODULES = [{"title": "CS3006 · From NumPy to Pandas · Motivation", "short": "Motivation", "count": 10}, {"title": "CS3006 · Pandas · Data Structures & Selection", "short": "Data Structures & Selection", "count": 19}, {"title": "CS3006 · Pandas · Data Ingestion & Exploration", "short": "Data Ingestion & Exploration", "count": 21}, {"title": "CS3006 · Pandas · Data Cleaning & Transformation", "short": "Data Cleaning & Transformation", "count": 25}, {"title": "CS3006 · Pandas · Filtering, Grouping & Aggregation", "short": "Filtering, Grouping & Aggregation", "count": 20}];

const PY_LOADER = "./pyodide/pyodide.js";
const PY_INDEXURL = "./pyodide/";
const $ = s => document.querySelector(s);
let i = 0, py = null, pyReady = false, mcqDone = {};

const isFile = location.protocol === "file:";
if (isFile) $("#banner").style.display = "block";

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

// module start offsets
const MOD_START = [];
(function(){
  let off = 0;
  MODULES.forEach(m=>{ MOD_START.push(off); off += m.count; });
})();

function typeIcon(t){
  if(t==="section") return "\u25A0";
  if(t==="predict") return "\u2753";
  if(t==="mcq") return "\u2611";
  return "\u2022";
}

function buildSidebar(){
  const nav = $("#sidebar");
  let h = "";
  MODULES.forEach((m, mi)=>{
    h += `<div class="mod" data-mi="${mi}">
      <div class="modhead" data-mi="${mi}">
        <span class="num">${mi+1}</span>
        <span class="mt" style="flex:1">${esc(m.short)}</span>
        <span class="cnt">${m.count}</span>
        <span class="car">&#9656;</span>
      </div>
      <div class="slist">`;
    for(let k=0;k<m.count;k++){
      const gi = MOD_START[mi]+k;
      const slide = DECK[gi];
      h += `<button class="sitem" data-gi="${gi}">
        <span class="si">${typeIcon(slide.type)}</span>
        <span class="st">${esc(slide._nav || slide.title || "(untitled)")}</span>
      </button>`;
    }
    h += `</div></div>`;
  });
  nav.innerHTML = h;

  nav.querySelectorAll(".modhead").forEach(el=>{
    el.addEventListener("click", ()=>{
      el.closest(".mod").classList.toggle("open");
    });
  });
  nav.querySelectorAll(".sitem").forEach(el=>{
    el.addEventListener("click", ()=>{
      jumpTo(parseInt(el.dataset.gi));
      if(window.innerWidth <= 860) closeSidebar();
    });
  });
}

function currentModuleIndex(){
  let mi = 0;
  for(let k=0;k<MOD_START.length;k++){ if(i >= MOD_START[k]) mi = k; }
  return mi;
}

function syncSidebarHighlight(){
  const nav = $("#sidebar");
  nav.querySelectorAll(".sitem").forEach(el=>{
    const gi = parseInt(el.dataset.gi);
    el.classList.toggle("current", gi===i);
    el.classList.toggle("done", gi<i);
  });
  const mi = currentModuleIndex();
  nav.querySelectorAll(".mod").forEach(m=>{
    m.classList.toggle("open", parseInt(m.dataset.mi)===mi);
  });
  const cur = nav.querySelector(".sitem.current");
  if(cur) cur.scrollIntoView({block:"nearest"});
}

function openSidebar(){ $("#sidebar").classList.remove("collapsed"); if(window.innerWidth<=860) $("#scrimNav").classList.add("show"); }
function closeSidebar(){ if(window.innerWidth<=860){ $("#sidebar").classList.add("collapsed"); $("#scrimNav").classList.remove("show"); } }
function toggleSidebar(){
  if($("#sidebar").classList.contains("collapsed")) openSidebar(); else closeSidebar();
}

function jumpTo(gi){
  if(gi<0||gi>=DECK.length) return;
  i = gi;
  render();
}

function render(){
  const c = DECK[i];
  const card = $("#card");
  let h = "";
  if(c.type==="section"){
    h += `<h1 class="sec">${esc(c.title)}</h1>`;
    if(c.subtitle) h += `<div class="sub">${esc(c.subtitle)}</div>`;
  } else if(c.type==="content"){
    h += `<h2 class="title">${esc(c.title)}</h2>`;
    if(c.bullets){h+='<ul class="b">';c.bullets.forEach(b=>h+=`<li>${esc(b)}</li>`);h+="</ul>";}
    if(c.svg) h += `<div class="svgwrap">${c.svg}</div>`;
    if(c.code) h += `<pre class="code">${esc(c.code)}</pre>`;
    h += `<div class="out" id="out"></div>`;
  } else if(c.type==="predict"){
    h += `<div><span class="chip predict">Predict</span>`;
    if(c.topic) h += `<span class="chip topic">${esc(c.topic)}</span>`;
    h += `</div><h2 class="title">${esc(c.title)}</h2>`;
    if(c.code) h += `<pre class="code">${esc(c.code)}</pre>`;
    h += `<div class="out" id="out"></div>`;
    h += `<div class="reveal" id="reveal"><div class="exp">${esc(c.expect||"")}</div>`;
    if(c.why) h += `<div class="why">${esc(c.why)}</div>`;
    h += `</div>`;
  } else if(c.type==="mcq"){
    h += `<div><span class="chip mcq">MCQ</span>`;
    if(c.topic) h += `<span class="chip topic">${esc(c.topic)}</span>`;
    h += `</div><h2 class="title">${esc(c.title)}</h2>`;
    if(c.code) h += `<pre class="code">${esc(c.code)}</pre>`;
    h += `<div class="opts" id="opts">`;
    c.options.forEach((o,k)=>{h+=`<button class="opt" data-k="${k}"><span class="k">${String.fromCharCode(65+k)}</span>${esc(o)}</button>`;});
    h += `</div>`;
    h += `<div class="reveal" id="reveal"><div class="exp">${esc(c.expect||"")}</div>`;
    if(c.why) h += `<div class="why">${esc(c.why)}</div>`;
    h += `</div>`;
  }
  card.innerHTML = h;
  if(c.type==="mcq"){
    card.querySelectorAll(".opt").forEach(b=>{
      b.addEventListener("click",()=>chooseMCQ(parseInt(b.dataset.k)));
    });
    if(mcqDone[i]!==undefined) markMCQ(mcqDone[i]);
  }
  // buttons availability
  const runnable = (c.type==="predict"||c.type==="content") && !!(c.run||c.code);
  $("#runBtn").disabled = !runnable || isFile;
  $("#revealBtn").disabled = !(c.type==="predict"||c.type==="mcq");
  $("#padBtn").disabled = isFile;
  $("#prevBtn").disabled = i===0;
  $("#nextBtn").disabled = i===DECK.length-1;

  const mi = currentModuleIndex();
  $("#crumb").innerHTML = `<span class="chip mod">Module ${mi+1}/${MODULES.length}</span>${esc(MODULES[mi].short)}`;
  $("#pos").innerHTML = `Slide <b>${i+1}</b> / ${DECK.length} &middot; ${esc(MODULES[mi].short)}`;

  syncSidebarHighlight();
}

function chooseMCQ(k){ mcqDone[i]=k; markMCQ(k); }
function markMCQ(k){
  const c = DECK[i];
  const opts = $("#opts");
  if(!opts) return;
  opts.querySelectorAll(".opt").forEach(b=>{
    const bk=parseInt(b.dataset.k);
    b.classList.remove("correct","wrong");
    if(bk===c.answer) b.classList.add("correct");
    else if(bk===k) b.classList.add("wrong");
  });
  $("#reveal").classList.add("show");
}

function reveal(){
  const c = DECK[i];
  if(c.type==="predict"){ $("#reveal")?.classList.add("show"); }
  else if(c.type==="mcq"){
    const opts=$("#opts");
    opts?.querySelectorAll(".opt").forEach(b=>{
      if(parseInt(b.dataset.k)===c.answer) b.classList.add("correct");
    });
    $("#reveal")?.classList.add("show");
  }
}

function next(){ if(i<DECK.length-1){i++;render();} }
function prev(){ if(i>0){i--;render();} }

async function initPy(){
  if(isFile) return;
  try{
    const s=document.createElement("script"); s.src=PY_LOADER;
    s.onload=async()=>{
      py = await loadPyodide({indexURL: PY_INDEXURL});
      // numpy is required; load it and surface a clear error if the offline
      // folder is missing its files.
      try{ await py.loadPackage("pandas"); }
      catch(err){ console.error("pandas failed to load:", err);
        alert("Pandas could not load from the pyodide/ folder.\nCopy the vetted v0.26.2 files into pyodide/ as described in the README."); }
      pyReady=true;
    };
    document.head.appendChild(s);
  }catch(e){ console.error(e); }
}

async function runInto(codeStr, outEl){
  if(!pyReady){ outEl.textContent="(Python still loading\u2026 try again in a moment)"; outEl.classList.add("show"); return; }
  outEl.classList.add("show"); outEl.textContent="running\u2026";
  const wrap = `
import sys, io
_b = io.StringIO(); _old = sys.stdout; sys.stdout=_b
try:
    exec(compile(__USRC__, '<cell>', 'exec'), {})
except Exception as _e:
    print(repr(_e))
finally:
    sys.stdout=_old
_out=_b.getvalue()
`;
  try{
    py.globals.set("__USRC__", codeStr);
    await py.runPythonAsync(wrap);
    let out = py.globals.get("_out") || "";
    outEl.innerHTML="";
    const mark = out.indexOf("__HTML__");
    if(mark !== -1){
      // text before the sentinel prints normally; everything after is trusted markup
      const pre = out.slice(0, mark);
      const htmlPart = out.slice(mark + 8);
      if(pre.trim().length){ const sp=document.createElement("span"); sp.textContent=pre; outEl.appendChild(sp); }
      const box=document.createElement("div"); box.innerHTML=htmlPart; outEl.appendChild(box);
    } else if(out.length){
      const pre=document.createElement("span"); pre.textContent=out; outEl.appendChild(pre);
    } else {
      outEl.textContent="(no output)";
    }
  }catch(e){ outEl.textContent=String(e); }
}

function runCurrent(){
  const c=DECK[i];
  const outEl=$("#out"); if(!outEl) return;
  runInto(c.run||c.code||"", outEl);
}

// scratchpad
function openPad(){
  if(isFile) return;
  const c=DECK[i];
  $("#padCode").value = c.run||c.code||"# scratchpad \u2014 type any Python\n";
  $("#padOut").classList.remove("show"); $("#padOut").innerHTML="";
  $("#scrim").classList.add("show"); $("#pad").classList.add("show");
  $("#padCode").focus();
}
function closePad(){ $("#scrim").classList.remove("show"); $("#pad").classList.remove("show"); }
function runPad(){ runInto($("#padCode").value, $("#padOut")); }

document.addEventListener("keydown",e=>{
  if($("#pad").classList.contains("show")){
    if(e.key==="Escape") closePad();
    if(e.key==="Enter" && (e.ctrlKey||e.metaKey)){ e.preventDefault(); runPad(); }
    if(e.key==="Tab"){ e.preventDefault(); const t=$("#padCode"); const s=t.selectionStart,en=t.selectionEnd;
      t.value=t.value.slice(0,s)+"    "+t.value.slice(en); t.selectionStart=t.selectionEnd=s+4; }
    return;
  }
  if(e.key===" "||e.key==="ArrowRight"){ e.preventDefault(); next(); }
  else if(e.key==="ArrowLeft"){ prev(); }
  else if(e.key==="r"||e.key==="R"){ if(!$("#runBtn").disabled) runCurrent(); }
  else if(e.key==="a"||e.key==="A"){ reveal(); }
  else if(e.key==="s"||e.key==="S"){ openPad(); }
  else if(e.key==="n"||e.key==="N"){ toggleSidebar(); }
});

window.addEventListener("DOMContentLoaded",()=>{
  buildSidebar();
  $("#nextBtn").addEventListener("click",next);
  $("#prevBtn").addEventListener("click",prev);
  $("#runBtn").addEventListener("click",runCurrent);
  $("#revealBtn").addEventListener("click",reveal);
  $("#padBtn").addEventListener("click",openPad);
